<style id="modern-ui">
/* عصري پرت: ټولو برخو ته عام. یوازې سټایل، هیڅ منطق نه بدلیږي. */
:root{--sh1:0 1px 2px #14382b0a,0 8px 24px -14px #14382b30;--sh2:0 2px 4px #14382b0d,0 14px 32px -14px #14382b40;--ring:0 0 0 3px #174b3c1f}
html{scroll-behavior:smooth}body{font-size:15px;-webkit-font-smoothing:antialiased}::selection{background:#e6d6a6;color:#173a2d}
*{scrollbar-width:thin;scrollbar-color:#c5d0bc transparent}
button,input,select,textarea{border-radius:11px;transition:border-color .15s,box-shadow .15s,background .15s,transform .1s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#174b3c;box-shadow:var(--ring);background:#fff}
button{font-weight:500}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}
button.p{box-shadow:0 4px 12px -6px #174b3c99}button.p:hover:not(:disabled){transform:translateY(-1px)}

#gs{border-radius:11px;border:1px solid transparent}#gs:focus{box-shadow:0 0 0 3px #e0c36a66;border-color:#e0c36a}
aside{box-shadow:6px 0 24px -20px #14382b50}

#new{width:100%;min-height:44px;font-size:14px}
.it{border-radius:12px;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}.it:hover{transform:translateX(-2px);box-shadow:var(--sh1)}.it.on{border-inline-start:4px solid #174b3c;box-shadow:var(--sh1)}
.dot{width:10px;height:10px;box-shadow:0 0 0 3px #ffffff}
.box,.stat,.rec,.im,.cmc{border-radius:14px}.box{box-shadow:var(--sh1);transition:box-shadow .2s,border-color .2s}.box:hover{box-shadow:var(--sh2)}
.stat{box-shadow:var(--sh1);transition:transform .15s,box-shadow .2s}.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.rec,.hrow,.afrow{transition:background .15s}.rec:hover{background:#eef4e8}.hrow:hover,.afrow:hover{background:#f6f9f2}
details.box>summary{border-radius:10px;padding-inline:4px;transition:background .15s}details.box>summary:hover{background:#f3f7ef}details.box[open]{border-color:#cfdcc4}
label{font-weight:600;letter-spacing:.1px}textarea{border-radius:12px}
.bar{box-shadow:0 10px 18px -18px #0b2a1f;border-radius:0 0 14px 14px;padding-inline:4px}.bar h2{letter-spacing:.2px}
#save:not(:disabled)::before{content:"● ";color:#e0c36a;font-size:11px}
.tabs button,.bar .tabs button{border-radius:99px}.tabs button.on{box-shadow:0 4px 12px -6px #174b3c99}
.gnav{padding:4px 2px 6px}.gnav button{background:#fff;border:1px solid #dfe6d6;color:#44604f}.gnav button:hover{border-color:#b59350;background:#f7f3e6}.gnav button.full{background:#eef6ec}
.chip{border-radius:99px}.b{border-radius:99px;padding:0 9px}

#gsr{border-radius:14px}#licdlg .lbox{border-radius:18px}

 <div class="tb"><button class="p" data-af="new">+ نوی بوټی</button><input id="afq" placeholder="لټون…" value="${esc(AFQ)}" style="min-width:220px"><button data-af="import">نوي بوټي له JSON څخه واردول</button><button data-af="importfile">فایل له کمپیوټر څخه واردول</button><input type="file" id="afjsonf" accept=".json,application/json" style="display:none"></div>
 <div class="box" id="afrows">${afRows()}</div></div>`;afBind()}
function afBind(){const m=$('#afm');
 m.addEventListener('click',e=>{const b=e.target.closest('[data-af]');if(!b)return;e.stopPropagation();afAct(b.dataset.af,b.dataset.id,b)});
 m.addEventListener('input',e=>{e.stopPropagation();if(e.target.id==='afq'){AFQ=e.target.value;$('#afrows').innerHTML=afRows()}});
 m.addEventListener('change',e=>{e.stopPropagation();const t=e.target;if(t.id==='afimgf'){afAddFiles(t.files);t.value=''}else if(t.id==='afjsonf'){afImportFile(t.files[0]);t.value=''}else if(t.dataset.afph){afSyncPh();AFPhDirty=true}})}
async function afAct(a,id,btn){
 if(a==='new')return afEdit(null);
 if(a==='edit')return afEdit(id);
 if(a==='del')return afDelete(id);
 if(a==='import')return afImport(btn);
 if(a==='importfile')return $('#afjsonf').click();
 if(a==='cancel')return afList();
 if(a==='save')return afSave(btn);
 if(a==='addph')return $('#afimgf').click();
 if(a==='rmph'){afSyncPh();AFPh.splice(Number(id),1);AFPhDirty=true;return afPhRender()}
 if(a==='mainph'){afSyncPh();const i=Number(id);AFPh.unshift(AFPh.splice(i,1)[0]);AFPhDirty=true;return afPhRender()}}
async function afImport(btn){
 btn.disabled=true;
 try{const r=await fetch('app/ghazali_all_100_plants_final.json');if(!r.ok)throw new Error('JSON '+r.status);const all=await r.json();
  const have=new Set(AFP.map(p=>p.id)),list=all.filter(p=>!have.has('p'+String(p.id).padStart(3,'0')));
  if(!list.length){btn.disabled=false;alert('ټول بوټي دمخه شته. نوی بوټی نشته.');return}
  if(!confirm(list.length+' نوي بوټي (ID '+list[0].id+' – '+list[list.length-1].id+') Firestore ته واردېږي. موجود بوټي او عکسونه نه بدلېږي. دوام؟')){btn.disabled=false;return}
  for(let i=0;i<list.length;i+=400){const b=writeBatch(db);list.slice(i,i+400).forEach(p=>{const d={...p};const lid=d.id;delete d.id;d.legacyId=lid;d.photoCount=0;d.thumb='';d.updatedAt=serverTimestamp();b.set(doc(db,AFC,'p'+String(lid).padStart(3,'0')),d)});await b.commit()}
  await afLoad();await afRenumber();toast('واردول سول: '+list.length+' نوي (ټول: '+AFP.length+')');afList()}
 catch(e){btn.disabled=false;alert('واردول ونه سول: '+(e.code||e.message))}}
/* فایل له کمپیوټر څخه واردول: د بوټو لیست (JSON array) د همدې ساحو سره لکه د ایپ JSON. موجود بوټي او عکسونه نه بدلېږي. */
async function afImportFile(file){
 if(!file)return;
 if(file.size>5*1024*1024)return alert('فایل ډېر لوی دی (تر ۵ MB پورې).');
 let raw;try{raw=JSON.parse(await file.text())}catch(e){return alert('فایل ونه لوستل سو، یا JSON نه دی: '+e.message)}
 const arr=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.plants)?raw.plants:(raw&&typeof raw==='object'?[raw]:null));
 if(!arr||!arr.length)return alert('په فایل کې بوټي نشته. فایل باید د بوټو لیست (JSON) وي.');
 const keys=AFF.map(f=>f[0]),have=new Set(AFP.map(p=>p.id)),sci=new Set(AFP.map(p=>norm(p.scientific_name)).filter(Boolean));
 const add=[],skip=[],bad=[],seen=new Set(),seenSci=new Set();
 arr.forEach((x,i)=>{
  if(!x||typeof x!=='object'||Array.isArray(x))return bad.push('#'+(i+1));
  const name=String(x.name_ps??'').trim();
  if(!name)return bad.push('#'+(i+1)+' (د پښتو نوم نشته)');
  const n=Number(x.id),hasId=Number.isInteger(n)&&n>0;
  const id=hasId?'p'+String(n).padStart(3,'0'):'p'+Date.now().toString(36)+i;
  const sc=norm(x.scientific_name);
  if(have.has(id)||seen.has(id))return skip.push(name+' (ID موجود)');
  if(sc&&(sci.has(sc)||seenSci.has(sc)))return skip.push(name+' (علمي نوم موجود)');
  const d={};keys.forEach(k=>{d[k]=String(x[k]??'').trim()});
  d.source_links=(Array.isArray(x.source_links)?x.source_links:[]).map(u=>String(u).trim()).filter(u=>/^https?:\/\//i.test(u));
  if(hasId)d.legacyId=n;
  seen.add(id);if(sc)seenSci.add(sc);add.push({id,d,name});
 });
 const more=(a,k)=>a.slice(0,k).join('، ')+(a.length>k?' …':'');
 if(!add.length)return alert('نوی بوټی نشته.'+(skip.length?'\nپرېښودل سوي ('+skip.length+'): '+more(skip,8):'')+(bad.length?'\nناسم ('+bad.length+'): '+more(bad,8):''));
 const msg=add.length+' نوي بوټي واردېږي:\n'+add.slice(0,6).map(a=>'• '+a.name).join('\n')+(add.length>6?'\n… او نور':'')
  +(skip.length?'\n\nپرېښودل سوي ('+skip.length+'): '+more(skip,6):'')+(bad.length?'\n\nناسم، نه واردېږي ('+bad.length+'): '+more(bad,6):'')
  +'\n\nموجود بوټي او عکسونه نه بدلېږي. دوام؟';
 if(!confirm(msg))return;
 try{for(let i=0;i<add.length;i+=400){const b=writeBatch(db);add.slice(i,i+400).forEach(a=>b.set(doc(db,AFC,a.id),{...a.d,photoCount:0,thumb:'',no:9999,updatedAt:serverTimestamp()}));await b.commit()}
  await afLoad();await afRenumber();toast('واردول سول: '+add.length+' نوي (ټول: '+AFP.length+')');afList()}
 catch(e){alert('واردول ونه سول: '+(e.code||e.message))}}
async function afEdit(id){
 const p=id?AFP.find(x=>x.id===id):null;AFEd=p?{...p}:{id:null};AFPh=[];AFPhDirty=false;
 if(p&&p.photoCount>0){try{const s=await getDocs(collection(db,AFC,id,'photos'));const a=[];s.forEach(d=>{const x=d.data();x._n=Number(d.id)||0;a.push(x)});a.sort((x,y)=>x._n-y._n);AFPh=a.map(x=>({data:x.data,author:x.author||'',license:x.license||'',source:x.source||''}))}catch(e){alert('عکسونه ونه لوستل سول')}}
 const v=k=>esc(AFEd[k]??'');
 $('#ed').innerHTML=`<div id="afm"><div class="bar"><button data-af="cancel">→ لیست</button><h2>${p?esc(p.name_ps):'نوی بوټی'}${p?` <small class="hint">(نمبر ${p.no??''})</small>`:''}</h2></div>
 <div class="box"><div class="afgrid">${AFF.map(([k,t,ty])=>`<div class="${ty==='t'?'full':''}"><label>${t}</label>${ty==='t'?`<textarea data-f="${k}" rows="2">${v(k)}</textarea>`:`<input data-f="${k}" value="${v(k)}">`}</div>`).join('')}
 <div class="full"><label>د سرچینو لینکونه <small>(هر لینک په جلا کرښه کې)</small></label><textarea data-f="source_links" dir="ltr" rows="3">${esc((AFEd.source_links||[]).join('\n'))}</textarea></div></div></div>
 <div class="box"><h3>عکسونه (تر ${AFMAXP} پورې) <small class="hint">لومړی عکس اصلي دی. هر عکس په اتومات ډول کوچنی کېږي.</small></h3><div id="afph"></div>
 <input type="file" id="afimgf" accept="image/*" multiple hidden></div>
 <div class="tb"><button class="p" data-af="save">خوندي کول</button><button data-af="cancel">لغوه</button></div></div>`;
 afBind();afPhRender();if(!p)document.querySelector('[data-f=name_ps]').focus()}
function afPhRender(){$('#afph').innerHTML=`<div class="afph">${AFPh.map((x,i)=>`<div class="c"><img src="${x.data}" alt="">
 <input data-afph="author" data-i="${i}" placeholder="لیکوال / عکاس" value="${esc(x.author)}"><input data-afph="license" data-i="${i}" placeholder="لایسنس (مثلاً CC BY-SA 4.0)" value="${esc(x.license)}"><input data-afph="source" data-i="${i}" placeholder="سرچینه / لینک" value="${esc(x.source)}">
 <div class="tb">${i>0?`<button data-af="mainph" data-id="${i}">اصلي کړه</button>`:'<span class="b pub">اصلي</span>'}<button data-af="rmph" data-id="${i}">لرې کړه</button></div></div>`).join('')}
 ${AFPh.length<AFMAXP?'<button data-af="addph" style="min-height:130px;border-style:dashed">+ عکس اضافه کړه</button>':''}</div>`}
function afSyncPh(){document.querySelectorAll('[data-afph]').forEach(el=>{const x=AFPh[Number(el.dataset.i)];if(x)x[el.dataset.afph]=el.value})}
function afBmp(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'))};i.src=u})}
function afScale(img,max,q){const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function afAddFiles(files){afSyncPh();
 for(const f of files){if(AFPh.length>=AFMAXP){toast('تر '+AFMAXP+' عکسونو پورې');break}
  try{const img=await afBmp(f);let q=.82,d=afScale(img,800,q);while(d.length>400000&&q>.4){q-=.12;d=afScale(img,800,q)}
   AFPh.push({data:d,author:'',license:'',source:''});AFPhDirty=true}catch(e){toast('دا فایل عکس نه دی: '+f.name)}}
 afPhRender()}
async function afThumbOf(data){const img=await afBmp(await (await fetch(data)).blob());return afScale(img,360,.7)}
async function afSave(btn){afSyncPh();
 const d={};document.querySelectorAll('#afm [data-f]').forEach(el=>{d[el.dataset.f]=el.value.trim()});
 if(!d.name_ps)return alert('د پښتو نوم ضروري دی.');
 d.source_links=(d.source_links||'').split('\n').map(x=>x.trim()).filter(Boolean);
 btn.disabled=true;
 try{const isNew=!AFEd.id,id=AFEd.id||('p'+Date.now().toString(36));
  d.photoCount=AFPh.length;d.updatedAt=serverTimestamp();
  if(isNew||AFPhDirty)d.thumb=AFPh[0]?await afThumbOf(AFPh[0].data):'';
  if(isNew)d.no=9999;
  await setDoc(doc(db,AFC,id),d,{merge:true});
  if(isNew||AFPhDirty){for(let i=1;i<=AFMAXP;i++){const x=AFPh[i-1],r=doc(db,AFC,id,'photos',String(i));
    if(x){if(x.data.length>900000)throw new Error('عکس ډېر لوی دی');await setDoc(r,{data:x.data,author:x.author||'',license:x.license||'',source:x.source||'',n:i})}else if(!isNew)await deleteDoc(r)}}
  await afLoad();await afRenumber();toast('خوندي سو');afList()}
 catch(e){btn.disabled=false;alert('خوندي نه سو: '+(e.code||e.message))}}
async function afDelete(id){const p=AFP.find(x=>x.id===id);if(!p)return;
 if(!confirm('«'+p.name_ps+'» او ټول عکسونه یې ړنګ سي؟'))return;
 try{for(let i=1;i<=AFMAXP;i++)await deleteDoc(doc(db,AFC,id,'photos',String(i)));await deleteDoc(doc(db,AFC,id));
  AFP=AFP.filter(x=>x.id!==id);await afRenumber();toast('ړنګ سو');afList()}
 catch(e){alert('ړنګ نه سو: '+(e.code||e.message))}}

const OCC={student:'زده کوونکی',doctor:'ډاکټر',pharmacist:'درملتون / فارماسیست',herbalist:'عطار / هربالیست',researcher:'څېړونکی',teacher:'ښوونکی',farmer:'کروندګر',other:'نور'};
let USR={},USRL=[],USF='all',USQ='';
async function usLoad(){try{const s=await getDocs(collectionGroup(db,'private'));USR={};s.forEach(d=>{if(d.id==='profile'){const uid=d.ref.path.split('/')[1];USR[uid]={...d.data(),uid}}});USRL=Object.values(USR).sort((a,b)=>(b.updatedAt?.toMillis?.()||b.updatedAt||0)-(a.updatedAt?.toMillis?.()||a.updatedAt||0));return true}catch(e){USR={};USRL=[];return e.code||String(e)}}
const usTag=x=>{const u=x&&x.uid&&USR[x.uid];if(!u)return '';const t=[OCC[u.occupation]||u.occupation,u.province].filter(Boolean).join(' · ');return t?` · <b>👤 ${esc(t)}</b>`:''};
async function usPage(){$('#ed').innerHTML='<div class="home"><h2>کارونکي</h2><p>لوستل کېږي…</p></div>';const r=await usLoad();await fbLoadAll();secBar();

 <div class="box" id="usrows">${usRowsHtml()}</div></div>`;
 const m=$('#usm');m.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();if(b.dataset.udel){const id=b.dataset.udel;if(!confirm('د دې کاروونکي پروفایل ړنګ سي؟ (حساب پاتې کېږي)'))return;try{await deleteDoc(doc(db,'users',id,'private','profile'));delete USR[id];USRL=USRL.filter(u=>u.uid!==id);usRender()}catch(er){alert('ړنګول ونه سول: '+(er.code||er.message))}}else if(b.dataset.usf){USF=b.dataset.usf;usRender()}else if(b.id==='usre')await usPage()});

function usFb(uid){const a=FBK.filter(x=>x.uid===uid);if(!a.length)return '';return `<details class="usfb" style="flex-basis:100%;width:100%"><summary>نظرونه (${a.length})</summary>${a.map(x=>{const h=DB[x.herbId],dt=x.createdAt?.toDate?x.createdAt.toDate().toLocaleDateString():'';return `<div style="border-top:1px solid #e1e7dc;padding:6px 0"><span class="hint">${h?esc(nm(h)):'عمومي'} · ${dt}${x.status==='new'?' · نوی':''}</span><p style="white-space:pre-wrap;margin:2px 0">${esc(x.text)}</p></div>`}).join('')}</details>`}

/* لومړی د ټولو بیک‌اپ ډاونلوډ کیږي، بیا یو یو مدخل ړنګیږي (لومړی عکسونه/تاریخچه، وروسته مدخل پخپله) */
async function removeHerbs(codes){

 const by=auth.currentUser.email,x=JSON.parse(JSON.stringify(o));

/* ===== iNaturalist: عکسونه چې هر یو یې خپل CC ليسنس لري ===== */
const INL={'cc0':'CC0 1.0','cc-by':'CC BY','cc-by-sa':'CC BY-SA'};
let SRC='cm';
const inAuthor=(ph,o)=>{const m=(ph.attribution||'').match(/^\(c\)\s*(.+?),\s*(some|no) rights reserved/i);return(m&&m[1].trim())||o?.user?.name||o?.user?.login||''};
async function inJson(u){const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function inTaxon(q){
 const j=await inJson('https://api.inaturalist.org/v1/taxa?per_page=8&is_active=true&q='+encodeURIComponent(q)),L=q.trim().toLowerCase(),a=j.results||[];
 return a.find(x=>(x.name||'').toLowerCase()===L)||a[0]||null}
async function inObs(tid,extra,n){
 const j=await inJson('https://api.inaturalist.org/v1/observations?taxon_id='+tid+'&photos=true&quality_grade=research&photo_license=cc0,cc-by,cc-by-sa&order_by=votes&order=desc&per_page='+n+extra),out=[];
 for(const o of j.results||[])for(const ph of o.photos||[]){
  const lc=ph.license_code;if(!INL[lc]||!ph.url)continue;
  const au=inAuthor(ph,o);if(!au&&lc!=='cc0')continue;
  const id='inat:'+ph.id;
  out.push({thumb:ph.url.replace('/square.','/medium.'),full:ph.url.replace('/square.','/large.'),file:id,lic:{name:INL[lc],url:'',author:au,source:'https://www.inaturalist.org/observations/'+o.id,via:'inaturalist',file:id}})}
 return out}
async function inAuto(q){
 const t=await inTaxon(q);if(!t)return{out:[],skipped:0,note:'بوټی په iNaturalist کې ونه موندل سو'};
 const slots=[['',20,'بشپړ بوټی'],['&term_id=12&term_value_id=13',12,'ګل'],['&term_id=12&term_value_id=14',12,'مېوه']];
 const res=await Promise.all(slots.map(([x,n])=>inObs(t.id,x,n).catch(()=>null)));
 if(res.every(r=>!r))throw new Error('net');
 const seen=new Set(),all=[];
 res.forEach((r,n)=>{if(!r)return;let picked=0;
  for(const x of r){if(seen.has(x.file))continue;seen.add(x.file);x.have=haveImg(x.file);x.label=slots[n][2];
   if(!x.have&&!picked){x.pick=true;picked=1}else x.pick=false;all.push(x)}});
 return{out:all,skipped:0,note:'iNaturalist: '+(t.name||'')+(t.preferred_common_name?' ('+t.preferred_common_name+')':'')}}
async function cmGo(){
 const q=$('#cmq').value.trim(),R=$('#cmres');if(!q)return;R.innerHTML='<p class="hint">لټوم…</p>';

  if(!out.length){R.innerHTML='<p class="hint">'+(note||'د مناسب ليسنس سره عکس ونه موندل سو.')+'</p>'+(skipped?`<p class="hint">${skipped} پایلې د ليسنس له امله پټې سوې.</p>`:'');return}
  const n0=out.filter(x=>x.pick).length;
  R.innerHTML=(note?`<p class="hint">${esc(note)}</p>`:'')+`<div class="cmgrid">${out.map((x,n)=>`<div class="cmc ${x.pick?'pk':''}"><label class="ck"><input type="checkbox" data-sel="${n}" ${x.pick?'checked':''} ${x.have?'disabled':''}> ${x.have?'✓ مخکې شته':'وټاکئ'}</label><img loading="lazy" src="${esc(x.thumb)}" alt=""><div class="lic ok">✓ ${esc(x.lic.name)}</div><div class="hint">${esc(x.lic.author)}${x.lic.source?` <a href="${esc(x.lic.source)}" target="_blank" rel="noopener">↗</a>`:''}</div><select data-lbl="${n}">${IMG.map(l=>`<option ${x.label===l?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>${skipped?`<p class="hint">${skipped} پایلې د ليسنس له امله پټې سوې.</p>`:''}<div class="cmf"><button class="p" data-act="addsel">زیات کړه (<span id="selc">${n0}</span>)</button><button class="p" data-act="addnext">زیات کړه او بل بوټی ←</button><button data-act="skipnext">پرېښودل، بل بوټی ←</button></div>`}

function checkForm(f){
 if(!f.name)return'ليسنس وټاکئ';
 if(!f.author)return'جوړونکی ولیکئ';
 if(f.name!=='Own work'&&!f.source)return'د سرچینې لینک ولیکئ';
 if(f.name!=='Own work'&&f.name!=='Permission'&&!/^https?:\/\//i.test(f.source))return'لینک باید په http یا https پیل سي';
 return''}

 toast((n?n+' عکس ذخیره سو ✓':'')+(hid?' · '+hid+' پټ (ليسنس نه دی تاییدسوی)':'')+(skip?' · '+skip+' د حق خوندیتوب له امله رد سو':''))}

const is45=c=>c[0]==='T'&&+c.slice(1)<=45;
const okS=(c,o,s)=>{if(!s)return false;if(!is45(c))return true;o=(o||'').trim();if(c==='T016'||c==='T023')return false;if(s.split(/\s+/).length<2)return false;if(/\bspp\b/i.test(o))return false;if(o&&o.startsWith(s))return false;return true};
const okF=(c,f)=>!!f&&!(is45(c)&&/^Plant Family/i.test(f));
$('#syn').onclick=async()=>{const LG5=['ps','fa','ur','en','ar'],ch=[];
 for(const [c,x] of Object.entries(LST)){const h=DB[c];if(!h)continue;const nn=h.names||{};
  const df=LG5.filter(l=>x[l]&&(nn[l]||'').trim()!==x[l]);
  const ex=[];if(okS(c,h.scientific,x.s)&&(h.scientific||'').trim()!==x.s)ex.push('scientific');if(okF(c,x.f)&&(h.family||'').trim()!==x.f)ex.push('family');if(x.l&&(h.link||'')!==x.l)ex.push('link');
  if(df.length||ex.length)ch.push([c,df,ex,x])}
 if(!ch.length)return toast('ټول مدخلونه له لیست سره سم دي');
 if(dirty&&!confirm('بدلونونه ذخیره نه دي. دوام؟'))return;
 const n45=ch.filter(r=>is45(r[0])).length;
 if(!confirm('په '+ch.length+' مدخلونو کې به بدلون راسي (نومونه، علمي نوم، کورنۍ او لینک د لیست سره برابرېږي). د کتاب متنونه نه بدلېږي. دوام؟'))return;
 let k=0,b=writeBatch(db),m=0;
 for(const [c,df,ex,x] of ch){const h=DB[c];h.names={...(h.names||{})};df.forEach(l=>h.names[l]=x[l]);
  if(ex.includes('scientific'))h.scientific=x.s;if(ex.includes('family'))h.family=x.f;if(ex.includes('link'))h.link=x.l;
  h.version=(h.version||0)+1;h.updatedAt=Date.now();h.updatedBy=auth.currentUser.email;
  const data=cleanContentLanguages(JSON.parse(JSON.stringify(h)));
  if(h.status==='index'){b.set(doc(db,'herbs',c),data);if(++m===400){await b.commit();b=writeBatch(db);m=0}}
  else{await setDoc(doc(db,'herbs',c),data);await addDoc(collection(db,'herbs',c,'history'),{at:serverTimestamp(),by:h.updatedBy,version:h.version,note:'د نوي لیست سره برابر سو: '+df.concat(ex).join(','),data})}
  k++}
 if(m)await b.commit();
 renderList();if(cur&&LST[cur.code])openHerb(cur.code);toast(k+' مدخلونه برابر سول ✓')};
document.addEventListener('click',e=>{if(e.target.closest('#back')){if(dirty&&!confirm('بدلونونه ذخیره نه دي. بیرته لیست ته؟'))return;dirty=false;$('#app').classList.remove('ed')}});

$('#seedf').onchange=async e=>{
 let arr;try{arr=JSON.parse(await e.target.files[0].text())}catch(er){e.target.value='';return alert('JSON فایل سم نه دی: '+er.message)}
 const rep=!Array.isArray(arr)&&!!arr&&arr.exportedFrom==='ghazali-entry';if(!Array.isArray(arr))arr=arr.entries||arr.herbs||[arr];
 const LG=['ps','fa','ur','en'],ok=h=>h&&/^[TMA]\d{3}$/.test(h.code||'');
 const nw=[],mg=[],sk=[],bad=[],rp=[];
 for(const h of arr){if(!ok(h)){bad.push(h&&h.code||'؟');continue}const o=DB[h.code];if(!o)nw.push(h);else if(rep)rp.push(h);else if(o.status==='reviewed'||o.status==='approved')sk.push(h.code);else mg.push(h)}
