<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د غزالي خزانه – ایډمین ډیشبورډ</title>
<style>
:root{--bg:#eef2ef;--pan:#fff;--ink:#16322a;--mut:#667a72;--line:#d5ded9;--pri:#1f6b50;--warn:#b4531f;--ok:#2a8a52;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f1a;--pan:#173029;--ink:#e8f1ec;--mut:#9db3a9;--line:#2c4a40;--pri:#4cb58a;--warn:#e08a52;--ok:#5fcf8c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:90px;resize:vertical}input,select{width:100%}
#small{display:none;padding:40px;text-align:center}
@media (max-width:1000px){#small{display:block}#app,#login{display:none!important}}
#login{max-width:340px;margin:12vh auto;background:var(--pan);padding:28px;border-radius:14px;border:1px solid var(--line)}
#login h2{margin:0 0 14px}#login input{margin:6px 0}
#app{display:none;grid-template-columns:330px 1fr;height:100vh}
aside{border-inline-start:1px solid var(--line);background:var(--pan);display:flex;flex-direction:column;min-height:0}
aside .t{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
#list{overflow:auto;flex:1}
.it{padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
.it:hover,.it.on{background:color-mix(in srgb,var(--pri) 14%,transparent)}
.it small{color:var(--mut);min-width:42px;direction:ltr}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.s-reviewed,.s-approved{background:var(--ok)}.s-draft{background:var(--warn)}
main{overflow:auto;padding:18px 26px}
.bar{display:flex;gap:10px;align-items:center;position:sticky;top:-18px;background:var(--bg);padding:10px 0;z-index:3;flex-wrap:wrap}
.bar h2{margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tabs button.on{background:var(--pri);color:#fff}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);margin-inline-start:4px}.chip.bad{background:var(--warn);color:#fff}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.im{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:6px}.im img{width:100%;height:110px;object-fit:cover;border-radius:6px}
#toast{position:fixed;bottom:18px;inset-inline-start:18px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:9}
.box{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
</style>
</head>
<body>
<div id="small">دا ډیشبورډ یوازې په کمپیوټر کې خلاصېږي.</div>
<div id="login"><h2>ایډمین ننوتنه</h2><input id="em" type="email" placeholder="Email" dir="ltr"><input id="pw" type="password" placeholder="Password" dir="ltr"><button class="p" id="go" style="width:100%;margin-top:8px">ننوتل</button><p id="lerr" style="color:var(--warn)"></p></div>
<div id="app">
<aside><div class="t"><input id="q" placeholder="لټون: نوم، کوډ، علمي نوم…"><select id="tf"><option value="">ټولې ډلې (T, M, A)</option><option value="T">T · بوټي</option><option value="M">M · معدني</option><option value="A">A · حیواني توکي</option></select><select id="sf"><option value="">ټول حالتونه</option><option>index</option><option>draft</option><option>reviewed</option><option>approved</option></select><div style="display:flex;gap:6px"><button class="p" id="new" style="flex:1">+ نوی بوټی</button><button id="imp" title="Seed JSON">Import</button><button id="out">وتل</button></div><small id="cnt" style="color:var(--mut)"></small></div><div id="list"></div></aside>
<main id="ed"><p style="color:var(--mut)">له کیڼ لیست څخه یو بوټی وټاکئ.</p></main>
</div>
<input type="file" id="seedf" accept=".json" hidden>
<input type="file" id="imgf" accept="image/*" multiple hidden>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,collection,doc,getDocs,setDoc,deleteDoc,addDoc,query,orderBy,limit,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
/* 1) د Firebase تنظیمات دلته ولیکئ (Project settings > Web app) */
const CFG={apiKey:"AIzaSyAhBekjZhte7rhP2Tbu7h4cEcIsCk5nigY",authDomain:"ghazali-herbs.firebaseapp.com",projectId:"ghazali-herbs"};
const $=s=>document.querySelector(s),L=['ps','fa','ur','en','ar'],LN={ps:'پښتو',fa:'فارسی',ur:'اردو',en:'English',ar:'العربية'};
const FK=[['mhy','پېژندنه (ماهیت)'],['origin','د پیدا کېدو ځای'],['color','رنګ او خوند'],['mzj','مزاج'],['khs','خواص (افعال)'],['benefit','ځانګړې ګټه'],['mzr','مضر'],['msl','مصلح'],['bdl','بدل'],['dose','د خوراک اندازه'],['chem','کیمیاوي اجزا'],['compounds','مشهور مرکبات'],['experience','تجربه'],['use','استعمال'],['notes','نورې یادونې'],['poison_signs','د زهرجن کېدو نښې'],['poison_treatment','د زهرجن کېدو درملنه'],['history','تاریخي یادونه'],['excretion','اخراج'],['safety','د خوندیتوب یادونې']];
const CORE=['mhy','mzj','khs','use'],IMG=['بشپړ بوټی','پاڼه','ګل','مېوه','تخم','ریښه','نور'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
if(CFG.apiKey.startsWith('YOUR')){$('#lerr').textContent='لومړی د فایل په سر کې د Firebase تنظیمات (CFG) ولیکئ.'}
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
let DB={},cur=null,lang='ps',dirty=false,imgs=[];
$('#go').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value).catch(e=>$('#lerr').textContent='ننوتنه ونه شوه: '+e.code);
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$('#login').style.display=u?'none':'block';$('#app').style.display=u?'grid':'none';if(u)await load()});
async function load(){const s=await getDocs(collection(db,'herbs'));DB={};s.forEach(d=>DB[d.id]=d.data());renderList()}
function nm(h){return h.names?.ps||h.names?.ur||h.names?.en||''}
function renderList(){const q=$('#q').value.trim().toLowerCase(),sf=$('#sf').value;
 const a=Object.entries(DB).filter(([c,h])=>(!sf||h.status===sf)&&(!$('#tf').value||(h.type||'T')===$('#tf').value)&&(!q||(c+' '+Object.values(h.names||{}).join(' ')+' '+(h.scientific||'')).toLowerCase().includes(q))).sort((x,y)=>(x[1].order??9e9)-(y[1].order??9e9));
 $('#cnt').textContent=a.length+' / '+Object.keys(DB).length;
 $('#list').innerHTML=a.map(([c,h])=>`<div class="it ${cur&&cur.code===c?'on':''}" data-c="${c}"><span class="dot s-${h.status}"></span><small>${c}</small><span>${esc(nm(h))}</span>${h.note&&h.status==='index'?'<span title="'+esc(h.note)+'" style="color:var(--warn)">⚑</span>':''}</div>`).join('')}
$('#q').oninput=$('#sf').onchange=$('#tf').onchange=renderList;
$('#list').onclick=e=>{const i=e.target.closest('.it');if(i)openHerb(i.dataset.c)};
async function openHerb(c){if(dirty&&!confirm('بدلونونه ذخیره نه دي. بل بوټی خلاصوئ؟'))return;
 cur=structuredClone(DB[c]);cur.code=c;cur.names??={};cur.otherNames??={};cur.fields??={};L.forEach(l=>{cur.fields[l]??={}});dirty=false;
 imgs=[];render();renderList();const s=await getDocs(collection(db,'herbs',c,'images'));imgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));render()}
function status(){return (/pending/i.test(cur.names?.en||'')?'<span class="chip bad">English ⚠</span>':'')+L.map(l=>{const n=CORE.filter(k=>!(cur.fields[l][k]||'').trim()).length;return `<span class="chip ${n?'bad':''}">${l} ${n?n+' خالي':'✓'}</span>`}).join('')}
function render(){const h=cur;if(!h)return;
 $('#ed').innerHTML=`<div class="bar"><h2>${esc(h.code)} · ${esc(nm(h))}</h2>${status()}<select id="st" data-p="status" style="width:130px">${['index','draft','reviewed','approved'].map(s=>`<option ${h.status===s?'selected':''}>${s}</option>`).join('')}</select><button id="hist">تاریخچه</button><button class="p" id="save" ${dirty?'':'disabled'}>ذخیره</button></div>
 <div class="grid"><div><label>علمي نوم</label><input dir="ltr" data-p="scientific" value="${esc(h.scientific)}"></div><div><label>کورنۍ</label><input dir="ltr" data-p="family" value="${esc(h.family)}"></div><div><label>د کتاب مخونه</label><input dir="ltr" data-p="pages" value="${esc(h.pages)}"></div></div>
 <label>یادونه / کار (ادمین)</label><textarea style="min-height:50px" data-p="note">${esc(h.note)}</textarea>
 <div class="tabs">${L.map(l=>`<button class="${l===lang?'on':''}" data-l="${l}">${LN[l]}</button>`).join('')}</div>
 <label>نوم (${LN[lang]})</label><input data-p="names.${lang}" value="${esc(h.names[lang])}">
 <label>نور نومونه (هر کرښه: ژبه: نوم)</label><textarea style="min-height:60px" data-p="otherNames.${lang}">${esc(h.otherNames[lang])}</textarea>
 ${FK.map(([k,t])=>`<label>${t}</label><textarea data-p="fields.${lang}.${k}">${esc(h.fields[lang][k])}</textarea>`).join('')}
 <div class="box"><b>عکسونه</b> <button id="addimg">+ عکس زیات کړئ</button><div class="imgs">${imgs.map(i=>`<div class="im"><img src="${i.data}"><select data-im="${i.id}">${IMG.map(x=>`<option ${i.label===x?'selected':''}>${x}</option>`).join('')}</select><button data-del="${i.id}" style="width:100%;margin-top:4px">ړنګول</button></div>`).join('')||'<span style="color:var(--mut)">لا عکس نشته</span>'}</div></div><div id="hl"></div>`}
function setPath(p,v){const k=p.split('.');let o=cur;for(let i=0;i<k.length-1;i++)o=o[k[i]]??={};o[k[k.length-1]]=v}
$('#ed').addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;setPath(p,e.target.value);dirty=true;$('#save').disabled=false;
 const b=document.querySelector('.bar');b.querySelectorAll('.chip').forEach(x=>x.remove());b.querySelector('h2').insertAdjacentHTML('afterend',status())});
$('#ed').addEventListener('click',async e=>{const t=e.target;
 if(t.dataset.l){lang=t.dataset.l;render()}
 else if(t.id==='save')await save();
 else if(t.id==='addimg')$('#imgf').click();
 else if(t.dataset.del){if(confirm('عکس ړنګ سي؟')){await deleteDoc(doc(db,'herbs',cur.code,'images',t.dataset.del));imgs=imgs.filter(i=>i.id!==t.dataset.del);render()}}
 else if(t.id==='hist')await hist()
 else if(t.dataset.restore){cur=structuredClone(JSON.parse(t.dataset.restore));dirty=true;render()}});
$('#ed').addEventListener('change',async e=>{const id=e.target.dataset.im;if(id){const i=imgs.find(x=>x.id===id);i.label=e.target.value;await setDoc(doc(db,'herbs',cur.code,'images',id),{label:i.label},{merge:true})}});
async function save(){const h=cur;h.updatedAt=Date.now();h.updatedBy=auth.currentUser.email;
 const data=JSON.parse(JSON.stringify(h));await setDoc(doc(db,'herbs',h.code),data);
 await addDoc(collection(db,'herbs',h.code,'history'),{at:serverTimestamp(),by:h.updatedBy,data});
 DB[h.code]=data;dirty=false;render();renderList();toast('ذخیره سو ✓')}
async function hist(){const s=await getDocs(query(collection(db,'herbs',cur.code,'history'),orderBy('at','desc'),limit(10)));
 $('#hl').innerHTML='<div class="box"><b>تېره بدلونونه</b>'+(s.docs.map(d=>{const x=d.data();return `<div style="margin-top:6px">${x.at?.toDate().toLocaleString()||''} · ${esc(x.by)} <button data-restore="${esc(JSON.stringify(x.data))}">بیرته راوستل</button></div>`}).join('')||' —')+'</div>'}
$('#imgf').onchange=async e=>{for(const f of e.target.files){const b=await createImageBitmap(f),r=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const data=c.toDataURL('image/webp',.8),o={data,label:IMG[0],order:imgs.length,w:c.width,h:c.height};
 if(data.length>900000){toast('عکس ډېر لوی دی');continue}
 const d=await addDoc(collection(db,'herbs',cur.code,'images'),o);imgs.push({id:d.id,...o})}
 e.target.value='';render();toast('عکسونه ذخیره سول ✓')};
$('#new').onclick=async()=>{const n=Math.max(0,...Object.keys(DB).filter(c=>c[0]==='T').map(c=>+c.slice(1)||0))+1,code=prompt('د نوي بوټي کوډ',('T'+String(n).padStart(3,'0')));if(!code||DB[code])return toast('کوډ تش یا تکراري دی');
 const h={code,type:code[0]||'T',order:Object.keys(DB).length+1,note:'',status:'draft',pages:'',scientific:'',family:'',names:{},otherNames:{},fields:{ps:{},fa:{},ur:{},en:{},ar:{}}};await setDoc(doc(db,'herbs',code),h);DB[code]=h;renderList();openHerb(code)};
$('#imp').onclick=()=>$('#seedf').click();
$('#seedf').onchange=async e=>{const arr=JSON.parse(await e.target.files[0].text());let add=0,b=writeBatch(db),n=0;
 for(const h of arr){if(DB[h.code])continue;b.set(doc(db,'herbs',h.code),h);DB[h.code]=h;add++;if(++n===400){await b.commit();b=writeBatch(db);n=0}}
 if(n)await b.commit();e.target.value='';renderList();toast(add+' بوټي واردات سول')};
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
</script>
</body>
</html>
