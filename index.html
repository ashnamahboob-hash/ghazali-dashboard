.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 4px}
.brand svg{width:34px;height:34px;color:var(--gold);flex:none}
.brand b{font-size:22px;display:block;line-height:1.3}.brand span{color:var(--gold);font-size:14px}
aside .t{padding:10px 16px;display:grid;gap:8px}

.fl{display:flex;gap:6px;flex-wrap:wrap}

#cnt{color:var(--soft);font-size:14px}
#list{overflow:auto;flex:1;padding:4px 14px 18px}

 e.target.value='';render();toast('عکسونه ذخیره سول ✓')};
$('#new').onclick=async()=>{const n=Math.max(0,...Object.keys(DB).filter(c=>c[0]==='T').map(c=>+c.slice(1)||0))+1,code=prompt('د نوي بوټي کوډ',('T'+String(n).padStart(3,'0')));if(!code||DB[code])return toast('کوډ تش یا تکراري دی');
 const h={code,type:code[0]||'T',order:Object.keys(DB).length+1,note:'',status:'draft',pages:'',scientific:'',family:'',names:{},otherNames:{},fields:{ps:{},fa:{},ur:{},en:{},ar:{}},version:0};await setDoc(doc(db,'herbs',code),h);DB[code]=h;renderList();openHerb(code)};
$('#imp').onclick=()=>$('#seedf').click();
$('#seedf').onchange=async e=>{const arr=JSON.parse(await e.target.files[0].text());let add=0,b=writeBatch(db),n=0;
 for(const h of arr){if(DB[h.code])continue;b.set(doc(db,'herbs',h.code),h);DB[h.code]=h;add++;if(++n===400){await b.commit();b=writeBatch(db);n=0}}
 if(n)await b.commit();e.target.value='';renderList();toast(add+' بوټي واردات سول')};
$('#exp').onclick=()=>{const a=Object.values(DB).sort((x,y)=>(x.order??9e9)-(y.order??9e9)),u=URL.createObjectURL(new Blob([JSON.stringify(a,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='ghazali-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();URL.revokeObjectURL(u)};
async function gotoHerb(c){if(dirty&&!confirm('بدلونونه ذخیره نه دي. بل بوټی خلاصوئ؟'))return;dirty=false;sec='lib';flt={st:'all',ty:'all',ch:''};$('#q').value='';$('#gs').value='';$('#gsr').style.display='none';secBar();renderList();await openHerb(c);document.querySelector(`#list [data-c="${c}"]`)?.scrollIntoView({block:'center'})}
let GR=[],GI=0;
function gsRender(){const box=$('#gsr'),q=norm($('#gs').value);if(!q){box.style.display='none';return}
 const m=Object.entries(DB).filter(([c,h])=>hay(c,h).includes(q)).map(([c,h])=>{const n=norm(h.names?.ps),cc=norm(c);return {c,h,s:cc===q?0:cc.startsWith(q)?1:n.startsWith(q)?2:3}}).sort((a,b)=>a.s-b.s||(a.h.order??9e9)-(b.h.order??9e9));
 GR=m.slice(0,15);GI=0;
 box.innerHTML=GR.map((r,i)=>`<div class="gr ${i?'':'on'}" data-gc="${r.c}"><small>${r.c}</small><span>${esc(nm(r.h))}</span><em>${esc(why(r.c,r.h,q))} · ${ST[r.h.status]||''}</em></div>`).join('')+(m.length?`<div class="gm">${m.length} پایله${m.length>15?' (لومړي ۱۵ ښودل سوي)':''}</div>`:'<div class="gm">هیڅ پایله ونه موندل سوه.</div>');box.style.display='block'}
$('#gs').oninput=gsRender;$('#gs').onfocus=gsRender;
$('#gs').onkeydown=e=>{const rows=[...document.querySelectorAll('#gsr .gr')];if(e.key==='Escape'){$('#gs').value='';$('#gsr').style.display='none'}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rows.length)return;rows[GI]?.classList.remove('on');GI=(GI+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows[GI].classList.add('on');rows[GI].scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'&&GR[GI])gotoHerb(GR[GI].c)};
$('#gsr').onmousedown=e=>{const r=e.target.closest('[data-gc]');if(r){e.preventDefault();gotoHerb(r.dataset.gc)}};
document.addEventListener('click',e=>{if(!e.target.closest('#gsw'))$('#gsr').style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#gs').focus()}
 if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(cur&&dirty)save()}});
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
</script>
