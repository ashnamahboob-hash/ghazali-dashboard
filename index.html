<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>د غزالي خزانه – ایډمین ډیشبورډ</title>
<style>
:root{--bg:#174a38;--tile:#2d5c4a;--deep:#103a2b;--gold:#e0c36a;--ink:#fff;--soft:#cfe3d8;--warn:#f0a98a;--ok:#8fd9a8;--red:#c9583a;--yel:#c79a1e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--deep);border:1px solid transparent;border-radius:14px;padding:8px 14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
button{cursor:pointer;background:var(--tile);transition:transform .1s}button:active{transform:scale(.97)}
button.p{background:var(--gold);color:var(--bg);font-weight:700}button:disabled{opacity:.45;cursor:default}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.9}input,select{width:100%}
textarea[readonly]{background:rgba(0,0,0,.22);color:var(--soft)}
textarea.bad{border-color:var(--red)}textarea.warn{border-color:var(--yel)}input.bad{border-color:var(--red)}
select option{background:var(--deep);color:var(--ink)}
#small{display:none;padding:40px;text-align:center}
@media (max-width:1000px){#small{display:block}#app,#login{display:none!important}}
#login{max-width:380px;margin:10vh auto;background:var(--tile);padding:30px;border-radius:24px;text-align:center}
#login .lg{color:var(--gold);width:54px;height:54px}
#login h2{margin:6px 0 4px;font-size:24px}#login .tg{color:var(--gold);margin:0 0 14px}
#login input{margin:6px 0;background:#fff;color:#222;border-radius:20px;padding:12px 18px}
#app{display:none;grid-template-columns:380px 1fr;height:100vh}
aside{background:var(--deep);display:flex;flex-direction:column;min-height:0;border-inline-start:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 4px}
.brand svg{width:34px;height:34px;color:var(--gold);flex:none}
.brand b{font-size:22px;display:block;line-height:1.3}.brand span{color:var(--gold);font-size:14px}
aside .t{padding:10px 16px;display:grid;gap:8px}
#q{background:#fff;color:#222;border-radius:20px;padding:11px 18px}#q::placeholder{color:#889}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{border-radius:12px;padding:0 12px;height:34px;font-size:14px}.fl button.on{background:var(--gold);color:var(--bg);font-weight:700}
.acts{display:flex;gap:6px}.acts button{flex:none;padding:6px 12px}.acts .p{flex:1}
#cnt{color:var(--soft);font-size:14px}
#list{overflow:auto;flex:1;padding:4px 14px 18px}
.it{padding:8px 14px;margin-bottom:8px;border-radius:16px;background:var(--tile);cursor:pointer;display:flex;gap:10px;align-items:center}
.it:hover{background:#376d59}.it.on{background:var(--gold);color:var(--bg);font-weight:700}
.it small{color:var(--gold);min-width:44px;direction:ltr;font-size:13px}.it.on small{color:var(--bg)}
.it .nm{flex:1}
.dot{width:11px;height:11px;border-radius:50%;background:#7a9a8c;flex:none}
.s-reviewed,.s-approved{background:var(--ok)}.s-draft{background:var(--warn)}
.b{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;color:#fff;margin-inline-start:4px;font-weight:400}
.b.r{background:var(--red)}.b.y{background:var(--yel)}
main{overflow:auto;padding:22px 32px 60px}
.bar{display:flex;gap:10px;align-items:center;position:sticky;top:-22px;background:var(--bg);padding:12px 0;z-index:3;flex-wrap:wrap}
.bar h2{margin:0;flex:1;font-size:24px;min-width:200px}.bar select{width:140px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
label{display:block;font-size:14px;color:var(--gold);margin:12px 4px 4px}label small{color:var(--soft);font-weight:400}
.tabs{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap;align-items:center}
.tabs button{border-radius:12px;height:40px;padding:0 18px}.tabs button.on{background:var(--gold);color:var(--bg);font-weight:700}
.tabs select{width:170px;margin-inline-start:auto}
.chip{font-size:12px;padding:1px 10px;border-radius:99px;background:var(--tile);color:var(--soft);margin-inline-start:4px;font-weight:400}.chip.bad{background:#a8552f;color:#fff}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.im{background:var(--deep);border-radius:18px;padding:8px}.im img{width:100%;height:110px;object-fit:cover;border-radius:12px}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--gold);color:var(--bg);font-weight:700;padding:10px 20px;border-radius:14px;display:none;z-index:9}
.box{background:var(--tile);border-radius:20px;padding:6px 18px 16px;margin-top:16px}.box>h3{color:var(--gold);margin:10px 0 0;font-size:18px}.box b{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 20px}
.stat{background:var(--tile);border-radius:20px;padding:16px;text-align:center}.stat b{display:block;font-size:34px;color:var(--gold);line-height:1.3}.stat span{color:var(--soft);font-size:15px}
.home h2{font-size:26px;margin:4px 0 2px}.home p{color:var(--soft)}
.prog{height:14px;border-radius:99px;background:var(--deep);overflow:hidden;display:flex;margin:6px 0 4px}.prog i{display:block;height:100%}
.rec{display:flex;gap:10px;padding:8px 14px;border-radius:14px;background:var(--deep);margin-top:8px;cursor:pointer}.rec small{color:var(--soft);margin-inline-start:auto;direction:ltr}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.hrow span{flex:1;min-width:200px}
.hint{color:var(--soft);font-size:13px;margin:4px 4px 0}
</style>
</head>
<body>
<div id="small">دا ډیشبورډ یوازې په کمپیوټر کې خلاصېږي.</div>
<div id="login"><svg class="lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 9 4 16c0 1.5.4 2.8 1 4 1.2-4.5 4-7.5 8-9.5-3 2.5-5 5.5-6 9.5 1.2.6 2.5 1 4 1 7 0 9-7 9-17z"/></svg><h2>غزالي د طبیعت خزانه</h2><p class="tg">ایډمین ننوتنه</p><input id="em" type="email" placeholder="Email" dir="ltr"><input id="pw" type="password" placeholder="Password" dir="ltr"><button class="p" id="go" style="width:100%;margin-top:8px">ننوتل</button><p id="lerr" style="color:var(--warn)"></p></div>
<div id="app">
<aside>
<div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 9 4 16c0 1.5.4 2.8 1 4 1.2-4.5 4-7.5 8-9.5-3 2.5-5 5.5-6 9.5 1.2.6 2.5 1 4 1 7 0 9-7 9-17z"/></svg><div><b>غزالي د طبیعت خزانه</b><span>ایډمین ډیشبورډ</span></div></div>
<div class="t">
<input id="q" placeholder="لټون: نوم، کوډ، علمي نوم…">
<div class="fl" id="fs"></div>
<div class="fl" id="ft"></div>
<div class="acts"><button class="p" id="new">+ نوی بوټی</button><button id="imp" title="Seed JSON">Import</button><button id="exp" title="بیک اپ">Export</button><button id="out">وتل</button></div>
<small id="cnt"></small>
</div>
<div id="list"></div>
</aside>
<main id="ed"></main>
</div>
<input type="file" id="seedf" accept=".json" hidden>
<input type="file" id="imgf" accept="image/*" multiple hidden>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,addDoc,query,orderBy,limit,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyAhBekjZhte7rhP2Tbu7h4cEcIsCk5nigY",authDomain:"ghazali-herbs.firebaseapp.com",projectId:"ghazali-herbs"};
const $=s=>document.querySelector(s),L=['ps','fa','ur','en','ar'],LN={ps:'پښتو',fa:'فارسی',ur:'اردو',en:'English',ar:'العربية'};
/* د ایپ په څېر ترتیب او لیبلونه (wordDetailLayout) */
const LAB={"ps": {"mhy": "پېژندنه او ماهیت", "origin": "د پیدا کېدو ځای", "source_note": "یادونه", "color": "رنګ او خوند", "mzj": "مزاج", "khs": "دودیز افعال", "benefit": "ځانګړې ګټه", "mzr": "زیانونه", "msl": "مصلح", "bdl": "بدل", "dose": "د کتاب تاریخي مقدار", "chem": "کیمیاوي اجزا", "compounds": "مشهور مرکبات", "experience": "د حکیم تجربه", "use": "د کتاب له مخې استعمال", "notes": "نورې یادونې", "poison_signs": "د زهري کېدو نښې", "poison_treatment": "د زهري کېدو علاج او احتیاط", "history": "تاریخ", "excretion": "له بدن څخه اخراج", "safety": "د خوندیتوب اوسنی احتیاط"}, "fa": {"mhy": "ماهیت", "origin": "محل پیدایش", "source_note": "یادداشت", "color": "رنگ و مزه", "mzj": "مزاج", "khs": "افعال", "benefit": "نفع خاص", "mzr": "مضر", "msl": "مصلح", "bdl": "بدل", "dose": "مقدار مصرف", "chem": "اجزای کیمیایی", "compounds": "مرکبات مشهور", "experience": "تجربۀ حکیم", "use": "استعمال", "notes": "یادداشت‌های دیگر", "poison_signs": "علایم تسمم", "poison_treatment": "درمان تسمم و احتیاط", "history": "تاریخ", "excretion": "دفع از بدن", "safety": "احتیاط ایمنی کنونی"}, "ur": {"mhy": "ماہیت", "origin": "مقام پیدائش", "source_note": "نوٹ", "color": "رنگ و ذائقہ", "mzj": "مزاج", "khs": "افعال", "benefit": "نفع خاص", "mzr": "مضر", "msl": "مصلح", "bdl": "بدل", "dose": "مقدار خوراک", "chem": "کیمیائی اجزا", "compounds": "مشہور مرکبات", "experience": "حکیم کا تجربہ", "use": "استعمال", "notes": "دیگر یادداشتیں", "poison_signs": "علامات زہریت", "poison_treatment": "علاج زہریت اور احتیاط", "history": "تاریخ", "excretion": "بدن سے اخراج", "safety": "موجودہ حفاظتی احتیاط"}, "en": {"mhy": "Description", "origin": "Growing regions", "source_note": "Note", "color": "Colour and taste", "mzj": "Temperament", "khs": "Actions", "benefit": "Particular benefit", "mzr": "Harm", "msl": "Corrective", "bdl": "Substitute", "dose": "Source quantity", "chem": "Chemical constituents", "compounds": "Named preparations", "experience": "Hakim’s experience", "use": "Uses", "notes": "Further notes", "poison_signs": "Poisoning signs", "poison_treatment": "Poisoning treatment and precautions", "history": "History", "excretion": "Excretion", "safety": "Current safety precautions"}, "ar": {"mhy": "الماهية", "origin": "موطن النبات", "source_note": "ملاحظة", "color": "اللون والطعم", "mzj": "المزاج", "khs": "الأفعال", "benefit": "النفع الخاص", "mzr": "المضار", "msl": "المصلح", "bdl": "البدل", "dose": "مقدار الاستعمال", "chem": "المكونات الكيميائية", "compounds": "المركبات المشهورة", "experience": "تجربة الحكيم", "use": "الاستعمال", "notes": "ملاحظات أخرى", "poison_signs": "علامات التسمم", "poison_treatment": "علاج التسمم والاحتياط", "history": "التاريخ", "excretion": "الطرح من الجسم", "safety": "احتياطات السلامة الحالية"}};
const GROUPS=[['پېژندنه',['mhy']],['پیدایښت او یادونه',['origin','source_note']],['خواص',['color','mzj','khs','benefit','mzr','msl','bdl','dose']],['کیمیاوي اجزا',['chem']],['مرکبات او تجربه',['compounds','experience']],['استعمال',['use']],['نورې یادونې',['notes']],['زهري کېدل',['poison_signs','poison_treatment']],['تاریخ او اخراج',['history','excretion']],['خوندیتوب',['safety']]];
const CORE=['mzj','mhy','khs','use','mzr'],SOFT=['msl','bdl'],IMG=['بشپړ بوټی','پاڼه','ګل','مېوه','تخم','ریښه','نور'];
const ST={index:'یوازې فهرست',draft:'مسوده',reviewed:'بیاکتل سوی',approved:'تایید سوی'};
const FS={all:'ټول',index:'فهرست',draft:'مسوده',reviewed:'بیاکتل',approved:'تایید',inc:'نیمګړي'},FT={all:'T M A',T:'T بوټي',M:'M معدني',A:'A حیواني'};
const dirOf=l=>l==='en'?'ltr':'rtl';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
if(CFG.apiKey.startsWith('YOUR')){$('#lerr').textContent='لومړی د فایل په سر کې د Firebase تنظیمات (CFG) ولیکئ.'}
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
let DB={},cur=null,lang='ps',ref='',dirty=false,imgs=[],HS=[],baseAt=0,flt={st:'all',ty:'all'};
$('#go').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value).catch(e=>$('#lerr').textContent='ننوتنه ونه شوه: '+e.code);
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$('#login').style.display=u?'none':'block';$('#app').style.display=u?'grid':'none';if(u)await load()});
async function load(){const s=await getDocs(collection(db,'herbs'));DB={};s.forEach(d=>DB[d.id]=d.data());renderList()}
const nm=h=>h.names?.ps||h.names?.ur||h.names?.en||'';
const ok=v=>String(v??'').trim().length>0;
/* بشپړتیا: سور = اړین ځایونه خالي (مزاج، ماهیت، خواص، استعمال، زیانونه + د کتاب مخ)، ژېړ = مصلح/بدل خالي.
   که کتاب نه وي لیکلی، «په کتاب کې نه دی لیکل شوی» ولیکئ، هغه بشپړ شمېرل کېږي. */
function Q(h){let red=h.pages?0:1,yel=0;const per={};L.forEach(l=>{const f=h.fields?.[l]||{};per[l]=CORE.filter(k=>!ok(f[k])).length;red+=per[l];yel+=SOFT.filter(k=>!ok(f[k])).length});return{red,yel,per}}
function badges(h){if(h.status==='index')return '';const q=Q(h);return (q.red?`<span class="b r">${q.red} سور</span>`:'')+(q.yel?`<span class="b y">${q.yel} ژېړ</span>`:'')}
function chipsRow(){$('#fs').innerHTML=Object.entries(FS).map(([k,t])=>`<button data-fs="${k}" class="${flt.st===k?'on':''}">${t}</button>`).join('');$('#ft').innerHTML=Object.entries(FT).map(([k,t])=>`<button data-ft="${k}" class="${flt.ty===k?'on':''}">${t}</button>`).join('')}
function renderList(){chipsRow();const q=$('#q').value.trim().toLowerCase();
 const a=Object.entries(DB).filter(([c,h])=>{
  if(flt.st==='inc'){if(h.status==='index'||!Q(h).red)return false}else if(flt.st!=='all'&&h.status!==flt.st)return false;
  if(flt.ty!=='all'&&(h.type||'T')!==flt.ty)return false;
  return !q||(c+' '+Object.values(h.names||{}).join(' ')+' '+(h.scientific||'')).toLowerCase().includes(q)}).sort((x,y)=>(x[1].order??9e9)-(y[1].order??9e9));
 $('#cnt').textContent=a.length+' / '+Object.keys(DB).length;
 $('#list').innerHTML=a.map(([c,h])=>`<div class="it ${cur&&cur.code===c?'on':''}" data-c="${c}"><span class="dot s-${h.status}"></span><small>${c}</small><span class="nm">${esc(nm(h))}</span>${badges(h)}${h.note&&h.status==='index'?'<span title="'+esc(h.note)+'" style="color:var(--warn)">⚑</span>':''}</div>`).join('');
 if(!cur)home()}
function home(){const v=Object.values(DB),n=s=>v.filter(h=>h.status===s).length,inc=v.filter(h=>h.status!=='index'&&Q(h).red).length,tot=v.length||1;
 const rec=Object.entries(DB).filter(([c,h])=>h.updatedAt).sort((a,b)=>b[1].updatedAt-a[1].updatedAt).slice(0,8);
 $('#ed').innerHTML=`<div class="home"><h2>ښه راغلاست</h2><p>له لیست څخه یو مدخل وټاکئ.</p>
 <div class="stats">${[['ټول مدخلونه',v.length],['تایید + بیاکتل',n('approved')+n('reviewed')],['مسوده',n('draft')],['نیمګړي (سور)',inc]].map(([t,c])=>`<div class="stat"><b>${c}</b><span>${t}</span></div>`).join('')}</div>
 <div class="box"><h3>پرمختګ</h3><div class="prog"><i style="width:${(n('approved')+n('reviewed'))/tot*100}%;background:var(--ok)"></i><i style="width:${n('draft')/tot*100}%;background:var(--warn)"></i></div><span class="hint">زرغون = بیاکتل/تایید · نارنجي = مسوده · پاتې = یوازې فهرست (${n('index')})</span></div>
 <div class="box"><h3>وروستي بدلونونه</h3>${rec.map(([c,h])=>`<div class="rec" data-c="${c}"><b>${c}</b><span>${esc(nm(h))}</span><small>${new Date(h.updatedAt).toLocaleString()}</small></div>`).join('')||'<span class="hint">تر اوسه هیڅ بدلون نشته.</span>'}</div></div>`}
$('#q').oninput=renderList;
$('#fs').onclick=e=>{const k=e.target.dataset.fs;if(k){flt.st=k;renderList()}};
$('#ft').onclick=e=>{const k=e.target.dataset.ft;if(k){flt.ty=k;renderList()}};
$('#list').onclick=e=>{const i=e.target.closest('.it');if(i)openHerb(i.dataset.c)};
async function openHerb(c){if(dirty&&!confirm('بدلونونه ذخیره نه دي. بل بوټی خلاصوئ؟'))return;
 cur=structuredClone(DB[c]);cur.code=c;cur.names??={};cur.otherNames??={};cur.fields??={};L.forEach(l=>{cur.fields[l]??={}});dirty=false;baseAt=DB[c].updatedAt||0;ref='';
 imgs=[];HS=[];render();renderList();const s=await getDocs(collection(db,'herbs',c,'images'));imgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));if(cur&&cur.code===c)render()}
function chips(){const h=cur,q=Q(h);if(h.status==='index')return '<span class="chip">یوازې فهرست</span>';return (/pending/i.test(h.names?.en||'')?'<span class="chip bad">English ⚠</span>':'')+L.map(l=>`<span class="chip ${q.per[l]?'bad':''}">${l} ${q.per[l]?q.per[l]+' خالي':'✓'}</span>`).join('')}
function fieldBlock(k){const h=cur,v=h.fields[lang][k]||'',idx=h.status==='index',cl=ok(v)||idx?'':CORE.includes(k)?'bad':SOFT.includes(k)?'warn':'';
 const lab=LAB[lang][k]+(lang!=='ps'?` <small>${LAB.ps[k]}</small>`:'');
 const right=ref?`<div><label>${LAB[ref][k]}</label><textarea readonly dir="${dirOf(ref)}">${esc(h.fields[ref]?.[k])}</textarea></div>`:'';
 return `<div class="${ref?'cmp':''}"><div><label>${lab}</label><textarea dir="${dirOf(lang)}" class="${cl}" data-p="fields.${lang}.${k}">${esc(v)}</textarea></div>${right}</div>`}
function render(){const h=cur;if(!h){home();return}
 $('#ed').innerHTML=`<div class="bar"><h2>${esc(h.code)} · ${esc(nm(h))}</h2><span id="chips">${chips()}</span><select id="st" data-p="status">${Object.entries(ST).map(([s,t])=>`<option value="${s}" ${h.status===s?'selected':''}>${t}</option>`).join('')}</select><button id="hist">تاریخچه</button><button class="p" id="save" ${dirty?'':'disabled'}>ذخیره</button></div>
 <div class="grid"><div><label>علمي نوم</label><input dir="ltr" data-p="scientific" value="${esc(h.scientific)}"></div><div><label>کورنۍ</label><input dir="ltr" data-p="family" value="${esc(h.family)}"></div><div><label>د کتاب مخونه</label><input dir="ltr" data-p="pages" class="${h.pages||h.status==='index'?'':'bad'}" value="${esc(h.pages)}"></div></div>
 <label>یادونه / کار (ادمین)</label><textarea style="min-height:50px" data-p="note">${esc(h.note)}</textarea>
 <div class="tabs">${L.map(l=>`<button class="${l===lang?'on':''}" data-l="${l}">${LN[l]}${h.status!=='index'&&Q(h).per[l]?` <span class="chip bad">${Q(h).per[l]}</span>`:''}</button>`).join('')}<select id="ref"><option value="">پرتله: هیڅ</option>${L.filter(l=>l!==lang).map(l=>`<option value="${l}" ${ref===l?'selected':''}>پرتله: ${LN[l]}</option>`).join('')}</select></div>
 <div class="box"><div class="${ref?'cmp':''}"><div><label>نوم (${LN[lang]})</label><input dir="${dirOf(lang)}" data-p="names.${lang}" value="${esc(h.names[lang])}"></div>${ref?`<div><label>نوم (${LN[ref]})</label><input readonly dir="${dirOf(ref)}" value="${esc(h.names[ref])}"></div>`:''}</div>
 <div class="${ref?'cmp':''}"><div><label>نور نومونه (هر کرښه: ژبه: نوم)</label><textarea style="min-height:60px" dir="${dirOf(lang)}" data-p="otherNames.${lang}">${esc(h.otherNames[lang])}</textarea></div>${ref?`<div><label>&nbsp;</label><textarea readonly style="min-height:60px" dir="${dirOf(ref)}">${esc(h.otherNames[ref])}</textarea></div>`:''}</div></div>
 ${GROUPS.map(([t,ks])=>`<section class="box"><h3>${t}</h3>${ks.map(fieldBlock).join('')}</section>`).join('')}
 <div class="box"><label>د بدلون یادښت (اختیاري، د تاریخچې لپاره)</label><input id="vnote" placeholder="لکه: د ۱۲ مخ سره پرتله سوه"><div class="hint">نسخه: ${DB[h.code]?.version||0} · وروستی ذخیره: ${DB[h.code]?.updatedBy?esc(DB[h.code].updatedBy):'—'}</div></div>
 <div class="box"><b>عکسونه</b> <button id="addimg">+ عکس زیات کړئ</button><div class="imgs">${imgs.map(i=>`<div class="im"><img src="${i.data}"><select data-im="${i.id}">${IMG.map(x=>`<option ${i.label===x?'selected':''}>${x}</option>`).join('')}</select><button data-del="${i.id}" style="width:100%;margin-top:4px">ړنګول</button></div>`).join('')||'<span class="hint">لا عکس نشته</span>'}</div></div><div id="hl"></div>`}
function setPath(p,v){const k=p.split('.');let o=cur;for(let i=0;i<k.length-1;i++)o=o[k[i]]??={};o[k[k.length-1]]=v}
$('#ed').addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;setPath(p,e.target.value);dirty=true;$('#save').disabled=false;
 $('#chips').innerHTML=chips();const t=document.querySelector('.tabs');
 L.forEach((l,i)=>{const b=t.children[i],q=Q(cur).per[l],c=b.querySelector('.chip');if(cur.status!=='index'&&q){if(c)c.textContent=q;else b.insertAdjacentHTML('beforeend',` <span class="chip bad">${q}</span>`)}else if(c)c.remove()});
 if(p==='status'){render();return}
 const k=p.split('.').pop(),idx=cur.status==='index';
 if(p==='pages')e.target.classList.toggle('bad',!ok(e.target.value)&&!idx);
 else if(p.startsWith('fields.'))e.target.className=ok(e.target.value)||idx?'':CORE.includes(k)?'bad':SOFT.includes(k)?'warn':''});
$('#ed').addEventListener('click',async e=>{const t=e.target.closest('[data-l],[data-del],[data-restore],[data-c],button')||e.target;
 if(t.dataset.c){openHerb(t.dataset.c)}
 else if(t.dataset.l){lang=t.dataset.l;if(ref===lang)ref='';render()}
 else if(t.id==='save')await save();
 else if(t.id==='addimg')$('#imgf').click();
 else if(t.dataset.del){if(confirm('عکس ړنګ سي؟')){await deleteDoc(doc(db,'herbs',cur.code,'images',t.dataset.del));imgs=imgs.filter(i=>i.id!==t.dataset.del);render()}}
 else if(t.id==='hist')await hist()
 else if(t.dataset.restore!==undefined){cur=structuredClone(HS[+t.dataset.restore].data);dirty=true;render();toast('بیرته راوړل سو. ذخیره کېکاږئ.')}});
$('#ed').addEventListener('change',async e=>{const id=e.target.dataset.im;if(id){const i=imgs.find(x=>x.id===id);i.label=e.target.value;await setDoc(doc(db,'herbs',cur.code,'images',id),{label:i.label},{merge:true})}
 if(e.target.id==='ref'){ref=e.target.value;render()}});
async function save(){const h=cur;
 if(h.status==='approved'&&Q(h).red){return alert('تایید نه سي کېدای: لا سره (سور) نیمګړتیاوې شته. که کتاب نه وي لیکلی، «په کتاب کې نه دی لیکل شوی» ولیکئ.')}
 const sv=await getDoc(doc(db,'herbs',h.code));
 if(sv.exists()&&(sv.data().updatedAt||0)!==baseAt&&!confirm('دا بوټی وروسته له خلاصولو بل چا بدل کړی دی. ستاسو نسخه دې پر هغه ولیکل سي؟'))return;
 const note=($('#vnote')?.value||'').trim();
 h.version=(DB[h.code]?.version||0)+1;h.updatedAt=Date.now();h.updatedBy=auth.currentUser.email;
 const data=JSON.parse(JSON.stringify(h));await setDoc(doc(db,'herbs',h.code),data);
 await addDoc(collection(db,'herbs',h.code,'history'),{at:serverTimestamp(),by:h.updatedBy,version:h.version,note,data});
 DB[h.code]=data;baseAt=h.updatedAt;dirty=false;render();renderList();toast('ذخیره سو ✓ (نسخه '+h.version+')')}
async function hist(){const s=await getDocs(query(collection(db,'herbs',cur.code,'history'),orderBy('at','desc'),limit(15)));HS=s.docs.map(d=>d.data());
 $('#hl').innerHTML='<div class="box"><b>تېر بدلونونه</b>'+(HS.map((x,i)=>`<div class="hrow"><b>v${x.version??'?'}</b><span>${x.at?.toDate().toLocaleString()||''} · ${esc(x.by)}${x.note?' · '+esc(x.note):''}</span><button data-restore="${i}">بیرته راوستل</button></div>`).join('')||'<div class="hint">—</div>')+'</div>';$('#hl').scrollIntoView({behavior:'smooth'})}
$('#imgf').onchange=async e=>{for(const f of e.target.files){const b=await createImageBitmap(f),r=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const data=c.toDataURL('image/webp',.8),o={data,label:IMG[0],order:imgs.length,w:c.width,h:c.height};
 if(data.length>900000){toast('عکس ډېر لوی دی');continue}
 const d=await addDoc(collection(db,'herbs',cur.code,'images'),o);imgs.push({id:d.id,...o})}
 e.target.value='';render();toast('عکسونه ذخیره سول ✓')};
$('#new').onclick=async()=>{const n=Math.max(0,...Object.keys(DB).filter(c=>c[0]==='T').map(c=>+c.slice(1)||0))+1,code=prompt('د نوي بوټي کوډ',('T'+String(n).padStart(3,'0')));if(!code||DB[code])return toast('کوډ تش یا تکراري دی');
 const h={code,type:code[0]||'T',order:Object.keys(DB).length+1,note:'',status:'draft',pages:'',scientific:'',family:'',names:{},otherNames:{},fields:{ps:{},fa:{},ur:{},en:{},ar:{}},version:0};await setDoc(doc(db,'herbs',code),h);DB[code]=h;renderList();openHerb(code)};
$('#imp').onclick=()=>$('#seedf').click();
$('#seedf').onchange=async e=>{const arr=JSON.parse(await e.target.files[0].text());let add=0,b=writeBatch(db),n=0;
 for(const h of arr){if(DB[h.code])continue;b.set(doc(db,'herbs',h.code),h);DB[h.code]=h;add++;if(++n===400){await b.commit();b=writeBatch(db);n=0}}
 if(n)await b.commit();e.target.value='';renderList();toast(add+' بوټي واردات سول')};
$('#exp').onclick=()=>{const a=Object.values(DB).sort((x,y)=>(x.order??9e9)-(y.order??9e9)),u=URL.createObjectURL(new Blob([JSON.stringify(a,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='ghazali-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();URL.revokeObjectURL(u)};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(cur&&dirty)save()}});
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
</script>
</body>
</html>
