 کتاب تاریخي نقلونه دي.\n\nد وچولو په پخواني بیان کې مېوه تر پخېدو او لوېدو پر ونه پرېښودل کېږي. کتاب د نږدې درې پر څلور برخې وچې مېوې لپاره ټوکرۍ، مرطوب ګوګړي لوګی ۲۰–۳۰ دقیقې، په لرګینو ټوکریو کې ۵–۷ ورځې لمر، اړول، تر بشپړ وچېدو مخکې لږ هوارول او د مالګې محلول یادوي. وروستی عمل د نرموالي او خوند د ساتلو لپاره بولي. د قوت موده دوه کاله لیکي. دا د سرچینې د وخت د ساتنې طریقه ده.","subtitle":"","source_ref":"PDF printed pages 1–5 · notes"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"fa":{"mhy":[{"text":"کتاب بلندی درخت انجیر را حدود شش، ده یا دوازده فوت ذکر می‌کند و میان نوع خودرو و پرورشی فرق می‌گذارد.","subtitle":"","source_ref":"sections.mhy"},{"text":"برگ‌ها بزرگ و زبر اند و از بخش‌های درخت شیرابه بیرون می‌شود.","subtitle":"","source_ref":"sections.mhy"},{"text":"کتاب از دو بار میوه‌دهی در سال و ماه‌های مارچ، اپریل، می و جون یاد می‌کند.","subtitle":"","source_ref":"sections.mhy"},{"text":"میوۀ گرد گوشت نرم و شیرین و دانه‌های ریز دارد.","subtitle":"","source_ref":"sections.mhy"},{"text":"میوۀ نارس سبز و سفت است و با رسیدن نرم می‌شود و ممکن است رنگ سرخ‌فام، قهوه‌ای یا ارغوانی بگیرد.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"کتاب سمیرنا در آسیای صغیر را خاستگاه احتمالی انجیر می‌داند.","subtitle":"","source_ref":"extras.0"},{"text":"از کشت گسترده در افغانستان، ایران، بلوچستان، افریقا، ترکیه، اسپانیا و پرتگال و کشت تجارتی در مناطق عربی، ایران، چین و جاپان یاد می‌کند.","subtitle":"","source_ref":"extras.0"},{"text":"به گفتۀ مؤلف، کشت در نیم‌قارۀ هند پاسخگوی نیاز مردم نیست و در روایت او، طبیبان ایرانی و عرب انجیر را به آن‌جا برده‌اند.","subtitle":"","source_ref":"extras.0"},{"text":"وقت گرفتن قلمه را از نیمۀ فبروری تا آغاز مارچ می‌داند.","subtitle":"","source_ref":"extras.0"},{"text":"قلمه‌ها با فاصله کشت می‌شوند و درخت پس از دو یا سه سال میوه می‌دهد.","subtitle":"","source_ref":"extras.0"},{"text":"فاصلۀ قلمه‌ها سه فوت ذکر شده است.","subtitle":"","source_ref":"extras.0"},{"text":"وقت میوۀ اول از میانۀ می تا آغاز جون و برای میوۀ دوم از میانۀ مارچ تا آغاز اپریل چاپ شده است.","subtitle":"","source_ref":"extras.0"},{"text":"این ترتیب مطابق متن کتاب حفظ شده است.","subtitle":"","source_ref":"extras.0"},{"text":"در نمونۀ سفر داوران، درختان از انجیر می‌خواهند فرمان‌روایی کند و انجیر حاضر به رها کردن میوۀ شیرین خود نمی‌شود.","subtitle":"","source_ref":"extras.1"},{"text":"در نمونۀ غزل غزل‌ها از رسیدن انجیر و خوش‌بویی تاک‌ها یاد می‌شود.","subtitle":"","source_ref":"extras.1"}],"source_note":[],"color":[],"mzj":[{"text":"به نقل از تاج المفردات، خزائن‌الادویه انجیر تازه و خودرو را معتدل می‌داند. حکیم کبیرالدین در علم‌الادویه نفیسی، انجیر تازه را به سبب شیرینی اندکی گرم و به سبب آب فراوان ترتر می‌داند. مخزن‌الادویه آن را در درجۀ اول گرم و در درجۀ دوم تر می‌خواند. فارماکوپیای طبی تنها گرم و تر گفته است. انجیر خشک در کتاب گرم و لطیف دانسته شده است.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"کتاب انجیر را مغذی و زودهضم می‌داند.","subtitle":"","source_ref":"sections.khs"},{"text":"در اصطلاح طب یونانی، آن را پاک‌کننده، خلط‌آور، ادرارآور، نرم‌کننده، عرق‌آور، مقوی و تحلیل‌برندۀ ورم می‌خواند.","subtitle":"","source_ref":"sections.khs"},{"text":"برای انجیر خشک، شیرینی میوه و شیرابۀ درخت اثرهای جداگانه ذکر می‌کند.","subtitle":"","source_ref":"sections.khs"},{"text":"میان تشنگی گرم‌مزاجان و تشنگی منسوب به بلغم فرق می‌گذارد و دیدگاه‌های سنتی دربارۀ سرفۀ بلغمی مزمن، گرفتگی جگر و طحال، گرده‌ها و مثانه می‌آورد.","subtitle":"","source_ref":"sections.khs"},{"text":"در شمار فواید خاص، از قبضیت، سرفه، نفس‌تنگی، بواسیر، نقرس، سختی و ورم طحال و رنگ پوست یاد می‌کند.","subtitle":"","source_ref":"sections.khs"},{"text":"این‌ها نسبت‌های تاریخی کتاب اند.","subtitle":"","source_ref":"sections.khs"},{"text":"در اصطلاح کتاب، شیرینی انجیر منضج و انجیر خشک گرم و لطیف دانسته شده است.","subtitle":"","source_ref":"sections.khs"},{"text":"مؤلف از غذای فراوان و زود سیرشدن، ادعای ساختن خون خوب، تشنگی گرم‌مزاجان و رقیق‌شدن بلغم در تشنگی بلغمی نیز سخن می‌گوید.","subtitle":"","source_ref":"sections.khs"},{"text":"برای شیرابۀ انجیر نسبت تاریخی حل‌کردن خون لخته‌شده و شیر بسته‌شده آمده است.","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"در نقل‌های منسوب به فارماکوپیای طبی و حکیم کبیرالدین، از زیان احتمالی به جگر، معده و روده‌ها و نیز گرفتگی یاد شده است.","subtitle":"","source_ref":"sections.mzr"},{"text":"مؤلف در صفحۀ پنجم با این نظر مخالفت می‌کند و به تجربه و پژوهش خود اشاره دارد.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"سکنجبین، شربت ترنج، انیسون، صعتر فارسی و بادام شیرین در کتاب به‌عنوان مصلح ذکر شده‌اند.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"مویز منقّی و مغز جلغوزه در کتاب به‌عنوان بدل ذکر شده‌اند.","subtitle":"","source_ref":"sections.bdl"}],"dose":[],"chem":[{"text":"جدول در هر صد گرام، پروتین، نشایسته، انرژی، سودیم، پوتاشیم، کلسیم، مگنیزیم، آهن، مس، فاسفورس، گوگرد و کلورین را ذکر می‌کند.","subtitle":"","source_ref":"extras.3"},{"text":"ویتامین‌های A و C نیز در جدول آمده‌اند.","subtitle":"","source_ref":"extras.3"}],"compounds":[],"experience":[{"text":"مؤلف دیدگاه‌های او و جالینوس را به‌عنوان دیدگاه‌های طبی تاریخی ثبت می‌کند.","subtitle":"","source_ref":"extras.2"},{"text":"مطالب مربوط به بیماری‌ها و کاربردها در بخش‌های بالا آمده‌اند.","subtitle":"","source_ref":"extras.2"},{"text":"مؤلف در بحث بعدی به قند و ویتامین‌های B و D اشاره می‌کند و با استناد به ترکیب آن، انجیر را میوۀ مغذی می‌داند.","subtitle":"","source_ref":"extras.3"},{"text":"تجربه‌های طبی مؤلف در بخش کاربردها مطرح شده‌اند.","subtitle":"","source_ref":"extras.3"},{"text":"مؤلف در بحث قبضیت، مقدار ۲–۳ دانه در فارماکوپیا و تجربۀ خود با ۴–۵ انجیر خشک را ذکر می‌کند.","subtitle":"","source_ref":"extras.5"},{"text":"در روایت شخصی بواسیر، ۳، ۵ یا ۷ دانه و مدت چند ماه آمده است.","subtitle":"","source_ref":"extras.5"},{"text":"این‌ها مقدارهای تاریخی ثبت‌شده در کتاب اند.","subtitle":"","source_ref":"extras.5"},{"text":"کتاب از تکه‌تکه شدن شیر هنگام جوشاندن با انجیر و نسبت‌دادن نفخ معده و گرفتگی روده‌ها به آن یاد می‌کند.","subtitle":"","source_ref":"extras.5"},{"text":"مؤلف در روایت بواسیر مدت ۴–۶ ماه و پس از انجیر دو برابر آن شیر را ذکر می‌کند.","subtitle":"","source_ref":"extras.5"},{"text":"در روایت شخصی سرفه، ۲–۳ انجیر و زمانی کمی پیش یا پس از غذای روز یا شب آمده است.","subtitle":"","source_ref":"extras.5"},{"text":"این‌ها روایت‌های تاریخی مؤلف اند.","subtitle":"","source_ref":"extras.5"}],"use":[{"text":"کتاب برای خشونت گلو و قبضیت کاربردهای سنتی یاد می‌کند. خوردن با چهارمغز، بادام یا پسته، جوشانده با صعتر، غرغره، ضماد و افزودن به معجون از نمونه‌های آن اند. کاربردهای قدیم مربوط به طحال، رحم، مقعد، پوست، بواسیر و دانه‌های ناشی از تب نیز آمده‌اند. در پایان از خاکستر انجیر خشک برای دندان و شیرابۀ میوۀ تازه بر زگیل یاد می‌کند. مقدارها و تجربه‌های مؤلف نیز در کتاب آمده‌اند. این بخش گزارش کاربردهای تاریخی است. کتاب شیرابۀ انجیر را در بحث لخته‌شدن خون یاد می‌کند. همچنین نسبت‌های تاریخی مربوط به گرفتگی جگر و طحال، سنگ گرده و مثانه، استعمال با سکنجبین برای ورم طحال، ضماد انجیر رسیده و بخار برای ورم و درد مقعد را ثبت می‌کند. در بحث پوست، برص، چنبل و کلف را نام می‌برد. در نقل حکیم رام، انجیر با صعتر دربارۀ بلغم و با بادام یا پسته دربارۀ حافظه و دماغ آمده است. در نقل‌های ابن‌قیم و جالینوس از ترکیب با چهارمغز و بادام، التهاب سینه و شش‌ها، ادرار و گرده و مثانه جداگانه یاد شده است. در بحث قبضیت بلغمی، انجیر ترشده در آب و پیوند آن با نقرس ذکر شده است. برای ضماد میوۀ رسیده از غده‌های زیر گلو یاد می‌شود. در نقل جالینوس، با چهارمغز و بادام ادعای حفاظت در برابر بعضی زهرها و افزایش‌ندادن تشنگی هنگام تب آمده است. با چهارمغز نسبت تقویت باه نیز ثبت است. در روایت دینی منسوب، ذکر فایدۀ بواسیر و نقرس هم بخشی از نقل کتاب است. مؤلف دربارۀ ضعف دماغ و تب نیز از انجیر یاد می‌کند. برگ‌ها در بحث پخته‌شدن دمل نیز ذکر شده‌اند.","subtitle":"","source_ref":"sections.use"}],"notes":[{"text":"کتاب چهار آیۀ نخست سورۀ تین را می‌آورد.","subtitle":"","source_ref":"extras.1"},{"text":"در آن آیه‌ها به انجیر، زیتون، طور سینا و شهر امن سوگند یاد می‌شود و از آفرینش انسان به بهترین صورت سخن می‌رود.","subtitle":"","source_ref":"extras.1"},{"text":"سپس روایتی منسوب به ابوالدرداء را دربارۀ ظرفی از انجیر، خوردن آن و همانند دانستن آن با میوۀ بهشت نقل می‌کند.","subtitle":"","source_ref":"extras.1"},{"text":"به نقل کتاب، ابن‌قیم می‌گوید انجیر در حجاز و مدینه رایج نبود، خرما میوۀ معمول بود و انجیر سفید را نوع برتر می‌دانست.","subtitle":"","source_ref":"extras.2"},{"text":"میوه تا رسیدن و افتادن از درخت روی درخت می‌ماند.","subtitle":"","source_ref":"extras.4"},{"text":"به گفتۀ مؤلف، در آن هنگام حدود سه‌چهارم خشک شده است.","subtitle":"","source_ref":"extras.4"},{"text":"کتاب از سبد، دود مرطوب گوگرد، خشک‌کردن در آفتاب در سبدهای چوبی، پشت‌ورو کردن میوه‌ها، پهن کردن آن‌ها پیش از خشک‌شدن کامل و فروبردن در محلول نمک یاد می‌کند.","subtitle":"","source_ref":"extras.4"},{"text":"مؤلف گام آخر را برای حفظ نرمی و مزه می‌داند.","subtitle":"","source_ref":"extras.4"},{"text":"در پایان، مدت اثر را دو سال ذکر می‌کند.","subtitle":"","source_ref":"extras.4"},{"text":"برای دود مرطوب گوگرد ۲۰–۳۰ دقیقه و برای خشک‌کردن در آفتاب ۵–۷ روز ذکر شده است.","subtitle":"","source_ref":"extras.4"},{"text":"میوه پیش از مرحلۀ محلول نمک کمی پهن می‌شود.","subtitle":"","source_ref":"extras.4"},{"text":"مؤلف ۴۹ یادکرد در تورات و انجیل برمی‌شمارد.","subtitle":"","source_ref":"extras.1"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"ur":{"mhy":[{"text":"کتاب انجیر کے درخت کی اونچائی تقریباً چھ، دس یا بارہ فٹ بتاتی ہے اور جنگلی اور کاشت شدہ اقسام میں فرق کرتی ہے۔","subtitle":"","source_ref":"sections.mhy"},{"text":"پتے بڑے اور کھردرے ہوتے ہیں اور درخت کے حصوں سے دودھیا رس نکلتا ہے۔","subtitle":"","source_ref":"sections.mhy"},{"text":"سال میں دو مرتبہ پھل آنے کا ذکر ہے اور مارچ، اپریل، مئی اور جون کے مہینے درج ہیں۔","subtitle":"","source_ref":"sections.mhy"},{"text":"گول پھل کا گودا نرم اور میٹھا اور دانے چھوٹے ہوتے ہیں۔","subtitle":"","source_ref":"sections.mhy"},{"text":"کچا پھل سبز اور سخت ہوتا ہے۔","subtitle":"","source_ref":"sections.mhy"},{"text":"پک کر نرم ہو جاتا ہے اور سرخی مائل، بھورا یا ارغوانی ہو سکتا ہے۔","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"افغانستان، ایران، بلوچستان، افریقہ، ترکی، اسپین اور پرتگال میں وسیع کاشت، اور عرب علاقوں، ایران، چین اور جاپان میں تجارتی کاشت کا ذکر کرتی ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"مصنف کے مطابق برصغیر کی کاشت مقامی ضرورت پوری نہیں کرتی۔","subtitle":"","source_ref":"extras.0"},{"text":"اس کی نقل کردہ روایت میں ایرانی اور عرب طبیب انجیر وہاں لائے۔","subtitle":"","source_ref":"extras.0"},{"text":"قلمیں وسط فروری سے اوائل مارچ تک لی جاتی ہیں، فاصلے سے لگائی جاتی ہیں اور درخت دو یا تین برس میں پھل دینے لگتا ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"قلموں کے درمیان تین فٹ فاصلہ درج ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"پہلے پھل کا وقت وسط مئی سے اوائل جون اور دوسرے کے لیے وسط مارچ سے اوائل اپریل چھپا ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"یہ ترتیب کتاب کے متن کے مطابق محفوظ ہے۔","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[],"mzj":[{"text":"تاج المفردات کے مطابق خزائن الادویہ میں تازہ اور جنگلی انجیر کو معتدل کہا گیا ہے۔ حکیم کبیرالدین نے علم الادویہ نفیسی میں مٹھاس کی وجہ سے اسے قدرے گرم اور پانی کی فراوانی کی وجہ سے زیادہ تر قرار دیا ہے۔ مخزن الادویہ کے مطابق تازہ انجیر پہلے درجے میں گرم اور دوسرے درجے میں تر ہے۔ طبی فارماکوپیا میں گرم و تر لکھا ہے۔ خشک انجیر کو گرم اور لطیف کہا گیا ہے۔","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"کتاب انجیر کو غذائیت بخش اور زود ہضم بتاتی ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"طب یونانی کی اصطلاح میں اسے جالی، مخرج بلغم، مدر بول، ملین، معرق، مقوی اور محلل ورم کہا گیا ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"خشک انجیر، پھل کی مٹھاس اور درخت کے دودھیا رس کے لیے الگ اثرات منسوب ہیں۔","subtitle":"","source_ref":"sections.khs"},{"text":"گرم مزاج کی پیاس اور بلغمی پیاس میں فرق کیا گیا ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"پرانی بلغمی کھانسی، جگر اور تلی کی رکاوٹوں، گردوں اور مثانے سے متعلق روایتی آرا بھی مذکور ہیں۔","subtitle":"","source_ref":"sections.khs"},{"text":"یہ کتاب کی تاریخی نسبتیں ہیں۔","subtitle":"","source_ref":"sections.khs"},{"text":"کتاب کے بیان میں انجیر کی مٹھاس کو منضج اور خشک انجیر کو گرم و لطیف کہا گیا ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"زیادہ غذا اور جلد سیر ہونے، عمدہ خون بننے، گرم مزاج کی پیاس اور بلغمی پیاس میں بلغم رقیق ہونے کی توضیح بھی ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"دودھیا رس کے لیے جمے ہوئے خون اور دودھ کو پگھلانے کی تاریخی نسبت درج ہے۔","subtitle":"","source_ref":"sections.khs"}],"benefit":[{"text":"خاص فوائد میں قبض، کھانسی، دمہ، بواسیر، نقرس، تلی کی سختی اور سوجن، اور جلد کی رنگت کا ذکر ہے۔","subtitle":"","source_ref":"sections.khs"}],"mzr":[{"text":"طبی فارماکوپیا اور حکیم کبیرالدین سے منسوب حوالوں میں جگر، معدے اور آنتوں کو ممکنہ ضرر اور رکاوٹ کا ذکر ہے۔","subtitle":"","source_ref":"sections.mzr"},{"text":"صفحہ ۵ پر مصنف اس رائے سے اختلاف کرتے ہوئے اپنے تجربے اور تحقیق کا حوالہ دیتا ہے۔","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"سکنجبین، شربت ترنج، انیسون، صعتر فارسی اور میٹھا بادام بطور مصلح درج ہیں۔","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"مویز منقّی اور مغز چلغوزہ بطور بدل درج ہیں۔","subtitle":"","source_ref":"sections.bdl"}],"dose":[],"chem":[{"text":"فی سو گرام جدول میں پروٹین، نشاستہ، حرارے، سوڈیم، پوٹاشیم، کیلشیم، میگنیشیم، لوہا، تانبا، فاسفورس، گندھک اور کلورین درج ہیں۔","subtitle":"","source_ref":"extras.3"},{"text":"وٹامن اے اور سی کا ذکر بھی ہے۔","subtitle":"","source_ref":"extras.3"},{"text":"بعد کی بحث میں مصنف شکر اور وٹامن بی اور ڈی کا حوالہ دے کر انجیر کو غذائیت بخش پھل بتاتا ہے۔","subtitle":"","source_ref":"extras.3"}],"compounds":[],"experience":[{"text":"مصنف کے طبی مشاہدات کا تعلق اوپر درج استعمالات سے ہے۔","subtitle":"","source_ref":"extras.3"},{"text":"قبض کی بحث میں مصنف فارماکوپیا کے ۲–۳ دانوں کا حوالہ اور اپنا ۴–۵ خشک انجیروں کا تجربہ لکھتا ہے۔","subtitle":"","source_ref":"extras.5"},{"text":"بواسیر کی اپنی روایت میں ۳، ۵ یا ۷ دانے اور کئی ماہ کا دورانیہ مذکور ہے۔","subtitle":"","source_ref":"extras.5"},{"text":"یہ کتاب میں درج تاریخی مقداریں ہیں۔","subtitle":"","source_ref":"extras.5"},{"text":"انجیر کے ساتھ دودھ ابالنے پر چھوٹے ٹکڑے بننے اور معدے میں نفخ اور آنتوں میں رکاوٹ کی نسبت بھی درج ہے۔","subtitle":"","source_ref":"extras.5"},{"text":"بواسیر کی مدت کے ضمن میں مصنف ۴–۶ ماہ اور انجیر کے بعد دوگنا دودھ لکھتا ہے۔","subtitle":"","source_ref":"extras.5"},{"text":"کھانسی کی ذاتی روایت میں ۲–۳ انجیر اور دن یا رات کے کھانے سے کچھ پہلے یا بعد لینے کا ذکر ہے۔","subtitle":"","source_ref":"extras.5"},{"text":"یہ مصنف کی تاریخی روایت ہے۔","subtitle":"","source_ref":"extras.5"}],"use":[{"text":"کتاب گلے کی خراش اور قبض کے لیے روایتی استعمالات بیان کرتی ہے۔ اخروٹ، بادام یا پستے کے ساتھ کھانا، صعتر کے ساتھ جوشاندہ، غرارے، ضماد اور معجون میں شامل کرنا اس کی مثالیں ہیں۔ تلی، رحم، مقعد، جلد، بواسیر اور بخار کے دانوں کے متعلق پرانے استعمالات بھی درج ہیں۔ آخر میں دانتوں کے لیے خشک انجیر کی راکھ اور مسّوں کے لیے تازہ پھل کے دودھیا رس کا ذکر ہے۔ کتاب میں مقدار اور مصنف کے تجربات بھی بیان ہوئے ہیں۔ یہ تاریخی طریقوں کا بیان ہے۔ کتاب انجیر کے دودھیا رس کا ذکر خون جمنے کے ضمن میں کرتی ہے۔ اسی بحث میں جگر اور تلی کے سدّے، گردے اور مثانے کی پتھری، ورم طحال میں سکنجبین کے ساتھ استعمال، پکے انجیر کے ضماد اور مقعد کے ورم اور درد میں بھاپ کی تاریخی نسبتیں درج ہیں۔ جلد کے ضمن میں برص، چنبل اور کلف کے نام آتے ہیں۔ حکیم رام کی نقل میں انجیر اور صعتر کا ذکر بلغم اور بادام یا پستے کے ساتھ حافظے اور دماغ کے حوالے سے ہے۔ ابن قیم اور جالینوس کی نقلوں میں اخروٹ اور بادام کے ساتھ ترکیب، سینے اور پھیپھڑوں کے التهاب، ادرار، گردے اور مثانے کی الگ آرا ہیں۔ بلغمی قبض کے ضمن میں پانی میں بھگوئی انجیر اور اس کے ساتھ نقرس کا ذکر ہے۔ پکے پھل کے ضماد کے لیے گلے کے نیچے کی غدود کا بیان ہے۔ جالینوس کی نقل میں اخروٹ اور بادام کے ساتھ بعض زہروں سے حفاظت کا دعویٰ اور بخار میں پیاس نہ بڑھانے کی نسبت ہے۔ اخروٹ کے ساتھ قوت باہ کی نسبت بھی درج ہے۔ منسوب مذہبی روایت میں بواسیر اور نقرس کے فائدے کا ذکر بھی اسی کتاب کی نقل کا حصہ ہے۔ مصنف دماغی کمزوری اور بخار کے ضمن میں بھی انجیر کا ذکر کرتا ہے۔ پتوں کا ذکر پھوڑے پکانے کے ضمن میں بھی ہے۔","subtitle":"","source_ref":"sections.use"}],"notes":[{"text":"کتاب ایشیائے کوچک کے شہر سمرنا کو انجیر کا ممکنہ اصل وطن قرار دیتی ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"کتاب سورۂ تین کی پہلی چار آیات لاتی ہے، جن میں انجیر، زیتون، طور سینا اور امن والے شہر کی قسم اور انسان کی بہترین صورت میں تخلیق کا بیان ہے۔","subtitle":"","source_ref":"extras.1"},{"text":"پھر ابو الدرداء سے منسوب روایت نقل کرتی ہے جس میں انجیر کے برتن، پھل کھانے اور اسے جنت کے پھل سے تشبیہ دینے کا ذکر ہے۔","subtitle":"","source_ref":"extras.1"},{"text":"کتاب کے نقل کردہ بیان میں ابن قیم کہتے ہیں کہ حجاز اور مدینہ میں انجیر عام نہیں تھی، کھجور عام تھی اور سفید انجیر بہتر سمجھی جاتی تھی۔","subtitle":"","source_ref":"extras.2"},{"text":"ابن قیم اور جالینوس کی باتیں تاریخی طبی آرا کے طور پر درج ہیں۔","subtitle":"","source_ref":"extras.2"},{"text":"بیماریوں اور استعمالات کے متعلق مواد اوپر اپنے متعلقہ حصوں میں ہے۔","subtitle":"","source_ref":"extras.2"},{"text":"کتاب کے بیان میں پھل پک کر گرنے تک درخت پر رہتا ہے اور اس وقت تقریباً تین چوتھائی خشک ہو چکا ہوتا ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"کتاب ٹوکری، گندھک کے نم دھوئیں، لکڑی کی ٹوکریوں میں دھوپ میں خشک کرنے، پھل الٹنے، مکمل خشک ہونے سے پہلے چپٹا کرنے اور نمک کے محلول میں ڈبونے کا ذکر کرتی ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"مصنف آخری مرحلے کو نرمی اور ذائقہ برقرار رکھنے سے جوڑتا ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"آخر میں مدت تاثیر دو سال درج ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"گندھک کے مرطوب دھوئیں کا وقت ۲۰–۳۰ منٹ اور دھوپ میں خشک کرنے کا وقت ۵–۷ دن درج ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"نمک کے محلول سے پہلے پھل قدرے چپٹا کیا جاتا ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"مصنف تورات و انجیل میں انجیر کے ۴۹ تذکرے گنواتا ہے۔","subtitle":"","source_ref":"extras.1"},{"text":"قضاۃ کی مثال میں درخت انجیر کو حکمران بنانا چاہتے ہیں اور وہ اپنا میٹھا پھل چھوڑنے پر آمادہ نہیں۔","subtitle":"","source_ref":"extras.1"},{"text":"غزل الغزلات کی مثال میں انجیر پکنے اور انگور کی بیلوں کی خوشبو کا ذکر ہے۔","subtitle":"","source_ref":"extras.1"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"en":{"mhy":[{"text":"The book describes fig trees as about six, ten or twelve feet tall and distinguishes wild from cultivated trees.","subtitle":"","source_ref":"sections.mhy"},{"text":"The leaves are large and rough, and parts of the tree exude latex.","subtitle":"","source_ref":"sections.mhy"},{"text":"The book mentions two fruitings a year and names March, April, May and June.","subtitle":"","source_ref":"sections.mhy"},{"text":"The round fruit has soft, sweet flesh and small seeds.","subtitle":"","source_ref":"sections.mhy"},{"text":"Unripe fruit is green and firm.","subtitle":"","source_ref":"sections.mhy"},{"text":"As it ripens it softens and may become reddish, brown or purple.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"The book identifies Smyrna in Asia Minor as a possible place of origin.","subtitle":"","source_ref":"extras.0"},{"text":"It mentions widespread cultivation in Afghanistan, Iran, Balochistan, Africa, Turkey, Spain and Portugal, and commercial cultivation in Arab regions, Iran, China and Japan.","subtitle":"","source_ref":"extras.0"},{"text":"The author says cultivation in the Indian subcontinent does not meet demand and recounts a tradition that physicians from Iran and Arab lands introduced the fig there.","subtitle":"","source_ref":"extras.0"},{"text":"Cuttings are taken from mid-February to early March and planted at intervals.","subtitle":"","source_ref":"extras.0"},{"text":"The trees bear fruit after two or three years.","subtitle":"","source_ref":"extras.0"},{"text":"The book specifies three feet between cuttings.","subtitle":"","source_ref":"extras.0"},{"text":"It prints the first fruiting period as mid-May to early June and the second as mid-March to early April.","subtitle":"","source_ref":"extras.0"},{"text":"This ordering is retained from the source.","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[],"mzj":[{"text":"According to Taj al-Mufradat, Khazain al-Adwiya regards fresh and wild figs as temperate. In Ilm al-Adwiya Nafisi, Hakim Kabiruddin describes fresh figs as slightly warm on account of their sweetness and more moist on account of their water content. Makhzan al-Adwiya describes them as warm in the first degree and moist in the second. The medical pharmacopoeia calls them warm and moist without specifying degrees. The book describes dried figs as warm and subtle.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"The book calls the fig nutritious and easy to digest.","subtitle":"","source_ref":"sections.khs"},{"text":"In Unani terms it is described as cleansing, expectorant, diuretic, softening, diaphoretic, strengthening and dispersing swellings.","subtitle":"","source_ref":"sections.khs"},{"text":"Separate effects are ascribed to dried figs, the sweetness of the fruit and the latex.","subtitle":"","source_ref":"sections.khs"},{"text":"The author distinguishes thirst in people of warm temperament from thirst attributed to phlegm.","subtitle":"","source_ref":"sections.khs"},{"text":"The text records traditional views concerning chronic productive cough, obstructions of the liver and spleen, and the kidneys and bladder.","subtitle":"","source_ref":"sections.khs"},{"text":"These are historical attributions.","subtitle":"","source_ref":"sections.khs"},{"text":"In the book's terminology the sweetness is maturative, and dried figs are warm and subtle.","subtitle":"","source_ref":"sections.khs"},{"text":"The author also mentions providing abundant nourishment and quick satiety, a claim of producing good-quality blood, thirst in warm temperaments, and thinning phlegm in thirst attributed to phlegm.","subtitle":"","source_ref":"sections.khs"},{"text":"Fig latex is historically credited with dissolving clotted blood and curdled milk.","subtitle":"","source_ref":"sections.khs"}],"benefit":[{"text":"Its list of particular benefits mentions constipation, cough, breathlessness, hemorrhoids, gout, hardening and swelling of the spleen, and complexion.","subtitle":"","source_ref":"sections.khs"}],"mzr":[{"text":"Passages attributed to the medical pharmacopoeia and Hakim Kabiruddin mention possible harm to the liver, stomach and intestines and refer to obstruction.","subtitle":"","source_ref":"sections.mzr"},{"text":"On page 5 the author disagrees and refers to his own experience and research.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"The book lists sikanjabin, citron syrup, anise, Persian sa'tar and sweet almonds as correctives.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"The book lists cleaned raisins (mawiz munaqqa) and chilgoza pine kernels as substitutes.","subtitle":"","source_ref":"sections.bdl"}],"dose":[],"chem":[{"text":"The table per 100 grams lists protein, starch, energy, sodium, potassium, calcium, magnesium, iron, copper, phosphorus, sulfur and chlorine.","subtitle":"","source_ref":"extras.3"},{"text":"It also mentions vitamins A and C.","subtitle":"","source_ref":"extras.3"},{"text":"The following discussion mentions sugar and vitamins B and D and cites the composition in describing figs as nutritious.","subtitle":"","source_ref":"extras.3"}],"compounds":[],"experience":[{"text":"The author's clinical observations relate to the uses discussed above.","subtitle":"","source_ref":"extras.3"},{"text":"In discussing constipation the author cites a pharmacopoeial quantity of 2–3 fruits and records his own experience with 4–5 dried figs.","subtitle":"","source_ref":"extras.5"},{"text":"His personal account concerning hemorrhoids mentions 3, 5 or 7 fruits over several months.","subtitle":"","source_ref":"extras.5"},{"text":"These are historical quantities recorded in the book.","subtitle":"","source_ref":"extras.5"},{"text":"The text also describes milk forming small pieces when boiled with figs and attributes bloating and intestinal obstruction to this.","subtitle":"","source_ref":"extras.5"},{"text":"In the hemorrhoid account the author gives a duration of 4–6 months and mentions twice the quantity of milk after the figs.","subtitle":"","source_ref":"extras.5"},{"text":"His personal cough account mentions 2–3 figs and taking them shortly before or after the daytime or evening meal.","subtitle":"","source_ref":"extras.5"},{"text":"These are the author's historical observations.","subtitle":"","source_ref":"extras.5"}],"use":[{"text":"The book records traditional uses for throat irritation and constipation. Examples include eating figs with walnuts, almonds or pistachios, making a decoction with sa'tar, and using figs in gargles, poultices and medicinal pastes. It also records historical uses concerning the spleen, uterus, anus, skin, hemorrhoids and eruptions associated with fever. The closing pages mention dried-fig ash in relation to teeth and fresh fig latex applied to warts. The book also records quantities and the author's experience. This section documents historical practice. The book mentions fig latex in its discussion of blood coagulation. It also records historical attributions concerning obstructions of the liver and spleen, kidney and bladder stones, use with sikanjabin for splenic swelling, ripe-fig poultices, and steam for anal swelling and pain. In discussing the skin it names bars, chanbal and kalaf. A quotation attributed to Hakim Ram mentions figs with sa'tar in connection with phlegm and figs with almonds or pistachios in connection with memory and the brain. Quotations from Ibn al-Qayyim and Galen separately discuss combinations with walnuts and almonds, inflammation of the chest and lungs, urination, and the kidneys and bladder. The discussion of constipation attributed to phlegm mentions water-soaked figs and also connects this with gout. Ripe-fruit poultices are mentioned in relation to glands beneath the throat. A quotation from Galen claims protection against certain poisons when figs are combined with walnuts and almonds, and also attributes to figs an absence of increased thirst during fever. A claim concerning sexual vigor with walnuts is recorded. The attributed religious report also mentions benefits for hemorrhoids and gout as part of the book's account. The author further discusses figs in connection with weakness of the brain and fever. The leaves are also mentioned in connection with ripening boils.","subtitle":"","source_ref":"sections.use"}],"notes":[{"text":"The book quotes the first four verses of Surah al-Tin.","subtitle":"","source_ref":"extras.1"},{"text":"They invoke the fig, the olive, Mount Sinai and the secure city, and speak of humanity being created in the best form.","subtitle":"","source_ref":"extras.1"},{"text":"It then recounts a report attributed to Abu al-Darda about a dish of figs, eating the fruit and comparing it to a fruit of Paradise.","subtitle":"","source_ref":"extras.1"},{"text":"As quoted in the book, Ibn al-Qayyim says figs were uncommon in the Hijaz and Medina, dates were common, and white figs were the preferred variety.","subtitle":"","source_ref":"extras.2"},{"text":"The book records his comments and those of Galen as historical medical views.","subtitle":"","source_ref":"extras.2"},{"text":"Uses concerning specific conditions appear in the relevant sections above.","subtitle":"","source_ref":"extras.2"},{"text":"The fruit is left on the tree until ripe and until it falls.","subtitle":"","source_ref":"extras.4"},{"text":"The author says it is then about three-quarters dry.","subtitle":"","source_ref":"extras.4"},{"text":"The book describes baskets, moist sulfur fumes, sun-drying in wooden baskets, turning the fruit, flattening it before it dries completely and dipping it in a salt solution.","subtitle":"","source_ref":"extras.4"},{"text":"According to the author the last step preserves softness and flavor.","subtitle":"","source_ref":"extras.4"},{"text":"The entry ends by giving a period of activity of two years.","subtitle":"","source_ref":"extras.4"},{"text":"The book gives 20–30 minutes for exposure to moist sulfur fumes and 5–7 days for sun-drying.","subtitle":"","source_ref":"extras.4"},{"text":"The fruit is slightly flattened before the salt-solution step.","subtitle":"","source_ref":"extras.4"},{"text":"The author counts 49 mentions in biblical texts.","subtitle":"","source_ref":"extras.1"},{"text":"In the example from Judges the trees ask the fig to rule, and it is unwilling to give up its sweet fruit.","subtitle":"","source_ref":"extras.1"},{"text":"The example from the Song of Songs mentions ripening figs and the fragrance of the vines.","subtitle":"","source_ref":"extras.1"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"ar":{"mhy":[{"text":"يذكر الكتاب أن ارتفاع شجرة التين نحو ست أو عشر أو اثنتي عشرة قدمًا، ويميّز بين البري والمزروع.","subtitle":"","source_ref":"sections.mhy"},{"text":"أوراقها كبيرة خشنة، وتفرز بعض أجزائها عصارة لبنية.","subtitle":"","source_ref":"sections.mhy"},{"text":"ويذكر الكتاب الإثمار مرتين في السنة، ويورد أشهر مارس وأبريل ومايو ويونيو.","subtitle":"","source_ref":"sections.mhy"},{"text":"والثمرة مستديرة ذات لب لين حلو وبذور صغيرة.","subtitle":"","source_ref":"sections.mhy"},{"text":"تكون خضراء صلبة قبل النضج، ثم تلين وقد يصير لونها محمرًا أو بنيًا أو أرجوانيًا.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"ويرى المؤلف أن زراعته في شبه القارة الهندية لا تكفي الطلب المحلي، وينقل رواية مفادها أن أطباء من إيران والبلاد العربية أدخلوه إليها.","subtitle":"","source_ref":"extras.0"},{"text":"ويذكر أخذ العقل بين منتصف فبراير وأوائل مارس وغرسها متباعدة وإثمار الشجر بعد سنتين أو ثلاث.","subtitle":"","source_ref":"extras.0"},{"text":"يذكر الكتاب مسافة ثلاث أقدام بين العقل.","subtitle":"","source_ref":"extras.0"},{"text":"ويطبع موعد الإثمار الأول من منتصف مايو إلى أوائل يونيو، والثاني من منتصف مارس إلى أوائل أبريل.","subtitle":"","source_ref":"extras.0"},{"text":"حُفظ هذا الترتيب من المصدر.","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[],"mzj":[{"text":"ينقل تاج المفردات عن خزائن الأدوية أن التين الطازج والبري معتدل المزاج. ويصف الحكيم كبير الدين في علم الأدوية النفيسي التين الطازج بأنه مائل إلى الحرارة لحلاوته وإلى الرطوبة لكثرة مائه. ويعدّه مخزن الأدوية حارًا في الدرجة الأولى ورطبًا في الثانية. ويصفه دستور الأدوية الطبي بأنه حار رطب دون تحديد درجة. أما التين المجفف فيصفه الكتاب بأنه حار لطيف.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"يصف الكتاب التين بأنه مغذٍّ سهل الهضم، وينسب إليه في اصطلاح الطب اليوناني الجلاء وإخراج البلغم وإدرار البول والتليين والتعريق والتقوية وتحليل الورم.","subtitle":"","source_ref":"sections.khs"},{"text":"ويميّز بين الآثار المنسوبة إلى التين المجفف وحلاوة الثمرة والعصارة اللبنية.","subtitle":"","source_ref":"sections.khs"},{"text":"ويفرّق بين عطش أصحاب المزاج الحار والعطش المنسوب إلى البلغم.","subtitle":"","source_ref":"sections.khs"},{"text":"ويورد آراء تقليدية عن السعال البلغمي المزمن وسدد الكبد والطحال والكليتين والمثانة.","subtitle":"","source_ref":"sections.khs"},{"text":"ويذكر ضمن المنافع الخاصة الإمساك والسعال وضيق النفس والبواسير والنقرس وتصلّب الطحال وتورّمه ولون البشرة.","subtitle":"","source_ref":"sections.khs"},{"text":"وهذه أوصاف تاريخية من الكتاب.","subtitle":"","source_ref":"sections.khs"},{"text":"في اصطلاح الكتاب تُعدّ حلاوة التين منضجة، والتين المجفف حارًا لطيفًا.","subtitle":"","source_ref":"sections.khs"},{"text":"ويذكر المؤلف كثرة الغذاء وسرعة الشبع، وادعاء توليد دم جيد، وعطش أصحاب المزاج الحار وترقيق البلغم في العطش المنسوب إليه.","subtitle":"","source_ref":"sections.khs"},{"text":"وينسب تاريخيًا إلى العصارة اللبنية إذابة الدم المتخثر واللبن المتجبن.","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"تذكر النقول المنسوبة إلى دستور الأدوية الطبي والحكيم كبير الدين ضررًا محتملاً للكبد والمعدة والأمعاء، وتشير إلى السدد.","subtitle":"","source_ref":"sections.mzr"},{"text":"ويخالف المؤلف هذا الرأي في الصفحة الخامسة مستندًا إلى تجربته وبحثه.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"يذكر الكتاب السكنجبين وشراب الأترج والأنيسون والصعتر الفارسي واللوز الحلو بوصفها مصلحات.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"يذكر الكتاب الزبيب المنقّى ولب حب الصنوبر الجلغوزي بوصفهما بديلين.","subtitle":"","source_ref":"sections.bdl"}],"dose":[],"chem":[{"text":"يذكر الجدول لكل مئة غرام البروتين والنشا والطاقة والصوديوم والبوتاسيوم والكالسيوم والمغنيسيوم والحديد والنحاس والفوسفور والكبريت والكلور، وكذلك فيتاميني أ وج.","subtitle":"","source_ref":"extras.3"},{"text":"ويذكر المؤلف في المناقشة التالية السكر وفيتاميني ب ود، ويستند إلى هذا التركيب في وصف التين بأنه مغذٍّ.","subtitle":"","source_ref":"extras.3"},{"text":"وتندرج ملاحظاته الطبية في مباحث الاستعمال.","subtitle":"","source_ref":"extras.3"}],"compounds":[],"experience":[{"text":"يذكر المؤلف في بحث الإمساك مقدار ٢–٣ ثمرات منقولاً عن دستور الأدوية، ثم تجربته مع ٤–٥ ثمرات مجففة.","subtitle":"","source_ref":"extras.5"},{"text":"وفي روايته الشخصية عن البواسير يذكر ٣ أو ٥ أو ٧ ثمرات على مدى عدة أشهر.","subtitle":"","source_ref":"extras.5"},{"text":"وهذه مقادير تاريخية واردة في الكتاب.","subtitle":"","source_ref":"extras.5"},{"text":"ويذكر تكتّل اللبن عند غليه مع التين وينسب إليه انتفاخ المعدة وانسداد الأمعاء.","subtitle":"","source_ref":"extras.5"},{"text":"يذكر المؤلف في رواية البواسير مدة ٤–٦ أشهر وكمية من اللبن تعادل ضعف كمية التين بعده.","subtitle":"","source_ref":"extras.5"},{"text":"وفي روايته الشخصية عن السعال يذكر ٢–٣ ثمرات وتناولها قبيل وجبة النهار أو الليل أو بعدها بقليل.","subtitle":"","source_ref":"extras.5"},{"text":"وهذه روايات المؤلف التاريخية.","subtitle":"","source_ref":"extras.5"}],"use":[{"text":"يورد الكتاب استعمالات تقليدية لخشونة الحلق والإمساك، منها تناول التين مع الجوز أو اللوز أو الفستق، وذكر مغليه مع الصعتر، والغرغرة والضماد وإدخاله في المعاجين. ويسجل أيضًا استعمالات قديمة تتعلق بالطحال والرحم والشرج والجلد والبواسير والبثور المصاحبة للحمّى. ويذكر في آخر المدخل رماد التين المجفف للأسنان والعصارة اللبنية للثمرة الطازجة للثآليل. ويتناول الكتاب المقادير وتجارب المؤلف كذلك. وترد هذه المواد في سياق توثيق الممارسة التاريخية. يذكر الكتاب عصارة التين اللبنية في مناقشة تخثّر الدم، ويسجل نسبًا تاريخية عن سدد الكبد والطحال وحصى الكلى والمثانة، واستعماله مع السكنجبين لورم الطحال، وضماد الثمر الناضج والبخار لورم الشرج وألمه. ويسمّي في مباحث الجلد البرص والچنبل والكلف. وفي نقل عن الحكيم رام يذكر التين مع الصعتر في سياق البلغم ومع اللوز أو الفستق في سياق الذاكرة والدماغ. وتتناول نقول ابن القيم وجالينوس التين مع الجوز واللوز، والتهاب الصدر والرئتين، والبول والكلى والمثانة. يذكر بحث الإمساك المنسوب إلى البلغم التين المنقوع في الماء ويربط ذلك بالنقرس أيضًا. ويذكر ضماد الثمر الناضج للغدد تحت الحلق. وفي نقل عن جالينوس دعوى الوقاية من بعض السموم عند الجمع مع الجوز واللوز، وعدم زيادة العطش أثناء الحمى. وترد مع الجوز دعوى تقوية الباه. كما يرد ذكر البواسير والنقرس في الرواية الدينية المنسوبة ضمن نقل الكتاب. ويناقش المؤلف التين أيضًا في سياق ضعف الدماغ والحمى. وترد الأوراق أيضًا في بحث إنضاج الدمامل.","subtitle":"","source_ref":"sections.use"}],"notes":[{"text":"يذكر الكتاب سميرنا في آسيا الصغرى موطنًا محتملاً للتين، ويشير إلى انتشاره في أفغانستان وإيران وبلوشستان وأفريقيا وتركيا وإسبانيا والبرتغال، وإلى زراعته تجاريًا في البلاد العربية وإيران والصين واليابان.","subtitle":"","source_ref":"extras.0"},{"text":"يورد الكتاب الآيات الأربع الأولى من سورة التين بما فيها القسم بالتين والزيتون وطور سيناء والبلد الأمين وذكر خلق الإنسان في أحسن تقويم.","subtitle":"","source_ref":"extras.1"},{"text":"ثم ينقل رواية منسوبة إلى أبي الدرداء عن طبق من التين وأكل الثمرة وتشبيهها بثمر الجنة.","subtitle":"","source_ref":"extras.1"},{"text":"ويحصي المؤلف ٤٩ إشارة إلى التين في النصوص الكتابية.","subtitle":"","source_ref":"extras.1"},{"text":"وفي المثال من سفر القضاة تطلب الأشجار من التين أن يحكمها فلا يرغب في ترك ثمره الحلو.","subtitle":"","source_ref":"extras.1"},{"text":"وفي المثال من نشيد الأنشاد يرد نضج التين وطيب رائحة الكروم.","subtitle":"","source_ref":"extras.1"},{"text":"ينقل الكتاب عن ابن القيم أن التين لم يكن شائعًا في الحجاز والمدينة، وأن التمر كان الفاكهة الشائعة، وأنه فضّل التين الأبيض.","subtitle":"","source_ref":"extras.2"},{"text":"وينقل أقواله وأقوال جالينوس ضمن الآراء الطبية التاريخية.","subtitle":"","source_ref":"extras.2"},{"text":"وترد المسائل الخاصة بالأمراض والاستعمال في مواضعها أعلاه.","subtitle":"","source_ref":"extras.2"},{"text":"تُترك الثمرة على الشجرة حتى تنضج وتسقط.","subtitle":"","source_ref":"extras.4"},{"text":"ويقول المؤلف إنها تكون حينها قد جفّت نحو ثلاثة أرباعها.","subtitle":"","source_ref":"extras.4"},{"text":"ويذكر السلال وأبخرة الكبريت الرطبة والتجفيف في الشمس في سلال خشبية وتقليب الثمار وتفليطحها قبل تمام جفافها وغمرها في محلول ملحي.","subtitle":"","source_ref":"extras.4"},{"text":"ويعزو المؤلف إلى الخطوة الأخيرة حفظ الليونة والطعم.","subtitle":"","source_ref":"extras.4"},{"text":"ويختتم المدخل بذكر مدة أثر قدرها سنتان.","subtitle":"","source_ref":"extras.4"},{"text":"يذكر الكتاب ٢٠–٣٠ دقيقة لأبخرة الكبريت الرطبة و٥–٧ أيام للتجفيف الشمسي، وتُفلطح الثمرة قليلاً قبل مرحلة المحلول الملحي.","subtitle":"","source_ref":"extras.4"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]}},"identity_note":{},"name_notes":{},"tables":{"ps":{"title":"د کتاب غذایي شمېرې · مخ ۴","note":"کتاب دا شمېرې د ۱۰۰ ګرامو تر سرلیک لاندې راوړي. د هر جز واحد نه دی لیکل سوی. اعشاري نښې د چاپ په بڼه ساتل سوي. د ویټامین اې او سي نومونه بې له شمېرې راغلي.","rows":[["پروټین","1ء5"],["نشایسته","15ء0"],["حرارې","66"],["سوډیم","24ء6"],["پوتاشیم","28ء8"],["کلسیم","8ء5"],["مګنیزیم","26ء2"],["اوسپنه","1ء18"],["مس","0ء07"],["فاسفورس","2ء6"],["سلفر","22ء9"],["کلورین","7ء1"]]},"fa":{"title":"عددهای غذایی چاپ‌شده · صفحۀ ۴","note":"کتاب این اعداد را زیر عنوان هر ۱۰۰ گرام می‌آورد، ولی واحد هر جزء را مشخص نمی‌کند. نشانۀ اعشاری به صورت چاپ حفظ شده است. ویتامین‌های A و C بدون مقدار ذکر شده‌اند.","rows":[["پروتین","1ء5"],["نشایسته","15ء0"],["انرژی","66"],["سودیم","24ء6"],["پوتاشیم","28ء8"],["کلسیم","8ء5"],["مگنیزیم","26ء2"],["آهن","1ء18"],["مس","0ء07"],["فاسفورس","2ء6"],["گوگرد","22ء9"],["کلورین","7ء1"]]},"ur":{"title":"مطبوعہ غذائی اعداد · صفحہ ۴","note":"یہ اعداد کتاب میں فی ۱۰۰ گرام کے عنوان سے ہیں۔ ہر جز کی اکائی درج نہیں۔ اعشاری نشان طباعت کے مطابق محفوظ ہے۔ وٹامن اے اور سی کے نام بغیر مقدار کے آئے ہیں۔","rows":[["لحمیات","1ء5"],["نشاستہ","15ء0"],["حرارے","66"],["سوڈیم","24ء6"],["پوٹاشیم","28ء8"],["کیلشیم","8ء5"],["میگنیشیم","26ء2"],["فولاد","1ء18"],["تانبا","0ء07"],["فاسفورس","2ء6"],["گندھک","22ء9"],["کلورین","7ء1"]]},"en":{"title":"Printed nutritional figures · p. 4","note":"The book heads these figures per 100 grams but does not specify a unit for each nutrient. Decimal marks are retained as printed. Vitamins A and C are named without amounts.","rows":[["Protein","1ء5"],["Starch","15ء0"],["Energy","66"],["Sodium","24ء6"],["Potassium","28ء8"],["Calcium","8ء5"],["Magnesium","26ء2"],["Iron","1ء18"],["Copper","0ء07"],["Phosphorus","2ء6"],["Sulfur","22ء9"],["Chlorine","7ء1"]]},"ar":{"title":"الأرقام الغذائية المطبوعة · ص ٤","note":"يورد الكتاب هذه الأرقام تحت عنوان لكل ١٠٠ غرام، لكنه لا يحدد وحدة كل عنصر. حُفظت العلامات العشرية كما طبعت. ويذكر فيتاميني أ وج دون مقادير.","rows":[["البروتين","1ء5"],["النشا","15ء0"],["الطاقة","66"],["الصوديوم","24ء6"],["البوتاسيوم","28ء8"],["الكالسيوم","8ء5"],["المغنيسيوم","26ء2"],["الحديد","1ء18"],["النحاس","0ء07"],["الفوسفور","2ء6"],["الكبريت","22ء9"],["الكلور","7ء1"]]}},"pages":"1–5","content_source":{"title":"تاج المفردات","language":"ur","printed_pages":"1–5","translation_basis":"original PDF scans and source-checked Urdu reading","pashto_docx_used":false},"review_policy":"PDF controls traditional content; botanical identity and current chemistry corrections retain their separate citations.","source_editorial_notes":{"en":[{"text":"The app's scientific field uses Ficus carica L.","subtitle":"","source_ref":"extras.6","previous_field":"notes"},{"text":"The headi ا ریز، هموار، براق و بیضوی اند و یک سر اندکی نوک‌تیز دارند.","subtitle":"","source_ref":"sections.mhy"},{"text":"روغنی که بدون حرارت گرفته شود شفاف است، و روغن بازار می‌تواند قهوه‌ای زردفام باشد.","subtitle":"","source_ref":"sections.mhy"},{"text":"کتاب یکی از علت‌های اهمیت گیاه را الیاف آن می‌داند که از آن پارچۀ باارزش و بادوام ساخته می‌شود.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"پاکستان، هند، مصر، روسیه، هالند و انگلستان در شمار مناطق کشت آمده‌اند.","subtitle":"","source_ref":"extras.0"},{"text":"کتاب تخم را از اقلام مهم صادراتی می‌داند.","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[{"text":"رنگ آن‌ها از قهوه‌ای سرخ‌فام تا قهوه‌ای تیره است و مزۀ ملایم دارند.","subtitle":"","source_ref":"sections.mhy"}],"mzj":[{"text":"مزاج تخم در درجۀ اول گرم و خشک دانسته شده است. خزائن‌الادویه نیز همین مزاج را ذکر می‌کند. روغن کتان در درجۀ اول گرم و تر دانسته شده است.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"کتاب تخم را تحلیل‌برندۀ ورم، نرم‌کننده، پاک‌کننده، آرام‌کنندۀ درد، خلط‌آور، قی‌آور، اندکی ادرارآور و ملین می‌داند.","subtitle":"","source_ref":"sections.khs"},{"text":"برای روغن نیز اثر تحلیل ورم، آرام‌کردن درد و خاصیت پاک‌کنندگی ذکر می‌کند و دعواهای سنتی مربوط به زخم‌ها را می‌آورد.","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"کتاب تخم را دیرهضم و برای معده و هاضمه زیان‌بار می‌داند.","subtitle":"","source_ref":"sections.mzr"},{"text":"در بخش روغن، دربارۀ معده، بینایی و قوۀ باه احتیاط ذکر شده است.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"برای تخم، عسل، گشنیز و سکنجبین ذکر شده است. برای روغن، گشنیز و سکنجبین آمده است.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"تخم شنبلیله (حلبه) بدل تخم کتان ذکر شده است. برای روغن در این مدخل بدل جداگانه‌ای نیامده است.","subtitle":"","source_ref":"sections.bdl"}],"dose":[{"text":"عبارت چاپی «5 سے 10 گرام (5 ماشے تا ایک درہم)» است.","subtitle":"","source_ref":"extras.3"},{"text":"گرام و واحدهای قدیمی به همان صورت حفظ شده‌اند و به یکدیگر تبدیل نشده‌اند.","subtitle":"","source_ref":"extras.3"},{"text":"مقدار روغن در کتاب وابسته به نیاز و سن دانسته شده است.","subtitle":"","source_ref":"extras.3"}],"chem":[{"text":"در ترکیب تخم از لینامارین، روغن، مواد لعابی، موم، صمغ رزینی، قند، فاسفیت و پروتین یاد شده است.","subtitle":"","source_ref":"extras.1"},{"text":"کتاب روغن کتان را روغن ثابت می‌داند و گلیسرول و اسید لینولئیک را ذکر می‌کند.","subtitle":"","source_ref":"extras.1"},{"text":"در صفحۀ چاپی ۸، در بیان ترکیب روغن، گلیسرول و اسید لینولئیک همراه با ۲۵–۳۰ درصد ذکر شده‌اند.","subtitle":"","source_ref":"extras.1"},{"text":"عبارت سهم جداگانۀ هر کدام را روشن نمی‌کند.","subtitle":"","source_ref":"extras.1"},{"text":"در بخش روغن، قیروطی بزرالکتان نام برده شده که ترکیبی از موم و روغن است.","subtitle":"","source_ref":"extras.2"}],"compounds":[{"text":"در بخش تخم، لعوق کتان، حب سعال، لعوق معتدل، لعوق ربو و شربت صدر آمده‌اند.","subtitle":"","source_ref":"extras.2"},{"text":"کتاب روغن کتان را جزء مهم مرهم‌ها می‌داند.","subtitle":"","source_ref":"extras.4"},{"text":"مرهمی با سفیدی تخم مرغ و ترکیب جداگانه‌ای با آب آهک در بحث سوختگی ذکر می‌کند.","subtitle":"","source_ref":"extras.4"},{"text":"استعمال‌های مربوط به التهاب سینه و شش‌ها، زخم روده، قولنج و روغن نیم‌گرم برای گوش‌درد هم در منبع ثبت شده‌اند.","subtitle":"","source_ref":"extras.4"},{"text":"در همان بحث تاریخی نام کاربولیک اسید نیز آمده است.","subtitle":"","source_ref":"extras.4"}],"experience":[],"use":[{"text":"در گزارش‌های تاریخی کتاب، ضماد تخم برای ورم، دانه‌های پوستی و درد بندها ذکر شده است. تخم با سرکه برای بعضی لکه‌های پوست، لعاب تخم در بحث سرخی چشم و تخم بریان و کوبیده در بحث زخم‌ها آمده است. تخم کوبیده با عسل، جوشانده و شربت در پیوند با سرفۀ بلغمی، خشونت گلو و نفس‌تنگی یاد شده‌اند. از ادرار، گرده‌ها و مثانه و نیز رحم و روده‌ها جداگانه یاد می‌شود. روغن در مالش برای درد، مالیدن بر لکه‌های پوست و ساخت مرهم‌ها ذکر شده است. دربارۀ سوختگی، اشتها، بلغم، ادرار، قولنج، خشکی اندام و گوش‌درد نیز یادداشت‌های سنتی مربوط به روغن آمده‌اند. کتاب در بخش ترکیب خاص، مالش با تخم کوبیدۀ نیم‌گرم و روغن کنجد، تخم کوبیده با عسل و بریان‌کردن تخم پیش از کوبیدن و آمیختن با عسل را ذکر می‌کند. در همان‌جا مؤلف به تجربۀ شخصی خود اشاره دارد. برای داغ‌های پوستی منسوب به گرمی، دانه‌ها و زخم‌ها نیز یادداشت جداگانه آمده است. در بحث ضماد، افزودن اندکی خردل میده برای افزایش اثر به‌عنوان نظر قدیمی ثبت شده است. در بحث ضماد تخم، کتاب ذات‌الجنب، ذات‌الریه، ورم پردۀ شکم و ورم بندها را نام می‌برد. دربارۀ غده‌های سفت ادعا می‌کند که ورم را می‌پزاند و مواد گردآمده را بیرون می‌کند. با سرکه از لکه‌های ریزش مو و کلف یاد می‌کند. از گرفتن لعاب تخم در آب و استعمال موضعی آن در بحث سرخی چشم سخن می‌گوید. برای تخم بریان و میده، ادعای تاریخی کاهش نفخ و درد را می‌آورد. جوشانده با زوفا در بحث ورم و زخم رحم و روده آمده است. فواید خاص تخم را خروج بلغم، بندکردن اسهال بلغمی و افزایش ادرار می‌داند. در بحث روغن از یرقان سیاه نیز نام می‌برد. ادعای آرام‌شدن فوری درد سوختگی و خشک‌شدن زخم با ترکیب تاریخی روغن و آب آهک، بخشی از نقل مؤلف است.","subtitle":"","source_ref":"sections.use"}],"notes":[],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"ur":{"mhy":[{"text":"السی برصغیر میں بکثرت کاشت ہوتی ہے۔","subtitle":"","source_ref":"sections.mhy"},{"text":"پودا دو سے چار فٹ بلند ہوتا ہے، پھول نیلے ہوتے ہیں اور چنے کے برابر غلاف میں تخم بھرے ہوتے ہیں۔","subtitle":"","source_ref":"sections.mhy"},{"text":"تخم چھوٹے، چپٹے، چمک دار، بیضوی اور قدرے نوک دار ہوتے ہیں۔","subtitle":"","source_ref":"sections.mhy"},{"text":"بغیر حرارت نکالا ہوا روغن شفاف ہے، جبکہ بازار کا روغن زردی مائل بھورا ہو سکتا ہے۔","subtitle":"","source_ref":"sections.mhy"},{"text":"کتاب پودے کی اہمیت کی ایک وجہ اس سے حاصل ہونے والا ریشہ بتاتی ہے جس سے قیمتی اور پائیدار کپڑا تیار ہوتا ہے۔","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"پاکستان، ہندوستان، مصر، روس، ہالینڈ اور انگلستان کا ذکر ہے۔","subtitle":"","source_ref":"extras.0"},{"text":"کتاب تخم کو برآمدات کی اہم شے کہتی ہے۔","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[{"text":"رنگ سرخی مائل بھورا یا گہرا بھورا اور ذائقہ پھیکا ہے۔","subtitle":"","source_ref":"sections.mhy"}],"mzj":[{"text":"تخم کتان پہلے درجے میں گرم و خشک ہے۔ خزائن الادویہ میں بھی یہی مزاج درج ہے۔ روغن کتان پہلے درجے میں گرم و تر ہے۔","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"کتاب تخم کو محلل ورم، منضج، جالی، مسکن درد، منفث بلغم، مقی، مدر خفیف اور ملین بیان کرتی ہے۔","subtitle":"","source_ref":"sections.khs"},{"text":"روغن کے خاص افعال میں محلل ورم، مسکن اوجاع، جالی اور نافع قروح درج ہیں۔","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"کتاب تخم کو دیر ہضم اور معدے و ہاضمے کے لیے مضر بیان کرتی ہے۔","subtitle":"","source_ref":"sections.mzr"},{"text":"روغن کے حصے میں بینائی، قوت باہ اور معدے کے بارے میں احتیاط درج ہے۔","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"تخم کے لیے شہد، کشنیز اور سکنجبین۔ روغن کے لیے کشنیز اور سکنجبین۔","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"تخم میتھی یا تخم حلبہ، تخم کتان کا بدل درج ہے۔ اس مدخل میں روغن کے لیے الگ بدل درج نہیں۔","subtitle":"","source_ref":"sections.bdl"}],"dose":[{"text":"طباعت میں «5 سے 10 گرام (5 ماشے تا ایک درہم)» درج ہے۔","subtitle":"","source_ref":"extras.3"},{"text":"گرام اور قدیم اکائیاں اسی صورت میں محفوظ ہیں، ان کی باہمی تبدیلی نہیں کی گئی۔","subtitle":"","source_ref":"extras.3"},{"text":"روغن کی مقدار حسب ضرورت و عمر لکھی ہے۔","subtitle":"","source_ref":"extras.3"}],"chem":[{"text":"تخم میں لینامارین، روغن، لعاب دار اجزا، موم، رال، شکر، فاسفیٹس اور اجزائے لحمیہ درج ہیں۔","subtitle":"","source_ref":"extras.1"},{"text":"روغن کو غیر فرّار تیل کہا گیا ہے اور گلیسرول اور لینولیک ایسڈ کا ذکر ہے۔","subtitle":"","source_ref":"extras.1"},{"text":"مطبوعہ صفحہ ۸ پر روغن کی ترکیب میں گلیسرول اور لینولک ایسڈ کے ساتھ ۲۵–۳۰ فیصد کا ذکر ہے۔","subtitle":"","source_ref":"extras.1"},{"text":"عبارت ہر ایک کا الگ تناسب واضح نہیں کرتی۔","subtitle":"","source_ref":"extras.1"}],"compounds":[{"text":"تخم کے مرکبات میں لعوق کتان، حب سعال، لعوق معتدل، لعوق ربو اور شربت صدر درج ہیں۔","subtitle":"","source_ref":"extras.2"},{"text":"روغن کے مرکبات میں قیروطی بزرالکتان ہے۔","subtitle":"","source_ref":"extras.2"},{"text":"قیروطی موم اور تیل سے تیار ہونے والا مرکب ہے۔","subtitle":"","source_ref":"extras.2"},{"text":"کتاب روغن کتان کو مرہموں کا اہم جز کہتی ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"مرغی کے انڈے کی سفیدی کے ساتھ مرہم اور سوختگی کے لیے چونے کے پانی کے ساتھ ایک الگ مرکب مذکور ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"اسی تاریخی بحث میں کاربالک ایسڈ کا نام بھی ہے۔","subtitle":"","source_ref":"extras.4"},{"text":"سینے اور پھیپھڑوں کی التہابی بیماریوں، آنتوں کے قروح، قولنج اور نیم گرم صورت میں کان کے درد سے متعلق استعمالات بھی کتاب میں درج ہیں۔","subtitle":"","source_ref":"extras.4"}],"experience":[],"use":[{"text":"کتاب سوجن، پھوڑے پھنسیوں اور جوڑوں کے درد کے لیے تخم کے ضماد کا تاریخی ذکر کرتی ہے۔ سرکے کے ساتھ جلد کے بعض داغ، لعاب کے ساتھ آنکھ کی سرخی، اور بھنے ہوئے باریک تخم کے ساتھ زخموں کا ذکر ہے۔ بلغمی کھانسی، خراش حلق اور ضیق النفس میں شہد کے ساتھ پسا ہوا تخم، جوشاندہ اور شربت درج ہیں۔ ادرار، گردوں، مثانے، رحم اور آنتوں سے متعلق استعمالات الگ بیان کیے گئے ہیں۔ روغن کے لیے درد میں مالش، جلد پر لگانے اور مرہم میں شامل کرنے کا ذکر ہے۔ سوختگی، اشتہا، بلغم، ادرار، قولنج، خشکی اور کان کے درد سے متعلق روایتی نوٹ بھی درج ہیں۔ خاص ترکیب استعمال میں کتاب نیم گرم پسی السی کے تل کے تیل کے ساتھ مالش، شہد کے ساتھ پسی السی، اور پہلے بھون کر پھر پیس کر شہد میں ملانے کا ذکر کرتی ہے۔ اسی مقام پر مصنف اپنے ذاتی تجربے کی نسبت بھی بیان کرتا ہے۔ گرمی کے باعث جلد کے داغ، دانوں اور قروح کے لیے الگ ذکر ہے۔ ضماد کی بحث میں اثر بڑھانے کے لیے کچھ باریک پسی رائی ملانے کا پرانا طریقہ بھی درج ہے۔ ضماد کے ضمن میں کتاب ذات الجنب، ذات الریہ، ورم صفاق اور ورم مفاصل کو نام سے بیان کرتی ہے۔ سخت گانٹھوں کے بارے میں ورم پکانے اور جمع شدہ مادے خارج کرنے کا دعویٰ کرتی ہے۔ سرکے کے ساتھ جھائیں، داد اور بال جھڑنے کے دھبوں کا ذکر ہے۔ تخم کا لعاب پانی میں نکال کر آنکھ کی سرخی کے ضمن میں طلاء بیان ہوا ہے۔ بھنی اور باریک پسی السی کے لیے نفخ اور درد میں تسکین کی تاریخی نسبت ہے۔ زوفا کے ساتھ جوشاندہ رحم اور آنتوں کے ورم و قروح کے ذکر میں آیا ہے۔ نفع خاص میں مخرج بلغم، اسہال بلغمی میں نفع اور ادرار درج ہے۔ روغن کی بحث میں یرقان اسود کا ذکر بھی ہے۔ چونے کے پانی کے ساتھ تاریخی مرکب سے سوختگی کے درد میں فوری تسکین اور زخم خشک ہونے کی نسبت مصنف کے بیان کا حصہ ہے۔","subtitle":"","source_ref":"sections.use"}],"notes":[],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"en":{"mhy":[{"text":"Flax is widely cultivated in the Indian subcontinent.","subtitle":"","source_ref":"sections.mhy"},{"text":"The plant grows two to four feet tall, has blue flowers, and bears its seeds in a pea-sized capsule.","subtitle":"","source_ref":"sections.mhy"},{"text":"The seeds are small, flat, glossy, oval and slightly pointed at one end.","subtitle":"","source_ref":"sections.mhy"},{"text":"They are reddish brown to dark brown and bland in taste.","subtitle":"","source_ref":"sections.mhy"},{"text":"Oil extracted without heat is clear, while commercial oil may be yellowish brown.","subtitle":"","source_ref":"sections.mhy"},{"text":"The book also attributes the plant's importance to its fiber, from which it says valuable, durable cloth is made.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"Pakistan, India, Egypt, Russia, the Netherlands and England are listed as growing regions.","subtitle":"","source_ref":"extras.0"},{"text":"The book calls the seed an important export.","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[],"mzj":[{"text":"The seed is described as warm and dry in the first degree, in agreement with Khazain al-Adwiya. Linseed oil is described as warm and moist in the first degree.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"The book describes the seed as dispersing swellings, softening, cleansing, relieving pain, promoting expectoration, inducing vomiting, acting as a mild diuretic and loosening the bowels.","subtitle":"","source_ref":"sections.khs"},{"text":"It attributes dispersing, soothing and cleansing properties to the oil and records traditional claims concerning wounds.","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"The book describes the seed as slow to digest and harmful to the stomach and digestion.","subtitle":"","source_ref":"sections.mzr"},{"text":"The oil section records cautions concerning the stomach, eyesight and sexual vigor.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"For the seed, honey, coriander and sikanjabin. For the oil, coriander and sikanjabin.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"Fenugreek seed is listed as a substitute for the seed. The oil entry names no separate substitute.","subtitle":"","source_ref":"sections.bdl"}],"dose":[{"text":"The printed wording is “5 سے 10 گرام (5 ماشے تا ایک درہم)”.","subtitle":"","source_ref":"extras.3"},{"text":"Grams and historical units are retained as printed without converting between them.","subtitle":"","source_ref":"extras.3"},{"text":"For the oil, the book states that the quantity depends on need and age.","subtitle":"","source_ref":"extras.3"}],"chem":[{"text":"The book lists linamarin, oil, mucilage, wax, resin, sugar, phosphates and protein in the seed.","subtitle":"","source_ref":"extras.1"},{"text":"It describes linseed oil as a fixed oil and mentions glycerol and linoleic acid.","subtitle":"","source_ref":"extras.1"},{"text":"On printed page 8 the oil-composition statement names glycerol and linoleic acid together with 25–30 percent.","subtitle":"","source_ref":"extras.1"},{"text":"The wording does not clearly allocate a separate proportion to each.","subtitle":"","source_ref":"extras.1"}],"compounds":[{"text":"The seed section lists Lauq-e-Katan, Habb-e-Sual, Lauq-e-Motadil, Lauq-e-Rabw and Sharbat-e-Sadr.","subtitle":"","source_ref":"extras.2"},{"text":"The oil section names Qairooti-e-Bazr-ul-Katan, a preparation of wax and oil.","subtitle":"","source_ref":"extras.2"},{"text":"The book calls linseed oil an important ingredient of ointments.","subtitle":"","source_ref":"extras.4"},{"text":"It mentions an ointment with hen's egg white and a separate preparation with limewater in connection with burns.","subtitle":"","source_ref":"extras.4"},{"text":"The same historical discussion also names carbolic acid.","subtitle":"","source_ref":"extras.4"},{"text":"Uses concerning inflammation of the chest and lungs, intestinal ulcers, colic and lukewarm oil for earache also occur in the source.","subtitle":"","source_ref":"extras.4"}],"experience":[],"use":[{"text":"The book describes seed poultices in historical accounts of swellings, eruptions and joint pain. It mentions the seed with vinegar for some skin marks, the mucilage for redness of the eyes, and roasted ground seed in connection with wounds. Ground seed with honey, decoctions and syrups are mentioned in connection with productive cough, throat irritation and breathlessness. The text separately discusses urination, the kidneys and bladder, and the uterus and intestines. The oil is mentioned in massage for pain, applications to skin marks, and ointments. The oil section also records traditional references to burns, appetite, phlegm, urination, colic, stiffness and earache. In its special-preparation section the book mentions massage using lukewarm ground linseed with sesame oil, ground seed with honey, and seed roasted before grinding and mixing with honey. The author attributes a personal observation to this passage. It separately mentions skin marks attributed to heat, eruptions and ulcers. The poultice discussion also records an old proposal to add a little finely ground mustard to increase the effect. The seed-poultice discussion specifically names pleurisy, pneumonia, inflammation of the abdominal membrane and joint swelling. For hard swellings the book claims maturation and discharge of accumulated material. With vinegar it mentions marks associated with hair loss and facial discoloration. It describes extracting seed mucilage in water and a topical application in the discussion of eye redness. Roasted finely ground seed is historically credited with relieving wind and pain. A decoction with hyssop occurs in the discussion of inflammation and ulcers of the uterus and intestines. The stated particular benefits include expectoration, benefit in diarrhea attributed to phlegm, and urination. The oil discussion also names black jaundice. Immediate relief of burn pain and drying of wounds with the historical oil-and-limewater mixture are claims attributed to the author.","subtitle":"","source_ref":"sections.use"}],"notes":[],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]},"ar":{"mhy":[{"text":"يكثر زرع الكتان في شبه القارة الهندية.","subtitle":"","source_ref":"sections.mhy"},{"text":"ويبلغ ارتفاع النبات قدمين إلى أربع أقدام، وله أزهار زرقاء وعلبة بحجم حبة الحمص تحمل البذور.","subtitle":"","source_ref":"sections.mhy"},{"text":"والبذور صغيرة مفلطحة لامعة بيضوية ولأحد طرفيها شيء من الحدّة، ولونها بني محمر أو بني داكن وطعمها خفيف.","subtitle":"","source_ref":"sections.mhy"},{"text":"ويكون الزيت المستخرج دون حرارة صافيًا، بينما قد يكون زيت السوق بنيًا مصفرًا.","subtitle":"","source_ref":"sections.mhy"},{"text":"ويعزو الكتاب أهمية النبات أيضًا إلى أليافه التي يُصنع منها قماش ثمين متين بحسب النص.","subtitle":"","source_ref":"sections.mhy"}],"origin":[{"text":"يذكر الكتاب باكستان والهند ومصر وروسيا وهولندا وإنجلترا ضمن مناطق الزراعة، ويعدّ البذور من الصادرات المهمة.","subtitle":"","source_ref":"extras.0"}],"source_note":[],"color":[],"mzj":[{"text":"يصف الكتاب البذور بأنها حارة يابسة في الدرجة الأولى، وهو ما يذكره خزائن الأدوية أيضًا. ويصف زيت الكتان بأنه حار رطب في الدرجة الأولى.","subtitle":"","source_ref":"sections.mzj"}],"khs":[{"text":"يصف الكتاب البذور بأنها محللة للورم ومنضجة وجالية ومسكنة للألم ومخرجة للبلغم ومقيئة ومدرّة للبول برفق ومليّنة.","subtitle":"","source_ref":"sections.khs"},{"text":"وينسب إلى الزيت تحليل الورم وتسكين الوجع والجلاء، ويورد أوصافًا تقليدية تتعلق بالقروح.","subtitle":"","source_ref":"sections.khs"}],"benefit":[],"mzr":[{"text":"يصف الكتاب البذور بأنها بطيئة الهضم ومضرّة بالمعدة والهضم.","subtitle":"","source_ref":"sections.mzr"},{"text":"ويورد في مبحث الزيت احتياطات تتعلق بالمعدة والبصر والقوة الجنسية.","subtitle":"","source_ref":"sections.mzr"}],"msl":[{"text":"يذكر للبذور العسل والكزبرة والسكنجبين، وللزيت الكزبرة والسكنجبين.","subtitle":"","source_ref":"sections.msl"}],"bdl":[{"text":"يذكر الكتاب بذور الحلبة بدلاً من بذور الكتان، ولا يسمّي في هذا المدخل بديلاً مستقلاً للزيت.","subtitle":"","source_ref":"sections.bdl"}],"dose":[{"text":"العبارة المطبوعة هي «5 سے 10 گرام (5 ماشے تا ایک درہم)».","subtitle":"","source_ref":"extras.3"},{"text":"حُفظت الغرامات والوحدات التاريخية بصورتها المطبوعة دون تحويل بينها.","subtitle":"","source_ref":"extras.3"},{"text":"ويجعل الكتاب مقدار الزيت تابعًا للحاجة والعمر.","subtitle":"","source_ref":"extras.3"}],"chem":[{"text":"يذكر في البذور اللينامارين والزيت والمواد المخاطية والشمع والراتنج والسكر والفوسفات والبروتين.","subtitle":"","source_ref":"extras.1"},{"text":"ويعدّ زيت الكتان من الزيوت الثابتة ويذكر الغليسرول وحمض اللينوليك.","subtitle":"","source_ref":"extras.1"},{"text":"في الصفحة المطبوعة ٨ تذكر عبارة تركيب الزيت الغليسرول وحمض اللينوليك مع نسبة ٢٥–٣٠ بالمئة، دون بيان واضح لنصيب كل واحد على حدة.","subtitle":"","source_ref":"extras.1"}],"compounds":[{"text":"يذكر في مبحث البذور لعوق الكتان وحب السعال ولعوق المعتدل ولعوق الربو وشراب الصدر.","subtitle":"","source_ref":"extras.2"},{"text":"وفي مبحث الزيت يذكر قيروطي بزر الكتان، والقيروطي مركّب من الشمع والزيت.","subtitle":"","source_ref":"extras.2"}],"experience":[],"use":[{"text":"يورد الكتاب ذكر ضماد البذور في سياق تاريخي عن التورم والبثور وآلام المفاصل. ويذكر البذور مع الخل لبعض آثار الجلد، ومخاطها في سياق احمرار العين، والبذور المحمصة المطحونة في بحث الجروح. ويورد البذور المطحونة مع العسل والمغلي والشراب في سياق السعال البلغمي وخشونة الحلق وضيق النفس. وترد إشارات منفصلة إلى البول والكلى والمثانة والرحم والأمعاء. ويذكر الزيت في التدليك عند الألم، وفي الاستعمال الموضعي لآثار الجلد وفي المراهم. ويرد كذلك ذكر تقليدي للحروق والشهية والبلغم والبول والمغص والتيبّس وألم الأذن. يذكر الكتاب في قسم التركيب الخاص التدليك بالبذور المطحونة الفاترة مع زيت السمسم، والبذور المطحونة مع العسل، وتحميص البذور قبل طحنها وخلطها بالعسل. ويشير المؤلف في الموضع نفسه إلى تجربته الشخصية. وترد إشارة منفصلة إلى آثار الجلد المنسوبة إلى الحرارة والبثور والقروح. ويسجل بحث الضماد رأيًا قديمًا بإضافة قليل من الخردل المطحون لزيادة الأثر. يسمّي بحث ضماد البذور ذات الجنب وذات الرئة وورم الصفاق وورم المفاصل. ويدّعي في الأورام الصلبة الإنضاج وإخراج المواد المتجمعة. ويذكر مع الخل آثار تساقط الشعر والكلف. ويصف استخراج مخاط البذور في الماء واستعماله الموضعي في بحث احمرار العين. وينسب تاريخيًا إلى البذور المحمصة المطحونة تسكين الانتفاخ والألم. ويرد المغلي مع الزوفا في بحث ورم الرحم والأمعاء وقروحها. ويذكر من المنافع الخاصة إخراج البلغم والنفع في الإسهال المنسوب إلى البلغم وإدرار البول. ويسمّي بحث الزيت اليرقان الأسود أيضًا. أما تسكين ألم الحرق فورًا وتجفيف الجروح بالتركيب التاريخي من الزيت وماء الجير فهما من دعاوى المؤلف المنقولة.","subtitle":"","source_ref":"sections.use"}],"notes":[{"text":"يعدّ الكتاب زيت الكتان مكوّنًا مهمًا للمراهم، ويذكر مرهمًا مع بياض بيض الدجاج وتركيبًا آخر مع ماء الجير في بحث الحروق.","subtitle":"","source_ref":"extras.4"},{"text":"ويسمّي في المناقشة التاريخية نفسها حمض الكربوليك.","subtitle":"","source_ref":"extras.4"},{"text":"وترد أيضًا استعمالات عن التهاب الصدر والرئتين وقروح الأمعاء والمغص واستعمال الزيت الفاتر في سياق ألم الأذن.","subtitle":"","source_ref":"extras.4"}],"poison_signs":[],"poison_treatment":[],"history":[],"excretion":[],"safety":[]}},"identity_note":{},"name_notes":{"ps":"د غوړیو نومونه · عربي، دهن الکتان · فارسي، روغن کتان · بنګالي، تلسی تیل · انګلیسي، Linseed oil","fa":"نام‌های روغن · عربی، دهن الکتان · فارسی، روغن کتان · بنگالی، تلسی تیل · انگلیسی، Linseed oil","ur":"روغن کے نام · عربی، دهن الکتان ·  دوم۔", "mhy": "ماخذ کا بوٹا جھاؤ جیسی ایک تا تین فٹ جھاڑی، جڑ سے کثیر شاخیں اور لمبے باریک نوکیلے پتے رکھتا ہے۔ عنوان پھول کے تحت گول تین خانوں والا پھل و سیاہی مائل بھورے بیج، پھر الگ چھوٹے سفید چنے جیسے پھول لکھے ہیں۔ دھونی کی خاص بو اور نظر/بدروح کا عوامی رواج نقل ہے۔ بو تیز ناگوار، ذائقہ تلخ کسیلا۔", "khs": "قدیم افعال: مقوی باہ، مسمن بدن، منفت بلغم، کاسر ریاح، مسہل اخلاط غلیظ، قاتل کرم شکم، مدر بول و حیض و شیر؛ امراض عصبی غلیظ میں نسبت، نفع خاص امراض باردہ۔", "use": "کتاب تخم کو تقویت باہ، اخراج بلغم، دمہ/کھانسی، عصبی صرع، رعشہ، جنون، نسیان، عرق النساء، استسقاء و ضعف اعضا میں درج کرتی ہے۔ پانی میں پکا کر روغن زیتون کے ساتھ پانی جلنے تک تیل، درد گوش کا قدیم نقل ہے۔ حیض میں سفوف «۴ ماشے» سوئے کے جوشاندے کے ساتھ؛ درد دندان میں دھونی بھی ہے۔ لعاب ثعلب کے ساتھ سخت ورم کا ضماد، کنجدی تیل کی ریاحی مفاصل و دیگر دردوں میں مالش؛ نظر/تعویذ اور نیلے کپڑے میں بیج گلے میں باندھنے کا عوامی رواج، اور تخم السی و شہد کے ساتھ دمہ/کھانسی و رطوبات پھیپھڑا کا تجربہ بھی مصنف کے تاریخی اقوال ہیں۔", "mzr": "ماخذ مصدع و مکرب/متلی پیدا کرنے والا کہتا ہے۔ موجودہ احتیاط: حرمل کھانے سے عصبی، ہضمی، قلبی زہریت اور اموات رپورٹ ہیں؛ حمل میں خصوصاً خطرناک۔ تاریخی مقدار خودعلاج کے لیے نہ اپنائیں۔", "msl": "ترش اشیا اور سکنجبین۔", "bdl": "الگ درج نہیں۔"}, "en": {"mzj": "Warm and dry in the second degree; some authorities assign warmth in the third and dryness in the second.", "mhy": "The source describes a 1–3-foot jhau-like shrub, many branches from the root and long narrow pointed leaves. Under “flowers” it describes small round three-chambered fruits with dark brown seeds, then separately notes small white chickpea-like flowers. Burning seeds have a characteristic smell; customs concerning the evil eye/spirits are reported. Smell is strong and unpleasant, taste bitter/astringent.", "khs": "Traditional actions are sexual strengthening, weight gain, expectoration, dispersing wind, purging thick humours, killing intestinal worms and promoting urine, menstruation and milk. Thick-humour nervous disorders and “cold disorders” are the particular source claims.", "use": "The source records seeds for sexual strengthening, expectoration, asthma/cough, nervous epilepsy, tremor, insanity, forgetfulness, sciatica, ascites and weak limbs. A water/olive-oil preparation after water evaporates is an old ear-pain account. The menstruation passage prints seed powder “۴ ماشے” with a dill decoction; toothache fumigation is also mentioned. A salep-mucilage poultice for hard swellings and sesame-oil massage for wind-related joint/other pain are source accounts. Amulets, evil-eye customs and a blue-cloth seed necklace for epilepsy, plus a seed/linseed/honey experience concerning lung moisture, asthma and cough, are retained as historical attributions.", "mzr": "The source calls it headache-producing and nauseating/distressing. Current safety: ingestion has caused neurological, gastrointestinal and cardiovascular poisoning and deaths. Pregnancy is especially hazardous. Historical quantities are not self-treatment instructions.", "msl": "Sour substances and oxymel (sikanjabin).", "bdl": "Not separately stated."}, "ar": {"mzj": "حار يابس في الثانية، وعند بعضهم حار في الثالثة يابس في الثانية.", "mhy": "يصف المصدر شجيرة كالجهاو بارتفاع ١–٣ أقدام كثيرة الأغصان من الجذر، بأوراق طويلة دقيقة مدببة. وتحت عنوان الزهر يصف ثمرًا صغيرًا كرويًا بثلاث حجرات وبذر بني داكن، ثم يذكر زهرًا أبيض صغيرًا كالحمص. للدخان رائحة خاصة وينقل عرف دفع العين والأرواح؛ والرائحة حادة كريهة والطعم مر قابض.", "khs": "الأفعال القديمة تقوية الباه والتسمين وإخراج البلغم وكسر الرياح وإسهال الأخلاط الغليظة وقتل ديدان البطن وإدرار البول والحيض واللبن؛ وترد الأمراض العصبية الغليظة والنفع الخاص للأمراض الباردة.", "use": "يسجل الكتاب البذر لتقوية الباه والبلغم والربو والسعال والصرع العصبي والرعشة والجنون والنسيان وعرق النسا والاستسقاء وضعف الأعضاء. وطبخه بالماء وزيت الزيتون حتى تبخر الماء لألم الأذن نقل قديم. وفي الحيض يطبع «۴ ماشے» من المسحوق مع مغلي الشبت ويذكر تبخير ألم الأسنان. والضماد بلعاب الثعلب للأورام الصلبة وزيت و لپاره مضر بولي؛ د پوستکي برخه په بد هضمۍ کې د نه استعمال خبره کوي. اوسنی احتیاط: اسپغول کافي مایع غواړي؛ د بندښت یا د تېرولو ستونزه لرونکي کس لپاره طبي ارزونه پکار ده، او د پوډر تنفس حساسیت راوستلای سي.", "msl": "سکنجبین عسلي؛ دا «شات او سکنجبین» دوه بېل توکي نه دي.", "bdl": "بهي‌دانه، د تلیین او تبرید لپاره؛ د بادیانو تخم نه دئ."}, "fa": {"mzj": "سرد و تر در دوم.", "mhy": "بذر گیاه کوچک بی‌ساقه با گل نزدیک زمین و بلندی تا نیم گز توصیف شده. بذر صورتی، لعابدار و خمیده مانند گوش اسب است؛ نام را از اسپ و غول، یعنی اسب و گوش، شرح می‌دهد. پوست سفید بذر «سبوس اسپغول»، «بهوسی» یا «پوست اسپغول» نامیده شده. رنگ بذر صورتی سرخ‌گون و پوست سفید، مزه بی‌مزه، لعابدار و چسبنده است؛ پوست لعاب بیشتر دارد. بذر کامل و پوست جدا در این مدخل تفکیک شده‌اند.", "khs": "افعال منبع: ملین، مغری، مسکن ورم، تسکین تشنگی و شدت تب گرم و مدر بول. کبیرالدین تلیین را نمی‌پذیرد و قابض می‌داند؛ نصیراحمد این نظر را غلط می‌خواند. نفع خاص مسکن حرارت و دافع زحیر است؛ اختلاف اقوال مؤلفان حفظ شده.", "use": "در اسهال/پیچش، لعاب برای خراش روده و اخراج «مردوں» ذکر شده. هم اخراج مادۀ سخت و هم بستن اسهال آبکی نسبت داده شده؛ تجربۀ گشودن حلق/سینه در سرفۀ خشک به نصیراحمد منسوب است. ضماد با مغلی پوست کوکنار برای ورم، لعاب بذر برای تشنگی/تب/سوزش و درد ادرار و ادعای کاهش حرارت جگر و حدت خون آمده‌اند. روایت خیساندن ۱۰ گرام و نوشیدن لعاب صبح با دو ساعت پرهیز غذا برای زخم روده؛ ۱۰ گرام با آب/شیر برای قبض و درد شق هنگام دفع؛ لعاب برای نرم‌کردن مو؛ و بریان در تابه یا روغن گل برای قابض‌شدن اقوال قدیمی‌اند، نه تجویز امروز.", "mzr": "در منبع برای مزاج بلغمی، هضم خراب/ضعیف و ضعف یا سردی عصب مضر است؛ بخش پوست از مصرف در بد هضمی منع می‌کند. احتیاط امروز: مایع کافی لازم است؛ انسداد یا دشواری بلع نیاز به ارزیابی طبی دارد و تنفس پودر می‌تواند حساسیت دهد.", "msl": "سکنجبین عسلی؛ نه دو مادۀ جداگانۀ عسل و سکنجبین.", "bdl": "به‌دانه برای تلیین و تبرید؛ نه بادیان."}, "ur": {"mzj": "سرد و تر درجہ دوم۔", "mhy": "چھوٹے بےتنے پودے کے تخم، پھول زمین کے نزدیک اور قد آدھ گز تک بیان ہے۔ تخم گلابی لعاب دار اور گھوڑے کے کان جیسے خمیدہ؛ نام اسپ (گھوڑا) و غول (کان) سے سمجھایا ہے۔ سفید چھلکا «سبوس اسپغول»، «بھوسی» یا «چھلکا اسپغول» کہلاتا ہے۔ تخم گلابی سرخی مائل، بھوسی سفید؛ پھیکا، لعاب دار و چپچپا، چھلکے میں لعاب زیادہ۔ مسلم تخم اور الگ بھوسی کے حصے یہاں جدا رکھے ہیں۔", "khs": "افعال: ملین، مغری، مسکن اورام، مسکن عطش و تپ شدید حار، مدر بول۔ کبیرالدین ملین ماننے سے انکار کرکے قابض لکھتے ہیں؛ نصیر احمد اسے غلط کہتے ہیں۔ نفع خاص مسکن حرارت و دافع زحیر۔ یہ مصنفین کے قدیم اقوال ہیں۔", "use": "اسہال/پیچش میں لعاب خراش آنت و «مردوں» خارج کرنے کے بیان میں ہے۔ سخت مواد اخراج اور رقیق دست بند ہونے کی دونوں نسبتیں؛ خشک کھانسی میں حلق/سینہ کھلنے کا تجربہ نصیر احمد کا ہے۔ پوست خشخاش کے گاڑھے جوشاندے کے ساتھ ورم کا لیپ، لعاب برائے پیاس، بخار، سوزش و درد بول، حرارت جگر و حدت خون کی نسبتیں ہیں۔ دس گرام بھگو کر صبح لعاب و دو گھنٹے غذا نہ لینے کا زخم آنت کا روایت؛ دس گرام پانی/دودھ کے ساتھ قبض و شق مقعد/آنت کے درد میں؛ بال نرم کرنے کا لعاب؛ توا یا روغن گل میں بریاں کرکے قابض کرنے کے اقوال قدیم ہیں، موجودہ خوراک کی سفارش نہیں۔", "mzr": "بلغمی مزاج، خراب/کمزور ہضم، ضعف اعصاب و سرد اشیا والوں کے لیے مضر؛ بھوسی کا حصہ بدہضمی میں منع کرتا ہے۔ موجودہ احتیاط: کافی مائع ضروری، رکاوٹ یا نگلنے کی مشکل میں طبی جانچ اور سفوف سانس میں جانے سے الرجی ممکن۔", "msl": "سکنجبین عسلی؛ شہد اور سکنجبین دو الگ اشیا نہیں۔", "bdl": "بہی دانہ، تلیین و تبرید کے لیے؛ بادیان نہیں۔"}, "en": {"mzj": "Cold and moist in the second degree.", "mhy": "The book describes seeds of a small stemless plant with flowers close to the ground and a height up to half a gaz. Pink mucilaginous seeds curve like a horse’s ear; it explains the name from asp (horse) and ghol (ear). The white coat is called sabus ispaghul, bhusi or chilka ispaghul. Seeds are pink/reddish, husks white, taste bland, mucilaginous and sticky; more mucilage is attributed to husks. Whole seeds and separated husks are distinguished within this entry.", "khs": "Source actions are laxation, coating/soothing, calming swelling, thirst and intense hot fever, and promoting urine. Kabiruddin disputes laxation and calls it astringent; Naseer Ahmad disagrees. The particular claim is cooling heat and relieving tenesmus. The authors’ historical disagreement is retained.", "use": "The diarrhea/dysentery account concerns mucilage soothing intestinal abrasion and expelling material termed “مردوں”. Both removal of hard contents and checking watery stools are attributed; a dry-cough throat/chest experience is attributed to Naseer Ahmad. Accounts include a poppy-capsule decoction poultice for swelling, mucilage for thirst/fever/burning or painful urination, and reducing liver heat/blood heat. Historical passages describe 10 g soaked for morning mucilage with two hours without food for bowel lesions; 10 g with water/milk for constipation and fissure pain during defecation; hair-softening mucilage; and pan-roasting or rose-oil roasting to make it astringent. These are source reports, not present-day dosing advice.", "mzr": "The source lists phlegmatic temperament, poor/weak digestion and weak/cold nerves; the husk section advises against use during indigestion. Current precaution: adequate liquid is essential; intestinal blockage or swallowing difficulty requires medical assessment, and inhaled powder can cause allergy.", "msl": "Honey-based oxymel (sikanjabin asali), not honey and oxymel as two separate items.", "bdl": "Quince seed (bihi dana), for softening and cooling; not fennel seed."}, "ar": {"mzj": "بارد رطب في الثانية.", "mhy": "يصف الكتاب بذر نبات صغير بلا جذع بأزهار قرب الأرض وارتفاع إلى نصف غز. البذور وردية لعابية مقوسة كأذن الفرس ويفسر الاسم من اسپ، الفرس، وغول، الأذن. والقشر الأبيض يسمى سبوس اسپغول أو بهوسي أو چلكا اسپغول. لون البذر وردي محمر والقشر أبيض والطعم عديم لعابي لاصق، والقشر أكثر لعابًا. وفصلت معلومات البذر الكامل عن القشر المنفصل.", "khs": "الأفعال في المصدر التليين والتغرية وتسكين الورم والعطش والحمى الحارة الشديدة وإدرار البول. ينفي كبير الدين التليين ويعده قابضًا ويخالفه نصير أحمد. والنفع الخاص تسكين الحرارة ودفع الزحير؛ حفظ خلاف المؤلفين القديم.", "use": "تذكر فقرات الإسهال والزحير تسكين خراش الأمعاء وإخراج مادة سماها المصدر «مردوں». وينسب إليه إخراج المحتوى الصلب وحبس الإسهال المائي، وتجربة السعال الجاف لتفتيح الحلق والصدر لنصير أحمد. وترد ضمادة بمغلي قشر الخشخاش للورم ولعاب البذر للعطش والحمى وحرقة البول وألمه وخفض حرارة الكبد والدم. وتروى ١٠ غرامات منقوعة للعاب الصباح وترك الطعام ساعتين لقروح الأمعاء، و١٠ غرامات بالماء أو اللبن للإمساك وألم الشق عند التبرز، ولعاب لتنعيم الشعر، والتحميص بالمقلاة أو زيت الورد لجعله قابضًا. هذه تقارير المصدر لا توصيات جرعات حالية.", "mzr": "يعده المصدر مضرًا للبلغم وضعف الهضم وفساده وضعف الأعصاب وبرودتها، وينهى قسم القشر عنه في سوء الهضم. حاليًا يحتاج إلى سائل كاف؛ وانسداد الأمعاء أو صعوبة البلع يستدعيان تقييمًا طبيًا وقد يسبب استنشاق المسحوق الحساسية.", "msl": "السكنجبين العسلي، وليس العسل والسكنجبين مادتين منفصلتين.", "bdl": "بذر السفرجل للتليين والتبريد، لا بذر الشمر."}}, "extras": {"ps": [["سیمې، ترکیب، مقدار او مرکبات", "کتاب پنجاب، سندهـ او بلوچستان، او په هند کې د ژمي کرنه او خودرو وده یادوي. ترکیب: لعابي ماده «میوسلج»، شحمي تېل، او «البیومن میٹر». مرکبات: سفوف طین او قرص طباشیر کافوري. عمومي چاپي مقدار «تین سے نو گرام (ماشہ)» دئ؛ قوسي ماشه له ګرام سره په اټکل نه دی برابر سوی."], ["د حکیمانو اختلاف او تجربه", "رام بهیا وایي چې اسپغول د موادو د پړسېدو له لارې عمل کوي او میده کول یې ډېر غلیظ لعاب، کولمي جامېدل، قولنج او حتی مرګ راوستلای سي. کبیرالدین یې میده کول د باطني زهري اغېزې له باور سره تړي. نصیر احمد طارق دواړه عمومي منعې بې‌دلیله ګڼي او په طب نبوي دواخانه کې د لسو کلونو د «تریاق شکم» په سفوف کې د مسلم اسپغول د میده سفوف ګډولو خپله تجربه نقل کوي. دا اختلاف او شخصي تجربي قولونه دي؛ د بې‌زیانه والي یا د میده/وچ تخم د خوندي تېرولو طبي تضمین نه دی."], ["سبوس / پوستکی: جلا تاریخي برخه", "د ۵۸م مخ اصل د نازک مزاج د قبض لپاره له شیدو سره، د کولمو زخم/پیچش، د شربت خوندورولو لپاره د غلیظ لعاب، د تندې تسکین، «پیچش (درد)»، تیزابیت او د معدې/کولمو د حدت یادونه کوي. د شپې د قبض چاپي مقدار «۲ دودھ پینے والے چمچ» نژدې ۶ ګرام، له شیدو/اوبو سره او په ورځ کې یو یا ډېر ځله، قوس «دس سے ۲۰ گرام تک» دئ؛ نورو امراضو ته له شربت یا مستو سره ورځ کې ۱–۲ ځله نژدې ۵–۷ ګرامه یاد دي. دا چاپي مقدارونه سره نه دي یوځای سوي. اصل د لږ پوستکي د قابض کېدو او د ډېر پوستکي د غایطه د پړسولو/نرمولو قول لري. کافي اوبه لرل د اوسني احتیاط خبره ده؛ د اصل «بې‌زیانه/مؤثر» جمله طبي تضمین نه دئ."]], "fa": [["مناطق، ترکیب، مقدار و مرکبات", "پنجاب، سند و بلوچستان، کشت زمستانی و رویش خودرو در هند ذکر است. ترکیب: لعاب «میوسلج»، روغن چرب و «البیومن میٹر». مرکبات سفوف طین و قرص طباشیر کافوری. مقدار چاپی «تین سے نو گرام (ماشہ)»؛ ماشۀ پرانتزی با گرام هم‌ارز فرض نشده."], ["اختلاف حکیمان و تجربه", "رام‌بهیا اثر را از پف‌کردن مواد می‌داند و خردکردن را سبب لعاب بسیار غلیظ، انسداد، قولنج و حتی مرگ می‌خواند. کبیرالدین پرهیز از کوفتن را به باور اثر زهری داخلی مربوط می‌سازد. نصیراحمد طارق این منع‌های عام را بی‌دلیل می‌داند و تجربۀ ده‌سالۀ افزودن سفوف کوفتۀ بذر کامل به «تریاق شکم» در دواخانۀ طب نبوی را نقل می‌کند. این اختلاف و تجربۀ شخصی است، نه تضمین بی‌ضرری یا بلع ایمن بذر خرد/خشک."], ["سبوس / پوست: بخش تاریخی جدا", "اصل صفحۀ ۵۸ مصرف با شیر در قبض نازک‌مزاجان، زخم/پیچش روده، لعاب غلیظ برای خوش‌طعم‌کردن شربت، تشنگی، «پیچش (درد)»، تیزابیت و حدت معده/روده را ذکر می‌کند. مقدار شبانۀ قبض «۲ دودھ پینے والے چمچ»، حدود ۶ گرام، با شیر/آب و یک یا چند بار در روز، پرانتز «دس سے ۲۰ گرام تک» است؛ سایر امراض با شربت/ماست ۱–۲ بار روزانه حدود ۵–۷ گرام. مقادیر مختلف ادغام نشده‌اند. قول قابض‌بودن کم و پف‌دادن/نرم‌کردن مدفوع با زیاد حفظ شده. احتیاط امروز مایع کافی است؛ صفت بی‌ضرر/مؤثر منبع ضمانت طبی نیست."]], "ur": [["مقام، اجزا، مقدار و مرکبات", "پنجاب، سندھ و بلوچستان، بھارت میں سردیوں کی کاشت و خودرو درج ہیں۔ اجزا لعابی مادہ «میوسلج»، فیٹی آئل اور «البیومن میٹر»۔ مرکبات سفوف طین، قرص طباشیر کافوری۔ مقدار «تین سے نو گرام (ماشہ)» مطبوعہ؛ قوسی اکائی گرام کے برابر قیاس نہیں کی گئی۔"], ["حکما کا اختلاف اور تجربہ", "رام بھیا عمل پیٹ کے مواد کو پھلانا کہتے اور کوفتہ سے گاڑھا لعاب، آنت جام، قولنج و موت کا اندیشہ لکھتے ہیں۔ کبیرالدین کوٹنے کی ممانعت کو باطنی زہری تاثیر کے خیال سے جوڑتے ہیں۔ نصیر احمد طارق ان عام ممانعتوں کو بےدلیل کہہ کر دس سال سے طب نبوی دواخانہ کے «تریاق شکم» میں کوفتہ مسلم اسپغول کا اپنا تجربہ نقل کرتے ہیں۔ اختلاف اور ذاتی تجربہ محفوظ ہے؛ بےضرری یا خشک/کوفتہ تخم محفوظ نگلنے کی طبی ضمانت نہیں۔"], ["سبوس / بھوسی: الگ تاریخی حصہ", "صفحہ ۵۸: نازک مزاج قبض میں دودھ، زخم آنت/پیچش، شربت خوش ذائقہ بنانے کا گاڑھا لعاب، پیاس، «پیچش (درد)»، تیزابیت و حدت معدہ/آنت درج ہیں۔ قبض میں رات «۲ دودھ پینے والے چمچ» تقریباً چھ گرام، دودھ/پانی، دن میں ایک یا زیادہ دفعہ، قوس «دس سے ۲۰ گرام تک»؛ دیگر امراض میں شربت/دہی کے ساتھ دن ایک دو بار تقریباً ۵–۷ گرام۔ الگ مطبوعہ مقادیر یکجا نہیں کی گئیں۔ کم مقدار قابض اور زیادہ پاخانہ پھلانے/نرم کرنے کا قول محفوظ۔ موجودہ احتیاط کافی مائع ہے؛ ماخذ کا بےضرر/مؤثر لفظ طبی ضمانت نہیں۔"]], "en": [["Regions, composition, quantity and preparations", "Punjab, Sindh and Balochistan, winter cultivation and wild growth in India are listed. Composition is mucilage, fatty oil and the printed “البیومن میٹر”. Preparations are Sufoof Tin and Qurs Tabashir Kafuri. General quantity reads “تین سے نو گرام (ماشہ)” (3–9 g, with masha in parentheses); equivalence of the printed units was not assumed."], ["Hakims’ disagreement and experience", "Ram Bhaiya explains the action as swelling bowel contents and associates crushing with very thick mucilage, obstruction, colic and possible death. Kabiruddin links the avoidance of crushing to a belief in internal toxicity. Naseer Ahmad Tariq rejects those blanket prohibitions and reports ten years of adding powdered whole seeds to “تریاق شکم” at the Tibb Nabawi dispensary. These conflicting opinions and personal experience are retained; they do not establish harmlessness or the safe swallowing of dry/crushed seed."], ["Husk: separate historical subsection", "Printed page 58 discusses husks with milk for constipation in delicate constitutions, bowel lesions/dysentery, thick mucilage to improve syrup flavour, thirst, “پیچش (درد)”, acidity and stomach/bowel heat. The constipation quantity prints “۲ دودھ پینے والے چمچ”, approximately 6 g, with milk/water at bedtime and once or more daily, with “دس سے ۲۰ گرام تک” in parentheses. Other disorders have syrup/curd once or twice daily, about 5–7 g. These distinct source figures are not merged. The source calls a small quantity constipating and a larger one stool-swelling/softening. Modern adequate-liquid precautions apply; the source’s harmless/effective wording is not a medical guarantee."]], "ar": [["المناطق والتركيب والمقدار والمركبات", "تذكر البنجاب والسند وبلوشستان والزراعة الشتوية والنمو البري في الهند. المكونات لعاب وزيت دهني والمطبوع «البیومن میٹر». والمركبات سفوف طين وقرص طباشير كافوري. والمقدار «تین سے نو گرام (ماشہ)» أي ٣–٩ غرامات وبالقوس الماشة، دون افتراض تساوي الوحدتين."], ["خلاف الحكماء وتجربتهم", "يربط رام بهيا العمل بانتفاخ محتوى الأمعاء ويحذر من أن الدق يولد لعابًا شديد الغلظ وانسدادًا وقولنجًا وربما الموت. ويربط كبير الدين منع الدق باعتقاد سمية باطنية. ويرفض نصير أحمد طارق المنع العام ويذكر تجربته لعشر سنوات بمسحوق البذر الكامل في «تریاق شکم» بدار الطب النبوي. حفظ الخلاف والتجربة الشخصية لا يضمن انعدام الضرر أو سلامة بلع البذر الجاف والمدقوق."], ["القشر: قسم تاريخي مستقل", "تذكر صفحة ٥٨ القشر باللبن لإمساك رقيقي المزاج وقروح الأمعاء والزحير واللعاب الغليظ لتحسين طعم الشراب والعطش و«پیچش (درد)» والحموضة وحرارة المعدة والأمعاء. ومقدار الإمساك ليلًا «۲ دودھ پینے والے چمچ»، نحو ٦ غرامات باللبن أو الماء مرة أو أكثر يوميًا وبالقوس «دس سے ۲۰ گرام تک». ولسائر الأمراض بالشراب أو اللبن الرائب مرة أو مرتين نحو ٥–٧ غرامات. لم تدمج المقادير المختلفة. وينسب إلى القليل القبض وإلى الكثير انتفاخ البراز وتليينه؛ ويلزم السائل الكافي حاليًا ولا تضمن عبارة غير ضار وفعال بالأصل الأمان الطبي."]]}, "photo_slots": 4, "photos": "empty as requested", "languages": ["ps", "fa", "ur", "en", "ar"], "status": "organized_text_reviewed", "complete_source_text_verified": true, "reading_blocks": [], "unresolved_source_readings": [], "scientific_as_printed": "Plantago-Ovata", "safety_source": "https://medlineplus.gov/druginfo/meds/a601104.html", "safety_provider": "M
