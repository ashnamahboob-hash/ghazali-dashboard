. وقتی درخت ۳۰–۴۰ ساله شود، درونش مادهٔ سیاه، سنگین و خوشبو پدید می‌آید که چوب را سنگین می‌کند تا آنجا که چوب خشک هم در آب غرق می‌شود؛ از این رو «عود غرقی» نام دارد. پوست نازک، محکم و هموار؛ برگ‌ها ۲–۳ اینچ و براق. در بهار گل‌های سفید نرم می‌دهد و میوه‌اش ۱٫۵–۲ اینچ و شبیه امرود است. در آسام، هیمالیای شرقی، سلهت، کوه‌های خاسیا، بنگال شرقی و برما فراوان است؛ عود بنگلادش بهتر شمرده می‌شود. رنگ سیاه و قهوه‌ای (چوب سیاه بهتر و گران‌تر از چوب روشن است). مزه: تلخ، تند و خوشبو.", "mzj": "گرم و خشک، درجهٔ دوم", "khs": "مقوی اعضای رئیسه و معده، کاسر ریاح، ملطف و مفتح، خوش‌بوکنندهٔ دهان، منفث بلغم", "use": "ضعف معده و کمی اشتها را برطرف می‌کند و در داروهای مقوی دل و مغز می‌آید. هضم را بهتر می‌کند و باد معده را تحلیل می‌برد. در سرفه و دمهٔ بلغمی به کار می‌رود. محافظ جنین است؛ خورده می‌شود و زیر ناف هم می‌مالند. برای بوی بد دهان در دهان می‌گذارند یا می‌جوند؛ پودر ریز آن برای دندان و لثه مفید است. پودرش بر لباس پاشیده شود ساس و شپش را دور می‌کند.", "mzr": "برای افراد گرم‌مزاج", "msl": "کافور و گلاب", "bdl": "دارچینی، میخک، زعفران و غیره"}, "ur": {"mhy": "سدا بہار درخت ہے جو ستر سے سو فٹ تک اونچا ہوتا ہے۔ جب درخت تیس چالیس برس کا ہوتا ہے تو اندر ایک سیاہ، وزنی اور خوشبودار مادہ پیدا ہو کر لکڑی کو بھاری کر دیتا ہے، یہاں تک کہ سوکھی لکڑی بھی پانی میں ڈوب جاتی ہے؛ اسی لیے اسے عود غرقی کہتے ہیں۔ چھال پتلی، مضبوط اور ہموار؛ پتے دو تین انچ لمبے اور چمکدار۔ بہار میں نرم سفید پھول لگتے ہیں اور پھل ڈیڑھ سے دو انچ لمبا، امرود کی شکل کا ہوتا ہے۔ آسام، مشرقی ہمالیہ، سلہٹ، کھاسیا کی پہاڑیوں، مشرقی بنگال اور برما میں کثرت سے ہوتا ہے؛ بنگلہ دیش کا عود بہتر خیال کیا جاتا ہے۔ رنگ سیاہ اور بھورا، مگر سیاہ لکڑی ہلکے رنگ کی نسبت بہتر اور قیمتی ہوتی ہے۔ ذائقہ: تلخ، تیز اور خوشبودار۔", "mzj": "گرم و خشک درجہ دوم", "khs": "مقوی اعضائے رئیسہ، مقوی معدہ، کاسر ریاح، ملطف و مفتح، مطیب دہن، منفث بلغم", "use": "ضعف معدہ اور کمی بھوک کو دور کرتا ہے، مقوی دل و دماغ ادویہ میں شامل کیا جاتا ہے۔ ہضم کو بہتر کرتا اور معدے کی غلط ریاح تحلیل کرتا ہے۔ منفث بلغم ہونے کی وجہ سے بلغمی کھانسی اور دمہ میں استعمال ہوتا ہے۔ محافظ جنین ہے؛ کھایا جاتا اور زیرِ ناف بھی لگایا جاتا ہے۔ منہ کی بدبو دور کرنے کے لیے منہ میں رکھ کر چباتے ہیں؛ اس کا باریک سفوف دانتوں اور مسوڑوں کو فائدہ دیتا ہے۔ کپڑوں پر سفوف چھڑکنے سے کھٹمل اور جوئیں دور ہو جاتی ہیں۔", "mzr": "گرم مزاج لوگوں کے لیے", "msl": "کافور اور گلاب", "bdl": "دار چینی، قرنفل، زعفران وغیرہ"}, "en": {"mhy": "An evergreen tree 70 to 100 ft tall. When the tree is 30–40 years old a black, heavy, fragrant substance forms inside, making the wood so heavy that even dry wood sinks in water, hence the name ‘ood gharqi’ (sinking oud). Bark thin, strong and smooth; leaves 2–3 in. long and glossy. Soft white flowers in spring; the fruit is 1.5–2 in. long and guava-shaped. Abundant in Assam, the eastern Himalaya, Sylhet, the Khasia hills, East Bengal and Burma; Bangladesh oud is considered better. Colour black and brown (black wood is better and dearer than light wood). Taste: bitter, sharp and fragrant.", "mzj": "Hot and dry, 2nd degree", "khs": "Strengthens the principal organs and the stomach, expels wind, softening and opening, sweetens the breath, expels phlegm", "use": "Relieves weak stomach and low appetite and is added to heart and brain tonics. Improves digestion and dissolves bad stomach wind. Used in phlegmatic cough and asthma. Protects the fetus; eaten and also applied below the navel. Held in the mouth or chewed for bad breath; its fine powder helps teeth and gums. Powder sprinkled on clothes drives off bedbugs and lice.", "mzr": "For hot-tempered people", "msl": "Camphor and rose", "bdl": "Cinnamon, clove, saffron, etc."}}, "extras": {"ps": [["د خوراک اندازه", "۳ تر ۴ ګرامه (ماشې)"], ["د متن حالت", "دا متن د تاج المفردات له چاپي اردو مخونو څخه په پنځو ژبو برابر سوی دئ او لا د بشپړې بیاکتنې انتظار باسي. د ډاکټر د مشورې بدل نه دئ."]], "fa": [["مقدار خوراک", "۳ تا ۴ ماشه (گرم)"], ["وضعیت متن", "این متن از صفحات چاپی اردوی تاج المفردات به پنج زبان تهیه شده و در انتظار بازبینی کامل است. جایگزین مشورت پزشک نیست."]], "ur": [["مقدار خوراک", "۳ سے ۴ ماشہ (گرام)"], ["متن کی حیثیت", "یہ متن تاج المفردات کے مطبوعہ اردو صفحات سے پانچ زبانوں میں تیار کیا گیا ہے اور مکمل نظرثانی باقی ہے۔ معالج کے مشورے کا بدل نہیں۔"]], "en": [["Dose", "3 to 4 masha (gram)"], ["Text status", "This text was prepared in five languages from the printed Urdu pages of Taj al-Mufradat and awaits full review. It is not a substitute for a physician’s advice."]]}, "status": "draft_from_printed_pages", "photo_slots": 4, "photos": "empty", "languages": ["ps", "fa", "ur", "en", "ar"]}, "T044": {"code": "T044", "pages": "74–75", "source": "تاج المفردات", "name": {"ps": "وړه الائچي", "fa": "هل خرد (هل کوچک)", "ur": "الائچی خرد", "en": "Small (Lesser) Cardamom", "ar": "الهيل الصغير"}, "names": [["ar", "قاقلہ صغار"], ["bn", "چھوٹ ایلاچ"], ["en", "The Lesser Cardamom"]], "scientific": "Elettaria cardamomum", "scientific_as_printed": "Elettaria cardamomum", "family": "Zingiberaceae", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "ډېری په لنده او سیوري لرونکې ځمکه کې کرل کېږي. بوټي یې د ادرکو په شان تل شین وي، له ریښې لاندې یې یوه غوټه ده، او له هغې یو ډنډ راوځي چې پاڼې پرې وي. تر ۸ فوټو پورې لوړېږي او له باران او لمر باید وساتل شي. کله چې ۳ یا ۴ فوټه لوړ شي، له ځایه یې ایستل کېږي او د ونو لاندې کرل کېږي. پاڼې یې ۲ فوټه اوږدې دي او له الائچو سره ورته بوی لري. ګلان یې سپین او سره دي، او میوه په ګڼو (ګچو) کې ځي؛ لومړی شنه وي او له ۲–۳ میاشتو وروسته ژېړ-شین کېږي، دننه یې تور دانې دي. دانې یې دوا کېږي؛ پوټکی یې بې ضرره دی. رنګ: دانه تور. ذائقه: سړه، خوږبوی او لطیفه. پیدایښت: سیام، چین، سري لنکا، جاوه، سماترا، میسور، کورګ او جنوبي هند په ځانګړي ډول مالابار.", "mzj": "ګرمه او وچه، دویم درجه (حکیم کبیر الدین یې لومړی درجه لیکلې)", "khs": "د خولې بوی ښه کوونکې، د معدې پیاوړې کوونکې، د باد ماتوونکې، مفرح او مسکن", "use": "یوازې یا د پان سره د خولې د بوی لپاره ژاولې کېږي. د باد له امله د ګېډې درد، د معدې ضعف، پړسوب او سوءهضم کې کارول کېږي. زړه پیاوړی او خوشحاله کوي، او د زړه درزا (خفقان) کې ګټوره ده. د زړه بدوالي او کانګو بندولو لپاره خوړل کېږي یا جوشانده یې څښل کېږي؛ خوله او خولې (پسینه) خوشبویه کوي. د پوډر بوی کول عطسه راولي. د سر درد او مرګي ته ګټه رسوي، اسهال ډډه کوي. په ګلاب کې جوش کړل شي او له سکنجبین سره وڅښل شي، د ځیګر د درد او سدو لپاره ګټوره ده.", "mzr": "سینه او پوستکي ناروغۍ پیدا کولای شي", "msl": "طباشیر", "bdl": "لویه الائچي، کبابه، حب بلسان"}, "fa": {"mhy": "بیشتر در زمین نمناک و جای سایه‌دار کاشته می‌شود. بوته‌اش مانند زنجبیل همیشه‌سبز است؛ زیر ریشه یک گره دارد و از آن ساقه‌ای برگ‌دار بیرون می‌آید. تا ۸ فوت بلند می‌شود و باید از باران و آفتاب محفوظ بماند. وقتی ۳–۴ فوت شد آن را کنده زیر درختان می‌کارند. برگ‌ها ۲ فوت بلند و بوی هل می‌دهند. گل‌ها سفید و سرخ‌اند و میوه به‌صورت خوشه می‌آید؛ نخست سبز و پس از ۲–۳ ماه زرد-سبز می‌شود و دانه‌های سیاه دارد. دانه دارو می‌شود و پوست آن بی‌ضرر است. رنگ: دانه سیاه. مزه: سرد، خوشبو و لطیف. زادگاه: سیام، چین، سریلانکا، جاوه، سوماترا، میسور، کورگ و جنوب هند به‌ویژه مالابار.", "mzj": "گرم و خشک درجهٔ دوم (حکیم کبیرالدین درجهٔ اول نوشته)", "khs": "خوش‌بوکنندهٔ دهان، مقوی معده، کاسر ریاح، مفرح و مسکن", "use": "به‌تنهایی یا با پان برای خوشبویی دهان جویده می‌شود. برای درد شکم بادی، ضعف معده، نفخ و ضعف هضم به کار می‌رود. دل را تقویت و شاد می‌کند و برای خفقان مفید است. برای تهوع و استفراغ خورده یا جوشانده‌اش نوشیده می‌شود. پودرش بوییده شود عطسه می‌آورد. برای سردرد و صرع سودمند است و اسهال را می‌بندد. جوشانده در گلاب با سکنجبین برای درد کبد و سدهٔ کبد مفید است.", "mzr": "ممکن است بیماری‌های سینه و پوست ایجاد کند", "msl": "طباشیر", "bdl": "هل کلان، کبابه، حب بلسان"}, "ur": {"mhy": "عموماً نمناک زمین اور سایہ دار جگہ میں بویا جاتا ہے۔ پودے ادرک کی طرح ہمیشہ سرسبز رہتے ہیں؛ جڑ کے نیچے ایک گانٹھ سی ہوتی ہے جس سے پتوں والی چھڑی نما گندل نکلتی ہے۔ آٹھ فٹ تک بلند ہو جاتا ہے اور بارش و دھوپ سے بچانا چاہیے۔ تین چار فٹ کا ہو تو اکھاڑ کر درختوں کے نیچے لگاتے ہیں۔ پتے دو فٹ لمبے اور الائچی کی خوشبو والے ہوتے ہیں۔ پھول سفید اور لال، پھل گچھوں میں لگتے ہیں؛ پہلے سبز اور دو تین ماہ میں پک کر زرد سبز مائل ہوتے ہیں جن میں سیاہی مائل دانے بھرے ہوتے ہیں۔ دانے بطور دوا استعمال ہوتے ہیں، چھلکا بے ضرر ہوتا ہے۔ رنگ: دانہ سیاہ۔ ذائقہ: ٹھنڈا، خوشبودار اور لطیف۔ مقامِ پیدائش: سیام، چین، سری لنکا، جاوا، سماٹرا، میسور، کورگ اور جنوبی ہند خصوصاً مالابار۔", "mzj": "گرم و خشک بدرجہ دوم (حکیم کبیر الدین نے درجہ اول لکھا ہے)", "khs": "مطیب دہن، مقوی معدہ، کاسر ریاح، مفرح و مسکن", "use": "تنہا یا پان کے ہمراہ خوشبوئے دہن کے لیے چباتے ہیں۔ درد شکم ریحی، ضعف معدہ، نفخ شکم اور ضعف ہضم میں استعمال ہوتی ہے۔ تقویت و تفریح قلب اور خفقان کے لیے مستعمل ہے۔ ابکائی، متلی اور قے روکنے کے لیے کھاتے یا جوشاندہ پلاتے ہیں۔ پیس کر سونگھنے سے چھینک آتی ہے۔ درد سر اور مرگی کو فائدہ دیتی ہے، اسہال کو روکتی ہے۔ گلاب میں جوش دے کر سکنجبین کے ہمراہ پلانا درد جگر اور جگر کے سدے کے لیے مفید ہے۔", "mzr": "صدر کے اور جلدی امراض پیدا کر سکتی ہے", "msl": "طباشیر", "bdl": "الائچی کلاں، کبابہ، حب بلسان"}, "en": {"mhy": "Usually sown in damp, shaded ground. The plants stay evergreen like ginger; a knot sits below the root and a leafy cane-like stalk rises from it. It reaches up to 8 ft and must be protected from rain and sun; at 3–4 ft it is uprooted and planted under trees. Leaves 2 ft long with a cardamom scent. Flowers white and red; the fruit grows in clusters, green at first, turning yellow-green after 2–3 months, with blackish seeds inside. The seeds are used as medicine; the husk is harmless. Colour: black seed. Taste: cool, fragrant and delicate. Grown in Siam, China, Sri Lanka, Java, Sumatra, Mysore, Coorg and South India, especially Malabar.", "mzj": "Hot and dry, 2nd degree (Hakim Kabir-ud-Din wrote 1st degree)", "khs": "Sweetens the breath, strengthens the stomach, expels wind, uplifting and soothing", "use": "Chewed alone or with paan for a fragrant mouth. Used for wind colic, weak stomach, bloating and poor digestion. Strengthens and cheers the heart and is used for palpitations. Eaten, or its decoction drunk, to stop nausea and vomiting. Powder sniffed brings sneezing. Helps headache and epilepsy and stops diarrhea. Boiled in rose water and taken with sikanjabin it helps liver pain and liver obstruction.", "mzr": "May cause chest and skin disorders", "msl": "Tabasheer", "bdl": "Large cardamom, kababa, habb-e-balsan"}}, "extras": {"ps": [["د خوراک اندازه", "نیم تر یو ګرام (ماشه)"], ["د متن حالت", "دا متن د تاج المفردات له چاپي اردو مخونو څخه په پنځو ژبو برابر سوی دئ او لا د بشپړې بیاکتنې انتظار باسي. د ډاکټر د مشورې بدل نه دئ."]], "fa": [["مقدار خوراک", "نیم تا یک ماشه (گرم)"], ["وضعیت متن", "این متن از صفحات چاپی اردوی تاج المفردات به پنج زبان تهیه شده و در انتظار بازبینی کامل است. جایگزین مشورت پزشک نیست."]], "ur": [["مقدار خوراک", "نصف سے ایک ماشہ (گرام)"], ["متن کی حیثیت", "یہ متن تاج المفردات کے مطبوعہ اردو صفحات سے پانچ زبانوں میں تیار کیا گیا ہے اور مکمل نظرثانی باقی ہے۔ معالج کے مشورے کا بدل نہیں۔"]], "en": [["Dose", "Half to 1 gram (masha)"], ["Text status", "This text was prepared in five languages from the printed Urdu pages of Taj al-Mufradat and awaits full review. It is not a substitute for a physician’s advice."]]}, "status": "draft_from_printed_pages", "photo_slots": 4, "photos": "empty", "languages": ["ps", "fa", "ur", "en", "ar"]}, "T045": {"code": "T045", "pages": "75–76", "source": "تاج المفردات", "name": {"ps": "لویه الائچي (غټه الائچي)", "fa": "هل کلان (هل بزرگ)", "ur": "الائچی کلاں (موٹی الائچی)", "en": "Large Cardamom", "ar": "الهيل الكبير"}, "names": [["ar", "قاقلہ کبار"], ["fa", "ہیل کلاں"], ["gu", "موٹی الائچی"], ["bn", "بڑا الانچ"], ["en", "Large Cardamom"]], "scientific": "Amomum subulatum", "scientific_as_printed": "Amomum subulatum", "family": "Scitamineae (as printed)", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "په اصل کې د وړې الائچي له کورنۍ او ډول څخه ده. بوټی یې تل شین دی، د ادرکو یا زردچوبې په شان، او ۳ تر ۴ فوټه لوړېږي. پاڼې ۱۸ تر ۲۰ انچه اوږدې او ۴ تر ۵ انچه پلنې دي، رنګ یې شین نیلي دی. ګلان او میوه د ډنډ په ښکته برخه کې ښکاري. ګل یې سپین دی او پر هغه بیګني (ارغواني) خالونه ښکاري. میوه ګردګونه او تېره  walnut.gl=walnut.gal.map((_,i)=>walnut.gl?.[i] || "");
 duplicate.gal.forEach((img,i)=>{
  if(!walnut.gal.includes(img)){walnut.gal.push(img);walnut.gl.push(duplicate.gl?.[i] || "")}
 });
 duplicate.hiddenDuplicate=true;
 const remap = ids => [...new Set(ids.map(i=>i===18?17:i).filter(i=>H[i]))];
 fav=remap(Array.isArray(fav)?fav:[]);
 recentHerbs=remap(recentHerbs);
 for (const row of tajRecords) {
  const [code, urdu, english]=row;
  const old=H[tajLinks[code]];
  if (old) {old.taj=row;continue}
  H.push({nm:{ps:code==="T001"?"انځر":code==="T002"?"السی (د کتان تخم)":urdu,fa:urdu,ur:urdu,en:english},s:code==="T001"?"Ficus carica L.":code==="T002"?"Linum usitatissimum L.":"",c:"#2d5c4a",img:undefined,taj:row,imported:true,otherNames:code==="T001"?figSourceNames.map(([,name])=>({name})):undefined});
 }
}
function herbDisplay(p){
 const reviewed=wordDetailLayout.records[p.taj?.[0]];
 if(reviewed?.name[lang])return reviewed.name[lang];
 if(lang!=="ar")return p.nm[lang];
 const arabic=(p.otherNames||[]).find(entry=>entry.language==="ar");
 return p.nm.ar || (arabic ? arabic.name : p.nm.ur);
}
function herbText(p,key){
 const value=p[key];
 if(value[lang])return value[lang];
 return lang==="ar" && value.ps ? '<span class="ft">'+t().fb+'</span><div lang="ps" dir="rtl">'+value.ps+'</div>' : "";
}

 if(view==='usr'||view==='set')render();

function authBridge(){return window.NativeAccount||window.WebAccount;}
function beginAccountAction(method,args=[]){
 if(accountBusy)return false;
 const bridge=authBridge();
 if(!accountReady||!bridge||typeof bridge[method]!=='function'){
  accountFailed=true;accountMessage='unavailable';const status=document.getElementById('auth-status');if(status)status.textContent=authStatus();return false;

 if(form?.elements?.email)authDraftEmail=form.elements.email.value.trim();

function gkEntryLanguage(label) {
 return GK_ENTRY_NAME_LANGUAGES.find(function(row){return new RegExp('^(?:'+row[1]+')$','i').test(String(label||'').trim());});
}
function gkEntryNameRows(input,displayLang) {
 var rows=[],seen=new Set();
 function add(label,value){
  label=String(label||'').trim();value=String(value||'').trim();
  if(!value)return;
  var known=gkEntryLanguage(label);if(known)label=known[2][displayLang]||known[2].en;
  var id=label+'\u0000'+value;if(seen.has(id))return;seen.add(id);rows.push([label,value]);
 }
 function parse(text){
  String(text||'').split(/[\n؛;]+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(part){
   var aliases=GK_ENTRY_NAME_LANGUAGES.map(function(r){return r[1];}).join('|');

   if(!matches.length){var colon=part.search(/[:：]/);if(colon>0)add(part.slice(0,colon),part.slice(colon+1));else add('',part);return;}
   var prefix=part.slice(0,matches[0].index).replace(/(?:،|,|اور|جبکہ)\s*$/,'').trim();
   if(prefix){var colon=prefix.search(/[:：]/);if(colon>0)add(prefix.slice(0,colon),prefix.slice(colon+1));else add('',prefix);}

    var labels=m[1].replace(/\s*اور\s*عام\s*زبان$/,'').split(/\s*(?:اور|\band\b|&)\s*|\s+و\s+/i);
    labels.forEach(function(label){add(label,value);});
   });
  });
 }

 else parse(input);
 return rows;
}

          const p=H.find(x=>x.taj&&x.taj[0]===h.code);if(p&&!im.length)p.img='';
          const left=[];e.lic={};const ln=x=>x&&x.lic&&x.lic.name?(x.lic.author?x.lic.author+' — ':'')+x.lic.name:'';
          im.forEach(x=>{const k=SL[x.label];if(k&&!seen[k]){seen[k]=1;e[k]=x.data;e.lic[k]=ln(x)}else left.push(x)});
          ['plant','leaf','flower','fruit','used'].forEach(k=>{if(!e[k]&&left.length){const y=left.shift();e[k]=y.data;e.lic[k]=ln(y)}});
          e.licCredit=[...new Set(Object.values(e.lic).filter(Boolean))].join(' · ');
        }catch(e){}
      }));
      if(any){try{applyPhotos()}catch(e){}try{render()}catch(e){}}
    }catch(e){console.warn('images',e)}
  }catch(e){console.warn('Firebase',e)}
})();
</script>
