{"s": "Aristolochia indica / A. bracteata", "c": "#6b3a5c", "img": "", "poster": "", "nm": {"ps": "ایشرمول", "fa": "زروند مدحرج", "ur": "ایشر مول", "en": "Indian Birth Wort"}, "ben": {"ps": "په دودیز طب کې د متیازو او میاشتني عادت د بندښت، د بلغم او معدې د سدو لپاره یاد شوی؛ په آیورېد کې د تقویې، تبې او هیضې لپاره.", "fa": "در طب سنتی برای احتباس ادرار و عادت ماهانه، دفع بلغم و گشودن سدّه‌های معده یاد شده؛ در آیورودا برای تقویت، تب و اسهال.", "ur": "روایتی طب میں پیشاب اور ایامِ ماہواری کی رکاوٹ، بلغم کے اخراج اور معدے کی سدّوں کے لیے مذکور ہے؛ آیوروید میں مقوی، بخار اور اسہال کے لیے۔", "en": "Mentioned in traditional medicine for urinary and menstrual blockage, phlegm and stomach obstructions; in Ayurveda as a tonic and for fever and diarrhoea."}, "use": {"ps": "دا بوټی زهري ترکیبونه لري؛ د ځان درملنې لپاره یې مه کاروئ. که دودیز استعمال ته اړتیا وي، یوازې د وړ او باتجربه طبیب تر څارنې لاندې. (د مقدار معلومات دلته نه دي ورکړل شوي.)", "fa": "این گیاه ترکیبات سمی دارد؛ برای خوددرمانی استفاده نکنید. در صورت نیاز به مصرف سنتی، فقط زیر نظر طبیب مجرب. (مقدار مصرف در اینجا داده نشده است.)", "ur": "اس بوٹی میں زہریلے اجزا ہیں؛ خود علاج کے لیے استعمال نہ کریں۔ روایتی استعمال کی صورت میں صرف ماہر معالج کی نگرانی میں۔ (مقدار یہاں فراہم نہیں کی گئی۔)", "en": "This plant contains toxic compounds; do not self-medicate. If traditional use is considered, only under a qualified, experienced practitioner. (No dosage is given here.)"}, "cau": {"ps": "ډیر خطرناک: ارستولوکیک اسید لري، چې د پښتورګو زیان او سرطان سره تړلی دی، او په ډیرو هېوادونو کې منع یا محدود دی. د امیندوارۍ، شیدو ورکولو، ماشومانو او د پښتورګو/ځیګر ناروغانو لپاره منع دی. د مار چیچلو لپاره هیڅکله په کور کې مه کاروئ — سمدلاسه روغتون ته ورشئ.", "fa": "بسیار خطرناک: حاوی اسید آریستولوشیک است که با آسیب کلیه و سرطان مرتبط است و در بسیاری از کشورها ممنوع یا محدود است. برای بارداری، شیردهی، کودکان و بیماران کلیه/کبد ممنوع است. برای مارگزیدگی هرگز در خانه استفاده نکنید — فوراً به بیمارستان بروید.", "ur": "نہایت خطرناک: اس میں ارسٹولوکک ایسڈ ہوتا ہے جو گردوں کے نقصان اور کینسر سے منسلک ہے، اور کئی ممالک میں ممنوع یا محدود ہے۔ حمل، دودھ پلانے، بچوں اور گردے/جگر کے مریضوں کے لیے ممنوع۔ سانپ کے کاٹے میں گھر پر ہرگز استعمال نہ کریں — فوراً ہسپتال جائیں۔", "en": "Highly dangerous: contains aristolochic acid, linked to kidney damage and cancer, and banned or restricted in many countries. Not for pregnancy, breastfeeding, children, or people with kidney/liver disease. Never use it at home for snakebite — go to hospital immediately."}},
{"s": "Aconitum heterophyllum", "c": "#3d4fa0", "img": "", "poster": "", "nm": {"ps": "اتیس تلخ", "fa": "اتیس تلخ", "ur": "اتیس تلخ", "en": "Indian Atees"}, "ben": {"ps": "په دودیز طب کې د تبې، ټوخي، دمې، نس ناستۍ او د هضم د خرابۍ لپاره یاد شوی دی.", "fa": "در طب سنتی برای تب، سرفه، آسم، اسهال و سوءهاضمه یاد شده است.", "ur": "روایتی طب میں بخار، کھانسی، دمہ، اسہال اور بدہضمی کے لیے مذکور ہے۔", "en": "Mentioned in traditional medicine for fever, cough, asthma, diarrhoea and indigestion."}, "use": {"ps": "کارونه یې په ځانګړو ترکیبونو او مقدارونو پورې تړلې دي؛ دلته مقدار نه ورکول کېږي. یوازې د وړ طبیب تر څارنې لاندې او یوازې د باوري سرچینې توکي.", "fa": "کاربردها به ترکیب و مقدار دقیق وابسته است؛ در اینجا مقدار داده نمی‌شود. فقط زیر نظر طبیب مجرب و با مواد معتبر.", "ur": "استعمال مخصوص نسخوں اور مقدار سے جڑا ہے؛ یہاں مقدار نہیں دی جاتی۔ صرف ماہر معالج کی نگرانی میں اور معتبر ذریعے کے اجزا کے ساتھ۔", "en": "Uses depend on specific preparations and doses; no dosage is given here. Only under a qualified practitioner and with reliably sourced material."}, "cau": {"ps": "پاملرنه: د Aconitum کورنۍ بوټی دی، او ځینې ډولونه (لکه بچھناګ) ډیر زهري دي او زړه ته جدي زیان رسوي. کله ناکله د اتیس پر ځای ټیټ کیفیت یا زهري ډول خرڅېږي. د ماشومانو، امیندوارو او شیدې ورکوونکو لپاره پخپله مه کاروئ. د ملاریا یا نورې تبې لپاره د ډاکټر معاینې او درملنې بدل نه دی.", "fa": "احتیاط: از خانواده Aconitum است و برخی گونه‌ها (مانند بچھناگ) بسیار سمی‌اند و به قلب آسیب جدی می‌زنند. گاهی نوع بی‌کیفیت یا سمی به جای اتیس فروخته می‌شود. برای کودکان، باردار و شیرده خودسرانه استفاده نکنید. جایگزین معاینه و درمان پزشکی برای مالاریا یا تب نیست.", "ur": "احتیاط: یہ Aconitum خاندان سے ہے اور بعض اقسام (جیسے بچھناگ) نہایت زہریلی ہیں جو دل کو شدید نقصان پہنچاتی ہیں۔ کبھی کبھار اتیس کی جگہ کم معیار یا زہریلی قسم بیچی جاتی ہے۔ بچوں، حاملہ اور دودھ پلانے والی خواتین خود سے استعمال نہ کریں۔ ملیریا یا بخار کے لیے ڈاکٹر کے معائنے اور علاج کا متبادل نہیں۔", "en": "Caution: belongs to the Aconitum family; some species (e.g. Bachnag) are highly toxic and can seriously harm the heart. Low-quality or toxic types are sometimes sold in its place. Do not self-use for children, pregnancy or breastfeeding. Not a substitute for medical examination and treatment of malaria or fever."}},

], "c": "#7a6a2c", "img": "", "gal": [], "nm": {"ps": "لیونی بنګه", "fa": "بزرالبنج", "ur": "اجوائن خراسانی", "en": "Henbane"}, "ben": {"ps": "په دودیز طب کې د دردونو، بلغمي ټوخي او بې خوبۍ لپاره یاد شوی، خو ډیر زهري دی او ډیر احتیاط غواړي.", "fa": "در طب سنتی برای دردها، سرفه بلغمی و بی‌خوابی یاد شده، اما بسیار سمی است و احتیاط زیادی می‌طلبد.", "ur": "روایتی طب میں دردوں، بلغمی کھانسی اور بے خوابی کے لیے مذکور ہے، مگر نہایت زہریلی ہے اور بہت احتیاط چاہتی ہے۔", "en": "Mentioned in traditional medicine for pain, phlegmy cough and insomnia, but it is highly toxic and demands great caution."}, "use": {"ps": "د مقدار په اړه ډیر حساس دی؛ دلته مقدار نه ورکول کېږي. په هیڅ ډول پخپله مه کاروئ، یوازې د وړ طبیب تر څارنې لاندې.", "fa": "بسیار حساس به مقدار است؛ در اینجا مقدار داده نمی‌شود. به هیچ وجه خودسرانه مصرف نکنید، فقط زیر نظر طبیب مجرب.", "ur": "مقدار کے لحاظ سے نہایت حساس ہے؛ یہاں مقدار نہیں دی جاتی۔ ہرگز خود استعمال نہ کریں، صرف ماہر معالج کی نگرانی میں۔", "en": "Extremely dose-sensitive; no dosage is given here. Never self-use; only under a qualified practitioner."}, "cau": {"ps": "ډیر زهري: ټول برخې یې (تخم، پاڼې، ریښه) ایټروپین او سکوپولامین لري. لږ مقدار هم لیونتوب، هذیان، د زړه ګړندي ټکان، وچ خوله، لوی شوي سترګې، بې هوشي او مرګ رسولی شي. ماشومان ډیر په خطر کې دي. که څوک یې وخوري، سمدلاسه عاجل روغتون ته ورشئ.", "fa": "بسیار سمی: همه اجزای آن (دانه، برگ، ریشه) حاوی آتروپین و اسکوپولامین است. مقدار کم هم می‌تواند توهم، هذیان، تپش قلب، خشکی دهان، گشادی مردمک، بی‌هوشی و مرگ ایجاد کند. کودکان در خطر بیشتری هستند. در صورت خوردن، فوراً به اورژانس بروید.", "ur": "نہایت زہریلی: اس کے تمام حصے (بیج، پتے، جڑ) میں ایٹروپین اور اسکوپولامین ہوتے ہیں۔ تھوڑی مقدار بھی ہذیان، دھڑکن کی تیزی، خشک منہ، پھیلی پتلیاں، بے ہوشی اور موت کا سبب بن سکتی ہے۔ بچے زیادہ خطرے میں ہیں۔ کھا لینے کی صورت میں فوراً ایمرجنسی جائیں۔", "en": "Highly toxic: all parts (seeds, leaves, root) contain atropine and scopolamine. Even small amounts can cause hallucinations, delirium, rapid heartbeat, dry mouth, dilated pupils, unconsciousness and death. Children are at greater risk. If ingested, go to emergency care immediately."}},
{"s": "Cymbopogon citratus / C. schoenanthus", "c": "#7a9a2c", "img": "", "gal": [], "nm": {"ps": "ازخر (لیمن ګراس)", "fa": "اذخر (علف لیمو)", "ur": "ازخر / لیمن گراس", "en": "Lemongrass"}, "ben": {"ps": "د چای په ډول په دودیز طب کې د معدې بې ارامۍ، کانګو، نس ناستۍ او د متیازو/میاشتني عادت د جریان لپاره یادېږي؛ خوږ بوی او ملایم ترش خوند لري.", "fa": "به صورت دمنوش در طب سنتی برای ناراحتی معده، تهوع، اسهال و تسهیل ادرار و عادت ماهانه یاد شده؛ بوی خوش و طعم ملایم ترش دارد.", "ur": "قہوے کی صورت میں روایتی طب میں معدے کی خرابی، قے، اسہال اور پیشاب و ماہواری کے اجرا کے لیے مذکور ہے؛ خوشبودار اور ہلکا ترش ذائقہ رکھتی ہے۔", "en": "As a tea, traditionally mentioned for upset stomach, nausea, diarrhoea and to promote urine and menstrual flow; fragrant with a light citrusy taste."}, "use": {"ps": "وچې یا تازه پاڼې او ډډ په ګرمو اوبو کې ځنډوئ او د چای په ډول وڅښئ.", "fa": "برگ و ساقه خشک یا تازه را در آب داغ دم کنید و به صورت چای بنوشید.", "ur": "خشک یا تازہ پتے اور تنے گرم پانی میں بھگو کر چائے کی طرح پئیں۔", "en": "Steep dried or fresh leaves and stalk in hot water and drink as tea."}, "cau": {"ps": "امیندواره مېرمنې دې په درملیز مقدار مه کاروي. د الرجۍ لرونکي دې احتیاط وکړي. اساسي تېل (essential oil) مه څښئ؛ یوازې رقیق شوی او بهرنی کارول کېږي. که اوږدمهاله ناروغي لرئ، له طبیب سره مشوره وکړئ.", "fa": "بانوان باردار در مقدار دارویی مصرف نکنند. افراد دارای آلرژی احتیاط کنند. اسانس (روغن اساسی) را نخورید؛ فقط رقیق‌شده و برای مصرف خارجی. در بیماری مزمن با پزشک مشورت کنید.", "ur": "حاملہ خواتین دوائی مقدار میں استعمال نہ کریں۔ الرجی والے احتیاط کریں۔ اس کا اسینشل آئل پیا نہیں جاتا؛ صرف پتلا کر کے بیرونی استعمال۔ دائمی مرض میں معالج سے مشورہ کریں۔", "en": "Pregnant women should avoid medicinal amounts. People with allergies should be careful. Never drink the essential oil; it is for diluted external use only. Consult a doctor if you have a chronic condition."}},
{"s": "Plantago ovata", "c": "#b07a4a", "img": "", "gal": [], "nm": {"ps": "اسپغول", "fa": "اسپغول", "ur": "اسپغول", "en": "Psyllium (Isabgol)"}, "ben": {"ps": "په دودیز طب کې د قبض، اسهال او پیچش، د کولمو د خارښت او ځورونې، وچ ټوخي او د تندې د تسکین لپاره یاد شوی.", "fa": "در طب سنتی برای یبوست، اسهال و دیسانتری، تحریک روده، سرفه خشک و تسکین تشنگی یاد شده است.", "ur": "روایتی طب میں قبض، اسہال اور پیچش، آنتوں کی جلن، خشک کھانسی اور پیاس کی شدت کے لیے مذکور ہے۔", "en": "Traditionally mentioned for constipation, diarrhoea and dysentery, bowel irritation, dry cough and soothing thirst."}, "use": {"ps": "دانې یا پوستکی په کافي اوبو، شیدو یا ماستو کې لندوئ، ښه ګډ کړئ او سمدلاسه وڅښئ. هیڅکله وچ مه خورئ.", "fa": "دانه یا پوسته را در آب فراوان، شیر یا ماست خیس و هم بزنید و فوراً بنوشید. هرگز خشک نخورید.", "ur": "دانے یا چھلکے کو وافر پانی، دودھ یا دہی میں بھگو کر ملائیں اور فوراً پئیں۔ کبھی خشک نہ کھائیں۔", "en": "Mix seeds or husk into plenty of water, milk or yogurt and drink immediately. Never swallow it dry."}, "cau": {"ps": "بې کافي اوبو د اخیستلو له امله ستونی یا کولمې بندېدای شي. د ډیر زیات استعمال سړه قبض راولي. که د کولمو بندښت یا د تېرولو (ښکته کولو) ستونزه لرئ، مه کاروئ. د نورو درملو څخه دوه ساعته فاصله ولري. د سختې بدهضمۍ او الرجۍ په صورت کې له طبیب سره مشوره وکړئ.", "fa": "مصرف بدون آب کافی می‌تواند باعث گیر کردن در گلو یا انسداد روده شود. مصرف زیاد یبوست ایجاد می‌کند. در انسداد روده یا مشکل بلع استفاده نکنید. با داروهای دیگر حدود دو ساعت فاصله بگذارید. در سوءهاضمه شدید و آلرژی با پزشک مشورت کنید.", "ur": "کافی پانی کے بغیر لینے سے گلے یا آنتوں میں رکاوٹ ہو سکتی ہے۔ زیادہ استعمال قبض پیدا کرتا ہے۔ آنتوں کی رکاوٹ یا نگلنے کی دشواری میں استعمال نہ کریں۔ دیگر ادویات سے تقریباً دو گھنٹے کا فاصلہ رکھیں۔ شدید بدہضمی اور الرجی میں معالج سے مشورہ کریں۔", "en": "Taking it without enough water can cause choking or bowel blockage. Excess may cause constipation. Avoid with bowel obstruction or swallowing difficulty. Take about two hours apart from other medicines. Consult a doctor for severe indigestion or allergy."}},
{"s": "Apium graveolens", "c": "#6a9a3c", "img": "", "poster": "", "nm": {"ps": "اجمود (کرفس)", "fa": "کرفس", "ur": "اجمود / کرفس", "en": "Celery seed"}, "ben": {"ps": "په دودیز طب کې د هضم، د ګېډې د باد، د بندونو درد، ټوخي، هچکۍ او د کانګو لپاره یاد شوی؛ اشتها راوړي.", "fa": "در طب سنتی برای هضم، نفخ، درد مفاصل، سرفه، سکسکه و تهوع یاد شده؛ اشتها‌آور است.", "ur": "روایتی طب میں ہاضمے، گیس، جوڑوں کے درد، کھانسی، ہچکی اور قے کے لیے مذکور ہے؛ اشتہا آور ہے۔", "en": "Traditionally mentioned for digestion, gas, joint pain, cough, hiccups and nausea; stimulates appetite."}, "use": {"ps": "دانې د غذا د مصالحې په ډول یا د جوشاندې په ډول کارېږي. د درملیز استعمال لپاره مقدار د طبیب له خوا وټاکل شي.", "fa": "دانه‌ها به عنوان ادویه غذا یا جوشانده استفاده می‌شود. برای مصرف دارویی، مقدار را پزشک تعیین کند.", "ur": "دانے کھانوں کے مصالحے یا جوشاندے کے طور پر استعمال ہوتے ہیں۔ دوائی استعمال کے لیے مقدار معالج طے کرے۔", "en": "Seeds are used as a food spice or as a decoction. For medicinal use, the dose should be set by a practitioner."}, "cau": {"ps": "امیندواره مېرمنې دې په درملیز مقدار مه کاروي (په دودیز طب کې حمل ته زیان رسوونکی یادېږي). د مرګي، پښتورګو ناروغۍ، د وینې رقیقوونکو درملو کارونکي او د کرفس د الرجۍ لرونکي دې له طبیب سره مشوره وکړي. د ګرم مزاج لرونکو لپاره دودیز ډول زیانمن بلل کېږي.", "fa": "بانوان باردار در مقدار دارویی مصرف نکنند (در طب سنتی برای حمل زیان‌آور یاد شده). مبتلایان به صرع، بیماری کلیوی، مصرف‌کنندگان داروهای رقیق‌کننده خون و دارندگان آلرژی به کرفس با پزشک مشورت کنند. در طب سنتی برای افراد گرم‌مزاج مضر دانسته شده.", "ur": "حاملہ خواتین دوائی مقدار میں استعمال نہ کریں (روایتی طب میں حمل کے لیے مضر ذکر ہے)۔ مرگی، گردے کے مرض، خون پتلا کرنے والی ادویات استعمال کرنے والے اور اجمود/کرفس سے الرجی والے معالج سے مشورہ کریں۔ روایتی طور پر گرم مزاج افراد کے لیے مضر سمجھا جاتا ہے۔", "en": "Pregnant women should avoid medicinal amounts (traditionally noted as harmful to pregnancy). People with epilepsy, kidney disease, those on blood thinners, or with celery allergy should consult a doctor. Traditionally considered unsuitable for hot-temperament people."}},
{"s": "Lavandula stoechas", "c": "#7a58b0", "img": "", "gal": [], "nm": {"ps": "اسطوخودوس", "fa": "اسطوخودوس", "ur": "اسطوخودوس", "en": "Lavender"}, "ben": {"ps": "په دودیز طب کې د سردرد (ځانګړي ډول د نیمایي سر درد)، د عصبونو او دماغ ځواک، د هضم، د ګېډې باد او د بندونو او پوستو درد لپاره یاد شوی؛ خوشبو بوی لري.", "fa": "در طب سنتی برای سردرد (به‌ویژه میگرن)، تقویت اعصاب و مغز، هضم، نفخ و درد مفاصل و عضلات یاد شده؛ بوی خوش دارد.", "ur": "روایتی طب میں سر درد (خصوصاً آدھے سر کا درد)، اعصاب و دماغ کی تقویت، ہاضمے، گیس اور جوڑوں و پٹھوں کے درد کے لیے مذکور ہے؛ خوشبودار ہے۔", "en": "Traditionally mentioned for headache (especially migraine), strengthening nerves and brain, digestion, gas and joint and muscle pain; strongly fragrant."}, "use": {"ps": "وچې ګلان او پاڼې د جوشاندې په ډول کارېږي. د درملیز استعمال لپاره مقدار طبیب وټاکي. تیل یې یوازې بهرنی او رقیق شوی کارېږي.", "fa": "گل و برگ خشک به صورت جوشانده استفاده می‌شود. برای مصرف دارویی، مقدار را پزشک تعیین کند. روغن آن فقط خارجی و رقیق‌شده.", "ur": "خشک پھول اور پتے جوشاندے کے طور پر استعمال ہوتے ہیں۔ دوائی استعمال میں مقدار معالج طے کرے۔ اس کا تیل صرف بیرونی اور پتلا کر کے۔", "en": "Dried flowers and leaves are used as a decoction. For medicinal use, the dose should be set by a practitioner. The oil is for diluted external use only."}, "cau": {"ps": "د ماشومانو لپاره پخپله مه کاروئ (په دودیز طب کې زیانمن یادېږي). د ګرم مزاج خلکو کې زړه بدوالی، کانګې او تنده زیاتولی شي. اساسي تیل مه څښئ، پوستکي ته یې رقیق کړئ. امیندواره او شیدې ورکوونکې مېرمنې او د خوب/ارامونکو درملو کارونکي دې له طبیب سره مشوره وکړي.", "fa": "برای کودکان خودسرانه استفاده نکنید (در طب سنتی مضر یاد شده). در افراد گرم‌مزاج می‌تواند تهوع، استفراغ و تشنگی ایجاد کند. اسانس را نخورید و روی پوست رقیق کنید. بانوان باردار و شیرده و مصرف‌کنندگان داروهای آرام‌بخش با پزشک مشورت کنند.", "ur": "بچوں کو خود سے نہ دیں (روایتی طب میں مضر مذکور ہے)۔ گرم مزاج افراد میں متلی، قے اور پیاس بڑھا سکتی ہے۔ اسینشل آئل نہ پئیں، جلد پر پتلا کر کے لگائیں۔ حاملہ، دودھ پلانے والی خواتین اور نیند/سکون کی ادویات استعمال کرنے والے معالج سے مشورہ کریں۔", "en": "Do not self-administer to children (traditionally noted as harmful). May cause nausea, vomiting and thirst in hot-temperament people. Never drink the essential oil; dilute it on skin. Pregnant or breastfeeding women and those on sedatives should consult a doctor."}},
{"s": "Tamarindus indica", "c": "#9a6a3c", "img": "", "gal": [], "nm": {"ps": "املی (تمر هندي)", "fa": "تمر هندی", "ur": "املی / تمر ہندی", "en": "Tamarind"}, "ben": {"ps": "په دودیز طب کې د ګودې شربت د تندې، تودوخې، کانګو او زړه بدوالي، قبض او د صفرا لپاره یاد شوی؛ پاڼې یې د زخمونو مینځلو او غرغرې لپاره یادېږي.", "fa": "در طب سنتی شربت پالپ آن برای تشنگی، گرمی، تهوع، یبوست و صفرا یاد شده؛ برگ آن برای شستن زخم و غرغره یاد می‌شود.", "ur": "روایتی طب میں گودے کا شربت پیاس، گرمی، متلی و قے، قبض اور صفرا کے لیے مذکور ہے؛ پتے زخم دھونے اور غرارے کے لیے مذکور ہیں۔", "en": "Traditionally the pulp (as a drink) is mentioned for thirst, heat, nausea, constipation and bile; the leaves for washing wounds and gargling."}, "use": {"ps": "ګوده په اوبو کې لندوئ، چاڼ کړئ او د شربت په ډول وکاروئ. بازار کې مالګه یا مصنوعي اسید ګډ شوی وي؛ پاکه ګوده غوره ده.", "fa": "پالپ را در آب خیسانده، صاف کنید و به صورت شربت مصرف کنید. نوع بازاری ممکن نمک یا اسید مصنوعی داشته باشد؛ پالپ خالص بهتر است.", "ur": "گودے کو پانی میں بھگو کر چھانیں اور شربت کے طور پر استعمال کریں۔ بازاری میں نمک یا مصنوعی ایسڈ ملا ہو سکتا ہے؛ خالص گودا بہتر ہے۔", "en": "Soak the pulp in water, strain and drink as a syrup. Market products may contain salt or added acids; pure pulp is better."}, "cau": {"ps": "ډیر مقدار اسهال راولي. که د وینې رقیقوونکي یا د شکرې درمل کاروئ، مخکې له طبیب سره مشوره وکړئ. په دودیز طب کې د ستوني ناروغۍ لپاره زیانمن یادېږي. دانې مه خورئ.", "fa": "مصرف زیاد باعث اسهال می‌شود. اگر داروی رقیق‌کننده خون یا دیابت مصرف می‌کنید، قبلاً با پزشک مشورت کنید. در طب سنتی برای بیماری گلو مضر یاد شده. دانه‌ها را نخورید.", "ur": "زیادہ مقدار اسہال پیدا کرتی ہے۔ خون پتلا کرنے یا ذیابیطس کی ادویات استعمال کرتے ہوں تو پہلے معالج سے مشورہ کریں۔ روایتی طب میں گلے کی بیماری کے لیے مضر ذکر ہے۔ بیج نہ کھائیں۔", "en": "Large amounts cause diarrhoea. If you take blood thinners or diabetes medication, consult a doctor first. Traditionally noted as unsuitable for throat ailments. Do not eat the seeds."}},
{"s": "Tylophora indica / Hemidesmus indicus (to be verified)", "c": "#8a8a2c", "img": "", "gal": [], "nm": {"ps": "اننت مول", "fa": "اننت مول", "ur": "اننت مول", "en": "Indian Ipecac / Country Sarsaparilla"}, "ben": {"ps": "په دودیز طب کې د بلغم لرې کولو، معدې ته ځواک، خولې راوړلو او د کانګو لپاره یاد شوی؛ د بهرني استعمال لپاره سور کوونکی او د تعفن ضد یادېږي.", "fa": "در طب سنتی برای دفع بلغم، تقویت معده، تعریق و ایجاد استفراغ یاد شده؛ در مصرف خارجی محمّر و ضدعفونی‌کننده است.", "ur": "روایتی طب میں بلغم کے اخراج، معدے کی تقویت، پسینہ لانے اور قے آور کے طور پر مذکور ہے؛ بیرونی استعمال میں محمّر اور ضد تعفن۔", "en": "Traditionally mentioned as an expectorant, stomach tonic, to induce sweating and vomiting; externally as a rubefacient and antiseptic."}, "use": {"ps": "دا بوټی د کانګې راوستلو اغېز لري؛ پخپله مه کاروئ. که دودیز استعمال ته اړتیا وي، یوازې د وړ طبیب تر څارنې لاندې. (دلته مقدار نه ورکول کېږي.)", "fa": "این گیاه اثر استفراغ‌آور دارد؛ خودسرانه مصرف نکنید. در صورت نیاز به مصرف سنتی، فقط زیر نظر طبیب مجرب. (مقدار در اینجا داده نمی‌شود.)", "ur": "اس بوٹی میں قے آور اثر ہے؛ خود استعمال نہ کریں۔ روایتی استعمال کی صورت میں صرف ماہر معالج کی نگرانی میں۔ (مقدار یہاں نہیں دی جاتی۔)", "en": "This plant is emetic; do not self-use. If traditional use is considered, only under a qualified practitioner. (No dosage is given here.)"}, "cau": {"ps": "پاملرنه: د کانګې راوړونکي اغېز له امله ډیر مقدار د سخت کانګو، د اوبو او مالګو د کمښت، او زهرجنتیا لامل کېدای شي. امیندواره، شیدې ورکوونکې، ماشومان او د زړه ناروغان دې مه کاروي. دا بوټی د Tylophora indica او Hemidesmus indicus (انډین ساپریلا) سره ګډېږي؛ پیژندنه یې یو پوه سړی تایید کړي.", "fa": "احتیاط: به دلیل اثر استفراغ‌آور، مقدار زیاد می‌تواند باعث استفراغ شدید، کم‌آبی و مسمومیت شود. بانوان باردار و شیرده، کودکان و بیماران قلبی استفاده نکنند. این گیاه با Tylophora indica و Hemidesmus indicus (سارسا پاریلای هندی) اشتباه گرفته می‌شود؛ شناسایی آن باید توسط متخصص تأیید شود.", "ur": "احتیاط: قے آور اثر کی وجہ سے زیادہ مقدار شدید قے، پانی کی کمی اور زہریلے اثرات کا باعث ہو سکتی ہے۔ حاملہ، دودھ پلانے والی خواتین، بچے اور دل کے مریض استعمال نہ کریں۔ یہ Tylophora indica اور Hemidesmus indicus (انڈین سارسا پریلا) سے خلط ملط ہوتی ہے؛ پہچان ماہر سے تصدیق کروائیں۔", "en": "Caution: being emetic, large amounts can cause severe vomiting, dehydration and toxicity. Not for pregnancy, breastfeeding, children or people with heart disease. This herb is confused with Tylophora indica and Hemidesmus indicus (Indian sarsaparilla); its identity should be confirmed by an expert."}},
{"s": "Echinops echinatus", "c": "#7a8a6a", "img": "", "gal": [], "nm": {"ps": "اونټ کټاره", "fa": "شترخار", "ur": "اونٹ کٹارا", "en": "Indian Globe Thistle"}, "ben": {"ps": "په دودیز طب کې د معدې ځواک، اشتها، هضم، د متیازو جریان، تبې او د بندونو درد لپاره یاد شوی؛ پاڼې یې د غدودو پړسوب کې په ضماد ډول یادېږي.", "fa": "در طب سنتی برای تقویت معده، اشتها، هضم، ادرار، تب و درد مفاصل یاد شده؛ برگ آن به صورت ضماد برای ورم غدد یاد شده است.", "ur": "روایتی طب میں معدے کی قوت، اشتہا، ہاضمے، پیشاب آوری، بخار اور جوڑوں کے درد کے لیے مذکور ہے؛ پتے غدود کی سوجن پر ضماد کے طور پر مذکور ہیں۔", "en": "Traditionally mentioned for stomach strength, appetite, digestion, urine flow, fever and joint pain; leaves as a poultice for swollen glands."}, "use": {"ps": "د ریښې پوستکی، تخم او پاڼې په دودیز طب کې کارېږي. د درملیز استعمال لپاره مقدار طبیب وټاکي. په ملاسته کې اغزي ځوروونکي دي، په احتیاط لاس ورکړئ.", "fa": "پوست ریشه، دانه و برگ در طب سنتی استفاده می‌شود. برای مصرف دارویی مقدار را پزشک تعیین کند. خارهای گیاه آزاردهنده است؛ با احتیاط لمس کنید.", "ur": "جڑ کی چھال، بیج اور پتے روایتی طب میں استعمال ہوتے ہیں۔ دوائی استعمال میں مقدار معالج طے کرے۔ اس کے کانٹے تکلیف دہ ہیں، احتیاط سے ہاتھ لگائیں۔", "en": "Root bark, seeds and leaves are used in traditional medicine. For medicinal use the dose should be set by a practitioner. The spines are sharp; handle with care."}, "cau": {"ps": "په دودیز طب کې د ډیر استعمال سره دماغ او پښتورګو ته زیانمن یادېږي. امیندواره مېرمنې، ماشومان او د پښتورګو ناروغان دې پخپله مه کاروي. په دودیز طب کې په ګرم مزاج خلکو کې احتیاط غواړي.", "fa": "در طب سنتی مصرف زیاد برای مغز و کلیه مضر یاد شده. بانوان باردار، کودکان و بیماران کلیه خودسرانه مصرف نکنند. در افراد گرم‌مزاج احتیاط لازم است.", "ur": "روایتی طب میں زیادہ استعمال دماغ اور گردوں کے لیے مضر مذکور ہے۔ حاملہ خواتین، بچے اور گردے کے مریض خود استعمال نہ کریں۔ گرم مزاج افراد میں احتیاط لازم ہے۔", "en": "Traditionally noted as harmful to the brain and kidneys in excess. Pregnant women, children and people with kidney disease should not self-use. Caution is advised for hot-temperament people."}},
{"s": "Mica / Talc (mineral)", "c": "#6a7a8a", "img": "", "poster": "", "nm": {"ps": "ابرک", "fa": "ابرک (ستاره زمین)", "ur": "ابرک", "en": "Mica (Abrak)"}, "ben": {"ps": "دا یو معدني توکی دی، نباتي بوټی نه دی. په دودیز طب کې د «کشته» (کلسین شوي) په بڼه د ټوخي، ساه لنډۍ او تبې لپاره یاد شوی.", "fa": "این یک ماده معدنی است، نه گیاه. در طب سنتی به صورت «کشته» (کلسینه) برای سرفه، تنگی نفس و تب یاد شده است.", "ur": "یہ ایک معدنی شے ہے، نباتی بوٹی نہیں۔ روایتی طب میں «کُشتہ» (کیلسائنڈ) کی صورت میں کھانسی، دمہ اور بخار کے لیے مذکور ہے۔", "en": "This is a mineral, not a plant. In traditional medicine it is mentioned in calcined «kushta» form for cough, shortness of breath and fever."}, "use": {"ps": "خام ابرک مه خورئ او کشته پخپله مه جوړوئ. که دودیز استعمال ته اړتیا وي، یوازې د باتجربه طبیب تر څارنې لاندې او د ازمول شوي سرچینې. (مقدار نه ورکول کېږي.)", "fa": "ابرک خام را نخورید و کشته را خودتان نسازید. در صورت نیاز به مصرف سنتی، فقط زیر نظر طبیب باتجربه و از منبع آزمایش‌شده. (مقدار داده نمی‌شود.)", "ur": "خام ابرک نہ کھائیں اور کُشتہ خود نہ بنائیں۔ روایتی استعمال کی صورت میں صرف تجربہ کار معالج کی نگرانی میں اور جانچ شدہ ذریعے سے۔ (مقدار نہیں دی جاتی۔)", "en": "Never eat raw mica or make kushta yourself. If traditional use is considered, only under an experienced practitioner and from a tested source. (No dosage is given.)"}, "cau": {"ps": "ډیر احتیاط: دودیز طب پخپله یې د پښتورګو لپاره زیانمن یادوي. د کشتو بازاري بڼو کې درنې فلزات (لکه سرب او پاره) موندل شوي. ماشومان، امیندواره او د پښتورګو ناروغان دې مه کاروي. د ټي بي، ذیابیطس یا لوړ فشار لپاره د ډاکټر درملنې بدل نه دی. د وچ ابرک/تالک غبار مه تنفس کوئ.", "fa": "احتیاط زیاد: خود طب سنتی آن را برای کلیه مضر می‌داند. در نمونه‌های بازاری کشته‌ها فلزات سنگین (مانند سرب و جیوه) یافت شده است. کودکان، باردار و بیماران کلیه استفاده نکنند. جایگزین درمان پزشکی سل، دیابت یا فشار خون بالا نیست. گرد ابرک/تالک را استنشاق نکنید.", "ur": "سخت احتیاط: روایتی طب خود اسے گردوں کے لیے مضر بتاتا ہے۔ بازاری کُشتوں میں بھاری دھاتیں (جیسے سیسہ اور پارہ) پائی گئی ہیں۔ بچے، حاملہ اور گردے کے مریض استعمال نہ کریں۔ ٹی بی، ذیابیطس یا بلند فشارِ خون کے ڈاکٹری علاج کا متبادل نہیں۔ ابرک/ٹالک کا باریک غبار سانس میں نہ لیں۔", "en": "Serious caution: traditional texts themselves call it harmful to the kidneys. Market kushtas have been found to contain heavy metals (such as lead and mercury). Not for children, pregnancy or kidney disease. Not a substitute for medical treatment of TB, diabetes or high blood pressure. Do not inhale mica/talc dust."}},
{"s": "Aloe vera", "c": "#4a9a5a", "img": "", "gal": [], "poster": "", "nm": {"ps": "ایلوا / صبر", "fa": "صبر (آلوئه‌ورا)", "ur": "ایلوا / صبر / کنوار گندل", "en": "Aloe vera"}, "ben": {"ps": "تازه جیل په دودیز طب کې د زخمونو او پوستکي لپاره یادېږي. «مصبر/ایلوا» (د پاڼو وچه تریخه شیره) د قبض لپاره یاد شوی؛ دا دوه بېل شیان دي.", "fa": "ژل تازه در طب سنتی برای زخم و پوست یاد شده. «مصبر/ایلوا» (شیره خشک و تلخ برگ) برای یبوست یاد شده؛ این دو یکی نیستند.", "ur": "تازہ جیل روایتی طب میں زخموں اور جلد کے لیے مذکور ہے۔ «مصبر/ایلوا» (پتوں کا خشک کڑوا رس) قبض کے لیے مذکور ہے؛ یہ دونوں الگ چیزیں ہیں۔", "en": "Fresh gel is traditionally mentioned for wounds and skin. «Musabbar/Aloes» (the dried bitter leaf juice) is mentioned for constipation; they are two different things."}, "use": {"ps": "تازه جیل (د پاڼې منځنۍ برخه) بهرنی کارېږي. زېړ تریخ شیره یا مصبر پخپله مه خورئ؛ مقدار طبیب وټاکي. که جیل خوړل کېږي، یوازې هغه محصول کاروئ چې د «ایلوین-پاک» (aloin-free) په نوم لیبل شوی وي.", "fa": "ژل تازه (قسمت میانی برگ) برای مصرف خارجی استفاده می‌شود. شیره زرد تلخ یا مصبر را خودسرانه نخورید؛ مقدار را پزشک تعیین کند. اگر ژل خوراکی مصرف می‌شود، فقط محصولی که «بدون آلوئین» برچسب دارد.", "ur": "تازہ جیل (پتے کا درمیانی حصہ) بیرونی استعمال کے لیے ہے۔ زرد کڑوا رس یا مصبر خود نہ کھائیں؛ مقدار معالج طے کرے۔ اگر جیل کھانا ہو تو صرف وہ مصنوعات جن پر «ایلوئن فری» لکھا ہو۔", "en": "Fresh gel (inner part of the leaf) is for external use. Do not take the yellow bitter juice or musabbar by yourself; the dose should be set by a practitioner. If drinking gel, use only products labelled aloin-free."}, "cau": {"ps": "مصبر/ایلوا ډیر تېز مسهل دی: د ګېډې درد، سخت اسهال او د مالګو کمښت راوړي. امیندواره (د حمل زیان)، شیدې ورکوونکې، ماشومان، د پښتورګو، کولمو سوزش او بواسیر ناروغان یې مه کاروي. د اوږدې مودې لپاره مه کاروئ. د زړه او د ادرار آورو درملو سره اړېکه لري، له طبیب سره مشوره وکړئ.", "fa": "مصبر/ایلوا مسهل قوی است: باعث دل‌درد، اسهال شدید و کمبود املاح می‌شود. بانوان باردار (خطر سقط)، شیرده، کودکان، بیماران کلیوی، التهاب روده و بواسیر استفاده نکنند. برای مدت طولانی مصرف نکنید. با داروهای قلبی و ادرارآور تداخل دارد؛ با پزشک مشورت کنید.", "ur": "مصبر/ایلوا تیز مسہل ہے: پیٹ درد، شدید اسہال اور نمکیات کی کمی کا سبب بنتا ہے۔ حاملہ (اسقاط کا خطرہ)، دودھ پلانے والی خواتین، بچے، گردے، آنتوں کی سوزش اور بواسیر کے مریض استعمال نہ کریں۔ طویل مدت تک استعمال نہ کریں۔ دل اور پیشاب آور ادویات سے تعامل رکھتا ہے؛ معالج سے مشورہ کریں۔", "en": "Musabbar/Aloes is a strong laxative: it can cause cramps, severe diarrhoea and electrolyte loss. Not for pregnancy (risk of miscarriage), breastfeeding, children, kidney disease, bowel inflammation or hemorrhoids. Do not use long term. It interacts with heart medicines and diuretics; consult a doctor."}},

X("Aristolochia indica / A. bracteata",{mzj:["گرم و خشک (در یک منبع «سرد» ذکر شده؛ برای تأیید به حکیم مراجعه کنید)","گرم و خشک (ایک ماخذ میں «سرد» مذکور ہے؛ تصدیق کے لیے حکیم سے رجوع کریں)","Garm wa khushk (one source says sard; consult a hakim to confirm)"],mhy:["گیاهی بوته‌ای که شاخه‌هایش روی زمین پخش می‌شود. گل آن سبزی‌مایل سفید با حاشیه سرخی‌مایل؛ دانه‌ها پهن و بالدار. ریشه خاکستری مایل به زرد، خوشبو (شبیه کافور) و تلخ‌مزه. در زمین‌های پست نپال، بنگلادش، بنگال و جنوب دکن می‌روید.","جھاڑی نما پودا جس کی شاخیں زمین پر پھیلتی ہیں۔ پھول سبزی مائل سفید اور کنارہ سرخی مائل؛ بیج چپٹے اور پردار۔ جڑ بھوری زردی مائل، کافور جیسی خوشبو والی اور ذائقہ تلخ۔ نیپال، بنگلہ دیش، بنگال اور جنوبی دکن کی نشیبی زمینوں میں پایا جاتا ہے۔","A shrubby climber whose branches spread along the ground. Flowers greenish-white with reddish margins; seeds flat and winged. Root yellowish-brown, camphor-like fragrance, bitter taste. Grows in lowlands of Nepal, Bangladesh, Bengal and southern Deccan."],khs:["در طب یونانی: مدر بول و مدر حیض؛ در آیورودا: محرک و مقوی.","یونانی طب میں: مدر بول و مدر حیض؛ آیوروید میں: محرک اور مقوی۔","In Unani medicine: mudir-e-bol and mudir-e-haiz; in Ayurveda: muharrik and muqawwi."],mzr:["حاوی اسید آریستولوشیک (مرتبط با آسیب کلیه و سرطان)؛ برای باردار شدیداً ممنوع.","ارسٹولوکک ایسڈ پر مشتمل (گردے کے نقصان اور کینسر سے منسلک)؛ حاملہ کے لیے سختی سے ممنوع۔","Contains aristolochic acid (linked to kidney damage and cancer); strictly forbidden in pregnancy."]});
X("Aconitum heterophyllum",{mzj:["در درجه دوم گرم و در درجه اول خشک","دوسرے درجے میں گرم اور پہلے درجے میں خشک","Garm in the second degree and khushk in the first degree"],mhy:["بوته‌ای یک تا سه فوت بلند؛ برگ‌ها نوک‌دار، گل‌ها سبز-زرد یا با خطوط بنفش. ریشه به اندازه انگشت کوچک، بیرون خاکی و درون شیری‌رنگ؛ مزه تلخ. در هیمالیا (کیدارناته، شیملا، چمبا) می‌روید؛ نوع سفید بهترین است.","ایک سے تین فٹ اونچا پودا؛ پتے نوکدار، پھول سبز زرد یا بنفشی لکیروں والے۔ جڑ چھنگلی کے برابر، باہر سے خاکی اور اندر سے دودھیا؛ ذائقہ تلخ۔ ہمالیہ (کیدارناتھ، شملہ، چمبہ) میں پایا جاتا ہے؛ سفید قسم بہترین ہے۔","A plant one to three feet tall; pointed leaves, green-yellow flowers or with violet streaks. Root about the size of a little finger, brownish outside and milky inside; bitter taste. Grows in the Himalayas (Kedarnath, Shimla, Chamba); the white type is best."],khs:["در طب سنتی به‌طور خاص برای تب و بیماری‌های کودکان یاد شده؛ دافع تب، مقوی.","روایتی طب میں خاص طور پر بخار اور بچوں کی بیماریوں کے لیے مذکور؛ دافع تب، مقوی۔","Mentioned in traditional medicine especially for fever and children's ailments; dafi-e-tab, muqawwi."],mzr:["از خانواده Aconitum؛ برخی گونه‌ها (مانند بچھناگ) بسیار سمی‌اند و خطر تقلب با بچھناگ وجود دارد.","Aconitum خاندان سے؛ بعض اقسام (جیسے بچھناگ) نہایت زہریلی ہیں اور بچھناگ سے ملاوٹ کا خطرہ ہے۔","From the Aconitum family; some species (e.g. Bachnag) are highly toxic, and there is a risk of adulteration with Bachnag."],msl:["مواد و اشیای سرد","سرد مواد اور اشیا","Cooling substances"]});
X("Hyoscyamus niger",{mzj:["سرد و خشک در درجه سوم","سرد و خشک تیسرے درجے میں","Sard wa khushk in the third degree"],mhy:["بوته‌ای بلندتر از کرفس؛ گل‌ها در رنگ‌های سفید، سرخ، سیاه یا زرد؛ دانه‌ها پهن و باریک؛ بوی تند و مزه تلخ. در خراسان، سند، بلوچستان، کشمیر، نیپال و شیملا می‌روید.","کرفس سے اونچا پودا؛ پھول سفید، سرخ، سیاہ یا زرد رنگوں کے؛ بیج چپٹے اور باریک؛ بو تیز اور ذائقہ تلخ۔ خراسان، سندھ، بلوچستان، کشمیر، نیپال اور شملہ میں پایا جاتا ہے۔","A plant taller than celery; flowers in white, red, black or yellow varieties; seeds flat and thin; sharp smell and bitter taste. Found in Khorasan, Sindh, Balochistan, Kashmir, Nepal and Shimla."],khs:["مسکن، مخدر، منوم، حابس، رادع.","Musakkin, mukhaddir, munawwim, habis, radi'."],mzr:["سمی (دارو درجه سوم)؛ برای مغز زیان‌آور. مقدار زیاد می‌تواند باعث سرگیجه، بی‌هوشی، جنون و مرگ شود.","زہریلی (تیسرے درجے کی دوا)؛ دماغ کے لیے نقصان دہ۔ زیادہ مقدار چکر، بے ہوشی، جنون اور موت کا سبب بن سکتی ہے۔","Toxic (a third-degree drug); harmful to the brain. A large dose can cause dizziness, unconsciousness, madness and death."],msl:["روغن حیوانی (گھی)، شیر، عسل","گھی، دودھ، شہد","Ghee, milk, honey"],bdl:["افیون و خشخاش","Opium and poppy"]});
X("Cymbopogon citratus / C. schoenanthus",{mzj:["گرم","Garm"],mhy:["گیاه معطر و خشک‌مانند که در زمین‌های شنی می‌روید؛ در شرق هند، مالابار و کوچین نیز یافت می‌شود؛ روغن آن در صابون و عطریات به کار می‌رود.","خوشبودار، خشک گھاس نما جھاڑی جو ریتیلی زمینوں میں اگتی ہے؛ مشرقی ہندوستان، مالابار اور کوچین میں بھی ملتی ہے؛ اس کا تیل صابن اور خوشبوؤں میں استعمال ہوتا ہے۔","An aromatic, dry grass-like shrub growing in sandy soils; also found in eastern India, Malabar and Cochin; its oil is used in soap and perfumes."],khs:["در طب سنتی نوشیدنی (چای) معطر برای هاضمه، معده و جریان ادرار/عادت ماهانه یاد شده.","روایتی طب میں خوشبودار مشروب (چائے) ہاضمے، معدے اور پیشاب/ماہواری کے اجرا کے لیے مذکور۔","In traditional medicine a fragrant drink (tea) mentioned for digestion, the stomach and urine/menstrual flow."],mzr:["بانوان باردار در مقدار دارویی مصرف نکنند.","حاملہ خواتین دوائی مقدار میں استعمال نہ کریں۔","Pregnant women should not use medicinal amounts."]});
X("Plantago ovata",{mzj:["سرد و تر، درجه دوم","سرد و تر، دوسرا درجہ","Sard wa tar, second degree"],mhy:["دانه‌های گیاهی که شکل گوش اسب، صورتی‌رنگ و لعاب‌دار است؛ پوسته آن سفید؛ دانه بی‌مزه. گیاه تا نیم گز بلند می‌شود؛ در پنجاب، سند، بلوچستان و هند در زمستان کاشته می‌شود.","پودے کے بیج جو گھوڑے کے کان کی شکل، گلابی رنگ اور لعاب دار ہوتے ہیں؛ چھلکا سفید؛ بیج بے ذائقہ۔ پودا آدھے گز تک بلند ہوتا ہے؛ پنجاب، سندھ، بلوچستان اور ہندوستان میں سردیوں میں کاشت ہوتا ہے۔","Seeds shaped like a horse's ear, pinkish and mucilaginous; the husk is white; seeds are tasteless. The plant grows up to half a yard; cultivated in winter in Punjab, Sindh, Balochistan and India."],khs:["ملین، مغذی، محلل، مسکن، تسکین‌دهنده حرارت و تشنگی، مدر بول.","ملین، مغذی، محلل، مسکن، حرارت اور پیاس کو تسکین دینے والا، مدر بول۔","Mulayyin, mughazzi, muhallil, musakkin, soothes heat and thirst, mudir-e-bol."],mzr:["برای مزاج بلغمی و دارندگان ضعف هاضمه زیان‌آور؛ بریان‌شده یبوست ایجاد می‌کند.","بلغمی مزاج اور کمزور ہاضمے والوں کے لیے نقصان دہ؛ بریاں کیا ہوا قبض پیدا کرتا ہے۔","Harmful for people of balghami mizaj and weak digestion; roasted (biryan) it causes constipation."],msl:["سکنجبین عسلی","Sikanjabin asali"],bdl:["بهیدانه","بہی دانہ","Behidana"]});
X("Apium graveolens",{mzj:["در درجه دوم گرم و خشک","دوسرے درجے میں گرم و خشک","Garm wa khushk in the second degree"],mhy:["یک تا سه فوت؛ برگ‌ها تقسیم‌شده، گل‌های ریز سفید در چتر؛ دانه‌ها شبیه انیسون؛ مزه شیرین-تلخ؛ بوی شبیه رازیانه. در پنجاب و بنگال می‌روید.","ایک سے تین فٹ؛ پتے کٹے ہوئے، چھوٹے سفید پھول چھتریوں میں؛ دانے سونف نما (انیسون جیسے)؛ ذائقہ میٹھا تلخ؛ خوشبو سونف جیسی۔ پنجاب اور بنگال میں اگتا ہے۔","One to three feet; divided leaves, small white flowers in umbels; seeds like anise; sweet-bitter taste; fennel-like smell. Grows in Punjab and Bengal."],khs:["محرک، کاسر ریاح، مدر بول و حیض، مفتح سده، معرق، مشتهی، قابض.","Muharrik, kasir-e-riyah, mudir-e-bol wa haiz, muftih-e-sudda, mu'arriq, mushtahi, qabiz."],mzr:["برای باردار، گرم‌مزاج و مبتلایان به صرع زیان‌آور.","حاملہ، گرم مزاج اور مرگی کے مریضوں کے لیے مضر۔","Harmful for pregnant women, people of garm mizaj and epilepsy patients."],msl:["انیسون، مصطکی","Anise, mastic"],bdl:["اجوائن خراسانی","Ajwain Khurasani"]});
X("Lavandula stoechas",{mzj:["در درجه دوم گرم و خشک","دوسرے درجے میں گرم و خشک","Garm wa khushk in the second degree"],mhy:["گیاهی شبیه ریحان وحشی؛ ساقه نیم متر؛ گل‌های بنفش در خوشه؛ بوی تند شبیه کافور و مزه تلخ. در کشمیر، هیمالیا، بوتان، اسپانیا و ایتالیا می‌روید.","جنگلی تلسی جیسا پودا؛ تنا آدھا میٹر؛ ارغوانی پھول خوشوں میں؛ کافور جیسی تیز بو اور تلخ ذائقہ۔ کشمیر، ہمالیہ، بھوٹان، ہسپانیہ اور اٹلی میں پایا جاتا ہے۔","A plant like wild basil; stem half a metre; purple flowers in spikes; sharp camphor-like smell and bitter taste. Found in Kashmir, the Himalayas, Bhutan, Spain and Italy."],khs:["مفرح، مقوی دماغ و اعصاب، کاسر ریاح، محلل، مفتح، جالی.","Mufarrih, muqawwi of brain and nerves, kasir-e-riyah, muhallil, muftih, jali."],mzr:["در افراد نازک‌طبع تهوع و بی‌قراری؛ برای کودکان زیان‌آور.","نازک طبیعت افراد میں متلی اور بے چینی؛ بچوں کے لیے مضر۔","Nausea and restlessness in delicate-natured people; harmful for children."],msl:["شربت لیمو، کتیرا، سکنجبین","لیموں کا شربت، کتیرا، سکنجبین","Lemon sharbat, tragacanth, sikanjabin"]});
X("Tamarindus indica",{mzj:["گوده: درجه اول سرد و درجه دوم خشک؛ مغز دانه: درجه سوم سرد و خشک","گودا: پہلے درجے میں سرد اور دوسرے میں خشک؛ گری: تیسرے درجے میں سرد و خشک","Pulp: sard in the first degree, khushk in the second; seed kernel: sard wa khushk in the third degree"],mhy:["درخت همیشه‌سبز بلند (۷۰–۷۵ فوت)؛ برگ‌ها جفتی؛ گل‌های سفید-زرد خوشبو. میوه در نیام‌هایی است که درون آن گوده و دانه است. وطن اصلی آن جنوب هند است.","سدا بہار اونچا درخت (۷۰ تا ۷۵ فٹ)؛ پتے جوڑوں میں؛ سفید زرد خوشبودار پھول۔ پھل پھلیوں میں ہوتا ہے جن کے اندر گودا اور بیج ہوتے ہیں۔ اصل وطن جنوبی ہندوستان ہے۔","A tall evergreen tree (70–75 ft); paired leaves; fragrant white-yellow flowers. The fruit grows in pods holding pulp and seeds. Native to southern India."],khs:["مسهل صفرا، مفرح، مسکن حرارت، ملین، مشتهی، دافع تشنگی.","مسہل صفرا، مفرح، مسکن حرارت، ملین، مشتہی، دافع تشنگی۔","Mushil of safra, mufarrih, musakkin of heat, mulayyin, mushtahi, dafi-e-tishnagi."],mzr:["بیماری گلو و اسهال ایجاد می‌کند.","گلے کی بیماری اور اسہال پیدا کرتی ہے۔","Causes throat ailments and diarrhoea."],msl:["شکر و عناب","شکر اور عناب","Sugar and jujube (unnab)"],bdl:["آلو بخارا و زیرشک","آلو بخارا اور زیرشک","Plum (alu bukhara) and zirishk"]});
X("Tylophora indica / Hemidesmus indicus (to be verified)",{mzj:["در درجه دوم گرم و خشک","دوسرے درجے میں گرم و خشک","Garm wa khushk in the second degree"],mhy:["گیاه پایا (همیشه‌سبز) با ریشه‌های درشت و دراز و ساقه‌های نازک پیچنده؛ گل‌های زرد با درون سرخ. در بنگلادش، جنوب هند و برزیل می‌روید.","سدا بہار پودا جس کی جڑیں بڑی اور لمبی اور تنے پتلے لپٹنے والے ہوتے ہیں؛ زرد پھول جن کا اندرونی حصہ سرخ۔ بنگلہ دیش، جنوبی ہندوستان اور برازیل میں پایا جاتا ہے۔","An evergreen plant with large long roots and slender twining stems; yellow flowers with a red centre. Found in Bangladesh, southern India and Brazil."],khs:["منفث (دفع‌کننده بلغم)، مقوی معده، مقی (قی‌آور)، معرق.","منفث (بلغم نکالنے والا)، مقوی معدہ، مقی (قے آور)، معرق۔","Munfith (expels phlegm), muqawwi of the stomach, muqayyi (emetic), mu'arriq."],mzr:["قی‌آور است؛ مقدار زیاد سمی است.","قے آور ہے؛ زیادہ مقدار زہریلی ہے۔","Emetic; large amounts are toxic."]});
X("Echinops echinatus",{mzj:["در درجه سوم گرم و خشک","تیسرے درجے میں گرم و خشک","Garm wa khushk in the third degree"],mhy:["بوته خاردار یک تا دو و نیم فوت؛ ریشه چهار تا شش اینچ؛ برگ‌ها دراز و زیر آن سفید پشمی؛ گل‌های سفید. شتر آن را با علاقه می‌خورد؛ در زمین‌های شنی پیدا می‌شود.","ایک سے ڈھائی فٹ کا کانٹے دار پودا؛ جڑیں چار سے چھ انچ؛ پتے لمبے اور نیچے سے سفید اونی؛ سفید پھول۔ اونٹ اسے شوق سے کھاتا ہے؛ ریتیلی زمینوں میں پایا جاتا ہے۔","A spiny plant one to two and a half feet tall; roots four to six inches; long leaves, woolly white beneath; white flowers. Camels eat it eagerly; found in sandy soils."],khs:["مقوی معده، محلل اورام بارد، مدر بول، ضد تب.","مقوی معدہ، محلل اورام بارد، مدر بول، ضد تب۔","Muqawwi of the stomach, muhallil of cold swellings (auram-e-barid), mudir-e-bol, anti-fever."],mzr:["مصرف زیاد به مغز و کلیه زیان می‌رساند.","زیادہ استعمال دماغ اور گردوں کو نقصان پہنچاتا ہے۔","Excess use harms the brain and kidneys."],msl:["شربت انگور","انگور کا شربت","Grape sharbat"],bdl:["انجدان (حلتیت)","Anjudan (hiltit)"]});
X("Mica / Talc (mineral)",{mzj:["سرد و خشک، درجه دوم","سرد و خشک، دوسرا درجہ","Sard wa khushk, second degree"],mhy:["ماده معدنی؛ لایه‌لایه، براق، سیاه یا سفید؛ بی‌مزه؛ به‌آسانی می‌شکند.","معدنی شے؛ تہ در تہ، چمکدار، سیاہ یا سفید؛ بے ذائقہ؛ آسانی سے ٹوٹ جاتی ہے۔","A mineral substance; layered, shiny, black or white; tasteless; breaks easily."],khs:["قابض، مجفف، حابس الدم.","Qabiz, mujaffif, habis ul-dam."],mzr:["برای کلیه زیان‌آور.","گردوں کے لیے نقصان دہ۔","Harmful to the kidneys."],msl:["تخم کرفس","کرفس کا بیج","Celery seed"],bdl:["گل قیمولیا","Gul qimoliya"]});

function homePage(){
 var T=t(), u=ui[lang], a=regionText[lang], labels=homeLabels[lang];

 var plant=H.find(function(p){return p.taj?.[0]==="T034"});
 return '<header class="hdr brand">'+appEmblem()+'<div><h1>'+T.title+'</h1><p>'+T.tag+'</p></div><button class="signin" onclick="go(\'about\')">'+ic("info")+'<span>'+((window.ABOUT&&ABOUT[lang])?ABOUT[lang].title:"")+'</span></button></header>'+
 '<div class="search-row"><form class="search" onsubmit="event.preventDefault();go(\'lib\',this.elements.hs.value)"><button class="search-go" aria-label="'+T.ph+'">'+ic("search")+'</button><input name="hs" id="hs" type="search" value="'+esc(homeQuery)+'" oninput="homeQuery=this.value" aria-label="'+T.ph+'" placeholder="'+T.ph+'"></form><button class="photo-shortcut" onclick="go(\'id\')" aria-label="'+labels[1]+'">'+ic("cam")+'<span>'+labels[1]+'</span><em class="soon">'+((window.SOON||{})[lang]||"")+'</em></button></div>'+
 '<button class="library-hero" onclick="go(\'lib\')"><span><strong>'+T.lib+'</strong><span class="library-cta">'+labels[0]+'</span></span><span class="library-cover" style="'+bg(plant)+'"></span></button>'+
 '<h2 class="home-title">'+u.sections+'</h2><div class="grid">'+tiles.map(function(x){
 return '<button class="tile" onclick="go(\''+x[0]+'\')">'+ic(x[1])+'<span>'+x[2]+'</span></button>';
 }).join("")+'</div>'+discoveryCards();
}

  .replace(/[^\p{L}\p{N}]/gu,"");

کے ضماد کے لیے گلے کے نیچے کی غدود کا بیان ہے۔ جالینوس کی نقل میں اخروٹ اور بادام کے ساتھ بعض زہروں سے حفاظت کا دعویٰ اور بخار میں پیاس نہ بڑھانے کی نسبت ہے۔ اخروٹ کے ساتھ قوت باہ کی نسبت بھی درج ہے۔ منسوب مذہبی روایت میں بواسیر اور نقرس کے فائدے کا ذکر بھی اسی کتاب کی نقل کا حصہ ہے۔ مصنف دماغی کمزوری اور بخار کے ضمن میں بھی انجیر کا ذکر کرتا ہے۔ پتوں کا ذکر پھوڑے پکانے کے ضمن میں بھی ہے۔", "طبی فارماکوپیا اور حکیم کبیرالدین سے منسوب حوالوں میں جگر، معدے اور آنتوں کو ممکنہ ضرر اور رکاوٹ کا ذکر ہے۔ صفحہ ۵ پر مصنف اس رائے سے اختلاف کرتے ہوئے اپنے تجربے اور تحقیق کا حوالہ دیتا ہے۔", "سکنجبین، شربت ترنج، انیسون، صعتر فارسی اور میٹھا بادام بطور مصلح درج ہیں۔", "مویز منقّی اور مغز چلغوزہ بطور بدل درج ہیں۔"], "en": ["According to Taj al-Mufradat, Khazain al-Adwiya regards fresh and wild figs as temperate. In Ilm al-Adwiya Nafisi, Hakim Kabiruddin describes fresh figs as slightly warm on account of their sweetness and more moist on account of their water content. Makhzan al-Adwiya describes them as warm in the first degree and moist in the second. The medical pharmacopoeia calls them warm and moist without specifying degrees. The book describes dried figs as warm and subtle.", "The book describes fig trees as about six, ten or twelve feet tall and distinguishes wild from cultivated trees. The leaves are large and rough, and parts of the tree exude latex. The book mentions two fruitings a year and names March, April, May and June. The round fruit has soft, sweet flesh and small seeds. Unripe fruit is green and firm. As it ripens it softens and may become reddish, brown or purple.", "The book calls the fig nutritious and easy to digest. In Unani terms it is described as cleansing, expectorant, diuretic, softening, diaphoretic, strengthening and dispersing swellings. Separate effects are ascribed to dried figs, the sweetness of the fruit and the latex. The author distinguishes thirst in people of warm temperament from thirst attributed to phlegm. The text records traditional views concerning chronic productive cough, obstructions of the liver and spleen, and the kidneys and bladder. Its list of particular benefits mentions constipation, cough, breathlessness, hemorrhoids, gout, hardening and swelling of the spleen, and complexion. These are historical attributions. In the book's terminology the sweetness is maturative, and dried figs are warm and subtle. The author also mentions providing abundant nourishment and quick satiety, a claim of producing good-quality blood, thirst in warm temperaments, and thinning phlegm in thirst attributed to phlegm. Fig latex is historically credited with dissolving clotted blood and curdled milk.", "The book records traditional uses for throat irritation and constipation. Examples include eating figs with walnuts, almonds or pistachios, making a decoction with sa'tar, and using figs in gargles, poultices and medicinal pastes. It also records historical uses concerning the spleen, uterus, anus, skin, hemorrhoids and eruptions associated with fever. The closing pages mention dried-fig ash in relation to teeth and fresh fig latex applied to warts. The book also records quantities and the author's experience. This section documents historical practice. The book mentions fig latex in its discussion of blood coagulation. It also records historical attributions concerning obstructions of the liver and spleen, kidney and bladder stones, use with sikanjabin for splenic swelling, ripe-fig poultices, and steam for anal swelling and pain. In discussing the skin it names bars, chanbal and kalaf. A quotation attributed to Hakim Ram mentions figs with sa'tar in connection with phlegm and figs with almonds or pistachios in connection with memory and the brain. Quotations from Ibn al-Qayyim and Galen separately discuss combinations with walnuts and almonds, inflammation of the chest and lungs, urination, and the kidneys and bladder. The discussion of constipation attributed to phlegm mentions water-soaked figs and also connects this with gout. Ripe-fruit poultices are mentioned in relation to glands beneath the throat. A quotation from Galen claims protection against certain poisons when figs are combined with walnuts and almonds, and also attributes to figs an absence of increased thirst during fever. A claim concerning sexual vigor with walnuts is recorded. The attributed religious report also mentions benefits for hemorrhoids and gout as part of the book's account. The author further discusses figs in connection with weakness of the brain and fever. The leaves are also mentioned in connection with ripening boils.", "Passages attributed to the medical pharmacopoeia and Hakim Kabiruddin mention possible harm to the liver, stomach and intestines and refer to obstruction. On page 5 the author disagrees and refers to his own experience and research.", "The book lists sikanjabin, citron syrup, anise, Persian sa'tar and sweet almonds as correctives.", "The book lists cleaned raisins (mawiz munaqqa) and chilgoza pine kernels as substitutes."], "fa": ["به نقل از تاج المفردات، خزائن‌الادویه انجیر تازه و خودرو را معتدل می‌داند. حکیم کبیرالدین در علم‌الادویه نفیسی، انجیر تازه را به سبب شیرینی اندکی گرم و به سبب آب فراوان ترتر می‌داند. مخزن‌الادویه آن را در درجۀ اول گرم و در درجۀ دوم تر می‌خواند. فارماکوپیای طبی تنها گرم و تر گفته است. انجیر خشک در کتاب گرم و لطیف دانسته شده است.", "کتاب بلندی درخت انجیر را حدود شش، ده یا دوازده فوت ذکر می‌کند و میان نوع خودرو و پرورشی فرق می‌گذارد. برگ‌ها بزرگ و زبر اند و از بخش‌های درخت شیرابه بیرون می‌شود. کتاب از دو بار میوه‌دهی در سال و ماه‌های مارچ، اپریل، می و جون یاد می‌کند. میوۀ گرد گوشت نرم و شیرین و دانه‌های ریز دارد. میوۀ نارس سبز و سفت است و با رسیدن نرم می‌شود و ممکن است رنگ سرخ‌فام، قهوه‌ای یا ارغوانی بگیرد.", "کتاب انجیر را مغذی و زودهضم می‌داند. در اصطلاح طب یونانی، آن را پاک‌کننده، خلط‌آور، ادرارآور، نرم‌کننده، عرق‌آور، مقوی و تحلیل‌برندۀ ورم می‌خواند. برای انجیر خشک، شیرینی میوه و شیرابۀ درخت اثرهای جداگانه ذکر می‌کند. میان تشنگی گرم‌مزاجان و تشنگی منسوب به بلغم فرق می‌گذارد و دیدگاه‌های سنتی دربارۀ سرفۀ بلغمی مزمن، گرفتگی جگر و طحال، گرده‌ها و مثانه می‌آورد. در شمار فواید خاص، از قبضیت، سرفه، نفس‌تنگی، بواسیر، نقرس، سختی و ورم طحال و رنگ پوست یاد می‌کند. این‌ها نسبت‌های تاریخی کتاب اند. در اصطلاح کتاب، شیرینی انجیر منضج و انجیر خشک گرم و لطیف دانسته شده است. مؤلف از غذای فراوان و زود سیرشدن، ادعای ساختن خون خوب، تشنگی گرم‌مزاجان و رقیق‌شدن بلغم در تشنگی بلغمی نیز سخن می‌گوید. برای شیرابۀ انجیر نسبت تاریخی حل‌کردن خون لخته‌شده و شیر بسته‌شده آمده است.", "کتاب برای خشونت گلو و قبضیت کاربردهای سنتی یاد می‌کند. خوردن با چهارمغز، بادام یا پسته، جوشانده با صعتر، غرغره، ضماد و افزودن به معجون از نمونه‌های آن اند. کاربردهای قدیم مربوط به طحال، رحم، مقعد، پوست، بواسیر و دانه‌های ناشی از تب نیز آمده‌اند. در پایان از خاکستر انجیر خشک برای دندان و شیرابۀ میوۀ تازه بر زگیل یاد می‌کند. مقدارها و تجربه‌های مؤلف نیز در کتاب آمده‌اند. این بخش گزارش کاربردهای تاریخی است. کتاب شیرابۀ انجیر را در بحث لخته‌شدن خون یاد می‌کند. همچنین نسبت‌های تاریخی مربوط به گرفتگی جگر و طحال، سنگ گرده و مثانه، استعمال با سکنجبین برای ورم طحال، ضماد انجیر رسیده و بخار برای ورم و درد مقعد را ثبت می‌کند. در بحث پوست، برص، چنبل و کلف را نام می‌برد. در نقل حکیم رام، انجیر با صعتر دربارۀ بلغم و با بادام یا پسته دربارۀ حافظه و دماغ آمده است. در نقل‌های ابن‌قیم و جالینوس از ترکیب با چهارمغز و بادام، التهاب سینه و شش‌ها، ادرار و گرده و مثانه جداگانه یاد شده است. در بحث قبضیت بلغمی، انجیر ترشده در آب و پیوند آن با نقرس ذکر شده است. برای ضماد میوۀ رسیده از غده‌های زیر گلو یاد می‌شود. در نقل جالینوس، با چهارمغز و بادام ادعای حفاظت در برابر بعضی زهرها و افزایش‌ندادن تشنگی هنگام تب آمده است. با چهارمغز نسبت تقویت باه نیز ثبت است. در روایت دینی منسوب، ذکر فایدۀ بواسیر و نقرس هم بخشی از نقل کتاب است. مؤلف دربارۀ ضعف دماغ و تب نیز از انجیر یاد می‌کند. برگ‌ها در بحث پخته‌شدن دمل نیز ذکر شده‌اند.", "در نقل‌های منسوب به فارماکوپیای طبی و حکیم کبیرالدین، از زیان احتمالی به جگر، معده و روده‌ها و نیز گرفتگی یاد شده است. مؤلف در صفحۀ پنجم با این نظر مخالفت می‌کند و به تجربه و پژوهش خود اشاره دارد.", "سکنجبین، شربت ترنج، انیسون، صعتر فارسی و بادام شیرین در کتاب به‌عنوان مصلح ذکر شده‌اند.", "مویز منقّی و مغز جلغوزه در کتاب به‌عنوان بدل ذکر شده‌اند."], "ar": ["ينقل تاج المفردات عن خزائن الأدوية أن التين الطازج والبري معتدل المزاج. ويصف الحكيم كبير الدين في علم الأدوية النفيسي التين الطازج بأنه مائل إلى الحرارة لحلاوته وإلى الرطوبة لكثرة مائه. ويعدّه مخزن الأدوية حارًا في الدرجة الأولى ورطبًا في الثانية. ويصفه دستور الأدوية الطبي بأنه حار رطب دون تحديد درجة. أما التين المجفف فيصفه الكتاب بأنه حار لطيف.", "يذكر الكتاب أن ارتفاع شجرة التين نحو ست أو عشر أو اثنتي عشرة قدمًا، ويميّز بين البري والمزروع. أوراقها كبيرة خشنة، وتفرز بعض أجزائها عصارة لبنية. ويذكر الكتاب الإثمار مرتين في السنة، ويورد أشهر مارس وأبريل ومايو ويونيو. والثمرة مستديرة ذات لب لين حلو وبذور صغيرة. تكون خضراء صلبة قبل النضج، ثم تلين وقد يصير لونها محمرًا أو بنيًا أو أرجوانيًا.", "يصف الكتاب التين بأنه مغذٍّ سهل الهضم، وينسب إليه في اصطلاح الطب اليوناني الجلاء وإخراج البلغم وإدرار البول والتليين والتعريق والتقوية وتحليل الورم. ويميّز بين الآثار المنسوبة إلى التين المجفف وحلاوة الثمرة والعصارة اللبنية. ويفرّق بين عطش أصحاب المزاج الحار والعطش المنسوب إلى البلغم. ويورد آراء تقليدية عن السعال البلغمي المزمن وسدد الكبد والطحال والكليتين والمثانة. ويذكر ضمن المنافع الخاصة الإمساك والسعال وضيق النفس والبواسير والنقرس وتصلّب الطحال وتورّمه ولون البشرة. وهذه أوصاف تاريخية من الكتاب. في اصطلاح الكتاب تُعدّ حلاوة التين منضجة، والتين المجفف حارًا لطيفًا. ويذكر المؤلف كثرة الغذاء وسرعة الشبع، وادعاء توليد دم جيد، وعطش أصحاب المزاج الحار وترقيق البلغم في العطش المنسوب إليه. وينسب تاريخيًا إلى العصارة اللبنية إذابة الدم المتخثر واللبن المتجبن.", "يورد الكتاب استعمالات تقليدية لخشونة الحلق والإمساك، منها تناول التين مع الجوز أو اللوز أو الفستق، وذكر مغليه مع الصعتر، والغرغرة والضماد وإدخاله في المعاجين. ويسجل أيضًا استعمالات قديمة تتعلق بالطحال والرحم والشرج والجلد والبواسير والبثور المصاحبة للحمّى. ويذكر في آخر المدخل رماد التين المجفف للأسنان والعصارة اللبنية للثمرة الطازجة للثآليل. ويتناول الكتاب المقادير وتجارب المؤلف كذلك. وترد هذه المواد في سياق توثيق الممارسة التاريخية. يذكر الكتاب عصارة التين اللبنية في مناقشة تخثّر الدم، ويسجل نسبًا تاريخية عن سدد الكبد والطحال وحصى الكلى والمثانة، واستعماله مع السكنجبين لورم الطحال، وضماد الثمر الناضج والبخار لورم الشرج وألمه. ويسمّي في مباحث الجلد البرص والچنبل والكلف. وفي نقل عن الحكيم رام يذكر التين مع الصعتر في سياق البلغم ومع اللوز أو الفستق في سياق الذاكرة والدماغ. وتتناول نقول ابن القيم وجالينوس التين مع الجوز واللوز، والتهاب الصدر والرئتين، والبول والكلى والمثانة. يذكر بحث الإمساك المنسوب إلى البلغم التين المنقوع في الماء ويربط ذلك بالنقرس أيضًا. ويذكر ضماد الثمر الناضج للغدد تحت الحلق. وفي نقل عن جالينوس دعوى الوقاية من بعض السموم عند الجمع مع الجوز واللوز، وعدم زيادة العطش أثناء الحمى. وترد مع الجوز دعوى تقوية الباه. كما يرد ذكر البواسير والنقرس في الرواية الدينية المنسوبة ضمن نقل الكتاب. ويناقش المؤلف التين أيضًا في سياق ضعف الدماغ والحمى. وترد الأوراق أيضًا في بحث إنضاج الدمامل.", "تذكر النقول المنسوبة إلى دستور الأدوية الطبي والحكيم كبير الدين ضررًا محتملاً للكبد والمعدة والأمعاء، وتشير إلى السدد. ويخالف المؤلف هذا الرأي في الصفحة الخامسة مستندًا إلى تجربته وبحثه.", "يذكر الكتاب السكنجبين وشراب الأترج والأنيسون والصعتر الفارسي واللوز الحلو بوصفها مصلحات.", "يذكر الكتاب الزبيب المنقّى ولب حب الصنوبر الجلغوزي بوصفهما بديلين."]};

 یا ۷ دانے اور کئی ماہ کا دورانیہ مذکور ہے۔ یہ کتاب میں درج تاریخی مقداریں ہیں۔ انجیر کے ساتھ دودھ ابالنے پر چھوٹے ٹکڑے بننے اور معدے میں نفخ اور آنتوں میں رکاوٹ کی نسبت بھی درج ہے۔  بواسیر کی مدت کے ضمن میں مصنف ۴–۶ ماہ اور انجیر کے بعد دوگنا دودھ لکھتا ہے۔ کھانسی کی ذاتی روایت میں ۲–۳ انجیر اور دن یا رات کے کھانے سے کچھ پہلے یا بعد لینے کا ذکر ہے۔ یہ مصنف کی تاریخی روایت ہے۔"], ["مطبوعہ نام اور خاندان · صفحہ ۱", "سرخی میں لاطینی نام Gacus Carica چھپا ہے، جبکہ دوسرے ناموں کی سطر میں Ficus Carica ہے۔ خاندان Urticaceae درج ہے۔ ایپ کی علمی خانے میں Ficus carica L. اور Moraceae استعمال ہوئے ہیں۔ یہ طباعت سے مختلف ہیں  Kew Plants of the World Online کے مطابق Ficus carica L. مستند نام اور Moraceae خاندان ہے۔"]], "en": [["Origin and cultivation · p. 1", "The book identifies Smyrna in Asia Minor as a possible place of origin. It mentions widespread cultivation in Afghanistan, Iran, Balochistan, Africa, Turkey, Spain and Portugal, and commercial cultivation in Arab regions, Iran, China and Japan. The author says cultivation in the Indian subcontinent does not meet demand and recounts a tradition that physicians from Iran and Arab lands introduced the fig there. Cuttings are taken from mid-February to early March and planted at intervals. The trees bear fruit after two or three years. The book specifies three feet between cuttings. It prints the first fruiting period as mid-May to early June and the second as mid-March to early April. This ordering is retained from the source."], ["Mentions in religious texts · p. 3", "The book quotes the first four verses of Surah al-Tin. They invoke the fig, the olive, Mount Sinai and the secure city, and speak of humanity being created in the best form. It then recounts a report attributed to Abu al-Darda about a dish of figs, eating the fruit and comparing it to a fruit of Paradise. The author counts 49 mentions in biblical texts. In the example from Judges the trees ask the fig to rule, and it is unwilling to give up its sweet fruit. The example from the Song of Songs mentions ripening figs and the fragrance of the vines."], ["Earlier authors · pp. 3–4", "As quoted in the book, Ibn al-Qayyim says figs were uncommon in the Hijaz and Medina, dates were common, and white figs were the preferred variety. The book records his comments and those of Galen as historical medical views. Uses concerning specific conditions appear in the relevant sections above."], ["Nutritional composition and the author's discussion · p. 4", "The table per 100 grams lists protein, starch, energy, sodium, potassium, calcium, magnesium, iron, copper, phosphorus, sulfur and chlorine. It also mentions vitamins A and C. The following discussion mentions sugar and vitamins B and D and cites the composition in describing figs as nutritious. The author's clinical observations relate to the uses discussed above."], ["Historical drying method and period of activity · p. 5", "The fruit is left on the tree until ripe and until it falls. The author says it is then about three-quarters dry. The book describes baskets, moist sulfur fumes, sun-drying in wooden baskets, turning the fruit, flattening it before it dries completely and dipping it in a salt solution. According to the author the last step preserves softness and flavor. The entry ends by giving a period of activity of two years. The book gives 20–30 minutes for exposure to moist sulfur fumes and 5–7 days for sun-drying. The fruit is slightly flattened before the salt-solution step."], ["The author's experience and quantities · pp. 4–5", "In discussing constipation the author cites a pharmacopoeial quantity of 2–3 fruits and records his own experience with 4–5 dried figs. His personal account concerning hemorrhoids mentions 3, 5 or 7 fruits over several months. These are historical quantities recorded in the book. The text also describes milk forming small pieces when boiled with figs and attributes bloating and intestinal obstruction to this.  In the hemorrhoid account the author gives a duration of 4–6 months and mentions twice the quantity of milk after the figs. His personal cough account mentions 2–3 figs and taking them shortly before or after the daytime or evening meal. These are the author's historical observations."], ["Printed name and family · p. 1", "The heading prints the Latin name as Gacus Carica, while the other-names line reads Ficus Carica. The source gives the family as Urticaceae. The app's scientific field uses Ficus carica L. and Moraceae. These differ from the printed information  Kew Plants of the World Online accepts Ficus carica L. in Moraceae."]], "fa": [["خاستگاه و کشت · صفحۀ ۱", "کتاب سمیرنا در آسیای صغیر را خاستگاه احتمالی انجیر می‌داند. از کشت گسترده در افغانستان، ایران، بلوچستان، افریقا، ترکیه، اسپانیا و پرتگال و کشت تجارتی در مناطق عربی، ایران، چین و جاپان یاد می‌کند. به گفتۀ مؤلف، کشت در نیم‌قارۀ هند پاسخگوی نیاز مردم نیست و در روایت او، طبیبان ایرانی و عرب انجیر را به آن‌جا برده‌اند. وقت گرفتن قلمه را از نیمۀ فبروری تا آغاز مارچ می‌داند. قلمه‌ها با فاصله کشت می‌شوند و درخت پس از دو یا سه سال میوه می‌دهد. فاصلۀ قلمه‌ها سه فوت ذکر شده است. وقت میوۀ اول از میانۀ می تا آغاز جون و برای میوۀ دوم از میانۀ مارچ تا آغاز اپریل چاپ شده است. این ترتیب مطابق متن کتاب حفظ شده است."], ["یادکرد در متن‌های دینی · صفحۀ ۳", "کتاب چهار آیۀ نخست سورۀ تین را می‌آورد. در آن آیه‌ها به انجیر، زیتون، طور سینا و شهر امن سوگند یاد می‌شود و از آفرینش انسان به بهترین صورت سخن می‌رود. سپس روایتی منسوب به ابوالدرداء را دربارۀ ظرفی از انجیر، خوردن آن و همانند دانستن آن با میوۀ بهشت نقل می‌کند. مؤلف ۴۹ یادکرد در تورات و انجیل برمی‌شمارد. در نمونۀ سفر داوران، درختان از انجیر می‌خواهند فرمان‌روایی کند و انجیر حاضر به رها کردن میوۀ شیرین خود نمی‌شود. در نمونۀ غزل غزل‌ها از رسیدن انجیر و خوش‌بویی تاک‌ها یاد می‌شود."], ["دیدگاه‌های نویسندگان پیشین · صفحه‌های ۳–۴", "به نقل کتاب، ابن‌قیم می‌گوید انجیر در حجاز و مدینه رایج نبود، خرما میوۀ معمول بود و انجیر سفید را نوع برتر می‌دانست. مؤلف دیدگاه‌های او و جالینوس را به‌عنوان دیدگاه‌های طبی تاریخی ثبت می‌کند. مطالب مربوط به بیماری‌ها و کاربردها در بخش‌های بالا آمده‌اند."], ["ترکیب غذایی و بحث مؤلف · صفحۀ ۴", "جدول در هر صد گرام، پروتین، نشایسته، انرژی، سودیم، پوتاشیم، کلسیم، مگنیزیم، آهن، مس، فاسفورس، گوگرد و کلورین را ذکر می‌کند. ویتامین‌های A و C نیز در جدول آمده‌اند. مؤلف در بحث بعدی به قند و ویتامین‌های B و D اشاره می‌کند و با استناد به ترکیب آن، انجیر را میوۀ مغذی می‌داند. تجربه‌های طبی مؤلف در بخش کاربردها مطرح شده‌اند."], ["روش تاریخی خشک‌کردن و مدت اثر · صفحۀ ۵", "میوه تا رسیدن و افتادن از درخت روی درخت می‌ماند. به گفتۀ مؤلف، در آن هنگام حدود سه‌چهارم خشک شده است. کتاب از سبد، دود مرطوب گوگرد، خشک‌کردن در آفتاب در سبدهای چوبی، پشت‌ورو کردن میوه‌ها، پهن کردن آن‌ها پیش از خشک‌شدن کامل و فروبردن در محلول نمک یاد می‌کند. مؤلف گام آخر را برای حفظ نرمی و مزه می‌داند. در پایان، مدت اثر را دو سال ذکر می‌کند. برای دود مرطوب گوگرد ۲۰–۳۰ دقیقه و برای خشک‌کردن در آفتاب ۵–۷ روز ذکر شده است. میوه پیش از مرحلۀ محلول نمک کمی پهن می‌شود."], ["تجربۀ مؤلف و بحث مقدار · صفحه‌های ۴–۵", "مؤلف در بحث قبضیت، مقدار ۲–۳ دانه در فارماکوپیا و تجربۀ خود با ۴–۵ انجیر خشک را ذکر می‌کند. در روایت شخصی بواسیر، ۳، ۵ یا ۷ دانه و مدت چند ماه آمده است. این‌ها مقدارهای تاریخی ثبت‌شده در کتاب اند. کتاب از تکه‌تکه شدن شیر هنگام جوشاندن با انجیر و نسبت‌دادن نفخ معده و گرفتگی روده‌ها به آن یاد می‌کند.  مؤلف در روایت بواسیر مدت ۴–۶ ماه و پس از انجیر دو برابر آن شیر را ذکر می‌کند. در روایت شخصی سرفه، ۲–۳ انجیر و زمانی کمی پیش یا پس از غذای روز یا شب آمده است. این‌ها روایت‌های تاریخی مؤلف اند."], ["نام و خانوادۀ چاپ‌شده · صفحۀ ۱", "در عنوان، نام لاتینی Gacus Carica چاپ شده، ولی در سطر نام‌های دیگر Ficus Carica آمده است. منبع خانواده را Urticaceae نوشته است. در خانۀ علمی ایپ Ficus carica L. و Moraceae به کار رفته‌اند. این‌ها با چاپ تفاوت دارند  بر بنیاد Plants of the World Online کیو، Ficus carica L. نام پذیرفته‌شده و Moraceae خانوادۀ آن است."]], "ar": [["الموطن والزراعة · ص ١", "يذكر الكتاب سميرنا في آسيا الصغرى موطنًا محتملاً للتين، ويشير إلى انتشاره في أفغانستان وإيران وبلوشستان وأفريقيا وتركيا وإسبانيا والبرتغال، وإلى زراعته تجاريًا في البلاد العربية وإيران والصين واليابان. ويرى المؤلف أن زراعته في شبه القارة الهندية لا تكفي الطلب المحلي، وينقل رواية مفادها أن أطباء من إيران والبلاد العربية أدخلوه إليها. ويذكر أخذ العقل بين منتصف فبراير وأوائل مارس وغرسها متباعدة وإثمار الشجر بعد سنتين أو ثلاث. يذكر الكتاب مسافة ثلاث أقدام بين العقل. ويطبع موعد الإثمار الأول من منتصف مايو إلى أوائل يونيو، والثاني من منتصف مارس إلى أوائل أبريل. حُفظ هذا الترتيب من المصدر."], ["ذكره في النصوص الدينية · ص ٣", "يورد الكتاب الآيات الأربع الأولى من سورة التين بما فيها القسم بالتين والزيتون وطور سيناء والبلد الأمين وذكر خلق الإنسان في أحسن تقويم. ثم ينقل رواية منسوبة إلى أبي الدرداء عن طبق من التين وأكل الثمرة وتشبيهها بثمر الجنة. ويحصي المؤلف ٤٩ إشارة إلى التين في النصوص الكتابية. وفي المثال من سفر القضاة تطلب الأشجار من التين أن يحكمها فلا يرغب في ترك ثمره الحلو. وفي المثال من نشيد الأنشاد يرد نضج التين وطيب رائحة الكروم."], ["أقوال المؤلفين القدماء · ص ٣–٤", "ينقل الكتاب عن ابن القيم أن التين لم يكن شائعًا في الحجاز والمدينة، وأن التمر كان الفاكهة الشائعة، وأنه فضّل التين الأبيض. وينقل أقواله وأقوال جالينوس ضمن الآراء الطبية التاريخية. وترد المسائل الخاصة بالأمراض والاستعمال في مواضعها أعلاه."], ["التركيب الغذائي ومناقشة المؤلف · ص ٤", "يذكر الجدول لكل مئة غرام البروتين والنشا والطاقة والصوديوم والبوتاسيوم والكالسيوم والمغنيسيوم والحديد والنحاس والفوسفور والكبريت والكلور، وكذلك فيتاميني أ وج. ويذكر المؤلف في المناقشة التالية السكر وفيتاميني ب ود، ويستند إلى هذا التركيب في وصف التين بأنه مغذٍّ. وتندرج ملاحظاته الطبية في مباحث الاستعمال."], ["طريقة التجفيف التاريخية ومدة الأثر · ص ٥", "تُترك الثمرة على الشجرة حتى تنضج وتسقط. ويقول المؤلف إنها تكون حينها قد جفّت نحو ثلاثة أرباعها. ويذكر السلال وأبخرة الكبريت الرطبة والتجفيف في الشمس في سلال خشبية وتقليب الثمار وتفليطحها قبل تمام جفافها وغمرها في محلول ملحي. ويعزو المؤلف إلى الخطوة الأخيرة حفظ الليونة والطعم. ويختتم المدخل بذكر مدة أثر قدرها سنتان. يذكر الكتاب ٢٠–٣٠ دقيقة لأبخرة الكبريت الرطبة و٥–٧ أيام للتجفيف الشمسي، وتُفلطح الثمرة قليلاً قبل مرحلة المحلول الملحي."], ["تجربة المؤلف ومناقشة المقادير · ص ٤–٥", "يذكر المؤلف في بحث الإمساك مقدار ٢–٣ ثمرات منقولاً عن دستور الأدوية، ثم تجربته مع ٤–٥ ثمرات مجففة. وفي روايته الشخصية عن البواسير يذكر ٣ أو ٥ أو ٧ ثمرات على مدى عدة أشهر. وهذه مقادير تاريخية واردة في الكتاب. ويذكر تكتّل اللبن عند غليه مع التين وينسب إليه انتفاخ المعدة وانسداد الأمعاء.  يذكر المؤلف في رواية البواسير مدة ٤–٦ أشهر وكمية من اللبن تعادل ضعف كمية التين بعده. وفي روايته الشخصية عن السعال يذكر ٢–٣ ثمرات وتناولها قبيل وجبة النهار أو الليل أو بعدها بقليل. وهذه روايات المؤلف التاريخية."], ["الاسم والفصيلة في الطباعة · ص ١", "يطبع العنوان الاسم اللاتيني Gacus Carica، بينما يرد Ficus Carica في سطر الأسماء الأخرى. ويذكر المصدر الفصيلة Urticaceae. ويستخدم الحقل العلمي في التطبيق Ficus carica L. وMoraceae. وهذه معلومات تختلف عن الطباعة  يعتمد Plants of the World Online في كيو الاسم Ficus carica L. ضمن فصيلة Moraceae."]]};

function flaxBookDetails() {

 const english=["The seed is described as warm and dry in the first degree, in agreement with Khazain al-Adwiya. Linseed oil is described as warm and moist in the first degree.", "Flax is widely cultivated in the Indian subcontinent. The plant grows two to four feet tall, has blue flowers, and bears its seeds in a pea-sized capsule. The seeds are small, flat, glossy, oval and slightly pointed at one end. They are reddish brown to dark brown and bland in taste. Oil extracted without heat is clear, while commercial oil may be yellowish brown. The book also attributes the plant's importance to its fiber, from which it says valuable, durable cloth is made.", "The book describes the seed as dispersing swellings, softening, cleansing, relieving pain, promoting expectoration, inducing vomiting, acting as a mild diuretic and loosening the bowels. It attributes dispersing, soothing and cleansing properties to the oil and records traditional claims concerning wounds.", "The book describes seed poultices in historical accounts of swellings, eruptions and joint pain. It mentions the seed with vinegar for some skin marks, the mucilage for redness of the eyes, and roasted ground seed in connection with wounds. Ground seed with honey, decoctions and syrups are mentioned in connection with productive cough, throat irritation and breathlessness. The text separately discusses urination, the kidneys and bladder, and the uterus and intestines. The oil is mentioned in massage for pain, applications to skin marks, and ointments. The oil section also records traditional references to burns, appetite, phlegm, urination, colic, stiffness and earache. In its special-preparation section the book mentions massage using lukewarm ground linseed with sesame oil, ground seed with honey, and seed roasted before grinding and mixing with honey. The author attributes a personal observation to this passage. It separately mentions skin marks attributed to heat, eruptions and ulcers. The poultice discussion also records an old proposal to add a little finely ground mustard to increase the effect. The seed-poultice discussion specifically names pleurisy, pneumonia, inflammation of the abdominal membrane and joint swelling. For hard swellings the book claims maturation and discharge of accumulated material. With vinegar it mentions marks associated with hair loss and facial discoloration. It describes extracting seed mucilage in water and a topical application in the discussion of eye redness. Roasted finely ground seed is historically credited with relieving wind and pain. A decoction with hyssop occurs in the discussion of inflammation and ulcers of the uterus and intestines. The stated particular benefits include expectoration, benefit in diarrhea attributed to phlegm, and urination. The oil discussion also names black jaundice. Immediate relief of burn pain and drying of wounds with the historical oil-and-limewater mixture are claims attributed to the author.", "The book describes the seed as slow to digest and harmful to the stomach and digestion. The oil section records cautions concerning the stomach, eyesight and sexual vigor.", "For the seed, honey, coriander and sikanjabin. For the oil, coriander and sikanjabin.", "Fenugreek seed is listed as a substitute for the seed. The oil entry names no separate substitute."];
 const englishRest=[["Origin and trade · p. 5", "Pakistan, India, Egypt, Russia, the Netherlands and England are listed as growing regions. The book calls the seed an important export."], ["Composition · pp. 6 and 8", "The book lists linamarin, oil, mucilage, wax, resin, sugar, phosphates and protein in the seed. It describes linseed oil as a fixed oil and mentions glycerol and linoleic acid. On printed page 8 the oil-composition statement names glycerol and linoleic acid together with 25–30 percent. The wording does not clearly allocate a separate proportion to each."], ["Named formulations · pp. 7 and 8", "The seed section lists Lauq-e-Katan, Habb-e-Sual, Lauq-e-Motadil, Lauq-e-Rabw and Sharbat-e-Sadr. The oil section names Qairooti-e-Bazr-ul-Katan, a preparation of wax and oil."], ["Quantity as printed · p. 6", "The printed wording is “5 سے 10 گرام (5 ماشے تا ایک درہم)”. Grams and historical units are retained as printed without converting between them. For the oil, the book states that the quantity depends on need and age."], ["Special historical oil preparations · pp. 7–8", "The book calls linseed oil an important ingredient of ointments. It mentions an ointment with hen's egg white and a separate preparation with limewater in connection with burns. The same historical discussion also names carbolic acid. Uses concerning inflammation of the chest and lungs, intestinal ulcers, colic and lukewarm oil for earache also occur in the source."], ["Scientific spelling in the source · p. 5", "The book prints Linum Usitatissimum Linn and the family Lineae. The scientific field uses the accepted spelling Linum usitatissimum L. and the family Linaceae. Names from other languages retain the source's script."]];
 const dari=["مزاج تخم در درجۀ اول گرم و خشک دانسته شده است. خزائن‌الادویه نیز همین مزاج را ذکر می‌کند. روغن کتان در درجۀ اول گرم و تر دانسته شده است.", "کتان در نیم‌قارۀ هند فراوان کشت می‌شود. گیاه دو تا چهار فوت قد می‌کشد، گل‌های آبی دارد و تخم‌هایش در غلافی به اندازۀ نخود جای می‌گیرند. تخم‌ها ریز، هموار، براق و بیضوی اند و یک سر اندکی نوک‌تیز دارند. رنگ آن‌ها از قهوه‌ای سرخ‌فام تا قهوه‌ای تیره است و مزۀ ملایم دارند. روغنی که بدون حرارت گرفته شود شفاف است، و روغن بازار می‌تواند قهوه‌ای زردفام باشد. کتاب یکی از علت‌های اهمیت گیاه را الیاف آن می‌داند که از آن پارچۀ باارزش و بادوام ساخته می‌شود.", "کتاب تخم را تحلیل‌برندۀ ورم، نرم‌کننده، پاک‌کننده، آرام‌کنندۀ درد، خلط‌آور، قی‌آور، اندکی ادرارآور و ملین می‌داند. برای روغن نیز اثر تحلیل ورم، آرام‌کردن درد و خاصیت پاک‌کنندگی ذکر می‌کند و دعواهای سنتی مربوط به زخم‌ها را می‌آورد.", "در گزارش‌های تاریخی کتاب، ضماد تخم برای ورم، دانه‌های پوستی و درد بندها ذکر شده است. تخم با سرکه برای بعضی لکه‌های پوست، لعاب تخم در بحث سرخی چشم و تخم بریان و کوبیده در بحث زخم‌ها آمده است. تخم کوبیده با عسل، جوشانده و شربت در پیوند با سرفۀ بلغمی، خشونت گلو و نفس‌تنگی یاد شده‌اند. از ادرار، گرده‌ها و مثانه و نیز رحم و روده‌ها جداگانه یاد می‌شود. روغن در مالش برای درد، مالیدن بر لکه‌های پوست و ساخت مرهم‌ها ذکر شده است. دربارۀ سوختگی، اشتها، بلغم، ادرار، قولنج، خشکی اندام و گوش‌درد نیز یادداشت‌های سنتی مربوط به روغن آمده‌اند. کتاب در بخش ترکیب خاص، مالش با تخم کوبیدۀ نیم‌گرم و روغن کنجد، تخم کوبیده با عسل و بریان‌کردن تخم پیش از کوبیدن و آمیختن با عسل را ذکر می‌کند. در همان‌جا مؤلف به تجربۀ شخصی خود اشاره دارد. برای داغ‌های پوستی منسوب به گرمی، دانه‌ها و زخم‌ها نیز یادداشت جداگانه آمده است. در بحث ضماد، افزودن اندکی خردل میده برای افزایش اثر به‌عنوان نظر قدیمی ثبت شده است. در بحث ضماد تخم، کتاب ذات‌الجنب، ذات‌الریه، ورم پردۀ شکم و ورم بندها را نام می‌برد. دربارۀ غده‌های سفت ادعا می‌کند که ورم را می‌پزاند و مواد گردآمده را بیرون می‌کند. با سرکه از لکه‌های ریزش مو و کلف یاد می‌کند. از گرفتن لعاب تخم در آب و استعمال موضعی آن در بحث سرخی چشم سخن می‌گوید. برای تخم بریان و میده، ادعای تاریخی کاهش نفخ و درد را می‌آورد. جوشانده با زوفا در بحث ورم و زخم رحم و روده آمده است. فواید خاص تخم را خروج بلغم، بندکردن اسهال بلغمی و افزایش ادرار می‌داند. در بحث روغن از یرقان سیاه نیز نام می‌برد. ادعای آرام‌شدن فوری درد سوختگی و خشک‌شدن زخم با ترکیب تاریخی روغن و آب آهک، بخشی از نقل مؤلف است.", "کتاب تخم را دیرهضم و برای معده و هاضمه زیان‌بار می‌داند. در بخش روغن، دربارۀ معده، بینایی و قوۀ باه احتیاط ذکر شده است.", "برای تخم، عسل، گشنیز و سکنجبین ذکر شده است. برای روغن، گشنیز و سکنجبین آمده است.", "تخم شنبلیله (حلبه) بدل تخم کتان ذکر شده است. برای روغن در این مدخل بدل جداگانه‌ای نیامده است."];

 const arabic=["يصف الكتاب البذور بأنها حارة يابسة في الدرجة الأولى، وهو ما يذكره خزائن الأدوية أيضًا. ويصف زيت الكتان بأنه حار رطب في الدرجة الأولى.", "يكثر زرع الكتان في شبه القارة الهندية. ويبلغ ارتفاع النبات قدمين إلى أربع أقدام، وله أزهار زرقاء وعلبة بحجم حبة الحمص تحمل البذور. والبذور صغيرة مفلطحة لامعة بيضوية ولأحد طرفيها شيء من الحدّة، ولونها بني محمر أو بني داكن وطعمها خفيف. ويكون الزيت المستخرج دون حرارة صافيًا، بينما قد يكون زيت السوق بنيًا مصفرًا. ويعزو الكتاب أهمية النبات أيضًا إلى أليافه التي يُصنع منها قماش ثمين متين بحسب النص.", "يصف الكتاب البذور بأنها محللة للورم ومنضجة وجالية ومسكنة للألم ومخرجة للبلغم ومقيئة ومدرّة للبول برفق ومليّنة. وينسب إلى الزيت تحليل الورم وتسكين الوجع والجلاء، ويورد أوصافًا تقليدية تتعلق بالقروح.", "يورد الكتاب ذكر ضماد البذور في سياق تاريخي عن التورم والبثور وآلام المفاصل. ويذكر البذور مع الخل لبعض آثار الجلد، ومخاطها في سياق احمرار العين، والبذور المحمصة المطحونة في بحث الجروح. ويورد البذور المطحونة مع العسل والمغلي والشراب في سياق السعال البلغمي وخشونة الحلق وضيق النفس. وترد إشارات منفصلة إلى البول والكلى والمثانة والرحم والأمعاء. ويذكر الزيت في التدليك عند الألم، وفي الاستعمال الموضعي لآثار الجلد وفي المراهم. ويرد كذلك ذكر تقليدي للحروق والشهية والبلغم والبول والمغص والتيبّس وألم الأذن. يذكر الكتاب في قسم التركيب الخاص التدليك بالبذور المطحونة الفاترة مع زيت السمسم، والبذور المطحونة مع العسل، وتحميص البذور قبل طحنها وخلطها بالعسل. ويشير المؤلف في الموضع نفسه إلى تجربته الشخصية. وترد إشارة منفصلة إلى آثار الجلد المنسوبة إلى الحرارة والبثور والقروح. ويسجل بحث الضماد رأيًا قديمًا بإضافة قليل من الخردل المطحون لزيادة الأثر. يسمّي بحث ضماد البذور ذات الجنب وذات الرئة وورم الصفاق وورم المفاصل. ويدّعي في الأورام الصلبة الإنضاج وإخراج المواد المتجمعة. ويذكر مع الخل آثار تساقط الشعر والكلف. ويصف استخراج مخاط البذور في الماء واستعماله الموضعي في بحث احمرار العين. وينسب تاريخيًا إلى البذور المحمصة المطحونة تسكين الانتفاخ والألم. ويرد المغلي مع الزوفا في بحث ورم الرحم والأمعاء وقروحها. ويذكر من المنافع الخاصة إخراج البلغم والنفع في الإسهال المنسوب إلى البلغم وإدرار البول. ويسمّي بحث الزيت اليرقان الأسود أيضًا. أما تسكين ألم الحرق فورًا وتجفيف الجروح بالتركيب التاريخي من الزيت وماء الجير فهما من دعاوى المؤلف المنقولة.", "يصف الكتاب البذور بأنها بطيئة الهضم ومضرّة بالمعدة والهضم. ويورد في مبحث الزيت احتياطات تتعلق بالمعدة والبصر والقوة الجنسية.", "يذكر للبذور العسل والكزبرة والسكنجبين، وللزيت الكزبرة والسكنجبين.", "يذكر الكتاب بذور الحلبة بدلاً من بذور الكتان، ولا يسمّي في هذا المدخل بديلاً مستقلاً للزيت."];
