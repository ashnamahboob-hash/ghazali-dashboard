، سند، یوپی، دکن، بنگال) می‌روید. نام علمی دقیق در کتاب چاپ نشده. تیره: Convolvulaceae.", "mzj": "گرم درجهٔ سوم و خشک درجهٔ دوم", "khs": "محلل، مفتح، مسکن درد، قاتل کرم شکم، مسهل بلغم و سودا، مقوی مو، مندمل زخم، مصفی خون", "use": "بیماری‌های سوداوی (صرع، جنون، مالیخولیا، کابوس)، دمل و جوش، التهاب چشم، بیماری‌های کبد و طحال، یرقان و تب‌های کهنه. روغن آن از ریزش مو جلوگیری می‌کند. نویسنده از تجربهٔ شخصی برای چاقی یاد می‌کند.", "mzr": "در کتاب ذکر نشده", "msl": "کاسنی و سکنجبین", "bdl": "در کتاب ذکر نشده"}, "ur": {"mhy": "سنہری زرد رنگ کی بیل ہے جس کا زمین سے تعلق نہیں، جڑ اور پتے نہیں ہوتے۔ جتنی باریک ٹہنی ہو اتنی بہتر۔ درختوں اور خاردار پودوں پر چڑھتی ہے اور بہار، گرمی، برسات میں پھیلتی ہے۔ پھل میں چار تخم ہوتے ہیں (تخم کشوث)۔ برصغیر کے گرم مرطوب علاقوں (پنجاب، سندھ، یوپی، دکن، بنگال) میں ہوتی ہے۔ کتاب میں لاطینی نام درج نہیں۔ فیملی: Convolvulaceae۔", "mzj": "گرم تیسرے اور خشک دوسرے درجے میں", "khs": "محلل، مفتح، مسکن درد، قاتل کرم شکم، مسہل بلغم و سودا، مقوی شعر، مندمل قروح، مصفی خون", "use": "سوداوی امراض (مرگی، جنون، مالیخولیا، کابوس)، پھوڑے پھنسیاں، آشوبِ چشم، ورمِ جگر و طحال، یرقان اور پرانے بخار۔ اس کا تیل بالوں کو گرنے سے روکتا ہے۔ مصنف نے موٹاپے میں ذاتی تجربہ بیان کیا ہے۔", "mzr": "کتاب میں مذکور نہیں", "msl": "کاسنی اور سکنجبین", "bdl": "کتاب میں مذکور نہیں"}, "en": {"mhy": "A golden-yellow climber with no connection to the ground and no roots or leaves; thinner stems are considered better. It twines over trees and thorny plants and spreads in spring, summer and the rains. The fruit holds four seeds (kashuth seed). Found in warm humid parts of the subcontinent (Punjab, Sindh, UP, Deccan, Bengal). The book prints no Latin name. Family: Convolvulaceae.", "mzj": "Hot in the 3rd degree, dry in the 2nd", "khs": "Resolvent, opener, pain-relieving, kills intestinal worms, purges phlegm and black bile, strengthens hair, heals wounds, purifies blood", "use": "Melancholic disorders (epilepsy, insanity, melancholia, nightmares), boils, eye inflammation, liver and spleen disorders, jaundice, chronic fevers. Its oil prevents hair fall. The author gives a personal account for obesity.", "mzr": "Not stated in the book", "msl": "Chicory and sikanjabin", "bdl": "Not stated in the book"}, "ar": {"mhy": "نبتة متسلقة صفراء ذهبية لا صلة لها بالأرض، لا جذر ولا ورق لها؛ والأرفع من أغصانها أفضل. تلتف على الأشجار والشجيرات الشائكة وتنتشر في الربيع والصيف والمطر. في ثمرتها أربع بذور (بذر الكشوث). توجد في المناطق الحارة الرطبة (البنجاب، السند، الدكن، البنغال). لم يُطبع اسم لاتيني في الكتاب. الفصيلة: Convolvulaceae.", "mzj": "حار في الدرجة الثالثة يابس في الثانية", "khs": "محلل، مفتح، مسكن للألم، قاتل لديدان البطن، مسهل للبلغم والسوداء، مقوٍّ للشعر، مندمل للقروح، مصفٍّ للدم", "use": "الأمراض السوداوية (الصرع، الجنون، الماليخوليا، الكابوس)، الدمامل، التهاب العين، أمراض الكبد والطحال، اليرقان، الحمّيات المزمنة. زيته يمنع تساقط الشعر. ويذكر المؤلف تجربة شخصية في السمنة.", "mzr": "لم يُذكر في الكتاب", "msl": "الهندباء والسكنجبين", "bdl": "لم يُذكر في الكتاب"}}, "extras": {"ps": [["د خوراک اندازه", "۳ تر ۵ ګرامه (ماشې)"], ["د متن حالت", "دا متن د تاج المفردات له چاپي اردو مخونو څخه په پنځو ژبو برابر سوی دئ او لا د بشپړې بیاکتنې انتظار باسي. د ډاکټر د مشورې بدل نه دئ."]], "fa": [["مقدار خوراک", "۳ تا ۵ گرم (ماشه)"], ["وضعیت متن", "این متن از صفحات چاپی اردوی تاج المفردات به پنج زبان تهیه شده و در انتظار بازبینی کامل است. جایگزین مشورت پزشک نیست."]], "ur": [["مقدار خوراک", "تین سے پانچ گرام (ماشے)"], ["متن کی حیثیت", "یہ متن تاج المفردات کے مطبوعہ اردو صفحات سے پانچ زبانوں میں تیار کیا گیا ہے اور مکمل نظرثانی باقی ہے۔ معالج کے مشورے کا بدل نہیں۔"]], "en": [["Dose", "3 to 5 grams (masha)"], ["Text status", "This text was prepared in five languages from the printed Urdu pages of Taj al-Mufradat and awaits full review. It is not a substitute for a physician’s advice."]], "ar": [["المقدار", "من ٣ إلى ٥ غرامات (ماشة)"], ["حالة النص", "أُعدّ هذا النص بخمس لغات من الصفحات الأردية المطبوعة لتاج المفردات وينتظر المراجعة الكاملة. وليس بديلاً عن استشارة الطبيب."]]}, "status": "draft_from_printed_pages", "photo_slots": 4, "photos": "empty", "languages": ["ps", "fa", "ur", "en", "ar"]}, "T043": {"code": "T043", "pages": "72–74", "source": "تاج المفردات", "name": {"ps": "اګر (عود هندي)", "fa": "اگر (عود هندی)", "ur": "اگر، عود ہندی", "en": "Eagle Wood (Agarwood)", "ar": "العود الهندي (الأَغَر)"}, "names": [["ar", "عود غرقی"], ["fa", "عود ہندی"], ["sd", "اگر کاٹھی"], ["sa", "اگرو"], ["en", "Eagle Wood"]], "scientific": "Aquilaria agallocha", "scientific_as_printed": "Aquilaria agallocha", "family": "", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "سدابهاره ونه ده چې ۷۰ تر ۱۰۰ فوټه لوړېږي. کله چې ونه ۳۰ یا ۴۰ کلنه شي، په دننه کې یې تور، دروند او خوږبوی مواد جوړېږي چې لرګی دروند کړي، تر دې چې وچ لرګی هم په اوبو کې ډوبېږي؛ له همدې امله ورته عود غرقي وايي. پوټکی یې نری، ټینګ او اوار دی. پاڼې ۲ تر ۳ انچه اوږدې او ځلانده دي. په پسرلي کې نرم سپین ګلان کوي، او میوه یې د امرود په شان ۱٫۵ تر ۲ انچه اوږده ده. په آسام، ختیځ هیمالیا، سلهټ، خاسیا غرونو، ختیځ بنګال او برما کې ډېر پیدا کېږي؛ د بنګله دېش عود غوره ګڼل کېږي. رنګ یې تور او نسواري دی، خو تور لرګی تر روښانه رنګ لرګي غوره او ګران دی. ذائقه: تریخه، تېزه او خوږبوی.", "mzj": "ګرم او وچ، په دویم درجه کې", "khs": "د اصلي غړو پیاوړی کوونکی، د معدې پیاوړی کوونکی، د باد ماتوونکی، ملطف او مفتح، د خولې بوی ښه کوونکی، د بلغم ایستونکی", "use": "د معدې ضعف او د اشتها کموالی لرې کوي. د زړه او مغز د پیاوړتیا په درملو کې ور ګډېږي. هضم ښه کوي او د معدې بد باد تحلیلوي. د بلغم ایستلو له امله په بلغمي ټوخي او دمه کې کارول کېږي. د حمل ساتونکی دی؛ خوړل کېږي او د ناف لاندې هم مښل کېږي. د خولې د بدبوی لپاره یې خولې ته اچوي یا چيچي؛ د هغه نرم پوډر د غاښونو او مسوړو لپاره ګټور دی. پوډر یې پر جامو شیندل کټمل او جوې لرې کوي.", "mzr": "ګرم مزاجه کسانو ته", "msl": "کافور او ګلاب", "bdl": "دارچین، مېخک (قرنفل)، زعفران او نور"}, "fa": {"mhy": "درخت همیشه‌سبز ۷۰ تا ۱۰۰ فوت بلند است. وقتی درخت ۳۰–۴۰ ساله شود، درونش مادهٔ سیاه، سنگین و خوشبو پدید می‌آید که چوب را سنگین می‌کند تا آنجا که چوب خشک هم در آب غرق می‌شود؛ از این رو «عود غرقی» نام دارد. پوست نازک، محکم و هموار؛ برگ‌ها ۲–۳ اینچ و براق. در بهار گل‌های سفید نرم می‌دهد و میوه‌اش ۱٫۵–۲ اینچ و شبیه امرود است. در آسام، هیمالیای شرقی، سلهت، کوه‌های خاسیا، بنگال شرقی و برما فراوان است؛ عود بنگلادش بهتر شمرده می‌شود. رنگ سیاه و قهوه‌ای (چوب سیاه بهتر و گران‌تر از چوب روشن است). مزه: تلخ، تند و خوشبو.", "mzj": "گرم و خشک، درجهٔ دوم", "khs": "مقوی اعضای رئیسه و معده، کاسر ریاح، ملطف و مفتح، خوش‌بوکنندهٔ دهان، منفث بلغم", "use": "ضعف معده و کمی اشتها را برطرف می‌کند و در داروهای مقوی دل و مغز می‌آید. هضم را بهتر می‌کند و باد معده را تحلیل می‌برد. در سرفه و دمهٔ بلغمی به کار می‌رود. محافظ جنین است؛ خورده می‌شود و زیر ناف هم می‌مالند. برای بوی بد دهان در دهان می‌گذارند یا می‌جوند؛ پودر ریز آن برای دندان و لثه مفید است. پودرش بر لباس پاشیده شود ساس و شپش را دور می‌کند.", "mzr": "برای افراد گرم‌مزاج", "msl": "کافور و گلاب", "bdl": "دارچینی، میخک، زعفران و غیره"}, "ur": {"mhy": "سدا بہار درخت ہے جو ستر سے سو فٹ تک اونچا ہوتا ہے۔ جب درخت تیس چالیس برس کا ہوتا ہے تو اندر ایک سیاہ، وزنی اور خوشبودار مادہ پیدا ہو کر لکڑی کو بھاری کر دیتا ہے، یہاں تک کہ سوکھی لکڑی بھی پانی میں ڈوب جاتی ہے؛ اسی لیے اسے عود غرقی کہتے ہیں۔ چھال پتلی، مضبوط اور ہموار؛ پتے دو تین انچ لمبے اور چمکدار۔ بہار میں نرم سفید پھول لگتے ہیں اور پھل ڈیڑھ سے دو انچ لمبا، امرود کی شکل کا ہوتا ہے۔ آسام، مشرقی ہمالیہ، سلہٹ، کھاسیا کی پہاڑیوں، مشرقی بنگال اور برما میں کثرت سے ہوتا ہے؛ بنگلہ دیش کا عود بہتر خیال کیا جاتا ہے۔ رنگ سیاہ اور بھورا، مگر سیاہ لکڑی ہلکے رنگ کی نسبت بہتر اور قیمتی ہوتی ہے۔ ذائقہ: تلخ، تیز اور خوشبودار۔", "mzj": "گرم و خشک درجہ دوم", "khs": "مقوی اعضائے رئیسہ، مقوی معدہ، کاسر ریاح، ملطف و مفتح، مطیب دہن، منفث بلغم", "use": "ضعف معدہ اور کمی بھوک کو دور کرتا ہے، مقوی دل و دماغ ادویہ میں شامل کیا جاتا ہے۔ ہضم کو بہتر کرتا اور معدے کی غلط ریاح تحلیل کرتا ہے۔ منفث بلغم ہونے کی وجہ سے بلغمی کھانسی اور دمہ میں استعمال ہوتا ہے۔ محافظ جنین ہے؛ کھایا جاتا اور زیرِ ناف بھی لگایا جاتا ہے۔ منہ کی بدبو دور کرنے کے لیے منہ میں رکھ کر چباتے ہیں؛ اس کا باریک سفوف دانتوں اور مسوڑوں کو فائدہ دیتا ہے۔ کپڑوں پر سفوف چھڑکنے سے کھٹمل اور جوئیں دور ہو جاتی ہیں۔", "mzr": "گرم مزاج لوگوں کے لیے", "msl": "کافور اور گلاب", "bdl": "دار چینی، قرنفل، زعفران وغیرہ"}, "en": {"mhy": "An evergreen tree 70 to 100 ft tall. When the tree is 30–40 years old a black, heavy, fragrant substance forms inside, making the wood so heavy that even dry wood sinks in water, hence the name ‘ood gharqi’ (sinking oud). Bark thin, strong and smooth; leaves 2–3 in. long and glossy. Soft white flowers in spring; the fruit is 1.5–2 in. long and guava-shaped. Abundant in Assam, the eastern Himalaya, Sylhet, the Khasia hills, East Bengal and Burma; Bangladesh oud is considered better. Colour black and brown (black wood is better and dearer than light wood). Taste: bitter, sharp and fragrant.", "mzj": "Hot and dry, 2nd degree", "khs": "Strengthens the principal organs and the stomach, expels wind, softening and opening, sweetens the breath, expels phlegm", "use": "Relieves weak stomach and low appetite and is added to heart and brain tonics. Improves digestion and dissolves bad stomach wind. Used in phlegmatic cough and asthma. Protects the fetus; eaten and also applied below the navel. Held in the mouth or chewed for bad breath; its fine powder helps teeth and gums. Powder sprinkled on clothes drives off bedbugs and lice.", "mzr": "For hot-tempered people", "msl": "Camphor and rose", "bdl": "Cinnamon, clove, saffron, etc."}, "ar": {"mhy": "شجرة دائمة الخضرة يبلغ ارتفاعها ٧٠ إلى ١٠٠ قدم. إذا بلغت ٣٠–٤٠ سنة تكوّنت في داخلها مادة سوداء ثقيلة عطرة تثقّل الخشب حتى يغرق الخشب اليابس في الماء، ولذلك سُمّي عوداً غرقياً. قشرتها رقيقة قوية ملساء وأوراقها ٢–٣ بوصات لامعة. تزهر في الربيع أزهاراً بيضاء ناعمة وثمرتها ١٫٥–٢ بوصة تشبه الجوافة. تكثر في آسام وشرق الهيمالايا وسلهت وجبال خاسيا وشرق البنغال وبورما، ويُعدّ عود بنغلاديش أفضل. لونه أسود وبني والأسود أجود وأغلى. طعمه مر حاد عطري.", "mzj": "حار يابس في الدرجة الثانية", "khs": "مقوٍّ للأعضاء الرئيسة والمعدة، كاسر للرياح، ملطِّف ومفتِّح، مطيِّب للفم، منفِّث للبلغم", "use": "يزيل ضعف المعدة وقلة الشهية ويدخل في أدوية تقوية القلب والدماغ. يحسّن الهضم ويحلّل ريح المعدة. يُستعمل في السعال البلغمي والربو. حافظ للجنين؛ يؤكل ويُدهن به تحت السرّة. يُمضغ لإزالة رائحة الفم الكريهة، وسفوفه الناعم نافع للأسنان واللثة. ينثر سفوفه على الثياب فيطرد البق والقمل.", "mzr": "لأصحاب المزاج الحار", "msl": "الكافور والورد", "bdl": "القرفة والقرنفل والزعفران وغيرها"}}, "extras": {"ps": [["د خوراک اندازه", "۳ تر ۴ ګرامه (ماشې)"], ["د متن حالت", "دا متن د تاج المفردات له چاپي اردو مخونو څخه په پنځو ژبو برابر سوی دئ او لا د بشپړې بیاکتنې انتظار باسي. د ډاکټر د مشورې بدل نه دئ."]], "fa": [["مقدار خوراک", "۳ تا ۴ ماشه (گرم)"], ["وضعیت متن", "این متن از صفحات چاپی اردوی تاج المفردات به پنج زبان تهیه شده و در انتظار بازبینی کامل است. جایگزین مشورت پزشک نیست."]], "ur": [["مقدار خوراک", "۳ سے ۴ ماشہ (گرام)"], ["متن کی حیثیت", "یہ متن تاج المفردات کے مطبوعہ اردو صفحات سے پانچ زبانوں میں تیار کیا گیا ہے اور مکمل نظرثانی باقی ہے۔ معالج کے مشورے کا بدل نہیں۔"]], "en": [["Dose", "3 to 4 masha (gram)"], ["Text status", "This text was prepared in five languages from the printed Urdu pages of Taj al-Mufradat and awaits full review. It is not a substitute for a physician’s advice."]], "ar": [["المقدار", "٣ إلى ٤ ماشة (غرام)"], ["حالة النص", "أُعدّ هذا النص بخمس لغات من الصفحات الأردية المطبوعة لتاج المفردات وينتظر المراجعة الكاملة. وليس بديلاً عن استشارة الطبيب."]]}, "status": "draft_from_printed_pages", "photo_slots": 4, "photos": "empty", "languages": ["ps", "fa", "ur", "en", "ar"]}, "T044": {"code": "T044", "pages": "74–75", "source": "تاج المفردات", "name": {"ps": "وړه الائچي", "fa": "هل خرد (هل کوچک)", "ur": "الائچی خرد", "en": "Small (Lesser) Cardamom", "ar": "الهيل الصغير"}, "names": [["ar", "قاقلہ صغار"], ["bn", "چھوٹ ایلاچ"], ["en", "The Lesser Cardamom"]], "scientific": "Elettaria cardamomum", "scientific_as_printed": "Elettaria cardamomum", "family": "Zingiberaceae", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "ډېری په لنده او سیوري لرونکې ځمکه کې کرل کېږي. بوټي یې د ادرکو په شان تل شین وي، له ریښې لاندې یې یوه غوټه ده، او له هغې یو ډنډ راوځي چې پاڼې پرې وي. تر ۸ فوټو پورې لوړېږي او له باران او لمر باید وساتل شي. کله چې ۳ یا ۴ فوټه لوړ شي، له ځایه یې ایستل کېږي او د ونو لاندې کرل کېږي. پاڼې یې ۲ فوټه اوږدې دي او له الائچو سره ورته بوی لري. ګلان یې سپین او سره دي، او میوه په ګڼو (ګچو) کې ځي؛ لومړی شنه وي او له ۲–۳ میاشتو وروسته ژېړ-شین کېږي، دننه یې تور دانې دي. دانې یې دوا کېږي؛ پوټکی یې بې ضرره دی. رنګ: دانه تور. ذائقه: سړه، خوږبوی او لطیفه. پیدایښت: سیام، چین، سري لنکا، جاوه، سماترا، میسور، کورګ او جنوبي هند په ځانګړي ډول مالابار.", "mzj": "ګرمه او وچه، دویم درجه (حکیم کبیر الدین یې لومړی درجه لیکلې)", "khs": "د خولې بوی ښه کوونکې، د معدې پیاوړې کوونکې، د باد ماتوونکې، مفرح او مسکن", "use": "یوازې یا د پان سره د خولې د بوی لپاره ژاولې کېږي. د باد له امله د ګېډې درد، د معدې ضعف، پړسوب او سوءهضم کې کارول کېږي. زړه پیاوړی او خوشحاله کوي، او د زړه درزا (خفقان) کې ګټوره ده. د زړه بدوالي او کانګو بندولو لپاره خوړل کېږي یا جوشانده یې څښل کېږي؛ خوله او خولې (پسینه) خوشبویه کوي. د پوډر بوی کول عطسه راولي. د سر درد او مرګي ته ګټه رسوي، اسهال ډډه کوي. په ګلاب کې جوش کړل شي او له سکنجبین سره وڅښل شي، د ځیګر د درد او سدو لپاره ګټوره ده.", "mzr": "سینه او پوستکي ناروغۍ پیدا کولای شي", "msl": "طباشیر", "bdl": "لویه الائچي، کبابه، حب بلسان"}, "fa": {"mhy": "بیشتر در زمین نمناک و جای سایه‌دار کاشته می‌شود. بوته‌اش مانند زنجبیل همیشه‌سبز است؛ زیر ریشه یک گره دارد و از آن ساقه‌ای برگ‌دار بیرون می‌آید. تا ۸ فوت بلند می‌شود و باید از باران و آفتاب محفوظ بماند. وقتی ۳–۴ فوت شد آن را کنده زیر درختان می‌کارند. برگ‌ها ۲ فوت بلند و بوی هل می‌دهند. گل‌ها سفید و سرخ‌اند و میوه به‌صورت خوشه می‌آید؛ نخست سبز و پس از ۲–۳ ماه زرد-سبز می‌شود و دانه‌های سیاه دارد. دانه دارو می‌شود و پوست آن بی‌ضرر است. رنگ: دانه سیاه. مزه: سرد، خوشبو و لطیف. زادگاه: سیام، چین، سریلانکا، جاوه، سوماترا، میسور، کورگ و جنوب هند به‌ویژه مالابار.", "mzj": "گرم و خشک درجهٔ دوم (حکیم کبیرالدین درجهٔ اول نوشته)", "khs": "خوش‌بوکنندهٔ دهان، مقوی معده، کاسر ریاح، مفرح و مسکن", "use": "به‌تنهایی یا با پان برای خوشبویی دهان جویده می‌شود. برای درد شکم بادی، ضعف معده، نفخ و ضعف هضم به کار می‌رود. دل را تقویت و شاد می‌کند و برای خفقان مفید است. برای تهوع و استفراغ خورده یا جوشانده‌اش نوشیده می‌شود. پودرش بوییده شود عطسه می‌آورد. برای سردرد و صرع سودمند است و اسهال را می‌بندد. جوشانده در گلاب با سکنجبین برای درد کبد و سدهٔ کبد مفید است.", "mzr": "ممکن است بیماری‌های سینه و پوست ایجاد کند", "msl": "طباشیر", "bdl": "هل کلان، کبابه، حب بلسان"}, "ur": {"mhy": "عموماً نمناک زمین اور سایہ دار جگہ میں بویا جاتا ہے۔ پودے ادرک کی طرح ہمیشہ سرسبز رہتے ہیں؛ جڑ کے نیچے ایک گانٹھ سی ہوتی ہے جس سے پتوں والی چھڑی نما گندل نکلتی ہے۔ آٹھ فٹ تک بلند ہو جاتا ہے اور بارش و دھوپ سے بچانا چاہیے۔ تین چار فٹ کا ہو تو اکھاڑ کر درختوں کے نیچے لگاتے ہیں۔ پتے دو فٹ لمبے اور الائچی کی خوشبو والے ہوتے ہیں۔ پھول سفید اور لال، پھل گچھوں میں لگتے ہیں؛ پہلے سبز اور دو تین ماہ میں پک کر زرد سبز مائل ہوتے ہیں جن میں سیاہی مائل دانے بھرے ہوتے ہیں۔ دانے بطور دوا استعمال ہوتے ہیں، چھلکا بے ضرر ہوتا ہے۔ رنگ: دانہ سیاہ۔ ذائقہ: ٹھنڈا، خوشبودار اور لطیف۔ مقامِ پیدائش: سیام، چین، سری لنکا، جاوا، سماٹرا، میسور، کورگ اور جنوبی ہند خصوصاً مالابار۔", "mzj": "گرم و خشک بدرجہ دوم (حکیم کبیر الدین نے درجہ اول لکھا ہے)", "khs": "مطیب دہن، مقوی معدہ، کاسر ریاح، مفرح و مسکن", "use": "تنہا یا پان کے ہمراہ خوشبوئے دہن کے لیے چباتے ہیں۔ درد شکم ریحی، ضعف معدہ، نفخ شکم اور ضعف ہضم میں استعمال ہوتی ہے۔ تقویت و تفریح قلب اور خفقان کے لیے مستعمل ہے۔ ابکائی، متلی اور قے روکنے کے لیے کھاتے یا جوشاندہ پلاتے ہیں۔ پیس کر سونگھنے سے چھینک آتی ہے۔ درد سر اور مرگی کو فائدہ دیتی ہے، اسہال کو روکتی ہے۔ گلاب میں جوش دے کر سکنجبین کے ہمراہ پلانا درد جگر اور جگر کے سدے کے لیے مفید ہے۔", "mzr": "صدر کے اور جلدی امراض پیدا کر سکتی ہے", "msl": "طباشیر", "bdl": "الائچی کلاں، کبابہ، حب بلسان"}, "en": {"mhy": "Usually sown in damp, shaded ground. The plants stay evergreen like ginger; a knot sits below the root and a leafy cane-like stalk rises from it. It reaches up to 8 ft and must be protected from rain and sun; at 3–4 ft it is uprooted and planted under trees. Leaves 2 ft long with a cardamom scent. Flowers white and red; the fruit grows in clusters, green at first, turning yellow-green after 2–3 months, with blackish seeds inside. The seeds are used as medicine; the husk is harmless. Colour: black seed. Taste: cool, fragrant and delicate. Grown in Siam, China, Sri Lanka, Java, Sumatra, Mysore, Coorg and South India, especially Malabar.", "mzj": "Hot and dry, 2nd degree (Hakim Kabir-ud-Din wrote 1st degree)", "khs": "Sweetens the breath, strengthens the stomach, expels wind, uplifting and soothing", "use": "Chewed alone or with paan for a fragrant mouth. Used for wind colic, weak stomach, bloating and poor digestion. Strengthens and cheers the heart and is used for palpitations. Eaten, or its decoction drunk, to stop nausea and vomiting. Powder sniffed brings sneezing. Helps headache and epilepsy and stops diarrhea. Boiled in rose water and taken with sikanjabin it helps liver pain and liver obstruction.", "mzr": "May cause chest and skin disorders", "msl": "Tabasheer", "bdl": "Large cardamom, kababa, habb-e-balsan"}, "ar": {"mhy": "يُزرع عادة في أرض رطبة ظليلة. نباتها دائم الخضرة كالزنجبيل، وتحت الجذر عقدة يخرج منها ساق قصبي ورقي. يبلغ ٨ أقدام ويجب وقايته من المطر والشمس؛ وإذا بلغ ٣–٤ أقدام اقتُلع وغُرس تحت الأشجار. أوراقه بطول قدمين برائحة الهيل. أزهاره بيضاء وحمراء وثماره عناقيد خضراء ثم تصفرّ بعد ٢–٣ أشهر وفيها بذور سوداء. تُستعمل البذور دواءً والقشرة لا ضرر فيها. اللون أسود. الطعم بارد عطري لطيف. موطنه سيام والصين وسريلانكا وجاوا وسومطرة وميسور وكورغ وجنوب الهند خاصة مالابار.", "mzj": "حار يابس في الدرجة الثانية (وكتبه الحكيم كبير الدين في الأولى)", "khs": "مطيّب للفم، مقوٍّ للمعدة، كاسر للرياح، مفرّح ومسكّن", "use": "يُمضغ وحده أو مع البان لطيب النكهة. يُستعمل في مغص الريح وضعف المعدة والنفخ وضعف الهضم. يقوّي القلب ويفرّحه وينفع في الخفقان. يؤكل أو يُشرب مغليّه لمنع الغثيان والقيء. سحيقه يُستنشق فيسبب العطاس. ينفع في الصداع والصرع ويمنع الإسهال. يُغلى في ماء الورد ويُشرب مع السكنجبين لوجع الكبد وسدده.", "mzr": "قد يسبب أمراض الصدر والجلد", "msl": "الطباشير", "bdl": "الهيل الكبير، الكبابة، حب البلسان"}}, "extras": {"ps": [["د خوراک اندازه", "نیم تر یو ګرام (ماشه)"], ["د متن حالت", "دا متن د تاج المفردات له چاپي اردو مخونو څخه په پنځو ژبو برابر سوی دئ او لا د بشپړې بیاکتنې انتظار باسي. د ډاکټر د مشورې بدل نه دئ."]], "fa": [["مقدار خوراک", "نیم تا یک ماشه (گرم)"], ["وضعیت متن", "این متن از صفحات چاپی اردوی تاج المفردات به پنج زبان تهیه شده و در انتظار بازبینی کامل است. جایگزین مشورت پزشک نیست."]], "ur": [["مقدار خوراک", "نصف سے ایک ماشہ (گرام)"], ["متن کی حیثیت", "یہ متن تاج المفردات کے مطبوعہ اردو صفحات سے پانچ زبانوں میں تیار کیا گیا ہے اور مکمل نظرثانی باقی ہے۔ معالج کے مشورے کا بدل نہیں۔"]], "en": [["Dose", "Half to 1 gram (masha)"], ["Text status", "This text was prepared in five languages from the printed Urdu pages of Taj al-Mufradat and awaits full review. It is not a substitute for a physician’s advice."]], "ar": [["المقدار", "نصف إلى ١ غرام (ماشة)"], ["حالة النص", "أُعدّ هذا النص بخمس لغات من الصفحات الأردية المطبوعة لتاج المفردات وينتظر المراجعة الكاملة. وليس بديلاً عن استشارة الطبيب."]]}, "status": "draft_from_printed_pages", "photo_slots": 4, "photos": "empty", "languages": ["ps", "fa", "ur", "en", "ar"]}, "T045": {"code": "T045", "pages": "75–76", "source": "تاج المفردات", "name": {"ps": "لویه الائچي (غټه الائچي)", "fa": "هل کلان (هل بزرگ)", "ur": "الائچی کلاں (موٹی الائچی)", "en": "Large Cardamom", "ar": "الهيل الكبير"}, "names": [["ar", "قاقلہ کبار"], ["fa", "ہیل کلاں"], ["gu", "موٹی الائچی"], ["bn", "بڑا الانچ"], ["en", "Large Cardamom"]], "scientific": "Amomum subulatum", "scientific_as_printed": "Amomum subulatum", "family": "Scitamineae (as printed)", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "په اصل کې د وړې الائچي function gkEntryLanguage(label) {
 return GK_ENTRY_NAME_LANGUAGES.find(function(row){return new RegExp('^(?:'+row[1]+')$','i').test(String(label||'').trim());});
}
function gkEntryNameRows(input,displayLang) {
 var rows=[],seen=new Set();
 function add(label,value){
  label=String(label||'').trim();value=String(value||'').trim();
  if(!value)return;
  var known=gkEntryLanguage(label);if(known)label=known[2][displayLang]||known[2].en;
  var id=label+'\u0000'+value;if(seen.has(id))return;seen.add(id);rows.push([label,value]);
 }
 function parse(text){
  String(text||'').split(/[\n؛;]+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(part){
   var aliases=GK_ENTRY_NAME_LANGUAGES.map(function(r){return r[1];}).join('|');

   });

 }

 else parse(input);
 return rows;
}
