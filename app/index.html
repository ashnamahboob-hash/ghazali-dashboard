 "use": "اصل یې د دماغي/عصبي صرع، لقوه، سوړ سر درد، زکام او نسیان لپاره، او د بدن د قوت، غفلت او د حافظې د نسیان په بحث کې یادوي. د اعصابو/عضلو د درد جوشانده، له سکنجبین سره د جګر ورم او استسقا، د ادرار پرانستل، او د سینې/سږو/دماغ د رطوبت پاکول د کتاب قولونه دي. د عقرقرحا په ملګرتیا د صرع او له افتیمون سره د مالیخولیا، د جګر استسقا او اختلاج د استعمالونو یادونه لري. د نیم سر درد لپاره له تور مرچ او کتیرا سره د درې واړو دواوو هم‌وزنه سفوف د ناستې تر مخه د ۱ ګرام خوراک تاریخي روایت دئ. نصیر احمد د طبیه کالج لاهور (یتیم‌خانه چوک) د «مفرح دماغ» په نوم شاوخوا څلوېښت کلنه تجربه او د ضعف نظر نسبت هم نقل کوي.", "mzr": "کتاب په نازک مزاج خلکو کې د زړه بدوالی او بې‌قراري یادوي.", "msl": "د لیمو شربت او کتیرا.", "bdl": "جلا نه دی یاد سوی."}, "fa": {"mzj": "گرم در اول و خشک در دوم؛ نزد بعضی گرم و خشک در دوم.", "mhy": "منبع بوته را شبیه ریحان وحشی در جنگل و خاک مرطوب کوه همراه علف، حدود نیم متر می‌داند. برگ سفیدگون یا زرد/سرخ‌گون و به پوسته‌های نازک تشبیه شده است. گل‌های کوچک در خوشه/سنبله مانند ریحان، سبزگون، سفید مایل زرد یا سرخ‌گون‌اند؛ مادۀ خوشبوی میانی با بوی کافور و مزۀ تلخ دارد. بذر کوچک ریحان‌مانند، اندکی تیره مایل زرد، خوشبو و تلخ است. برگ و گل خشک هر دو دوایی‌اند؛ مزه تند/تلخ وصف شده.", "khs": "افعال سنتی: مسکن صداع، مقوی دماغ/عصب و معده، کاسر ریاح، مسهل بلغم و سودا، مفتح و جالی. نفع خاص صداع و تنقیۀ دماغ/اعصاب؛ سودا با صفرا عوض نشده است.", "use": "اصل در صرع دماغی/عصبی، لقوه، صداع سرد، زکام و نسیان و بحث قوت بدن، غفلت و حافظه آمده. جوشانده برای درد عصب/عضله، همراه سکنجبین در ورم جگر و استسقا، ادرار بول و پاکی رطوبت سینه/ریه/دماغ اقوال منبع‌اند. همراه عاقرقرحا در صرع و افتیمون در مالیخولیا، استسقای جگر و اختلاج ذکر است. نسخۀ هم‌وزن با فلفل سیاه و کتیرا، یک گرام پیش از ناشتایی در شقیقه، نقل تاریخی است. نصیراحمد تجربۀ تقریباً چهل‌سالۀ طبیه کالج لاهور (یتیم‌خانه چوک) با نام مفرح دماغ و نسبت نفع در ضعف نظر را نقل می‌کند.", "mzr": "در نازک‌مزاجان تهوع و بی‌قراری ذکر شده است.", "msl": "شربت لیمو و کتیرا.", "bdl": "جداگانه ذکر نشده است."}, "ur": {"mzj": "گرم درجہ اول خشک درجہ دوم؛ بعض کے نزدیک گرم خشک دوم۔", "mhy": "ماخذ جنگلی تلسی جیسا پودا، جنگل و پہاڑ کی نمناک زمین میں گھاس کے ساتھ، قد قریب آدھا میٹر بیان کرتا ہے۔ پتے سفیدی یا زردی/سرخی مائل اور باریک قشر سے مشابہ بتائے ہیں۔ چھوٹے تلسی جیسے گچھے/بالیاں، سبزی مائل، سفیدی مائل زرد یا سرخی مائل پھول، درمیان خوشبودار مادہ، کافور جیسی بو و تلخی؛ ریحان جیسے چھوٹے، سیاہی مائل زرد، خوشبودار تلخ بیج۔ خشک پتے و پھول دونوں دوا میں، ذائقہ تیز و تلخ۔", "khs": "افعال مسکن صداع، مقوی دماغ و اعصاب و معدہ، کاسر ریاح، مسہل بلغم و سودا، مفتح و جالی۔ نفع خاص صداع و تنقیہ دماغ و اعصاب؛ سودا کو صفرا نہیں بنایا گیا۔", "use": "اصل امراض دماغی/عصبی صرع، لقوہ، صداع بارد، زکام و نسیان، قوت بدن و غفلت و ضعف حافظہ کا ذکر کرتا ہے۔ اعصاب/عضلات کے درد کا جوشاندہ، سکنجبین کے ساتھ ورم جگر و استسقاء، ادرار بول اور سینہ/پھیپھڑا/دماغ کی رطوبات کی صفائی نسبتیں ہیں۔ عقرقرحا کے ساتھ صرع، افتیمون کے ساتھ مالیخولیا، جگر استسقاء و اختلاج بھی درج ہیں۔ شقیقہ میں مرچ سیاہ و کتیرا تینوں ہم وزن، ایک گرام قبل ناشتہ کا سفوف تاریخی نقل ہے۔ نصیر احمد طبیہ کالج لاہور (یتیم خانہ چوک) کے «مفرح دماغ» کی قریب چالیس سالہ نسبت اور ضعف نظر کا تجربہ بھی لکھتے ہیں۔", "mzr": "نازک مزاج لوگوں میں متلی و بےچینی درج ہے۔", "msl": "شربت لیموں اور کتیرا۔", "bdl": "الگ درج نہیں۔"}, "en": {"mzj": "Warm in the first degree and dry in the second; some authorities assign both to the second degree.", "mhy": "The source describes a wild-basil-like plant among grasses in forests and moist mountain ground, about half a metre high. Leaves are described as pale or yellowish/reddish and resembling thin scales. Small basil-like flower clusters/spikes are described as greenish, pale yellowish or reddish, with an aromatic central material smelling of camphor and tasting bitter. Small basil-like seeds are dark-yellowish, aromatic and bitter. Both dried leaves and flowers are used in the source; taste is pungent/bitter.", "khs": "Traditional actions are relieving headache, strengthening brain/nerves and stomach, dispersing wind, purging phlegm and black bile, opening obstructions and cleansing. Particular action is headache relief and clearing brain/nerves; black bile is not replaced by yellow bile.", "use": "The original discusses brain/nervous epilepsy, facial palsy, cold headache, catarrh and forgetfulness, bodily strengthening, inattention and memory. Source accounts include decoction for nerve/muscle pain, sikanjabin with it for liver swelling/ascites, promoting urine and clearing chest/lung/brain moisture. Pellitory root is paired for epilepsy; dodder is paired for melancholia; liver ascites and twitching are also named. An equal-weight lavender/black-pepper/tragacanth powder with a printed one-gram pre-breakfast quantity for migraine is a historical recipe. Naseer Ahmad attributes roughly forty years of use at Tibbia College Lahore (Yateem Khana Chowk), under “Mufarrih Dimagh”, and an eyesight-weakness experience.", "mzr": "The source notes nausea and restlessness in delicate constitutions.", "msl": "Lemon syrup and tragacanth.", "bdl": "Not separately stated."}, "ar": {"mzj": "حار في الأولى يابس في الثانية، وعند بعضهم حار يابس في الثانية.", "mhy": "يصف المصدر نباتًا كالريحان البري بين العشب بالغابات وأرض الجبال الرطبة بارتفاع نحو نصف متر. والورق أبيض أو مصفر محمر ومشبه بقشور رقيقة. الزهر الصغير بعناقيد أو سنابل كالريحان أخضر أو أبيض مصفر أو محمر، بوسط عطري كرائحة الكافور وطعم مر. والبذر صغير كالريحان داكن مصفر عطر مر. ويستعمل الورق والزهر الجافان بحسب المصدر، والطعم حريف مر.", "khs": "الأفعال القديمة تسكين الصداع وتقوية الدماغ والأعصاب والمعدة وكسر الرياح وإسهال البلغم والسوداء والتفتيح والجلاء. والنفع الخاص الصداع وتنقية الدماغ والأعصاب؛ حفظت السوداء ولم تستبدل بالصفراء.", "use": "يتناول الأصل الصرع الدماغي والعصبي واللقوة والصداع البارد والزكام والنسيان وتقوية البدن والغفلة والذاكرة. ويذكر المغلي لألم العصب والعضلة، والسكنجبين لورم الكبد والاستسقاء، وإدرار البول وتنقية رطوبة الصدر والرئة والدماغ. ويقرنه بالعاقرقرحا للصرع وبالأفتيمون للماليخوليا ويذكر استسقاء الكبد والاختلاج. ومسحوقه مع الفلفل الأسود والكثيراء بأوزان مت کرم‌خورده و قوت آن دو سال دانسته شده. رنگ خاکستری/قهوه‌ای و مزه تند تلخ.", "khs": "افعال سنتی مقوی، مسمن، منقی رحم، محلل، مولد و مغلظ منی، مولد شیر و مصلب پستان؛ نفع خاص تقویت باه و درد ریاحی است.", "use": "منبع تقویت باه، سفوف با شیر در رقت منی/جریان و پاکی رحم و پیچ پس از زایمان را ذکر می‌کند؛ نسخۀ حفظ بارداری ندارد. ضماد محلل ورم، استعمال داخلی/خارجی در درد مفصل و نسبت قائم‌مقامی سورنجان و طلا برای صلابت پستان آمده‌اند. نصیراحمد طارق تجربۀ شخصی افزودن حتمی در نسخه‌های درد عصبی/ریاحی، باه و جریان را نقل می‌کند. سل، ضعف پیری و چاقی اقوال تاریخی‌اند؛ در کثرت حیض هر یک ۳ گرام اسگند و رال سفید با ۶ گرام مصری و در «معین حمل» روزانه صبح ۴ گرام با شکر/شیر نقل کتاب است، نه توصیۀ حفظ حمل موجود. لیپ آبی برای خنازیر نیز ذکر است.", "mzr": "عنوان مضر جدا ندارد؛ یادداشت، ریشه را غیرسمی و بذر را زهری می‌خواند. این تضمین ایمنی همۀ ریشه‌ها/محصولات نیست. احتیاط NCCIH: در بارداری و شیردهی مصرف نشود؛ موارد آسیب کبد، ملاحظات تیروئید و تداخل برخی داروها ذکر شده‌اند.", "msl": "گوند کتیرا؛ عسل در این سطر اصل نیست.", "bdl": "بهمن سفید."}, "ur": {"mzj": "گرم خشک درجہ سوم۔", "mhy": "دو صورتیں: کاشت شدہ موٹی جڑ، اور قبرستان/کھنڈر کی خودرو چھوٹی باریک جڑ۔ پودا قریب تین فٹ، پتلی شاخیں، برسات میں، نمناک زمین و درختوں کے سائے میں سارا سال۔ چوڑے قدرے دراز پتے، گہری رگیں، باریک سفید بال اور کان سے تشبیہ؛ چھوٹے بیگن جیسے زردی مائل سبز پھول اگلی شاخوں پر۔ پھل رس بھری کی طرح غلاف میں، پہلے سبز پھر مکو پھل کے برابر سرخ، اندر کثیر زرد تخم۔ جڑ ۸–۱۰ انچ، نیچے پتلی اوپر موٹی، باہر بھوری اندر سفید؛ تازہ بو گھوڑے کے پیشاب جیسی اور نام اشوگندھا اسی نسبت۔ مستعمل جڑ، جلد گھن، قوت دو سال؛ رنگ بھورا/خاکستری، تیز و تلخ۔", "khs": "افعال مقوی، مسمن، منقی رحم، محلل، مولد و مغلظ منی، مولد شیر، مصلب پستان؛ نفع خاص تقویت باہ و درد ریاحی۔", "use": "اصل تقویت باہ، رقت منی/جریان میں سفوف مع دودھ اور وضع حمل کے بعد پیچیلا/صفائی رحم لکھتا ہے؛ حمل محفوظ رکھنے کی ترکیب نہیں۔ محلل ورم ضماد، وجع مفاصل میں داخلی/خارجی استعمال و سورنجان کا قائم مقام، صلابت پستان کی طلا مذکور ہیں۔ نصیر احمد طارق اعصابی/ریاحی درد، باہ و جریان نسخوں میں لازمی شمولیت کا ذاتی تجربہ لکھتے ہیں۔ سل، بڑھاپے کی کمزوری و فربہی کے تاریخی اقوال؛ کثرت حیض میں اسگند و رال سفید تین تین گرام، مصری چھ گرام، اور «معین حمل» میں روزانہ صبح چار گرام شکر و دودھ کا ماخذی نقل ہے، موجودہ حمل کی حفاظت کی ہدایت نہیں۔ خنازیر کا آبی لیپ بھی درج ہے۔", "mzr": "الگ مضر سرخی نہیں؛ نوٹ جڑ غیرسمی اور تخم زہریلے کہتا ہے۔ یہ تمام جڑ/مصنوعات کی حفاظت کی ضمانت نہیں۔ NCCIH کی موجودہ احتیاط: حمل و دودھ پلانے میں اجتناب؛ جگر کے نقصان کے واقعات، تھائیرائڈ اور بعض دوا تعاملات مذکور ہیں۔", "msl": "گوند کتیرا؛ اصل سطر میں شہد نہیں۔", "bdl": "بہمن سفید۔"}, "en": {"mzj": "Warm and dry in the third degree.", "mhy": "The book distinguishes thick-rooted cultivated material from smaller thin-rooted wild plants of graveyards/ruins. The roughly three-foot plant has slender branches, grows in the rains and year-round in moist ground/tree shade. Broad, slightly long, deeply veined leaves bear fine white hairs and are compared to ears. Small eggplant-like yellow-green flowers occur on forward branches. Covered, cape-gooseberry-like fruits start green and ripen red, about a mako berry’s size, containing many yellow seeds. Roots are 8–10 inches, narrowing below and thicker above, brown outside/white inside; their fresh smell is compared to horse urine and linked to the name. Root is the used part, described as readily insect-damaged with a two-year potency. Colour is brown/grey and taste pungent/bitter.", "khs": "Traditional actions are strengthening, weight gain, uterine cleansing, dispersing swellings, producing/thickening semen, promoting milk and firming breasts; particular source benefits concern sexual strength and wind-related pain.", "use": "The original records sexual strengthening, powder with milk for thin semen/discharge, and uterine cleansing/cramping after childbirth; it does not prescribe maintaining an existing pregnancy. Swelling poultices, internal/external joint-pain use, a claim of substituting for colchicum, and breast-firming applications appear. Naseer Ahmad Tariq gives his personal experience of routinely including it in nerve/wind-related pain, sexual-tonic and discharge prescriptions. Tuberculosis, old-age weakness and weight gain are historical attributions. The source’s excessive-menstruation recipe gives asgand and white resin 3 g each with rock sugar 6 g; its “معین حمل” fertility account gives 4 g each morning with sugar/milk. This is not advice to protect an existing pregnancy. A water paste for scrofulous swelling is also reported.", "mzr": "There is no separate harm heading; a source note calls the root nonpoisonous and seeds poisonous. This does not guarantee safety of all root products. Current NCCIH precautions advise avoidance in pregnancy and breastfeeding and note reported liver injury, thyroid concerns and some medicine interactions.", "msl": "Tragacanth gum; honey is not listed in the original line.", "bdl": "White behman (bahman safed)."}, "ar": {"mzj": "حار يابس في الثالثة.", "mhy": "يفرق الكتاب بين المزروع ذي الجذر الغليظ والبري الصغير الدقيق بالمقابر والخرائب. النبات نحو ثلاثة أقدام بأغصان رفيعة ينمو بالمطر وطوال العام في الأرض الرطبة وظل الشجر. الورق عريض مطاول قليلًا عميق العروق بزغب أبيض دقيق ومشبه بالأذن. الزهر الصغير كالباذنجان أخضر مصفر بمقدم الأغصان. الثمر مغلف كالحرنكش أخضر ثم أحمر بحجم ثمر المكو ببذور صفراء كثيرة. الجذر ٨–١٠ بوصات، دقيق أسفل غليظ أعلى، بني خارجًا أبيض داخلًا؛ وشبهت رائحته الطازجة ببول الفرس وربط بها الاسم. المستعمل الجذر سريع التسوس وقوته سنتان بحسب الكتاب؛ اللون بني رمادي والطعم حريف مر.", "khs": "الأفعال القديمة التقوية والتسمين وتنقية الرحم والتحليل وتوليد المني وتغليظه وتوليد اللبن وتصليب الثدي؛ والنفع الخاص تقوية الباه والألم الريحي.", "use": "يسجل الأصل تقوية الباه ومسحوقًا باللبن لرقة المني والسيلان وتنقية الرحم والمغص بعد الولادة؛ ولا يصف حفظ الحمل القائم. وترد ضمادات الورم والاستعمال الداخلي والخارجي للمفاصل ودعوى قيامه مقام السورنجان وطلاء تصليب الثدي. وينقل نصير أحمد طارق تجربته الشخصية بإدخاله في وصفات الألم العصبي والريحي والباه والسيلان. والسل وضعف الكبر والتسمين نسب تاريخية. ووصفة كثرة الحيض بالمصدر ٣ غرامات لكل من الأسگند والراتنج الأبيض مع ٦ غرامات سكر صخري، ووصف «معین حمل» للخصوبة ٤ غرامات صباحًا بالسكر واللبن؛ ليس هذا نصحًا لحماية حمل قائم. ويذكر معجونًا مائيًا للخنازير.", "mzr": "لا عنوان مستقل للمضار؛ وتعد ملاحظة المصدر الجذر غير سام والبذر سامًا، ولا يضمن ذلك أمان كل منتجات الجذر. وتنصح احتياطات NCCIH الحالية بتجنبه في الحمل والإرضاع وتذكر أذية الكبد المبلغ عنها ومشكلات الدرق وتداخل بعض الأدوية.", "msl": "صمغ الكثيراء؛ لا يذكر العسل في السطر الأصلي.", "bdl": "بهمن أبيض."}}, "extras": {"ps": [["سیمې، ترکیب، مقدار او مرکبات", "چاپ پنجاب، سندهـ، بلوچستان او سرحد؛ د هند ناګوري/راجپوتانه، بمبۍ، آګره، یوپي او ډیلي یادوي. ترکیب: روغن، قلم‌دار الکلي او په چاپي املا «سومینفیرین»؛ واحد عمده جز په همدې نوم بولي. عمومي چاپي مقدار ۳–۵ ګرامه. مرکبات: حب اسګند، معجون مقوي رحم، سفوف جریان خاص. د «Sofanaceae» چاپي کورنۍ پر ځای تایید سوی Solanaceae کارول سوی. د ژباړې د رال/نشایستې زیاتول او د مصري ۲ ګرامه مقدار د اصل له مخې سم سوي؛ په اصل کې مصري ۶ ګرامه ده."]], "fa": [["مناطق، ترکیب، مقدار و مرکبات", "پنجاب، سند، بلوچستان و سرحد، ناگوری/راجپوتانه، بمبئی، آگره، یوپی و دهلی ذکرند. ترکیب روغن و قلیای متبلور با املای چاپی «سومینفیرین» به عنوان جزء عمده است. مقدار عام ۳–۵ گرام؛ حب اسگند، معجون مقوی رحم و سفوف جریان خاص. Solanaceae تأییدشده جای Sofanaceae چاپی را گرفته. افزودن رال/نشاسته و دو گرام مصری در ترجمه مطابق اصل اصلاح شد؛ مصری اصل شش گرام است."]], "ur": [["مقام، اجزا، مقدار و مرکبات", "پنجاب، سندھ، بلوچستان، سرحد، ناگوری/راجپوتانہ، بمبئی، آگرہ، یوپی و دہلی درج ہیں۔ اجزا روغن و قلم دار الکلی، مطبوعہ «سومینفیرین» اہم جز بتایا ہے۔ عمومی مقدار ۳–۵ گرام؛ حب اسگند، معجون مقوی رحم، سفوف جریان خاص۔ Sofanaceae مطبوعہ کے مقابل مصدقہ Solanaceae مستعمل ہے۔ ترجمے کا رال/نشاستہ اضافہ و مصری دو گرام درست نہیں؛ اصل مصری چھ گرام ہے۔"]], "en": [["Regions, composition, quantity and preparations", "Source regions include Punjab, Sindh, Balochistan, the Frontier, Nagori/Rajputana, Bombay, Agra, UP and Delhi. Composition is oil and a crystalline alkali printed “سومینفیرین”, called the main constituent. General quantity is 3–5 g. Preparations are Habb Asgand, Majun Muqawwi Rahim and Sufoof Jiryan Khas. Verified Solanaceae replaces printed Sofanaceae in the displayed family. The draft’s added resin/starch and two-gram rock-sugar figure were corrected; the original gives rock sugar six grams."]], "ar": [["المناطق والتركيب والمقدار والمركبات", "المناطق البنجاب والسند وبلوشستان وسرحد وناگوري/راجبوتانا وبمبئي وآغرة ويوپي ودلهي. والتركيب زيت وقلوي متبلور مطبوع «سومینفیرین» يسميه المكون الرئيس. والمقدار العام ٣–٥ غرامات؛ والمركبات حب أسگند ومعجون مقوي رحم وسفوف جريان خاص. استعملت Solanaceae المؤكدة بدل Sofanaceae المطبوعة. وصحح الراتنج والنشاء المضافان بالمسودة ومقدار السكر الصخري غرامين؛ الأصل ستة غرامات."]]}, "photo_slots": 4, "photos": "empty as requested", "languages": ["ps", "fa", "ur", "en", "ar"], "status": "organized_text_reviewed", "complete_source_text_verified": true, "reading_blocks": [], "unresolved_source_readings": [], "scientific_as_printed": "Withania Somnifera", "source_family": "Sofanaceae (printed)", "source_english_label": "Winter Cherey", "safety_source": "https://www.nccih.nih.gov/health/ashwagandha", "safety_provider": "NCCIH", "coverage_review": {"pages": "59–61", "method": "manual comparison of full Urdu page scans, with user Pashto draft as an aid", "form": "organized translated source account, not a diplomatic edition", "topics": ["aliases", "morphology and regions", "temperament alternatives", "actions and all use paragraphs", "harm/corrective/substitute or explicit absence", "printed quantities with source units", "chemical and compound names", "author experiences and disagreements", "source versus current safety distinctions"]}, "source_reading_review": {"date": "2026-11-06", "source": "Taj al-Mufradat, printed pp.51–61; full PDF page offset +36", "literal_transcription": false, "limitations": "Historical assertions and quantities are not clinical validation. No guessed species identity or silent unit conversion."}}, "T036": {"code": "T036", "pages": "61–62", "source": "تاج المفردات", "name": {"ps": "اُشق / امونیاک ګوند", "fa": "اُشق / صمغ آمونیاک", "ur": "اُشق / گوند اشق", "en": "Gum ammoniac / Ammoniacum", "ar": "الأُشَّق"}, "names": [["fa", "اشق"], ["ar", "اشج"], ["hi", "کاندر"], ["sa", "اوشن چتر"], ["en", "گم ایمونیاکم"]], "scientific": "Ferula ammoniacum (D.Don) Spalik, M.Panahi, Piwczyński & Puchałka", "family": "Apiaceae", "taxonomy_source": "https://powo.science.kew.org/taxon/77152156-1", "sections": {"ps": {"mzj": "په درېیمه درجه ګرم او په لومړۍ درجه وچ؛ همدا د اصل جلا درجې دي.", "mhy": "کتاب د وړې ونې ګوند یادوي؛ ریښه د شلغم یا مڼې په اندازه پنډه، پوستکی ژېړبخن سپین لکه نری کاغذ، پاڼې د بیر له پاڼو سره تشبیه، ګلان واړه ګرد خړ یا ژېړ دي. د ریښې/څانګو د پرې کېدو او د څانګو د چاودېدو وروسته رال‌مانند ګوند راوتل بیانوي. تازه ماده «طرثوث» نوموي؛ په اوبو کې په مروستلو د شیدو په شان سپینه عصاره جوړوي. رنګ ژېړبخن نسواري او په زړېدو توربخن، دننه غیرشفاف سپین یا لږ ژېړ؛ بوی لکه سکبینج او خوند ترخ خراشدار دئ.", "khs": "دودیز افعال: محلل، مفتح، منضج بلغم، ملین، مسهل، جالي، مدر حیض او قاتل کرم شکم. ځانګړې نفع د کلکو ورمونو تحلیل ده.", "use": "تاریخي روایتونه: د خنازیرو، د مفصلونو صلابت او ورم ضماد، د بواسیرو د مسو د پرانستلو لپاره لیپ؛ له سرکې سره د داغ/کلف/بهق طلا، او د زخمونو مرهم. مؤلف د اعصابو/رګونو خفیف تحریک او د سوداوي موادو تحلیل یادوي؛ له پارې سره د ضماد قوي کېدو قول هم لري، چې د پارې د خوندي استعمال تایید نه دئ. له شاتو سره د زوړ ټوخي/دمې او د بلغم د تعفن او ایستلو قول؛ د طحال صلابت، خناق، صرع، فالج، لقوه، تشنج، مفصل او نقرس لپاره له مناسبو دواوو سره استعمال راغلی. د ډېر مقدار مسهل کېدل، د حیض جاري کول، د ژوندي/مړه جنین ایستل او د چینجیو هلاکول د کتاب تاریخي ادعاوې دي؛ په حمل کې د استعمال لارښوونه نه دي.", "mzr": "اصل یې «بول الدم» یعني په متیازو کې وینه پیدا کوونکی بولي؛ دا د وینې کمول یا د متیازو بندول نه دي. د جنین د ایستلو پخواني قول په سبب د حمل پر مهال د ځان‌درملنې لپاره مه کاروئ.", "msl": "انیسون او سرکه.", "bdl": "جاوشیر."}, "fa": {"mzj": "گرم در سوم و خشک در اول، مطابق درجات جداگانۀ اصل.", "mhy": "صمغ درخت کوچک توصیف شده؛ ریشه ستبر مانند شلغم/سیب، پوست زردگون سفید چون کاغذ نازک، برگ شبیه کنار و گل کوچک گرد خاکستری یا زرد. تراوش صمغ‌رزین پس از بریدگی ریشه/شاخه یا شکافتن شاخه ذکر است. مادۀ تازه را «طرثوث» می‌نامد؛ با ساییدن در آب شیرۀ سفید شیری می‌دهد. رنگ قهوه‌ای زردگون و در کهنگی تیره، درون سفید غیرشفاف یا کم‌زرد، بو مانند سکبینج و مزه تلخ خراشنده است.", "khs": "افعال سنتی محلل، مفتح، منضج بلغم، ملین، مسهل، جالی، مدر حیض و قاتل کرم شکم؛ نفع خاص تحلیل ورم سخت.", "use": "روایت‌های تاریخی: ضماد خنازیر، صلابت/ورم مفصل، لیپ برای بازکردن دانه‌های بواسیر؛ با سرکه در داغ/کلف/بهق و مرهم زخم. مؤلف تحریک خفیف عصب/رگ و تحلیل مواد سودایی و قوی‌ترشدن ضماد با سیماب را می‌گوید؛ این تأیید مصرف ایمن سیماب نیست. با عسل در سرفۀ کهنه/آسم و تعفن/اخراج بلغم، با ادویۀ مناسب در صلابت طحال، خناق، صرع، فالج، لقوه، تشنج، مفصل و نقرس آمده. مسهل‌شدن مقدار زیاد، إدرار حیض، اخراج جنین زنده/مرده و کرم‌کشی دعاوی تاریخی‌اند، نه راهنمای مصرف در بارداری.", "mzr": "اصل «بول الدم»، یعنی خون در ادرار، می‌گوید؛ نه کم‌خونی یا احتباس ادرار. به‌ویژه با قول قدیمی اخراج جنین، در بارداری خوددرمانی نشود.", "msl": "انیسون و سرکه.", "bdl": "جاوشیر."}, "ur": {"mzj": "گرم درجہ سوم، خشک درجہ اول؛ اصل کی الگ درجے محفوظ ہیں۔", "mhy": "چھوٹے درخت کا گوند؛ شلغم/سیب جتنی موٹی جڑ، زردی مائل سفید کاغذی چھال، بیر جیسے پتے، چھوٹے گول خاکی/پیلے پھول۔ جڑ و شاخ کی کٹائی یا شاخ پھٹنے پر رال نما گوند کا اخراج درج ہے۔ تازہ مادہ «طرثوث»، پانی میں ملنے سے دودھ جیسا سفید شیرہ۔ رنگ زردی مائل بھورا، پرانا سیاہی مائل، اندر غیرشفاف سفید/کم زرد؛ بو سکبینج جیسی، ذائقہ تلخ خراش دار۔", "khs": "قدیم افعال محلل، مفتح، منضج بلغم، ملین، مسہل، جالی، مدر حیض و قاتل کرم شکم؛ نفع خاص اورام صلبہ کا تحلیل۔", "use": "تاریخی اقوال: خنازیر، صلابت/ورم مفاصل کا ضماد، بواسیری مسے کھولنے کا لیپ؛ سرکہ کے ساتھ داغ/کلف/بہق، زخموں کے مرہم۔ اعصاب و عروق کی خفیف تحریک و سوداوی مواد کا تحلیل؛ پارہ شامل کرنے سے ضماد قوی ہونے کا قول بھی، جو پارے کی حفاظت کا اثبات نہیں۔ شہد کے ساتھ پرانی کھانسی/دمہ و تعفن/اخراج بلغم؛ صلابت طحال، خناق، صرع، فالج، لقوہ، تشنج، مفاصل و نقرس میں مناسب ادویہ کے ساتھ درج ہے۔ زیادہ مقدار کا مسہل، مدر حیض، زندہ/مردہ جنین خارج اور کرم کش ہونا تاریخی دعوے ہیں، حمل میں استعمال کی ہدایت نہیں۔", "mzr": "اصل بول الدم یعنی پیشاب میں خون لکھتا ہے، خون کی کمی یا بندش بول نہیں۔ جنین اخراج کے قدیم قول کے باعث حمل میں خودعلاج نہ کیا جائے۔", "msl": "انیسون و سرکہ۔", "bdl": "جاوشیر۔"}, "en": {"mzj": "Warm in the third degree and dry in the first, preserving the original’s separate degrees.", "mhy": "The source describes a small tree’s gum: turnip/apple-thick roots, thin yellow-white papery bark, jujube-like leaves and small round grey/yellow flowers. Gum-resin exudation after root/branch injury or splitting is described. The fresh material is called “طرثوث”; rubbing in water makes a milky white liquid. Colour is yellow-brown, darkening with age, opaque white/slightly yellow within; smell resembles sagapenum and taste is bitter/irritant.", "khs": "Traditional actions are dispersing swellings, opening obstructions, maturing phlegm, softening stools, purging, cleansing, promoting menstruation and killing intestinal worms; the particular benefit is dispersing hard swellings.", "use": "Historical accounts include poultices for scrofula, hard/swollen joints and hemorrhoidal nodules; vinegar applications for skin marks/chloasma/leucoderma and wound ointments. Mild nerve/vessel stimulation and dispersing melancholic material are attributed; a mercury-enhanced poultice claim is recorded without validating mercury safety. Honey mixtures for old cough/asthma and foul/retained phlegm, and combinations for hard spleen, throat disease, epilepsy, paralysis, facial palsy, spasm, joint pain and gout appear. Strong purgation at larger quantities, menstruation, expulsion of living/dead fetuses and intestinal worms are historical claims, not pregnancy-use guidance.", "mzr": "The source says “بول الدم” (blood in urine), not anemia or urinary retention. In view of its fetal-expulsion claim, it must not be used for self-treatment during pregnancy.", "msl": "Anise and vinegar.", "bdl": "Jawshir (as named)."}, "ar": {"mzj": "حار في الثالثة يابس في الأولى، كما فصل الأصل الدرجتين.", "mhy": "يصف المصدر صمغ شجرة صغيرة بجذر غليظ كاللفت أو التفاح وقشر ورقي أبيض مصفر وورق كالسدر وزهر صغير كروي رمادي أو أصفر. ويصف رشح الصمغ الراتنجي بعد جرح الجذر أو الغصن وتشقق الأغصان، ويسمي الطازج «طرثوث» ويعطي بالفرك بالماء سائلًا أبيض كاللبن. لونه بني مصفر يسود مع القدم، وباطنه أبيض معتم أو قليل الصفرة؛ رائحته كالسكبينج وطعمه مر خادش.", "khs": "الأفعال القديمة التحليل والتفتيح وإنضاج البلغم والتليين والإسهال والجلاء وإدرار الحيض وقتل ديدان البطن، والنفع الخاص تحليل الأورام الصلبة.", "use": "ترد ضمادات تاريخية للخنازير وصلابة المفاصل وورمها وعقد البواسير، وطلاء بالخل للكلف والبهق والبقع ومراهم الجروح. وينسب إليه تحريك خفيف للعصب والعروق وتحليل المواد السوداوية وتقوية الضماد بالزئبق؛ ليس ذلك إثبات أمان الزئبق. وترد خلطات العسل للسعال القديم والربو وتعفن البلغم وإخراجه، ومع أدوية مناسبة لصلابة الطحال والخناق والصرع والفالج واللقوة والتشنج والمفاصل والنقرس. والإسهال بزيادة المقدار وإدرار الحيض وإخراج الجنين الحي أو الميت والديدان دعاوى تاريخية لا دليل استعمال للحامل.", "mzr": "يقول الأصل «بول الدم»، لا فقر الدم ولا احتباس البول. ومع دعوى إخراج الجنين القديمة لا يستعمل للعلاج الذاتي أثناء الحمل.", "msl": "الأنيسون والخل.", "bdl": "الجاوشير."}}, "extras": {"ps": [["سیمې، ترکیب، مقدار او مرکبات", "کتاب پاکستان/هند پنجاب، ایران او افغانستان یادوي. چاپي ترکیب: ګوند ۲۰٪، رال ۷۰٪، فراري/الوتونکي تېل ۴٪ او نور مواد ۶٪؛ مجموعه ۱۰۰٪ ده. عمومي مقدار «آدھا سے ڈیڑھ گرام (ماشہ)» دئ؛ ګرام او ماشه نه دي سره برابر فرض سوي. مرکبات: مرهم اُشق، ضماد خنازیر وغيره."]], "fa": [["مناطق، ترکیب، مقدار و مرکبات", "پنجاب پاکستان/هند، ایران و افغانستان ذکرند. ارقام چاپی صمغ ۲۰٪، رزین ۷۰٪، روغن فرار ۴٪ و دیگر مواد ۶٪، جمع ۱۰۰٪ است. مقدار «آدھا سے ڈیڑھ گرام (ماشہ)»؛ گرام و ماشه هم‌ارز فرض نشده‌اند. مرهم اشق و ضماد خنازیر ذکرند."]], "ur": [["مقام، اجزا، مقدار و مرکبات", ، د مؤلف قول دئ. دا د سترګو، حمل یا ځان‌درملنې اوسنی لارښود نه دئ.", "mzr": "الاصل «مسقط جنین اور مثانہ کے لیے» لیکي. د جنین او مثانې ضرر جلا ساتل سوی. د قوي توند/خارښناک مادې د داخلي خوراک یا سترګو استعمال د خوندي والي تایید نسته.", "msl": "د بنفشې غوړي او مغز کدو.", "bdl": "جلا نه دی یاد سوی."}, "fa": {"mzj": "گرم و خشک در سوم.", "mhy": "منبع دو صورت یاد می‌کند؛ در یکی شاخه‌های باریک گرد با اصطلاح «چنٹے» آمده. دود بسیار تند در سوختن و ساخت صابون از گیاه ذکر است. رنگ سبزگون تیره و مزه تند خراشنده. حکم قطعی بی‌برگی و فقط خارداشتن از مسودۀ ترجمه بود؛ توصیف کوتاه اصل حدسی بسط داده نشده.", "khs": "افعال سنتی جالی، مدر بول و حیض و مسهل؛ نفع خاص استسقا.", "use": "منبع استعمال‌های تاریخی در احتباس حیض/ادرار، اسقاط جنین و استسقا به سبب مدر/مسهل‌بودن را می‌آورد. زدودن گوشت زائد زخم، عصارۀ عسلی برای قرح و گل چشم و منجن دندان نیز ذکرند. مصرف عرب‌ها به جای صابون و برای پاکی ابریشم رنگی قول کتاب است؛ راهنمای امروزی چشم، بارداری یا خوددرمانی نیست.", "mzr": "اصل «مسقط جنین اور مثانہ کے لیے» دارد؛ ضرر جنین و مثانه جدا حفظ است. ایمنی خوردن یا کاربرد چشمی این مادۀ تند خراشنده تأیید نشده.", "msl": "روغن بنفشه و مغز کدو.", "bdl": "جداگانه ذکر نشده است."}, "ur": {"mzj": "گرم خشک درجہ سوم۔", "mhy": "دو قسمیں درج؛ ایک کے لیے «چنٹے» کا لفظ، باریک و گول شاخیں، جلانے پر تیز دھواں اور صابن سازی لکھی ہے۔ رنگ سبزی مائل سیاہ، ذائقہ تیز خراش دار۔ صرف کانٹے و بالکل بےپتہ ہونے کی قطعی بات ترجمے کا اضافہ تھی؛ مختصر اصل کو قیاس سے نہیں بڑھایا۔", "khs": "افعال جالی، مدر بول و حیض، مسہل؛ نفع خاص استسقاء۔", "use": "بندش حیض/بول، اسقاط جنین اور مدر/مسہل ہونے کی وجہ سے استسقاء کے تاریخی استعمال ہیں۔ زخم کا زائد گوشت و صفائی، قرح چشم/گل چشم میں عصارہ مع شہد، اور چمک دندان کا منجن مذکور۔ عربوں کا بدل صابن اور رنگین ریشمی کپڑے صاف کرنا ماخذ کا قول ہے؛ آنکھ، حمل یا خودعلاج کی موجودہ ہدایت نہیں۔", "mzr": "اصل «مسقط جنین اور مثانہ کے لیے» ہے۔ جنین و مثانہ کا ضرر محفوظ؛ تیز خراشدار مادے کی اندرونی یا آنکھ کی حفاظت مصدقہ نہیں۔", "msl": "روغن بنفشہ و مغز کدو۔", "bdl": "الگ درج نہیں۔"}, "en": {"mzj": "Warm and dry in the third degree.", "mhy": "The book notes two forms, using “چنٹے” for one and describing thin rounded branchlets. It reports very acrid smoke on burning and soap-making use. Colour is greenish-dark and taste pungent/irritant. The draft’s categorical “leafless, only thorns” statement is not substituted for the original’s short description.", "khs": "Traditional actions are cleansing, promoting urine and menstruation, and purging; the particular source claim is ascites.", "use": "Historical accounts concern retained menstruation/urine, abortion, and ascites through attributed diuretic/purgative effects. Removing excessive wound tissue, a honey-extract eye application for ulcers/opacities, and tooth-cleansing powder are described. Use by Arabs in place of soap and for cleaning coloured silk is the book’s account, not current eye, pregnancy or self-treatment guidance.", "mzr": "The original warns of fetal expulsion and harm to the bladder. Safety of swallowing or placing this acrid, irritant material in the eyes is not established.", "msl": "Violet oil and pumpkin-seed kernel.", "bdl": "Not separately stated."}, "ar": {"mzj": "حار يابس في الثالثة.", "mhy": "يذكر الكتاب صورتين ويستعمل لفظ «چنٹے» لإحداهما مع أغصان دقيقة مدورة ودخان شديد الحدة عند الحرق واستعمال في الصابون. اللون أخضر مسود والطعم حاد خادش. ولم يعتمد حكم المسودة القطعي بأنه عديم الورق ولا يحمل إلا الشوك بدل وصف الأصل الموجز.", "khs": "الأفعال القديمة الجلاء وإدرار البول والحيض والإسهال، والنفع الخاص الاستسقاء.", "use": "ترد استعمالات تاريخية لاحتباس الحيض والبول وإسقاط الجنين والاستسقاء لخاصية الإدرار والإسهال المنسوبة. ويذكر إزالة اللحم الزائد وتنظيف الجروح وعصارة بالعسل لقروح العين وغشائها ومسحوقًا لجلاء الأسنان. واستعمال العرب له بدل الصابون وتنظيف الحرير الملون قول المصدر لا إرشاد حالي للعين أو الحمل أو العلاج الذاتي.", "mzr": "يحذر الأصل من إسقاط الجنين وضرر المثانة، ولم يثبت أمان تناول هذه المادة الحادة الخادشة أو وضعها في العين.", "msl": "زيت البنفسج ولب القرع.", "bdl": "غير مذكور مستقلًا."}}, " ن سرخ؛ صمغ اول سفید سپس سرخ. مقدس‌بودن نزد هندوان قول فرهنگی/تاریخی منبع است.", "khs": "افعال سنتی تریاق امراض زنان، قبض/تقویت رحم، دفع اسقاط حمل، قابض و حابس قوی خون، مسکن، کمک منسوب به جوش‌خوردن استخوان، تحلیل ورم، دفع عفونت/تشنج و تقویت عصب؛ تأیید امروزی حفظ بارداری نیست.", "use": "منبع پوست را قابض/حابس و منقی رحم، به‌ویژه در کثرت حیض، ضعف رحم، سیلان و اختناق رحم می‌داند. نسخۀ تاریخی اصل ۱۰ گرام پوست با عبارت چاپی «دودھ دس ملی لیٹر» (۱۰ میلی‌لیتر شیر) و نیم لیتر آب، جوش تا رفتن آب و شیر باقیمانده در سه بخش روزی سه بار، تازه هر روز است. جوشاندۀ سردشدۀ ۱۰ گرام پوست نیز ذکر است. شیرۀ گل در بواسیر خونی/پیچش و عصاره مایع پوست در ضعف عصبی/رحمی زنان، لکوری و کثرت حیض نقل شده‌اند؛ راهنمای خوددرمانی خون‌ریزی یا بیماری رحم نیست.", "mzr": "جداگانه ذکر نشده است.", "msl": "جداگانه ذکر نشده است.", "bdl": "جداگانه ذکر نشده است."}, "ur": {"mzj": "اصل «سرد معتدل خشک درجہ دوم»؛ رام بھیا معتدل لکھتے، نصیر احمد اسے درست کہتے، کبیرالدین سرد خشک لکھتے ہیں۔ اختلاف محفوظ ہے۔", "mhy": "سایہ دار سدا بہار درخت ۱۰–۲۰ فٹ، کثیر شاخیں۔ نرم چوڑے آم جیسے پتے ۳–۶ انچ، کنارے قدرے خم، تازہ سبز خشک سرخ۔ خوشبودار خوبصورت نارنجی/شعلہ نما سرخ پھول برسات تک؛ ۶–۱۰ انچ کی سرس نما پھلی میں چار پانچ، ایک تا ڈیڑھ انچ بیج۔ چھال باہر خاکی/سیاہی مائل اندر سرخ؛ گوند پہلے سفید بعد سرخ۔ ہندؤں کی مقدس شجر نسبت ثقافتی/تاریخی ہے۔", "khs": "تاریخی افعال تریاق امراض نسواں، قبض و تقویت رحم، دفع اسقاط حمل، قابض، قوی حابس الدم، مسکن، ہڈی جوڑنے کی نسبت، محلل ورم، دافع عفونت و تشنج، مقوی اعصاب؛ موجودہ حمل بچانے کی توثیق نہیں۔", "use": "اصل چھال قابض/حابس و منقی رحم خصوصاً کثرت حیض، ضعف، سیلان و اختناق رحم میں لکھتا ہے۔ تاریخی نسخہ دس گرام چھال، مطبوعہ «دودھ دس ملی لیٹر»، نصف لیٹر پانی؛ پانی خشک ہونے کے بعد شیر تین حصے، دن تین بار، روز تازہ۔ سہولت کے لیے دس گرام چھال کا ٹھنڈا جوشاندہ بھی۔ گل شیرہ خونی بواسیر/پیچش، چھال کا مائع ایکسٹریکٹ اعصابی/رحمی کمزوری، لیکوریا و کثرت حیض کے ماخذی اقوال ہیں؛ خودعلاج کی ہدایت نہیں۔", "mzr": "الگ درج نہیں۔", "msl": "الگ درج نہیں۔", "bdl": "الگ درج نہیں۔"}, "en": {"mzj": "The printed wording is “سرد معتدل خشک درجہ دوم” (cool/temperate, dry in the second degree). Ram Bhaiya calls it temperate, a view preferred by Naseer Ahmad; Kabiruddin gives cold and dry. The differing opinions are retained.", "mhy": "A shady evergreen tree about 10–20 feet tall with many branches. Soft broad mango-like leaves are 3–6 inches long, slightly curved at the edge, described as green fresh and red when dry. Attractive fragrant orange/flame-red flowers last until the rainy season; 6–10-inch pods contain four or five seeds, each 1–1.5 inches. Bark is grey/dark outside and red within; gum starts white and turns red. Sacred status among Hindus is the source’s cultural/historical account.", "khs": "Traditional actions are a women’s-disorder antidote, uterine tightening/strengthening, preventing miscarriage, astringency, checking bleeding, pain relief, claimed bone-union support, dispersing swelling, countering infection/spasm and nerve strengthening. These source claims do not validate pregnancy protection.", "use": "The source attributes astringent, bleeding-checking and uterine-cleansing uses to bark, especially for excessive menstruation, uterine weakness, discharge and uterine “suffocation”. Its historical recipe is 10 g bark with the printed “دودھ دس ملی لیٹر” (10 mL milk) and half a litre of water, simmered until water is gone; remaining milk is divided into three daily portions and made fresh daily. A cooled 10-g bark decoction is another account. Flower juice for bleeding piles/dysentery and liquid bark extract for women’s nervous/uterine weakness, leucorrhea and excessive menstruation are source reports, not self-treatment instructions.", "mzr": "Not separately stated.", "msl": "Not separately stated.", "bdl": "Not separately stated."}, "ar": {"mzj": "المطبوع «سرد معتدل خشک درجہ دوم»، أي بارد معتدل يابس في الثانية. ويعده رام بهيا معتدلًا ويفضل نصير أحمد رأيه، ويقول كبير الدين بارد يابس؛ حفظ الخلاف.", "mhy": "شجرة ظليلة دائمة الخضرة نحو ١٠–٢٠ قدمًا كثيرة الأغصان. الورق ډوالي د درملنې تضمین نه دئ."]], "fa": [["مناطق، ترکیب و مقدار چاپی", "فراوانی در سند/هند، پوست اصیل مالابار و اختلاط پوست تقلبی در بنگال اقوال کتاب‌اند. ترکیب Tannin، املای Catachin، اندکی Petroleum Ether Extract و Alcoholic Extract حل‌شونده در آب گرم و Organic Substance. مقدار چاپی سفوف پوست ۳–۴ گرام و جوشانده ۱۰ گرام؛ سیال رب ۷–۱۰ قطره با آب روزانه نقل قدیمی است. مرکب اشوکارشت به عنوان دوای آیورویدی امراض نسوان حمید پشتون. ارقام ۱۰ گرام شیر، ۵–۱۰ گرام جوشانده و شربت همدرد در مسوده مطابق اصل اصلاح شدند."], ["هومیوپاتی و تجربۀ مؤلف", "کاشی‌رام معنی لفظی آشوکا را دورکنندۀ همۀ بیماری‌ها می‌گوید؛ نقل مؤلف است. سردرد/درد رحمی، قطع حیض، درد و سوزش ناف/شکم و مثانه در حیض، تقویت رحم و نظم سریع عادت در بخش هومیوپاتی‌اند. نصیراحمد تجربۀ زنان نابارور، Q پنج قطره روزی سه بار تا ۳–۴ ماه و ادعای خطانکردن را نقل می‌کند. این تجربه و مقدار تاریخی تضمین علمی اثر یا درمان ناباروری نیست."]], "ur": [["مقام، اجزا و مطبوعہ مقدار", "سندھ/بھارت میں کثرت، مالابار کی اصلی چھال اور بنگال میں نقلی کی ملاوٹ ماخذ کا قول۔ Tannin، مطبوعہ Catachin، تھوڑا Petroleum Ether Extract، گرم پانی میں حل Alcoholic Extract و Organic Substance درج ہیں۔ چھال سفوف ۳–۴ گرام، جوشاندہ دس گرام؛ سیال رب ۷–۱۰ قطرے پانی کے ساتھ روز کا قدیم نقل۔ مرکب اشوکارشت، حمید پشتون کی امراض نسواں آیورویدی دوا۔ ترجمے کے دس گرام دودھ، ۵–۱۰ گرام جوشاندہ و ہمدرد شربت اصل کے مطابق بدلے ہیں۔"], ["ہومیوپیتھی و تجربۂ مصنف", "کاشی رام کا لفظی معنی تمام بیماریوں کو دور کرنے والا، مصنف کا نقل ہے۔ رحم کے سردرد/درد، بندش حیض، حیض میں ناف/پیٹ و مثانہ درد و جلن، تقویت رحم و جلد اصلاح عادت ہومیوپیتھی حصے میں ہیں۔ نصیر احمد بانجھ خواتین کا ذاتی تجربہ، Q پانچ قطرے دن تین بار تین چار ماہ اور خطا نہ کرنے کا دعویٰ نقل کرتے ہیں؛ یہ سائنسی ثبوت یا بانجھ پن کی ضمانت علاج نہیں۔"]], "en": [["Regions, composition and printed quantities", "Abundance in Sindh/India, genuine Malabar bark and adulterated Bengal bark are source statements. Composition names tannin, printed Catachin, small petroleum-ether and alcohol extracts (the latter dissolving in hot water),  الورق كثير التقطيع والتسنن مشبه بالمجوي ومغطى بشعر أبيض حريري لين من الجانبين. والزهر صغير كروي مصفر كثير على الأغصان. الورق والزهر مستعملان وكل الأجزاء حادة الرائحة مرة. ويقول الأصل أنواع كثيرة لا ثلاثين.", "khs": "الأفعال القديمة التحليل والتفتيح وإدرار البول والحيض وقتل ديدان البطن والتسكين وتقوية المعدة والكبد والدماغ ودفع الحمى؛ والنفع الخاص للحمى النوبية والبلغمية.", "use": "ترد روايات للمغلي في ورم الكبد والاستسقاء والحمى المزمنة والنوبية وضعف الهضم وخاصة الديدان الطويلة، وطلاء المسحوق بالعسل لبقع الجلد، ونسب لضعف الدماغ والصرع والرعشة والفالج واللقوة والاسترخاء والأمراض العصبية والريحية والبواسير. ويذكر بخار المغلي للمراق والماليخوليا. وترد الكبد والطحال والحمى واحتباس البول والحيض، وتحضير بزيت اللوز بعد تبخر الماء لقروح الأذن وألمها وشوائبها، والتبخير للحشرات وصيانة الملابس والكتب من العث وتقليل رائحة الحبر؛ لا يثبت هذا العلاج الحالي لتلك الأمراض.", "mzr": "يذكر الأصل الصداع. لا توصي EMA به للحمل والإرضاع ودون ١٨ سنة وتمنعه لانسداد الصفراء ومرض الكبد؛ وقد يسبب الثوجون في الزيت اختلاجات.", "msl": "شراب الرمان والأنيسون.", "bdl": "غير مذكور مستقلًا."}}, "extras": {"ps": [["سیمې، چاپي ترکیب، مقدار او مرکبات", "بلوچستان، چترال، ګلګت، افغانستان ۵۰۰۰–۷۰۰۰ فوټه، د هند اترپرادېش، غرونه، تبت، افریقا، امریکا، اروپا او سایبریا د سرچینې سیمې دي. اصل د Absinthol په چاپي نوم «ڈیڑھ فیصدی» (۱.۵٪) فراري تېل یادوي. نیم فیصد تریخ جوهر Absinthin، ۵٪ رال، لږ ټینین او د اوسپنې په شان فلزونه یادوي؛ د فاسفورس زیاتونه په اصل کې نه ده. مقدار «دو سے پانچ گرام (ماشہ)». مرکبات: عرق افسنتین؛ د لاهور طبیه کالج سفوف افسنتین؛ او د سواسوریا لایپا/راسن له نوم سره د طب آیورویدي مجلس سفوف افسنتین."]], "fa": [["مناطق، ترکیب چاپی، مقدار و مرکبات", "بلوچستان، چترال، گلگت، افغانستان ۵۰۰۰–۷۰۰۰ فوت، اترپردیش، کوهستان، تبت، افریقا، امریکا، اروپا و سیبری مناطق منبع‌اند. اصل روغن فرار با نام چاپی Absinthol را «ڈیڑھ فیصدی» (۱٫۵٪) می‌نویسد. نیم درصد Absinthin، رزین ۵٪، اندکی تانن و فلزاتی چون آهن ذکر است، نه افزودۀ فسفر. مقدار «دو سے پانچ گرام (ماشہ)». عرق افسنتین، سفوف کالج طبیه لاهور و سفوف مجلس آیوروید با ذکر سواسوریا لایپا/راسن آمده‌اند."]], "ur": [["مقام، مطبوعہ اجزا، مقدار و مرکبات", "بلوچستان، چترال، گلگت، افغانستان ۵۰۰۰–۷۰۰۰ فٹ، اترپردیش، پہاڑ، تبت، افریقہ، امریکا، یورپ، سائبیریا ماخذ کے مقام۔ اصل Absinthol نام کا روغن فراری «ڈیڑھ فیصدی» (۱٫۵٪) لکھتا ہے۔ Absinthin نصف فیصد، رال پانچ فیصد، کچھ ٹینن و لوہا جیسے دھاتیں، فاسفورس اضافہ نہیں۔ مقدار «دو سے پانچ گرام (ماشہ)»۔ عرق افسنتین، لاہور طبیہ کالج سفوف و طب آیورویدی مجلس کا سواسوریا لایپا/راسن کے ذکر والا سفوف درج ہے۔"]], "en": [["Regions, printed chemistry, quantity and preparations", "Source regions include Balochistan, Chitral, Gilgit, Afghanistan at 5,000–7,000 feet, UP, mountains, Tibet, Africa, America, Europe and Siberia. The source prints volatile oil named Absinthol at “ڈیڑھ فیصدی” (1.5%). The source also prints half-percent Absinthin, resin 5%, some tannin and metals such as iron; added phosphorus was not retained. Quantity reads “دو سے پانچ گرام (ماشہ)”. Preparations are Arq Afsantin, Lahore Tibbia College’s powder and an Ayurvedic-council powder naming Saussurea lappa/rasan."]], "ar": [["المناطق والكيمياء المطبوعة والمقدار والمركبات", "مناطق المصدر بلوشستان وچترال وگلگت وأفغانستان على ٥٠٠٠–٧٠٠٠ قدم وأترپرديش والجبال والتبت وأفريقيا وأمريكا وأوروبا وسيبيريا. يطبع المصدر الزيت الطيار باسم Absinthol بنسبة «ڈیڑھ فیصدی» (١٫٥٪). ويطبع Absinthin نصف بالمئة وراتنج ٥٪ وقليل التانين ومعادن كالحديد دون الفوسفور المضاف. والمقدار «دو سے پانچ گرام (ماشہ)». والمركبات عرق أفسنتين ومسحوق كلية الطب بلاهور ومسحوق المجلس الأيورفيدي بذكر سواسوريا لايپا/راسن."]]}, "photo_slots": 4, "photos": "empty as requested", "languages": ["ps", "fa", "ur", "en", "ar"], "status": "organized_text_reviewed", "complete_source_text_verified": true, "reading_blocks": [], "unresolved_source_readings": [], "scientific_as_printed": "Artemisia Absinthium", "source_family": "N.O. Compositae", "safety_source": "https://www.ema.europa.eu/en/documents/herbal-report/final-assessment-report-artemisia-absinthium-l-herba-revision-1_en.pdf", "safe ، د لوږې کمول، حابس الدم، د تبې دفع، مقوي، مخدر او د ګرم ورم منسوب دفع. د چاپ «مانع نزول» د زکام/ریزش په بحث کې راغلی؛ مدر بول د پښتو مسودې زیاتونه وه. ځانګړې نفع د خوب او درد ارامول ده.", "use": "اصل د سر/اعصابو درد، ذات‌الجنب، مفصل، غوږ/غاښ، د سترګې رمد او عرق‌النساء درد ته مسکن، او د سرسام، مالیخولیا او جنون د بې‌خوبۍ لپاره منوم استعمال نقلوي. د معدې/کولمو د رطوبت وچول، د اشتها/هضم کمول، قبض او د کولمو د حرکت سستول، د صفراوي ترشح/ځیګر او زیړي زاړه تعبیرونه هم د مؤلف اقوال دي. په لږ/ډېر مقدار د زړه د تحریک/ضعف توپیر د کتاب ادعا ده. اسهال، پیچش، وینې بهېدل، په تود پیچش کې د مسهل له لارې د موادو وتل، د زوړ ټوخي او د سږو د شپې ټوخي خوب، زکام/ریزش، باه او سرعت انزال ته د ممسک استعمال ټول تاریخي معلومات دي. د اسقاط د مخنیوي قول او د زېږون وروسته د رحم له دننه د وینې/درد په اړه د نصیر احمد احتیاط دواړه ساتل سوي: دی یې له زېږون وروسته مضر بولي. پرله‌پسې استعمال د عادت او د پرېښودو د سختۍ سبب بولي؛ د ماشومانو پخوانی لږ استعمال او د ژر عادت کېدو خبرداری هم شته. دا د ماشوم، حمل، درد یا ټوخي د ځان‌درملنې سپارښتنه نه ده.", "mzr": "کتاب د بدن ضعف، باه ته ضرر، قبض او عادت یادوي. اوسنی احتیاط: د ساه ورو کېدل او بې‌هوښي د مرګوني اوپیوایډ مسمومیت نښې دي؛ عاجله طبي مرسته، د ساه ملاتړ او پر وخت نالوکسان اړین دي (WHO).", "msl": "چاپي نوم «جندبیدستر»، زعفران او شیدې وغيره. سپین صندل او بادام د دې کرښې د اصل نومونه نه دي.", "bdl": "اجواین خراساني؛ دا Hyoscyamus/بنج دئ، بادیان یا سونف نه دي."}, "fa": {"mzj": "در منبع سرد و خشک در چهارم.", "mhy": "شیرۀ مربوط به غوزۀ گیاه با خشکی مادۀ قهوه‌ای/تیره می‌دهد. اصل گیاه یک‌ساله حدود یک گز، ساقۀ باریک راست، برگ پهن دراز نرم با لبۀ خمیده، گل زیبای سفید/آبی/بنفش، میوه حدود یک ماه پس از گل و غوزۀ زرد در رسیدگی را توصیف می‌کند. غوزه‌های گرد/بیضوی بسته به ساقه و تخم ریز ذکرند. رنگ بذر با رنگ گل مرتبط دانسته شده و غوزۀ کوچک گل آبی افیون بیشتر نسبت داده شده؛ قول کتاب است. مزه تلخ و نشه‌دار. توصیف گردآوری شیرۀ اصل به راهنمای عملی جدید تبدیل نشده.", "khs": "افعال منبع منوم، مسکن، قابض و کاهندۀ اشتهای اعضا و گرسنگی، حابس خون، دافع تب، مقوی، مخدر و نسبت دفع ورم گرم است. مانع نزول در بحث زکام/ریزش آمده؛ مدر بول افزودۀ مسوده بود. نفع خاص خواب و تسکین درد است.", "use": "اصل مصرف مسکن در درد سر/عصب، ذات‌الجنب، مفصل، گوش/دندان، رمد و عرق‌النسا و منوم در بی‌خوابی سرسام، مالیخولیا و جنون را نقل می‌کند. خشکی رطوبت معده/روده، کاهش اشتها/هضم، قبض و کندی حرکت روده و تعبیرهای قدیمی ترشح صفرا/کبد و یرقان نیز اقوال مؤلف‌اند. تفاوت تحریک/ضعف قلب در کم/زیاد ادعای کتاب است. اسهال، پیچش، خون‌ریزی، اخراج مواد با مسهل در پیچش گرم، خواب در سرفۀ کهنه/شبانه ریوی، زکام و ممسک باه/انزال زودرس تاریخ‌اند. قول جلوگیری اسقاط و هشدار نصیراحمد دربارۀ ضرر پس از زایمان به سبب خون داخلی رحم هر دو حفظ شده‌اند. عادت با مصرف متوالی و دشواری ترک، مصرف قدیمی کم در کودک و هشدار عادت سریع ذکرند؛ نه تجویز خوددرمانی کودک، بارداری، درد یا سرفه.", "mzr": "اصل ضعف بدن، ضرر باه، قبض و عادت را ذکر می‌کند. احتیاط کنونی: کندی تنفس و بیهوشی می‌تواند تسمم کشندۀ اوپیوئید باشد؛ کمک عاجل، حمایت تنفس و نالوکسان به‌موقع لازم است (WHO).", "msl": "نام چاپی جندبیدستر، زعفران و شیر و غیره؛ صندل سفید و بادام در این سطر اصل نیستند.", "bdl": "اجواین خراسانی، یعنی بنگ/Hyoscyamus، نه بادیان."}, "ur": {"mzj": "ماخذ میں سرد و خشک درجہ چہارم۔", "mhy": "غوزے سے متعلق شیرہ خشک ہو کر بھورا/سیاہی مائل مادہ۔ اصل یک سالہ قریب ایک گز پودا، سیدھا پتلا تنا، چوڑے لمبے نرم کنگرے دار پتے، سفید/نیلے/بنفشی خوبصورت پھول، قریب ماہ بعد پھل اور پکنے پر زرد غوزہ بیان کرتا ہے۔ گول/بیضوی ڈوڈے ڈنٹھل پر اور چھوٹے بیج؛ رنگ تخم کو گل سے مربوط اور نیلے گل کی چھوٹی ڈوڈی میں افیون زیادہ نسبت ہے۔ ذائقہ تلخ و نشیلا۔ اصل کی شیرہ جمع کرنے کی تفصیل کو نیا عملی طریقہ نہیں بنایا گیا۔", "khs": "افعال منوم، مسکن اوجاع، قابض اشتہائے اعضاء، شدت بھوک گھٹانا، حابس الدم، دافع بخار، مقوی، مخدر و مانع ورم گرم۔ مانع نزول، زکام/ریزش کے باب میں؛ مدر بول ترجمے کا اضافہ تھا۔ نفع خاص منوم و مسکن۔", "use": "اصل سر/اعصاب، ذات الجنب، مفاصل، کان/دانت، رمد و عرق النساء درد کا مسکن، سرسام/مالیخولیا/جنون کی بےخوابی کا منوم نقل کرتا ہے۔ رطوبات معدہ/امعا خشک، اشتہا/ہضم کم، قبض و حرکت آنت سست، صفراوی ترشح/جگر و یرقان کی قدیم تعبیرات بھی اقوال ہیں۔ کم/زیادہ مقدار میں تحریک/ضعف قلب کتاب کا دعویٰ۔ اسہال، پیچش، خون بند، گرم پیچش میں مسہل کے ساتھ اخراج، پرانی/رات کی ریوی کھانسی میں نیند، زکام/ریزش، باہ و سرعت انزال کا ممسک تاریخی معلومات ہیں۔ دفع اسقاط کا قول اور وضع حمل کے بعد اندرونی رحمی خون کے باعث ضرر پر نصیر احمد کی تنبیہ دونوں محفوظ۔ مسلسل استعمال کا عادی و مشکل ترک، بچوں میں پرانا کم استعمال و جلد عادت بھی؛ بچوں، حمل، درد یا کھانسی کا خودعلاج نہیں۔", "mzr": "اصل ضعف بدن/باہ، قبض و عادت لکھتا ہے۔ موجودہ احتیاط: سست سانس و بےہوشی مہلک اوپیوئڈ زہریت ہو سکتی؛ فوری طبی مدد، سانس کی معاونت و بروقت نالوکسان ضروری (WHO)۔", "msl": "جندبیدستر، زعفران و دودھ وغیرہ۔ سفید صندل و بادام اصل سطر میں نہیں۔", "bdl": "اجوائن خراسانی، Hyoscyamus/بنج؛ بادیان/سونف نہیں۔"}, "en": {"mzj": "Cold and dry in the fourth degree in the source.", "mhy": "Latex associated with the capsule dries into brown/dark material. The source describes an annual about one gaz high with a slender straight stem, broad long soft scalloped leaves, white/blue/violet flowers, fruit roughly a month after flowering and yellow ripe capsules. Round/oval stalked capsules and tiny seeds are noted. It links seed colour with flower colour and attributes more opium to small blue-flowered capsules; these are book descriptions. Taste is bitter/intoxicating. The source’s collection account is not converted into a new practical production guide.", "khs": "Source actions are inducing sleep, relieving pain, astringency/reducing organ appetite and hunger, checking bleeding, reducing fever, strengthening, narcotic action and preventing hot swelling. “Preventing descent” belongs to the catarrh account; promoting urine was added in the draft. Particular claims are sleep and pain relief.", "use": "Historical uses include analgesia for headache, nerve pain, pleurisy, joints, ear/tooth pain, inflamed eyes and sciatica, and sleep induction in delirium, melancholia and insanity. Drying digestive moisture, reduced appetite/digestion, constipation, slowed bowel movement and older liver/bile/jaundice explanations are the author’s accounts. Contrasting small/large-quantity cardiac effects are source claims. Diarrhea, dysentery, bleeding, use with a purgative in hot dysentery, sleep during chronic/night-time lung cough, catarrh and delayed ejaculation are historical uses. Both a miscarriage-prevention claim and Naseer Ahmad’s warning against postpartum use because of uterine blood are retained. Repeated-use dependence, difficulty stopping, old small-quantity pediatric use and rapid habituation warnings also appear. None is advice for self-treating children, pregnancy, pain or cough.", "mzr": "The book notes weakness, sexual harm, constipation and habituation. Slow breathing/unconsciousness may signal fatal opioid poisoning; seek urgent medical help, breathing support and timely naloxone (WHO).", "msl": "Printed jund bedastar, saffron and milk, etc.; white sandalwood and almonds are not in the original line.", "bdl": "Ajwain khurasani (henbane/Hyoscyamus), not fennel or anise."}, "ar": {"mzj": "بارد يابس في الرابعة بحسب المصدر.", "mhy": "يعطي اللبن المرتبط بكبسولة النبات مادة بنية داكنة عند الجفاف. يصف الأصل نباتًا حوليًا نحو غز بساق دقيقة مستقيمة وأوراق عريضة طويلة لينة مسننة وزهر أبيض أو أزرق أو بنفسجي وثمر بعد نحو شهر وكبسولات صفراء ناضجة. ويذكر غلافًا كرويًا أو بيضويًا بسويقة وبذرًا صغيرًا ويربط لونه بلون الزهر وينسب الأفيون الأكثر إلى غوزة الزهر الأزرق الصغيرة؛ أوصاف مصدرية. الطعم مر مسكر. ولم يحول وصف جمع اللبن إلى دليل إنتاج عملي جديد.", "khs": "الأفعال بالمصدر التنويم والتسكين والقبض وتقليل شهية الأعضاء والجوع وحبس الدم ودفع الحمى والتقوية والتخدير ودفع الورم الحار. ومانع النزول في باب الزكام والرشح؛ إدرار البول إضافة المسودة. والنفع الخاص النوم وتسكين الألم.", "use": "ترد استعمالات تاريخية لتسكين الصداع وألم العصب وذات الجنب والمفصل والأذن والسن والرمد وعرق النسا وللتنويم في السرسام والماليخوليا والجنون. وتجفيف رطوبة الهضم وتقليل الشهية والهضم والقبض وإبطاء الأمعاء والتفسيرات القديمة للكبد والصفراء واليرقان أقوال المؤلف. وتباين تأثير القلب في القليل والكثير دعوى مصدرية. والإسهال والزحير والنزف والاستعمال مع مسهل في الزحير الحار والنوم لسعال الرئة الليلي والمزمن والزكام وتأخير القذف استعمالات تاريخية. وحفظت دعوى منع الإسقاط وتحذير نصير أحمد من ضرره بعد الولادة بسبب الدم داخل الرحم معًا. ويذكر الاعتياد وصعوبة الترك والاستعمال القديم القليل للأطفال وسرعة اعتيادهم؛ ليس ذلك نصحًا للعلاج الذاتي للطفل أو الحمل أو الألم أو السعال.", "mzr": "يذكر الأصل الضعف وضرر الباه والقبض والاعتياد. بطء التنفس وفقد الوعي قد يعنيان تسممًا أفيونيًا قاتلًا؛ تلزم مساعدة طبية عاجلة ودعم التنفس والنالوكسون في الوقت المناسب (WHO).", "msl": "الاسم المطبوع جندبيدستر والزعفران واللبن وغيرها؛ ليس الصندل الأبيض واللوز في سطر الأصل.", "bdl": "أجواين خراساني، أي البنج/Hyoscyamus، لا الشمر ولا اليانسون."}}, "extras": {"ps": [["سیمې او د کتاب تاریخي حقوقي یادونه", "سرحد، راجستان، پنجاب، اترپرادېش، مدهیه پرادېش/مالوه، آسام، نیپال، فارس او مصر یاد سوي. د جواز او د حکومت د څارنې د کرنې خبره د کتاب د وخت بیان دئ، د افغانستان یا بل هېواد د اوسني قانون تفسیر نه دئ. د زینت لپاره کرنه هم د کتاب قول ده؛ دلته د کرلو یا راټولولو عملي لارښود نه دئ ورکړل سوی."], ["د مسمومیت پخوانۍ برخه: تاریخي ارزونه", "د کتاب نښې: د سترګو وړې کسۍ، سوړ/خوله‌ناک پوستکی، د مخ/شونډو شینوالی، د تنفس او زړه ورو کېدل، اوږده خرېدا او بې‌هوښي. د معدې نل، پوټاشیم پرمنګنیټ، نه ویده کول، سړې پټۍ، امونیا/تنفسي محرکات او تریاقي مخلوطونه د هغه وخت پروتوکولونو په توګه یاد سوي؛ دلته یې عملي نسبتونه/طریقه نه دي د عاجل علاج په بڼه وړاندې سوي. د ناروغ کانګې راوستل یا په خوله جبري مایعات ورکول په ځانګړي ډول د بې‌هوښۍ پر مهال خطرناک دي؛ د اصل برخه باید د اوسني طبي عاجل خدمت بدیل ونه ګڼل سي."], ["چاپي کیمیا او تاریخي ادعاوې", "اصل مارفین ۵–۱۲٪ لیکي؛ نورې چاپي کرښې «کوڈین تین سے تین فیصد»، «پے پورین اعشاریہ پانچ سے ایک فیصد» او «نارسی این اعشاریہ دو (2ء) ایک فیصد تک» دي. ورکې اعشاریې نه دي اټکل سوي؛ پاتې چاپي نومونه ګلوکوز، پروټین، میکونین/میکونیک اسید، قند، رزین، هایدروکوټارین، رایادین او نامعلومه املا لرونکي نور نومونه دي. د «۲۵ الکالایډونو» او «نیکوتین» زیاتونې د اصل پر ځای نه دي ساتل سوي. بله «ثانویه الکلایډز» کرښه هم، د مارفین/اپوکوډین او کوډین له مشتقاتو سره، د کتاب زوړ نقل دئ؛ اوسنی تحلیلي معیار نه دئ. ګلوکوز نژدې ۱۰٪، نشایسته، لطیف تېل، کلسیم/مګنیزیم مالګې او خوشبویه اجزا یادوي. د اخراج په برخه کې عرق/پیشاب او په ځیګر کې د «ډای مارفین» بدلېدو ادعا د اصل زوړ قول دئ؛ د انساني میتابولیزم تایید سوی بیان نه دئ."], ["تاریخ، چاپي مقدار او د مؤلف تجربه", "کتاب د چین/هند/پاکستان د استعمال، د عرب سوداګرو له لارې چین ته د رسېدو د ۱۴مې پېړۍ قول، د اکبر د قوانینو او د ۱۹۸۷–۱۹۸۸ د ۸۶ لکو «نشې عادیانو» اټکل نقلوي. دا د کتاب تاریخي نسبتونه دي، نه اوسني احصایې؛ له دې څخه ۸۶ لکه یوازې د افیون کاروونکي نه دي جوړ سوي. «هیروین» ته د اوښتو قول هم په خپل وخت پورې تړلی دئ. چاپي مقدار «دو چاول سے ایک رتی تک» دئ؛ د غنمو دانه یا ۵۰–۱۰۰ ملي‌ګرامه نه دئ په اټکل بدل سوی. مرکبات: معجون برشعثا، حب پیچش، حب سل، قرص مثلث، حب سعالطو (د طب نبوي دواخانه چاپي نوم). نصیر احمد د وروستي مرکب د زکام/ټوخي، د ماشومانو لپاره د میده ګولۍ له تودو اوبو/شیدو سره، او د معدې د بې‌قرارۍ خپله تجربه نقل کوي؛ دا د ماشوم لپاره خوندي استعمال نه ثابتوي. د سوځېدو/حل کېدو او له ایلوې/پوست سره د ساتلو تر «۵۰ کلونو» د قوت جمله هم د کتاب ازمایښتي نه تایید سوی پخوانی قول دئ، د کیفیت معیار یا عملي ساتنې سپارښتنه نه ده."]], "fa": [["مناطق و یادداشت حقوقی تاریخی کتاب", "سرحد، راجستان، پنجاب، اترپردیش، مدھیه‌پردیش/مالوه، آسام، نیپال، فارس و مصر ذکرند. جواز و نظارت دولت در کشت، بیان زمان کتاب است، نه شرح قانون فعلی افغانستان یا کشور دیگر. کشت زینتی نیز قول منبع است؛ راهنمای عملی کاشت یا گردآوری ارائه نشده."], ["بخش قدیمی تسمم: ارزیابی تاریخی", "علایم کتاب مردمک ریز، پوست سرد عرق‌دار، کبودی صورت/لب، کندی تنفس و قلب، خرخر طولانی و بیهوشی‌اند. لولۀ معده، پرمنگنات، بیدار نگه‌داشتن، کمپرس سرد، آمونیا/محرک تنفسی و مخلوط تریاقی پروتوکول‌های قدیمی منبع‌اند؛ نسبت و روش آن‌ها به دستور عاجل تبدیل نشده. واداشتن به استفراغ یا دادن اجباری مایعات خصوصاً در بیهوشی خطرناک است؛ این بخش جایگزین خدمت عاجل طبی نیست."], ["کیمیای چاپی و ادعاهای تاریخی", "اصل مورفین ۵–۱۲٪ دارد؛ سطرهای دیگر «کوڈین تین سے تین فیصد»، «پے پورین اعشاریہ پانچ سے ایک فیصد» و «نارسی این اعشاریہ دو (2ء) ایک فیصد تک» هستند؛ اعشار افتاده حدسی تکمیل نشده؛ نام‌های دیگر گلوکوز، پروتئین، میکونین/اسید میکونیک، قند، رزین، هیدروکوتارین، رایادین و نام‌های چاپی ناروشن‌اند. افزودن ۲۵ آلکالوئید و نیکوتین جای اصل نشده. سطر آلکالوئید ثانویه با مشتقات مورفین/اپوکودئین/کودئین نقل قدیمی است نه معیار تحلیلی امروز. گلوکوز حدود ۱۰٪، نشاسته، روغن لطیف، نمک کلسیم/مگنیزیم و مواد خوشبو ذکرند. ادعای اخراج عرق/ادرار و تبدیل کبدی به «دای مارفین» قول قدیمی منبع است نه شرح تأییدشدۀ متابولیسم انسانی."], ["تاریخ، مقدار چاپی و تجربۀ مؤلف", "کتاب استعمال چین/هند/پاکستان، قول رسیدن به چین از راه تاجران عرب در قرن۱۴، قوانین اکبر و برآورد ۸۶ لک معتاد مواد در ۱۹۸۷–۱۹۸۸ را نقل می‌کند. این‌ها نسبت‌های تاریخی‌اند، نه آمار امروز یا ۸۶ لک فقط مصرف‌کنندۀ افیون. گذار به هیروئین نیز قول دورۀ کتاب است. مقدار «دو چاول سے ایک رتی تک» است؛ به دانۀ گندم یا ۵۰–۱۰۰ میلی‌گرام حدسی بدل نشده. معجون برشعثا، حب پیچش، حب سل، قرص مثلث و حب سعالطو نام‌های مرکبات‌اند. تجربۀ نصیراحمد در زکام/سرفه، قرص خرد برای کودک با آب/شیر گرم و ناآرامی معده نقل شده و ایمنی کودک را ثابت نمی‌کند. سوختن/حل‌شدن و قوت تا۵۰ سال با ایلوه/پوست ادعای قدیمی تأییدنشده است، نه معیار کیفیت یا روش نگهداری امروز."]], "ur": [["مقام اور کتاب کا تاریخی قانونی نوٹ", "سرحد، راجستھان، پنجاب، اترپردیش، مدھیہ پردیش/مالوہ، آسام، نیپال، فارس و مصر درج ہیں۔ لائسنس و حکومتی نگرانی کتاب کے زمانے کا بیان، افغانستان یا دیگر ملک کے موجودہ قانون کی تشریح نہیں۔ آرائشی کاشت بھی ماخذ کا قول؛ عملی کاشت/جمع طریقہ نہیں۔"], ["زہریت کا قدیم حصہ: تاریخی جائزہ", "کتاب کی علامات چھوٹی پتلیاں، ٹھنڈی پسینے والی جلد، چہرہ/لب نیلا، سست سانس و قلب، طویل خراٹے و بےہوشی ہیں۔ معدی نل، پرمنگنیٹ، جگانا، سرد پٹیاں، امونیا/تنفسی محرک اور تریاقی آمیزے قدیم پروٹوکول ہیں؛ نسبت/طریقہ موجودہ ہنگامی ہدایت نہیں بنایا۔ قے کرانا یا زبردستی مائع خصوصاً بےہوشی میں خطرناک؛ پرانا حصہ فوری طبی خدمت کا بدل نہیں۔"], ["مطبوعہ کیمیا و تاریخی دعوے", "اصل مارفین ۵–۱۲٪؛ دیگر عبارات «کوڈین تین سے تین فیصد»، «پے پورین اعشاریہ پانچ سے ایک فیصد»، «نارسی این اعشاریہ دو (2ء) ایک فیصد تک» ہیں، گم شدہ اعشاریہ قیاس سے نہیں ڈالا؛ دیگر گلوکوز، پروٹین، میکونین/میکونک ایسڈ، قند، رزین، ہائیڈروکوٹارین، رایادین و کچھ غیرمعیار مطبوعہ نام۔ ۲۵ الکلائڈ و نیکوتین کے اضافے اصل کا بدل نہیں۔ ثانوی الکلائڈز و مورفین/اپوکوڈین/کوڈین مشتقات کی کرن بھی قدیم نقل، موجودہ تجزیاتی معیار نہیں۔ گلوکوز قریب۱۰٪، نشاستہ، لطیف روغن، کیلشیم/میگنیشیم نمک و خوشبو اجزا مذکور۔ اخراج عرق/پیشاب و جگر میں «ڈائی مارفین» تبدیل ہونے کا قول قدیم، مصدقہ انسانی میٹابولزم نہیں۔"], ["تاریخ، مطبوعہ مقدار و تجربۂ مصنف", "چین/ہند/پاکستان استعمال، عرب تجار سے چین کو چودھویں صدی کا قول، اکبر قوانین و ۱۹۸۷–۱۹۸۸ کے چھیاسی لاکھ نشہ عادی ماخذ کے تاریخی نسبت، موجودہ اعداد یا صرف افیون استعمال کنندگان نہیں۔ ہیروئن کی طرف رجوع بھی اسی وقت کا قول۔ مقدار «دو چاول سے ایک رتی تک»، گندم دانہ یا ۵۰–۱۰۰ ملی گرام کی قیاسی تبدیلی نہیں۔ معجون برشعثا، حب پیچش، حب سل، قرص مثلث، حب سعالطو طب نبوی دواخانہ کے نام۔ نصیر احمد کا زکام/کھانسی، بچے کی باریک گولی گرم پانی/دودھ اور معدہ بےقراری کا تجربہ نقل، بچوں کی حفاظت ثابت نہیں۔ جلنا/حل و ایلوا/پوست سے پچاس سال قوت، غیرمصدقہ قدیم قول، موجودہ معیار/طریقہ حفاظت نہیں۔"]], "en": [["Regions and the book’s historical legal note", "The source lists the Frontier, Rajasthan, Punjab, UP, Madhya Pradesh/Malwa, Assam, Nepal, Persia and Egypt. Licensing and state supervision are the book’s period account, not a statement of current Afghan or other national law. Ornamental growing is also a source statement; no practical cultivation or collection guide is supplied."], ["Old poisoning section: historical appraisal", "The source signs are tiny pupils, cold sweaty skin, blue face/lips, slow breathing/heart, prolonged snoring and unconsciousness. Stomach tubes, permanganate, enforced wakefulness, cold compresses, ammonia/respiratory stimulants and antidotal mixtures belong to its old protocols; their ratios/procedures are not presented as emergency instructions. Inducing vomiting or forcing oral fluids, especially during unconsciousness, is dangerous; the historical section is not a substitute for emergency medical care."], ["Printed chemistry and historical claims", "The original gives morphine 5–12%; other printed lines are “کوڈین تین سے تین فیصد”, “پے پورین اعشاریہ پانچ سے ایک فیصد” and “نارسی این اعشاریہ دو (2ء) ایک فیصد تک”. Missing decimals have not been inferred; other printed names include glucose, protein, meconin/meconic acid, sugar, resin, hydrocotarnine, rhoeadine and nonstandard spellings. The draft’s 25-alkaloid and nicotine additions are not substituted for the original. A secondary-alkaloid line with morphine/apocodeine/codeine derivatives is historical, not a current assay standard. Glucose around 10%, starch, light oil, calcium/magnesium salts and aromatic material are mentioned. The source’s sweat/urine excretion and liver conversion to “di-morphine” claim is not a validated account of human metabolism."], ["History, printed quantity and author experience", "Historical attributions concern China/India/Pakistan, Arab traders reaching China in the fourteenth century, Akbar’s rules and an estimate of 86 lakh people habituated to intoxicants in 1987–1988. These are not present statistics or a count restricted to opium users; the heroin-transition statement is also period-specific. Quantity reads “دو چاول سے ایک رتی تک” (two rice-grain units to one ratti), not a wheat grain or an inferred 50–100 mg. Preparations named are Majun Barshasha, Habb Pechish, Habb Sil, Qurs Muthallath and printed Habb Sualto of the Tibb Nabawi dispensary. Naseer Ahmad’s cough/catarrh, powdered-child-pill with warm water/milk and stomach-distress experiences are retained as unvalidated personal accounts, not pediatric safety evidence. Burning/solubility and fifty-year potency with aloe/capsule material are unverified historical claims, not a quality standard or storage recommendation."]], "ar": [["المناطق وملاحظة الكتاب القانونية التاريخية", "تذكر سرحد وراجستان والبنجاب وأترپرديش ومدهيا پرديش ومالوه وآسام ونيبال وفارس ومصر. والترخيص وإشراف الدولة على الزراعة وصف زمن الكتاب لا تفسير القانون الأفغاني أو غيره حاليًا. والزراعة للزينة قول المصدر أيضًا؛ لم يقدم دليل عملي للزراعة أو الجمع."], ["قسم التسمم القديم: تقييم تاريخي", "علامات المصدر ضيق الحدقتين وبرودة الجلد وتعرقه وزرقة الوجه والشفتين وبطء التنفس والقلب والشخير الطويل وفقد الوعي. وأنبوب المعدة والبرمنغنات والإيقاظ والكمادات الباردة والأمونيا والمنبهات التنفسية والخلطات الترياقية بروتوكولات قديمة؛ لم تقدم نسبها وطرائقها كإرشادات إسعافية. تحريض القيء أو إجبار المغمى عليه خصوصًا على السوائل خطر؛ ولا يحل القسم التاريخي محل الرعاية الإسعافية."], ["الكيمياء المطبوعة والدعاوى التاريخية", "يعطي الأصل مورفين ٥–١٢٪ والأسطر الأخرى «کوڈین تین سے تین فیصد» و«پے پورین اعشاریہ پانچ سے ایک فیصد» و«نارسی این اعشاریہ دو (2ء) ایک فیصد تک» دون افتراض فواصل عشرية مفقودة، وأسماء أخرى منها الغلوكوز والبروتين والميكونين وحمض الميكونيك والسكر والراتنج والهيدروكوتارنين والرايادين ورسوم غير معيارية. لم تستبدل بالأصل إضافتا ٢٥ قلويدًا والنيكوتين بالمسودة. وسطر القلويدات الثانوية ومشتقات المورفين والأبوكودين والكودين نقل قديم لا معيار تحليل حالي. ويذكر غلوكوز نحو١٠٪ ونشاء وزيتًا لطيفًا وأملاح الكلس والمغنيسيوم ومواد عطرية. ودعوى الطرح بالعرق والبول والتحول الكبدي إلى «داي مارفين» قول المصدر لا وصف مثبت للاستقلاب البشري."], ["التاريخ والمقدار المطبوع وتجربة المؤلف", "ينقل المصدر استعمال الصين والهند وباكستان ووصوله إلى الصين بتجار عرب في القرن١٤ وقوانين أكبر وتقدير ٨٦ لكًا من معتادي المسكرات في١٩٨٧–١٩٨٨. ليست إحصاءات حالية ولا عددًا خاصًا بمستعملي الأفيون، والانتقال إلى الهيروين قول زمني أيضًا. والمقدار «دو چاول سے ایک رتی تک» أي وحدتا حبة أرز إلى رتي لا حبة قمح ولا تحويلًا حدسيًا إلى٥٠–١٠٠ ملغ. المركبات معجون برشعثا وحب پيچش وحب سل وقرص مثلث وحب سعالطو المطبوع لدار الطب النبوي. وتجربة نصير أحمد للزكام والسعال وحبة الطفل المدقوقة بالماء أو اللبن الدافئ واضطراب المعدة نقل شخصي لا يثبت أمان الأطفال. والاحتراق والذوبان وقوة خمسين عامًا مع الألوة أو القشر دعاوى تاريخية غير محققة لا معيار جودة أو توصية تخزين."]]}, "photo_slots": 4, "photos": "empty as requested", "languages": ["ps", "fa", "ur", "en", "ar"], "status": "organized_text_reviewed", "complete_source_text_verified": true, "reading_blocks": [], "unresolved_source_readings": [], "scientific_as_printed": "Papversomniferum", "material_type": "Dried latex product; distinct from seed and capsule wall.", "identity_note": {"ps": "افیون د کوکنارو وچه شوې شیره ده؛ خشخاش تخم، د غوزې پوستکی او افیون درې بېل مواد دي. علمي نوم د سرچینې بوټي دئ، نه د درې واړو برخو د برابر قوت یا خوندي‌والي نښه.", "fa": "افیون شیرۀ خشک خشخاش است؛ بذر، پوست غوزه و افیون سه مادۀ جدا هستند. نام علمی گیاه منبع، برابری قوت یا ایمنی اجزا را نمی‌رساند.", "ur": "افیون خشک شیرہ ہے؛ خشخاش بیج، پوست ڈوڈہ و افیون الگ مواد ہیں۔ علمی نام ماخذی پودے کا، تینوں کی یکساں قوت/حفاظت نہیں۔", "en": "Opium is dried poppy latex. Poppy seed, capsule wall and opium are different materials; the plant name does not imply equal potency or safety of those parts.", "ar": "الأفيون لبن الخشخاش المجفف. البذر وجدار الكبسولة والأفيون مواد مختلفة؛ ولا يدل اسم النبات على تساوي قوتها أو أمانها."}, "safety_source": "https://www.who.int/news-room/fact-sheets/detail/opioid-overdose", "safety_provider": "WHO", "additional_safety_sources": [{"url": "https://www.nhs.uk/conditions/poisoning/", "provider": "NHS"}], "coverage_review": {"pages": "66–70", "method": "manual comparison of original Urdu page scans; user Pashto draft only as an aid", "form": "organized translated source account, not a diplomatic edition", "topics": ["source aliases", "morphology", "temperament and disagreements", "all historical action/use paragraphs", "harm/corrective/substitute or explicit absence", "source unit distinctions", "printed chemistry and uncertainties", "author experiences", "historical versus current safety"]}, "source_reading_review": {"date": "2026-11-06", "source": "Taj al-Mufradat original printed pp.61–70; full PDF page offset +36", "literal_transcription": false, "limitations": "Not modern clinical validation; source chemistry/taxonomy uncertainties explicit; old toxicology protocols appraised, not presented as modern instructions."}}, "T041": {"code": "T041", "pages": "70–71", "source": "تاج المفردات", "name": {"ps": "اقاقیا (د ببول عصاره)", "fa": "اقاقیا (عصارهٔ ببول)", "ur": "اقاقیا — عصارہ ببول", "en": "Acacia extract (Babul)", "ar": "الأقاقيا (عصارة السنط)"}, "names": [["ar", "اقاقیا"], ["fa", "عصارہ ببول"], ["sd", "بیر جو کھیر"], ["en", "Juice of Acacia"]], "scientific": "Acacia arabica", "scientific_as_printed": "Acacia arabica", "family": "", "identity_status": "as printed in the book; not independently verified", "sections": {"ps": {"mhy": "د کیکر (ببول) د پلیو او پاڼو عصاره ده چې وچه او ټکي (کیک) کړل شي. ونه په ټول هېواد کې شته، خو له ۲۵۰۰ فوټو لوړو ځایونو کې نه شي کېدای. دوه ډوله لري: وړوکې او لویه.", "mzj": "سړه او وچه، دویم درجه", "khs": "قابض، د وینې بندوونکی، وچوونکی، رادع", "use": "د هر غړي وینه بهېدل، جریان، احتلام، سیلان الرحم، بواسیر، د مقعد وتل (ضماد/شیاف)، د سترګو ګرم پړسوب، د شکرې ناروغي. د اور سوځېدنې لپاره د هګۍ له سپینې سره، او د وېښتانو توروونکی.", "mzr": "مسدد (بندښت)، قابض (قبض)", "msl": "روغنیات (غوړې)", "bdl": "په کتاب کې نه دی لیکل شوی"}, "fa": {"mhy": "عصارهٔ نیام و برگ کیکر (ببول) که خشک و قرص می‌شود. در سراسر کشور هست ولی بالاتر از ۲۵۰۰ فوت نمی‌روید. دو نوع است: کوچک و بزرگ.", "mzj": "سرد و خشک، درجهٔ دوم", "khs": "قابض، حابس‌الدم، مجفف، رادع", "use": "خونریزی هر عضو، جریان، احتلام، سیلان الرحم، بواسیر، افتادن مقعد (ضماد/شیاف)، التهاب گرم چشم، دیابت. برای سوختگی با سفیدهٔ تخم‌مرغ، و برای سیاه کردن مو.", "mzr": "مسدد (انسداد)، قابض (یبوست)", "msl": "روغنیات", "bdl": "در کتاب ذکر نشده"}, "ur": {"mhy": "کیکر (ببول) کی پھلیوں اور پتوں کا عصارہ ہے جسے خشک کر کے ٹکیہ بنا لیتے ہیں۔ یہ درخت ملک بھر میں ہے مگر ڈھائی ہزار فٹ سے اوپر نہیں اگتا۔ دو قسمیں ہیں: چھوٹا اور بڑا۔", "mzj": "سرد و خشک درجہ دوم", "khs": "قابض، حابس الدم، مجفف، رادع", "use": "ہر عضو کے جریان خون، جریان، احتلام، سیلان الرحم، بواسیر، استرخائے مقعد (ضماد/شیاف)، گرم ورم خصوصاً آشوبِ چشم، ذیابیطس۔ آگ سے جلنے پر انڈے کی سفیدی میں ملا کر، او
